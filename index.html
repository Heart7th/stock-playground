  // ---------- 开盘（单机） ----------
  function startGame() {
    App.hide(els.lobby);
    App.sfx.tap();
    App.show(els.count);
    els.countInfo.innerHTML = S.mode === 'me' ? '金色虚线 = 未来 5 秒' : '看准了再跑';
    let n = 3;
    const tick = () => {
      if (App.current !== 'bag' || !S) return;
      if (n > 0) { els.countNum.textContent = n; els.countNum.className = 'count-num'; App.sfx.count(); n--; setTimeout(tick, 650); return; }
      els.countNum.textContent = '开盘'; els.countNum.className = 'count-num up'; App.sfx.go();
      setTimeout(() => { App.hide(els.count); startLoop(); flashBanner('📰 ' + S.headline, 'rumor', 3200); }, 450);
    };
    tick();
  }
  function startLoop() { stopLoop(); paused = false; lastTs = 0; acc = 0; raf = requestAnimationFrame(frame); }
  function stopLoop() { cancelAnimationFrame(raf); raf = 0; }
  function doPause() { paused = true; App.show(els.pause); }

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    if (!S) return;
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000; lastTs = ts;
    if (dt > 0.25) dt = 0.25;
    if (shoutCd > 0) shoutCd = Math.max(0, shoutCd - dt);
    if (NET) {
      // 联机：行情由服务器推送，这里只负责显示
      processEvents();
      updateHud();
    } else if (running()) {
      acc += dt * speed;
      let n = 0;
      while (acc >= E.DT && n < 5 * speed && !S.over) { E.step(S); acc -= E.DT; n++; }
      if (S.mode === 'me' && !S.over && (!fc || S.t % 5 === 0 || n > 0 && fc.t !== S.t)) fc = { t: S.t, x: E.forecast(S, 50) };
      processEvents();
      updateHud();
      if (S.over && !settled) { settled = true; endGame(); }
    }
    draw();
  }

  // ---------- 盘中事件 → 气泡、横幅、动态 ----------
  function processEvents() {
    for (; logIdx < S.log.length; logIdx++) {
      const r = S.log[logIdx];
      if (r.id === ME || r.kind === 'dump') continue; // 砸盘是匿名的，不能挂到庄家头上
      if (r.q < 400) continue;
      bubble(r.id, (r.side === 'buy' ? '买 ' : '卖 ') + fmtQ(r.q), r.side === 'buy' ? 'tb' : 'ts', 1100);
    }
    for (; feedIdx < S.feed.length; feedIdx++) {
      const f = S.feed[feedIdx], p = f.id != null ? S.pl[f.id] : null;
      switch (f.kind) {
        case 'shout':
          if (!p) break;
          if (f.id === ME) floatText('📢 ' + f.text, 'shout');
          else bubble(f.id, esc(f.text), 'shout', 2200);
          break;
        case 'join': {
          if (!p) break;
          const cell = cellOf(f.id);
          if (cell) { cell.classList.remove('away'); cell.classList.add('pop'); }
          if (f.id !== ME) feedLine('🚪 ' + p.name + '（' + p.tag + '）进场了');
          App.sfx.tick();
          break;
        }
        case 'news':
          flashBanner((f.sign < 0 ? '📉 利空：' : '📈 利好：') + f.text, f.sign < 0 ? 'bad' : 'good', 4200);
          App.sfx.news();
          break;
        case 'seal':
          if (f.dir === 'up') { flashBanner('🔥 封涨停！买单排起长队', 'up', 2200); App.sfx.alarm(); }
          else { flashBanner('🧊 跌停！卖单排队，卖不掉了', 'down', 2400); App.sfx.alarm(); }
          break;
        case 'break':
          if (f.dir === 'up') { flashBanner('💥 炸板了！涨停被砸开', 'down', 2200); App.sfx.bad(); }
          else flashBanner('跌停打开了，排队的卖单在成交', 'good', 2000);
          break;
        case 'dump':
          flashBanner('⚡ 神秘大单砸出 ' + fmtQ(f.q) + ' 股！' + f.from.toFixed(2) + ' → ' + f.to.toFixed(2), 'bad', 3600);
          App.sfx.bad(); App.buzz(40);
          scr.classList.remove('shake'); void scr.offsetWidth; scr.classList.add('shake');
          break;
        case 'bust':
          if (!p) break;
          if (f.id === ME) { App.toast('你喊完“' + E.SHOUTS[f.key].human.replace(/^\S+\s/, '') + '”就卖，被大家识破了<br>之后喊单没那么灵了', 'warn', 2600); }
          else feedLine('🤥 ' + p.name + ' 喊完“' + E.SHOUTS[f.key].lines[0].replace(/！$/, '') + '”就卖，被识破了');
          break;
        default: break;
      }
    }
  }

  // ---------- 你的操作 ----------
  function humanBuy() {
    if (!running()) return;
    if (NET) { NET.send({ t: 'order', side: 'buy' }); App.sfx.tap(); return; }
    const me = meP();
    const r = E.order(S, ME, 'buy', E.LOT);
    showFill('buy', r.q, r.px, r.queued, 0, r.queued ? E.qSum(S.buyQ) - me.qBuy : 0);
    updateHud();
  }
  function humanSell(all) {
    if (!running()) return;
    const me = meP();
    if (me.shares - me.qSell < 100 && !me.qBuy) { App.toast(me.qSell > 0 ? '你的卖单正在跌停板上排队' : '你手里没有股票', '', 1200); return; }
    if (NET) { NET.send({ t: 'order', side: all ? 'all' : 'sell' }); App.sfx.tap(); return; }
    const hadQ = me.qBuy;
    if (hadQ > 0) E.cancelSide(S, me, 'buy');
    const want = all ? me.shares : E.LOT;
    const r = want > 0 && me.shares - me.qSell >= 100 ? E.order(S, ME, 'sell', want) : { q: 0, px: 0, queued: 0 };
    showFill(all ? 'all' : 'sell', r.q, r.px, r.queued, hadQ, r.queued ? E.qSum(S.sellQ) - me.qSell : 0);
    updateHud();
  }
  // 成交回报（单机马上有，联机等服务器回）
  function showFill(side, q, px, queued, cancelled, ahead) {
    const me = meP();
    if (cancelled > 0) feedLine('撤掉了排队的 ' + cancelled + ' 股买单');
    if (side === 'buy') {
      if (q > 0) { App.sfx.buy(); App.buzz(8); feedLine('你买入 ' + q + ' 股 @' + px.toFixed(2)); floatText('+' + q + ' @' + px.toFixed(2), 'buy'); }
      if (queued > 0) { feedLine('涨停了，你排队买 ' + queued + ' 股，前面还有 ' + fmtQ(ahead) + ' 股'); App.sfx.tick(); }
      if (!q && !queued) App.toast(me.qBuy > 0 ? '钱都在排队的买单里了' : '钱不够了', '', 1200);
    } else {
      if (q > 0) { App.sfx.sell(); App.buzz(8); feedLine('你卖出 ' + q + ' 股 @' + px.toFixed(2) + (side === 'all' && me.shares <= 0 ? '，清仓了' : '')); floatText('−' + q + ' @' + px.toFixed(2), 'sell'); }
      if (queued > 0) { feedLine('跌停了！你排队卖 ' + queued + ' 股，前面还有 ' + fmtQ(ahead) + ' 股'); App.sfx.alarm(); }
    }
  }

  // ---------- 界面数字 ----------
  function updateHud() {
    if (!S) return;
    const F = S.net ? { p: E.priceOf(S.x), sealUp: S.pub.sealUp > 0, sealQ: S.pub.sealUp, sealDown: S.pub.sealDown > 0, crowd: S.pub.crowd / 100 } : E.features(S);
    const p = F.p, me = meP();
    const chg = (p / E.P0 - 1) * 100;
    App.setText(els.price, p.toFixed(2));
    App.setClass(els.price, 'num bh-price ' + cls(chg));
    App.setText(els.chg, fmtPct(chg));
    App.setClass(els.chg, 'num bh-chg ' + cls(chg));
    const left = Math.max(0, Math.ceil(E.DUR - S.t * E.DT));
    if (els.clock._v !== left) { els.clock.innerHTML = left + '<small>秒</small>'; els.clock._v = left; }
    els.clock.classList.toggle('hot', S.t * E.DT > E.DUR - 10 && !S.over);
    // 状态：封板 / 排队

    else if (F.sealDown) st = '<span class="chip down pulse">跌停 · 排队卖 ' + fmtQ(S.net ? S.pub.sealDown : E.qSum(S.sellQ)) + ' 股</span>';
    else if (p >= E.UP * 0.97) st = '<span class="chip up">逼近涨停</span>';
    else if (p <= E.DOWN * 1.03) st = '<span class="chip down">逼近跌停</span>';
    if (me.qBuy > 0) st = '<span class="chip gold">你在排队买 ' + me.qBuy + ' 股 · 点卖出可撤</span>';
    if (me.qSell > 0) st = '<span class="chip gold">你在排队卖 ' + me.qSell + ' 股</span>';
    if (els.state._h !== st) { els.state.innerHTML = st; els.state._h = st; }
    const crowd = Math.round(F.crowd * 100);
    els.crowdBar.style.width = crowd + '%';
    els.crowdBar.className = crowd >= 75 ? 'hot' : '';
    App.setText(els.crowdTxt, crowd + '%');
    const live = S.net ? S.pub.live : S.pl.filter((x) => x.active).length;
    App.setText(els.t2, NET ? '房间 ' + NET.code + ' · ' + MODES[S.mode].name + ' · ' + live + ' 人' + (NET.rtt ? ' · ' + NET.rtt + 'ms' : '') : S.stock + ' · ' + MODES[S.mode].name + ' · ' + live + ' 人在场');
    // 你的账户
    const eqv = me.cash + me.resCash + me.shares * p + me.hidden * p;
    const pnl = eqv - (E.CASH0 + me.hidden0 * E.P0);
    App.setText(els.cash, fmtMoney(me.cash + me.resCash));
    App.setText(els.pos, me.shares ? me.shares + ' 股 · 成本 ' + (me.cost / me.shares).toFixed(2) : (me.hidden ? '底仓 ' + fmtQ(me.hidden) : '0 股'));
    App.setText(els.pnl, (pnl >= 0 ? '+' : '') + fmtMoney(pnl));
    App.setClass(els.pnl, 'num m-pnl ' + cls(pnl));
    const live2 = running();
    els.buy.disabled = !live2; els.sell.disabled = !live2; els.run.disabled = !live2 || (me.shares <= 0 && me.qBuy <= 0);
    els.shoutBtn.disabled = !live2;
    App.setText(els.shoutBtn, shoutCd > 0 ? '📢 ' + Math.ceil(shoutCd) + ' 秒' : '📢 喊单');
    if (me.banker) els.dump.disabled = !live2 || S.dumped;
    // 对手仓位条
    for (const o of S.pl) {
      if (o.id === ME) continue;
      const cell = cellOf(o.id);
      if (!cell) continue;
      let fr, qd;
      if (S.net) { fr = o.pos || 0; qd = o.qf === 1 ? 'b' : o.qf === 2 ? 's' : ''; }
      else {
        const ev = o.cash - o.hidCash + o.resCash + o.shares * p;
        fr = ev > 0 ? Math.round(((o.shares * p) / ev) * 20) * 5 : 0;
        qd = o.qBuy > 0 ? 'b' : o.qSell > 0 ? 's' : '';
      }
      if (cell._fr !== fr) { cell.querySelector('.bh-bar i').style.width = fr + '%'; cell.classList.toggle('in', fr >= 30); cell._fr = fr; }
      if (cell._qd !== qd) { cell.querySelector('.bh-q').className = 'bh-q ' + qd; cell._qd = qd; }
      if (o.active && cell.classList.contains('away')) cell.classList.remove('away');
    }
  }

  // ---------- 走势图 ----------
  function drawIdle() { if (S) draw(); else { const { ctx, w, h } = App.fitCanvas(els.cv); ctx.clearRect(0, 0, w, h); } }
  function draw() {
    if (!S) return;
    const { ctx, w, h } = App.fitCanvas(els.cv);
    ctx.clearRect(0, 0, w, h);
    const padL = 8, padR = 50, padT = 12, padB = 18;
    const plotW = w - padL - padR, plotH = h - padT - padB, plotR = padL + plotW, plotB = padT + plotH;
    const xOf = (tk) => padL + (tk / E.TICKS) * plotW;
    let lo = 0, hi = 0;
    for (const x of S.hx) { if (x < lo) lo = x; if (x > hi) hi = x; }
    if (fc) for (const x of fc.x) { if (x < lo) lo = x; if (x > hi) hi = x; }
    let pLo = Math.min(E.priceOf(lo), E.P0 * 0.96), pHi = Math.max(E.priceOf(hi), E.P0 * 1.04);
    if (pHi > E.UP * 0.975) pHi = E.UP;
    if (pLo < E.DOWN * 1.025) pLo = E.DOWN;
    const pad = (pHi - pLo) * 0.08;
    pHi += pad; pLo -= pad;
    const yOf = (pp) => padT + ((pHi - pp) / (pHi - pLo)) * plotH;
    const nowX = xOf(S.t);
    // 还没走到的时间
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    ctx.fillRect(nowX, padT, plotR - nowX, plotH);
    // 网格
    const span = pHi - pLo, step = span > 2.4 ? 1 : span > 1.2 ? 0.5 : 0.25;
    ctx.font = '10px ' + C.num; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (let v = Math.ceil(pLo / step) * step; v <= pHi; v += step) {
      const y = yOf(v);
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke();
      ctx.fillStyle = C.dim; ctx.fillText(v.toFixed(2), plotR + 6, y);
    }
    // 昨收、涨跌停
    const hline = (pp, col, label) => {
      const y = yOf(pp);
      if (y < padT - 1 || y > plotB + 1) return;
      ctx.strokeStyle = col; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke(); ctx.setLineDash([]);
      if (label) { ctx.fillStyle = col; ctx.font = 'bold 10px ' + C.font; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(label, padL + 3, y - 2); }
    };
    hline(E.P0, 'rgba(255,255,255,0.22)', '');
    hline(E.UP, 'rgba(245,71,75,0.75)', '涨停 12.00');
    hline(E.DOWN, 'rgba(23,178,106,0.75)', '跌停 8.00');
    // 价格线和面积：昨收以上红、以下绿
    const n = S.hx.length;
    const last = E.priceOf(S.x), up = last >= E.P0;
    const col = up ? C.up : C.down;
    const lineEndX = xOf(n - 1), y0 = yOf(E.P0);
    const trace = () => { ctx.beginPath(); for (let i = 0; i < n; i++) { const X = xOf(i), Y = yOf(E.priceOf(S.hx[i])); if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y); } };
    for (const half of [0, 1]) {
      ctx.save();
      ctx.beginPath();
      if (half === 0) ctx.rect(0, padT - 2, w, y0 - padT + 2); else ctx.rect(0, y0, w, plotB - y0 + 2);
      ctx.clip();
      trace(); ctx.lineTo(lineEndX, y0); ctx.lineTo(padL, y0); ctx.closePath();
      const g = ctx.createLinearGradient(0, half === 0 ? padT : plotB, 0, y0);
      g.addColorStop(0, half === 0 ? 'rgba(245,71,75,0.26)' : 'rgba(23,178,106,0.26)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fill();
      trace(); ctx.strokeStyle = half === 0 ? C.up : C.down; ctx.lineWidth = 1.8; ctx.stroke(); ctx.lineWidth = 1;
      ctx.restore();
    }
    // 庄家的透视：未来 5 秒（只有庄家自己有 fc）
    if (fc && !S.over) {
      ctx.beginPath(); ctx.moveTo(lineEndX, yOf(last));
      fc.x.forEach((x, i) => ctx.lineTo(xOf(fc.t + i + 1), yOf(E.priceOf(x))));
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
      const endP = E.priceOf(fc.x[fc.x.length - 1]), chg5 = (endP / last - 1) * 100;
      const lbl = '5 秒后 ' + endP.toFixed(2) + '（' + fmtPct(chg5, 1) + '）';
      ctx.font = 'bold 11px ' + C.font;
      const lw = ctx.measureText(lbl).width + 10, ex = xOf(fc.t + fc.x.length), ey = yOf(endP);
      const lx = Math.min(plotR - lw, ex + 6), ly = clamp(ey + (chg5 < 0 ? 6 : -24), padT, plotB - 18);
      ctx.fillStyle = 'rgba(16,19,26,0.88)'; roundRect(ctx, lx, ly, lw, 18, 6); ctx.fill();
      ctx.fillStyle = C.gold; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(lbl, lx + 5, ly + 9.5);
    }
    // 事件标记：消息、砸盘
    for (const f of S.feed) {
      if (f.kind !== 'news' && f.kind !== 'dump') continue;
      const X = xOf(f.t);
      ctx.strokeStyle = f.kind === 'dump' ? 'rgba(255,179,26,0.6)' : 'rgba(255,255,255,0.25)';
      ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(X, padT); ctx.lineTo(X, plotB); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '12px ' + C.font; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(f.kind === 'dump' ? '⚡' : '📰', X, plotB + 2);
    }
    // 你的买卖点
    for (const r of S.log) {
      if (r.id !== ME || r.kind === 'dump') continue;
      const X = xOf(r.t), Y = yOf(r.px);
      ctx.fillStyle = r.side === 'buy' ? C.up : C.down;
      ctx.beginPath(); ctx.arc(X, Y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px ' + C.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(r.side === 'buy' ? 'B' : 'S', X, Y + 0.5);
    }
    // 当前价
    const yNow = yOf(last);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(lineEndX, yNow, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(performance.now() / 180);
    ctx.beginPath(); ctx.arc(lineEndX, yNow, 7, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    const tagH = 18, tagY = clamp(yNow - tagH / 2, padT, plotB - tagH);
    ctx.fillStyle = col; roundRect(ctx, plotR + 2, tagY, padR - 4, tagH, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px ' + C.num; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(last.toFixed(2), plotR + padR / 2, tagY + tagH / 2 + 0.5);
    // 时间轴
    ctx.fillStyle = C.dim; ctx.font = '10px ' + C.font; ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText('开盘', padL, plotB + 3);
    ctx.textAlign = 'right'; ctx.fillText('收盘', plotR, plotB + 3);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // 名场面
  function moments() {
    const res = S.result, out = [];
    const name = (id) => (id === ME ? '你' : S.pl[id].name);
    // 最先在高点附近跑的人
    const nearTop = S.log.filter((r) => r.side === 'sell' && r.kind === 'mkt' && r.q >= 500 && r.px >= res.hi * 0.97 && Math.abs(r.t - res.hiT) < 60);
    if (nearTop.length) {
      const f = nearTop[0];
      out.push(['up', '跑在顶上', name(f.id) + ' 在第 ' + sec(f.t) + ' 秒卖出 ' + fmtQ(f.q) + ' 股 @' + f.px.toFixed(2) + '，离最高点只差 ' + ((1 - f.px / res.hi) * 100).toFixed(1) + '%。']);
    }
    // 接盘侠是怎么来的
    const rank = E.ranking(S), bag = rank[rank.length - 1];
    const bagBuys = S.log.filter((r) => r.id === bag.id && r.side === 'buy');
    if (bagBuys.length) {
      const worst = bagBuys.reduce((a, b) => (b.px > a.px ? b : a));
      out.push(['down', '接盘', name(bag.id) + ' 第 ' + sec(worst.t) + ' 秒买在 ' + worst.px.toFixed(2) + (bag.held > 0 ? '，收盘还拿着 ' + fmtQ(bag.held) + ' 股' : '，后来割在了低处') + '，最后' + (bag.pnl < 0 ? '亏了 ' + fmtMoney(-bag.pnl) : '只赚了 ' + fmtMoney(bag.pnl)) + '。']);
    }
    // 喊单被识破
    const busted = S.feed.filter((f) => f.kind === 'bust');
    if (busted.length) {
      const b = busted[0];
      out.push(['gold', '喊单出货', name(b.id) + ' 第 ' + sec(b.t) + ' 秒喊完“' + (S.pl[b.id].human ? E.SHOUTS[b.key].human.replace(/^\S+\s/, '') : E.SHOUTS[b.key].lines[0]) + '”，转手就卖。' + (busted.length > 1 ? '这局一共被识破 ' + busted.length + ' 次。' : '')]);
    }
    // 庄家
    if (S.bankerId >= 0 && S.dumpT >= 0) {
      const c = res.clues[S.bankerId];
      out.push(['gold', '庄家', name(S.bankerId) + (c && c.preDump > 0 ? ' 先在砸盘前卖掉明仓 ' + fmtQ(c.preDump) + ' 股，' : ' ') + '第 ' + sec(S.dumpT) + ' 秒匿名砸出 ' + fmtQ(dumpSize()) + ' 股底仓。']);
    }
    // 你的操作
    const mine = S.log.filter((r) => r.id === ME && r.kind !== 'dump');
    if (mine.length) {
      const sells = mine.filter((r) => r.side === 'sell'), buys = mine.filter((r) => r.side === 'buy');
      const bestS = sells.length ? sells.reduce((a, b) => (b.px > a.px ? b : a)) : null;
      const worstB = buys.length ? buys.reduce((a, b) => (b.px > a.px ? b : a)) : null;
      let txt = '你买卖了 ' + mine.length + ' 次';
      if (bestS) txt += '，卖得最好的一笔 @' + bestS.px.toFixed(2) + '（第 ' + sec(bestS.t) + ' 秒）';
      if (worstB) txt += '，买得最贵的一笔 @' + worstB.px.toFixed(2);
      out.push(['', '你', txt + '。']);
    } else out.push(['', '你', '一笔没买卖：不炒股就不会亏，但也赚不到。']);
    if (res.sealDownQ > 0) out.push(['down', '跌停', '收盘时还有 ' + fmtQ(res.sealDownQ) + ' 股卖单排在跌停板上，没卖掉。']);
    return out.slice(0, 5);
  }

  function netConnect() {
    if (!NET || NET.bye) return;
    if (NET.ws && NET.ws.readyState <= 1) return; // 已经有一条连接（或正在连），不要再开第二条
    let ws;
    try { ws = new WebSocket(NET.url); } catch (e) { App.toast('连不上联机服务器', 'warn'); netFail(); return; }
    NET.ws = ws;
    const mine = NET;
    ws.onopen = () => {
      if (NET !== mine) return;
      NET.retry = 0;
      els.conn.classList.remove('show');
      if (NET.code) NET.send({ t: 'join', code: NET.code, tok: NET.tok, name: NET.name, emoji: NET.emoji });
      else NET.send({ t: 'create', name: NET.name, emoji: NET.emoji });
      clearInterval(NET.pinger);
      NET.pinger = setInterval(() => { if (NET === mine) NET.send({ t: 'ping', c: Math.round(performance.now()) }); }, 4000);
    };
    ws.onmessage = (e) => { if (NET === mine) { try { onNet(JSON.parse(e.data)); } catch (err) { /* ignore */ } } };
    ws.onclose = () => {
      if (NET !== mine || NET.bye || NET.ws !== ws) return;
      clearInterval(NET.pinger);
      if (NET.retry >= 8 || !NET.code) { App.toast(NET.code ? '和服务器断开了，回到菜单' : '连不上联机服务器', 'warn', 2400); netFail(); return; }
      NET.retry++;
      NET.reconnecting = true;
      els.conn.textContent = '连接断了，正在重连…'; els.conn.classList.add('show');
      setTimeout(() => { if (NET === mine && !NET.bye) netConnect(); }, Math.min(5000, 500 * NET.retry));
    };
  }
  function netFail() { netReset(true); showMenu(); }
  function netReset(silent) {
    if (NET) {
      NET.bye = true;
      clearInterval(NET.pinger); clearInterval(NET.waitTimer); clearTimeout(NET.countTimer);
      try { NET.ws && NET.ws.close(); } catch (e) { /* ignore */ }
    }
    NET = null;
    els.conn.classList.remove('show');
    if (!silent) { stopLoop(); S = null; }
  }
  function netLeave() {
    if (NET) { NET.send({ t: 'leave' }); if (NET.code) App.store.set('bag_tok_' + NET.code, null); }
    netReset(true);
    stopLoop(); S = null; ME = 0;
    if (location.hash.indexOf('#bagholder-') === 0) history.replaceState(null, '', location.pathname + location.search + '#bagholder');
    showMenu();
  }
  function netCfg(patch) {
    if (!NET || !NET.lobby) return;
    const c = Object.assign({}, NET.lobby.cfg, patch);
    NET.send({ t: 'cfg', n0: c.n0, lateJoin: c.lateJoin, mode: c.mode });
    App.sfx.tap();
  }
  function netInvite() {
    if (!NET || !NET.code) return;
    const link = location.origin + location.pathname + location.search + '#bagholder-' + NET.code;
    App.share('来「谁是接盘侠」房间 ' + NET.code + ' 一起炒股，看谁接盘：\n' + link);
  }

  function renderRoom() {
    if (!NET) return;
    const L = NET.lobby;
    if (!L) { els.roomBody.innerHTML = '<div class="menu-title">联机房间</div><div class="bh-waiting">正在连接服务器……</div><button class="link-btn" data-act="net-leave">取消</button>'; return; }
    const meRow = L.people.find((p) => p.me) || {}, host = !!meRow.host;
    const humans = L.people.filter((p) => p.online).length, bots = Math.max(0, L.cfg.n0 - humans);
    const lateN = L.cfg.lateJoin ? clamp(Math.round(Math.max(L.cfg.n0, humans) * 0.4), 1, 4) : 0;
    const people = L.people.map((p) => '<div class="bh-person' + (p.online ? '' : ' off') + '"><div class="bh-av">' + esc(p.emoji) + '</div><b>' + esc(p.name) + (p.me ? '（你）' : '') + '</b><span>' + (p.host ? '房主' : p.online ? '玩家' : '离线') + '</span></div>').join('') +
      (bots ? '<div class="bh-person bot"><div class="bh-av">🤖</div><b>+' + bots + ' 个电脑</b><span>补空座位</span></div>' : '');
    const waiting = NET.phase === 'wait';
    let settings;
    if (host && !waiting && L.phase === 'lobby') {
      settings = '<div class="bh-setting"><div><b>座位</b><span>含真人，3–12 个；真人不够的由电脑补上</span></div>' +
        '<div class="bh-step"><button data-act="rminus"' + (L.cfg.n0 <= Math.max(3, humans) ? ' disabled' : '') + '>−</button><b class="num">' + L.cfg.n0 + '</b><button data-act="rplus"' + (L.cfg.n0 >= 12 ? ' disabled' : '') + '>+</button></div></div>' +
        '<button class="bh-setting bh-toggle' + (L.cfg.lateJoin ? ' on' : '') + '" data-act="rlate"><div><b>中途有电脑进场</b><span>' + (L.cfg.lateJoin ? '涨起来会有 ' + lateN + ' 个电脑股民冲进来' : '关掉：只有开盘时这些人') + '</span></div><i></i></button>' +
        '<div class="bh-seg"><button data-rmode="plain" class="' + (L.cfg.mode === 'plain' ? 'on' : '') + '">抢跑局</button><button data-rmode="banker" class="' + (L.cfg.mode === 'banker' ? 'on' : '') + '"' + (L.cfg.n0 < 4 ? ' disabled' : '') + '>庄家局</button></div>' +
        '<div class="bh-tip">' + (L.cfg.mode === 'banker' ? '🕵️ 庄家局：开盘时从所有座位里随机挑一个当庄家，可能是真人也可能是电脑。只有庄家自己知道，收盘后大家投票。' : '💡 抢跑局：没有庄家。收盘还拿着的，第二天按“一日游”价结算。') + '</div>';
    } else {
      settings = '<div class="bh-tip">' + L.cfg.n0 + ' 个座位 · ' + (L.cfg.mode === 'banker' ? '庄家局' : '抢跑局') + (L.cfg.lateJoin ? ' · 有电脑中途进场' : '') + '</div>';
    }
    let action;
    if (waiting) action = '<div class="bh-waiting">这局已经开盘超过 60 秒，<b class="bh-wait-left num">' + (NET.waitLeft || 0) + '</b> 秒后收盘，下一局自动加入。</div>';
    else if (L.phase !== 'lobby') action = '<div class="bh-waiting">这局正在进行……</div>';
    else if (host) action = '<button class="btn block" data-act="net-start">开盘（' + humans + ' 个真人' + (bots ? ' + ' + bots + ' 个电脑' : '') + '）</button>';
    else action = '<div class="bh-waiting">等房主开盘……</div>';
    els.roomBody.innerHTML =
      '<div class="bh-room-code"><span>房间码</span><b class="num">' + esc(L.code) + '</b></div>' +
      '<button class="btn ghost block" data-act="net-invite">📨 邀请朋友（发房间链接）</button>' +
      '<div class="bh-people">' + people + '</div>' + settings + action +
      '<button class="link-btn" data-act="net-leave">离开房间</button>';
  }

  // 收到服务器的消息
  function onNet(m) {
    switch (m.t) {
      case 'welcome':
        NET.code = m.code; NET.tok = m.tok; NET.name = m.name;
        App.store.set('bag_tok_' + m.code, m.tok);
        if (location.hash !== '#bagholder-' + m.code) history.replaceState(null, '', location.pathname + location.search + '#bagholder-' + m.code);
        break;
      case 'error':
        App.toast(esc(m.msg), 'warn', 2400);
        if (m.code === 'NOROOM' && NET) { const code = NET.code; App.store.set('bag_tok_' + code, null); netReset(true); App.hide(els.room); openNet(code); }
        if (m.code === 'REPLACED' && NET) { netReset(true); stopLoop(); S = null; ME = 0; showMenu(); }
        break;
      case 'pong': if (NET) NET.rtt = Math.max(1, Math.round(performance.now() - m.c)); break;
      case 'lobby': {
        NET.lobby = m;
        if (m.phase === 'lobby') {
          if (NET.phase === 'result' || NET.phase === 'wait' || NET.phase === 'connecting' || NET.phase === 'lobby' || NET.phase === 'vote') {
            NET.phase = 'lobby'; NET.voted = false;
            clearInterval(NET.waitTimer);
            [els.res, els.vote, els.settle, els.count, els.menu, els.net].forEach(App.hide);
            stopLoop(); S = null; drawIdle();
            renderRoom(); App.show(els.room);
          }
        } else if (NET.phase === 'connecting' || NET.phase === 'lobby' || NET.phase === 'wait') renderRoom();
        if (NET.phase === 'result' && els.res.classList.contains('show') && !S) renderRoom();
        break;
      }
      case 'wait':
        NET.phase = 'wait'; NET.waitLeft = m.left;
        clearInterval(NET.waitTimer);
        NET.waitTimer = setInterval(() => { if (!NET) return; NET.waitLeft = Math.max(0, NET.waitLeft - 1); const el = els.roomBody.querySelector('.bh-wait-left'); if (el) el.textContent = NET.waitLeft; }, 1000);
        renderRoom(); App.show(els.room);
        break;
      case 'start': netGameStart(m); break;
      case 'phase':
        if (m.phase === 'live' && S) goLive();
        break;
      case 'k': if (S && NET.phase !== 'wait') applyTick(m); break;
      case 'settle': if (S) netSettle(m); break;
      case 'voted': { const el = els.voteBody.querySelector('.bh-vote-wait') || els.voteBody.querySelector('.bh-vote-left'); if (el) el.textContent = '已投 ' + m.got + '/' + m.need; break; }
      case 'result': if (S) netResult(m); break;
      default: break;
    }
  }
  const unTrade = (a) => ({ t: a[0], id: a[1], side: a[2] > 0 ? 'buy' : 'sell', q: a[3], px: a[4], kind: a[5] === 1 ? 'qfill' : a[5] === 2 ? 'dump' : 'mkt' });
  function mirrorPlayer(p) {
    return { id: p.id, name: p.name, emoji: p.emoji, tag: p.tag, human: p.human, active: p.active !== false, joinT: p.joinT || 0, cash: E.CASH0, shares: 0, cost: 0, qBuy: 0, qSell: 0,
      hidden: 0, hidden0: 0, resCash: 0, hidCash: 0, busted: 0, banker: false, pos: 0, qf: 0 };
  }
  function netGameStart(m) {
    const g = m.game;
    stopLoop();
    ME = m.you;
    S = { net: true, mode: g.mode, stock: g.stock, code: g.code, headline: g.headline, cfg: g.cfg, t: 0, x: 0, hx: [0], over: false, dumped: false, dumpT: -1, dumpQ: 0, bankerId: -1,
      pl: g.players.map(mirrorPlayer), log: [], feed: [], pub: { crowd: 0, sealUp: 0, sealDown: 0, live: g.players.filter((p) => p.active).length }, result: null };
    const me = S.pl[ME];
    if (m.banker) { me.banker = true; me.hidden = me.hidden0 = m.hidden0; S.bankerId = ME; }
    if (m.snap) {
      S.t = m.snap.k; S.hx = m.snap.hx.slice(); S.x = S.hx[S.hx.length - 1];
      S.feed = m.snap.feed || []; S.log = (m.snap.log || []).map(unTrade); S.dumped = !!m.snap.dumped; S.dumpT = m.snap.dumpT;
      for (const f of S.feed) if (f.kind === 'dump') S.dumpQ = f.q;
    }
    [els.room, els.net, els.menu, els.res, els.vote, els.settle].forEach(App.hide);
    buildTable();
    resetView();
    NET.voted = false;
    raf = requestAnimationFrame(frame);
    const live = m.phase === 'live' || (m.snap && m.startIn <= 0);
    if (m.phase === 'vote' || m.phase === 'result') { NET.phase = m.phase; S.over = true; return; }
    if (live) { goLive(true); return; }
    // 倒计时
    NET.phase = 'count';
    App.show(els.count);
    els.countInfo.innerHTML = me.banker ? '🤫 你是这局的庄家<br>金色虚线 = 未来 5 秒，⚡ 能匿名砸一次盘' : S.mode === 'banker' ? '🕵️ 这局有人是庄家<br>可能是真人，也可能是电脑' : '看准了再跑';
    let n = Math.max(1, Math.ceil(m.startIn / 1000));
    const tick = () => {
      if (!NET || NET.phase !== 'count') return;
      if (n > 0) { els.countNum.textContent = n; els.countNum.className = 'count-num'; App.sfx.count(); n--; NET.countTimer = setTimeout(tick, 1000); return; }
      els.countNum.textContent = '开盘'; els.countNum.className = 'count-num up';
    };
    tick();
  }
  function goLive(late) {
    if (!NET) return;
    NET.phase = 'live';
    setTimeout(() => { if (NET) NET.reconnecting = false; }, 0);
    clearTimeout(NET.countTimer);
    App.hide(els.count);
    App.sfx.go();
    const me = meP();
    if (late && NET.reconnecting) flashBanner('🔌 重新连上了，接着炒', 'good', 2200);
    else if (late) flashBanner(S.t > 0 ? '🚪 你中途进场了，带着 10 万现金，赶紧看盘' : '📰 ' + S.headline, 'rumor', 3200);
    else if (me.banker) flashBanner('🤫 你是庄家：金线是未来 5 秒，⚡ 能匿名砸一次盘，别被揪出来', 'rumor', 5000);
    else flashBanner('📰 ' + S.headline, 'rumor', 3200);
  }
  function applyTick(m) {
    while (S.hx.length < m.k) S.hx.push(S.hx[S.hx.length - 1]);
    S.hx[m.k] = m.x; S.hx.length = m.k + 1;
    S.t = m.k; S.x = m.x;
    let rebuild = false;
    for (const a of m.tr) S.log.push(unTrade(a));
    for (const e of m.ev) {
      if (e.kind === 'join' && e.id != null) {
        if (!S.pl[e.id] && e.p) { S.pl[e.id] = mirrorPlayer(Object.assign({ id: e.id, active: true }, e.p)); rebuild = true; }
        if (S.pl[e.id]) S.pl[e.id].active = true;
      }
      if (e.kind === 'dump') { S.dumped = true; S.dumpT = e.t; S.dumpQ = e.q; }
      S.feed.push(e);
    }
    if (rebuild) { buildTable(); for (const o of S.pl) { const c = cellOf(o.id); if (c) c._fr = -1; } }
    S.pub = { crowd: m.pub[0], sealUp: m.pub[1], sealDown: m.pub[2], live: m.pub[3] };
    if (m.me) { const a = m.me, me = meP(); me.cash = a[0]; me.shares = a[1]; me.cost = a[2]; me.qBuy = a[3]; me.qSell = a[4]; me.hidden = a[5]; me.resCash = a[6]; me.hidCash = a[7]; me.busted = a[8]; }
    if (m.pos) m.pos.forEach((a, i) => { if (S.pl[i]) { S.pl[i].pos = a[0]; S.pl[i].qf = a[1]; } });
    if (m.fc) fc = { t: m.k, x: m.fc };
    if (m.f) for (const f of m.f) showFill(f[0], f[1], f[2], f[3], f[4], f[5]);
    if (NET.phase !== 'live' && m.k > 0 && !S.over) goLive();
    if (m.k >= E.TICKS) S.over = true;
  }
  function netSettle(m) {
    S.over = true;
    NET.phase = m.vote ? 'vote' : 'settle';
    fc = null;
    const r = m.res;
    S.dumpT = r.dumpT; if (r.dumpQ) S.dumpQ = r.dumpQ;
    S.result = { close: r.close, next: r.next, kind: r.kind, hi: r.hi, hiT: r.hiT, lo: r.lo, loT: r.loT, sealUpQ: r.sealUpQ, sealDownQ: r.sealDownQ, clues: r.clues,
      players: Object.keys(r.visPnl).map((id) => ({ id: +id, visPnl: r.visPnl[id], pnl: 0, pct: 0, held: 0 })), vote: null };
    processEvents();
    updateHud();
    if (m.again) { // 重连回来：直接进投票或等结果
      if (m.vote) { showVote(); markVoteLeft(m.voteSec); }
      return;
    }
    settleOverlay(S.result);
    NET.settleAt = Date.now();
    setTimeout(() => {
      if (!NET || !S) return;
      App.hide(els.settle);
      if (m.vote && NET.phase === 'vote') { showVote(); markVoteLeft(m.voteSec - 3); }
      else if (NET.pendingResult) { const pr = NET.pendingResult; NET.pendingResult = null; netResult(pr); }
    }, 2600);
  }
  function markVoteLeft(secs) {
    let left = Math.max(1, Math.round(secs));
    const el = () => els.voteBody.querySelector('.bh-vote-left');
    if (el()) el().textContent = left + ' 秒内投票';
    clearInterval(NET.waitTimer);
    NET.waitTimer = setInterval(() => { left = Math.max(0, left - 1); if (el()) el().textContent = left + ' 秒内投票'; if (!left) clearInterval(NET.waitTimer); }, 1000);
  }
  function netResult(m) {
    if (NET.settleAt && Date.now() - NET.settleAt < 2500 && els.settle.classList.contains('show')) { NET.pendingResult = m; return; }
    clearInterval(NET.waitTimer);
    NET.phase = 'result';
    const R = S.result || {};
    R.players = m.res.players;
    R.vote = m.res.vote;
    S.result = R;
    S.bankerId = m.bankerId;
    if (m.bankerId >= 0 && S.pl[m.bankerId]) { S.pl[m.bankerId].banker = true; S.pl[m.bankerId].hidden0 = m.hidden0; }
    (m.busted || []).forEach((b, i) => { if (S.pl[i]) S.pl[i].busted = b; });
    S.log = m.log.map(unTrade);
    logIdx = S.log.length;
    App.hide(els.settle);
    if (R.vote) {
      if (!els.vote.classList.contains('show')) showVoteShell();
      revealVotes();
    } else showResult();
  }
  function showVoteShell() {
    els.voteBody.innerHTML = '<div class="menu-title">开票</div><div class="menu-sub">' + (votePick != null ? '你投给了 <b>' + esc(S.pl[votePick].name) + '</b>' : '投票结束') + '</div><div class="bh-tally"></div><button class="btn block" data-act="toresult" disabled>看结算</button>';
    App.show(els.vote);
  }

  App.Bag = { init, _state: () => S, _cfg: () => cfg, _speed: (v) => { speed = v || 1; }, _net: () => NET, _me: () => ME };
})(window);

</script>

  let home;
  function buildHome() {
    home = App.el(`

      <div class="gc-body"><div class="gc-title">解套大作战 <span class="gc-no">⑤</span></div><div class="gc-desc">50 元买的，现在 40 元。靠高抛低吸做 T，把成本做到现价以下。</div><div class="gc-rec rec-unstuck"></div></div><div class="gc-arrow">›</div></button>
    <button class="game-card" data-go="bag"><div class="gc-icon" style="background:rgba(60,196,110,0.13)">${ICONS.bag}</div>
      <div class="gc-body"><div class="gc-title">谁是接盘侠 <span class="gc-no">⑧</span></div><div class="gc-desc">一群人炒同一只股票，谁买谁推高、谁卖谁砸低。喊单、抢跑、揪庄家，跑晚了就是接盘侠。</div><div class="gc-rec rec-bag"></div></div><div class="gc-arrow">›</div></button>
    <div class="home-foot">
      <button class="link-btn" data-act="sound"></button>
      <div class="disclaimer">原型 v0.1 · 所有公司均为虚构 · ④ 的题目来自真实历史指数行情<br>仅供娱乐，不构成任何投资建议</div>
      <button class="link-btn" data-act="reset" style="font-size:12px;color:var(--dim)">清空本地记录</button>
    </div>
  </div>
</section>`);
    document.getElementById('app').appendChild(home);
    // 放在 NAS 草稿测试区（/demos/ 下）时，首页显示返回入口
    if (/\/demos\//.test(location.pathname)) {
      home.querySelector('.home-wrap').insertAdjacentHTML('afterbegin', '<a class="demo-back" href="../">‹ 草稿测试区</a>');
    }
    home.addEventListener('click', (e) => {
      const b = e.target.closest('[data-go],[data-act]');
      if (!b) return;
      const go = b.getAttribute('data-go');
      if (go) { App.sfx.tap(); App.go(go); return; }
      const act = b.getAttribute('data-act');
      if (act === 'sound') { App.sfx.toggle(); refresh(); }
      if (act === 'reset') App.confirm('清空本地记录？', '各个玩法的成绩、进度和关卡星星都会被清空。', '清空', () => { App.store.clearAll(); refresh(); App.toast('已清空', 'ok'); });
    });
    // 假行情跑马灯（每天固定一组）
    const rng = App.makeRng('ticker-' + U.dateKey());
    let html = '';
    for (let i = 0; i < 12; i++) {
      const p = rng.range(-9.9, 9.9);
      html += '<span>' + rng.pick(E.FOODS) + rng.pick(E.INDS) + '<b class="num ' + cls(p) + '">' + fmtPct(p) + '</b></span>';
    }
    home.querySelector('.ticker-inner').innerHTML = html + html;
    App.register('home', { enter: refresh });
  }

  function refresh() {
    const q = (s) => home.querySelector(s);
    const hd = App.store.get('hold_daily', {})[U.dateKey()];
    const hc = App.store.get('hold_career', null);
    const parts = [];
    if (hd) parts.push('今日 <span class="' + cls(hd.first) + '">' + fmtPct(hd.first) + '</span>');
    if (hc && !hc.over) parts.push('快速模式第 ' + hc.day + ' 天');
    const pr = App.Trader.activeLine();
    if (pr) parts.push(pr);
    q('.rec-hold').innerHTML = parts.join(' · ') || '今天的行情已经开盘';
    const dd = App.store.get('draw_daily', {})[U.dateKey()];
    const ds = App.store.get('draw_stats', null);
    q('.rec-draw').textContent = dd ? '今日 ' + dd.score + ' 分' + (ds && ds.streakR >= 2 ? ' · 连对 ' + ds.streakR : '') : '今日一题等你作答';
    const lr = App.store.get('uk_levels', {});
    const ids = Object.keys(lr).filter((k) => lr[k].stars > 0);
    const stars = ids.reduce((s, k) => s + lr[k].stars, 0);
    q('.rec-unstuck').textContent = ids.length ? '已解套 ' + ids.length + '/' + App.LEVELS.length + ' 关 · ★ ' + stars : App.LEVELS.length + ' 关等你下山';
    const bs = App.store.get('bag_stats', null);
    q('.rec-bag').textContent = bs && bs.plays ? '玩了 ' + bs.plays + ' 局 · 拿过 ' + bs.wins + ' 次第一 · 接盘 ' + bs.bags + ' 次' : '人数随你定，3–12 人一个房间';
    q('[data-act=sound]').textContent = App.sfx.enabled ? '🔊 音效：开' : '🔇 音效：关';
  }

  function boot() {
    App.Hold.init();
    App.Trader.init();
    App.Draw.init();
    App.Unstuck.init();
    App.Bag.init();
    buildHome();
    // 深链接：#hold / #draw / #unstuck 直接进入对应玩法；#pro 进操盘手（先选难度），#biga 进大A模式
    const route = { '#hold': 'hold', '#draw': 'draw', '#unstuck': 'unstuck', '#bagholder': 'bag', '#pro': 'trader', '#biga': 'trader' }[location.hash];
    App.go(route || 'home', location.hash === '#biga' ? { variant: 'biga' } : location.hash === '#pro' ? { group: 'pro' } : undefined);
    document.addEventListener('pointerdown', () => App.sfx.unlock(), { once: true });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
</body>
</html>

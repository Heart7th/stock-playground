      case 'menu': if (R && !R.over) App.show(els.menu); break;
      case 'closemenu': App.hide(els.menu); break;
      case 'start': App.hide(els.intro); if (!R || R.over) newRun(); renderPick(); break;
      case 'newrun': App.hide(els.over); newRun(); renderPick(); break;
      case 'abandon':
        App.confirm('放弃这一局？', '这一局会按现在的成绩结束，不能恢复。', '放弃', () => {
          App.hide(els.menu);
          R.over = { why: 'quit', d: R.day - 1 };
          saveRun(); updateBest(); showOver();
        });
        break;
      case 'go': startDay(); break;
      case 'next':
        App.hide(els.res);
        if (R.over) showOver(); else if (R.shop) showShop(); else renderPick();
        break;
      case 'timemachine': useTimeMachine(); break;
      case 'shopdone': App.hide(els.shop); R.shop = null; pendingRep = null; saveRun(); renderPick(); break;
      default: break;
    }
  }

  // ---------- 进入：选搭档 / 选难度 / 开局 / 接着玩 ----------
  function enter(arg) {
    allOverlays().forEach(App.hide);
    if (arg && arg.done && arg.variant) {
      V = VARIANTS[arg.variant]; R = loadRun();
      if (R && R.inDay) { handleDone(arg.done, false); return; }
    }
    const go = () => {
      if (arg && arg.variant && VARIANTS[arg.variant]) openVariant(VARIANTS[arg.variant]);
      else showDiff();
    };
    if (!CH.picked()) { afterChar = go; showChar(); return; }
    go();
  }
  function showChar() {
    scr.classList.add('empty');
    const st = CH.stage();
    els.charGrid.innerHTML = CH.ORDER.map((id) => {
      const c = CH.CHARS[id];
      return '<button class="tc-card' + (CH.picked() === id ? ' on' : '') + '" data-char="' + id + '">' + CH.portrait(id, st, 'card') +
        '<b>' + c.name + '</b><span>' + c.titles[st - 1] + '</span></button>';
    }).join('');
    App.show(els.char);
  }
  function pickChar(id) {
    CH.setPick(id);
    App.sfx.tap();
    App.hide(els.char);
    App.toast(CH.CHARS[id].name + '：' + CH.line('pick'), '', 2200);
    const f = afterChar; afterChar = null;
    if (f) f();
  }
  function showDiff() {
    scr.classList.add('empty');
    els.diffAva.innerHTML = CH.portrait(CH.picked(), CH.stage(), 'head');
    els.diffs.innerHTML = ['easy', 'normal', 'hard'].map((k) => {
      const v = VARIANTS[k];
      return '<button class="mode-card" data-var="' + k + '"><div class="mc-title">' + v.tag + '<span class="chip ' + (k === 'easy' ? 'blue' : k === 'normal' ? 'gold' : 'up') + '">' +
        (k === 'easy' ? '只做多 · 不加杠杆' : k === 'normal' ? '多空 · 杠杆' : '无涨跌停 · 财报日') + '</span></div><div class="mc-sub">' + v.sub + '</div><div class="mc-rec">' + summaryOf(v) + '</div></button>';
    }).join('');
    App.show(els.diff);
  }
  function openVariant(v) {
    V = v; R = loadRun();
    headerFor();
    sel.sid = null; sel.dir = 1; sel.lev = V.levs[0];
    if (!R) { showIntro(); return; }
    if (R.over) { renderPick(); showOver(); return; }
    if (R.inDay) { settleInterrupted(); return; }
    renderPick();
    if (R.shop) showShop();
  }
  function headerFor() {
    els.t1.textContent = V.name;
    els.menuTitle.textContent = V.name;
    els.menuRules.innerHTML = '<details class="rules"><summary>规则说明</summary>' + rulesOf(V) + '</details>';
    els.menuDiff.style.display = V.group === 'pro' ? '' : 'none';
  }
  function showIntro() {
    scr.classList.add('empty');
    els.inAva.innerHTML = CH.portrait(CH.picked(), CH.stage(), 'head');
    els.inTitle.textContent = V.name;
    els.inSub.innerHTML = V.sub + '<br>10 万本金起步，每 5 个交易日一关。';
    els.inRules.innerHTML = rulesOf(V);
    els.sched.innerHTML = '每关目标：' + [1, 2, 3, 4, 5].map((k) => '第 ' + k + ' 关 ' + fmtMoney(G.stageTarget(k, V.key))).join(' · ') + ' ……越往后要求越高。';
    App.show(els.intro);
  }
  function newRun() {
    R = {
      v: 3, variant: V.key, seed: Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36),
      day: 1, stage: 1, sd: 1, slen: G.STAGE_DAYS, eq: G.stageStart(1, V.key), pool: 0, sv: 1, perks: {},
      tac: {}, items: [], bag: [], tier: 0, streak: 0, insUsed: false, t0Used: false, hold: null, salt: {}, call: null, shop: null,
      retreats: 0, maxStage: 0, peakNet: G.stageStart(1, V.key), liqs: 0, wins: 0, best: null, hist: [], ov: {}, inDay: null, over: null, pre: null,
    };
    R.perks = G.rollPerks(R.seed, R.sv, market().stocks.length);
    saveRun();
    const b = bestRec(); b.runs++; App.store.set(bestKey(V), b);
    sel.sid = null; sel.dir = 1; sel.lev = V.levs[0];
  }
  const bestRec = (v) => App.store.get(bestKey(v || V), { runs: 0, maxStage: 0, peakNet: E.PRO_START, days: 0 });
  function updateBest() {
    const b = bestRec();
    b.maxStage = Math.max(b.maxStage, R.maxStage); b.peakNet = Math.max(b.peakNet, R.peakNet); b.days = Math.max(b.days, R.day - 1);
    App.store.set(bestKey(V), b);
  }

  // ---------- 盘前：选股、方向、杠杆 ----------
  function offersNow() {
    const m = market(), D = R.day, n = R.salt[D] || 0, o = m.offers(D, n ? 'h' + n : undefined).slice();
    // 老股东：收盘时持有的福利股，第二天一定还在候选里
    if (R.hold && o.indexOf(R.hold.sid) < 0) o[o.length - 1] = R.hold.sid;
    return o;
  }
  function renderPick() {
    scr.classList.remove('empty');
    const m = market(), D = R.day, day = m.at(D), tgt = T(), base = S0();
    els.t2.textContent = '第 ' + D + ' 天 · 第 ' + R.stage + ' 关（' + R.sd + '/' + R.slen + '）';
    els.eq.textContent = fmtMoney(R.eq);
    els.wk.textContent = R.sd >= R.slen ? '今天收盘后考核' : '还有 ' + (R.slen - R.sd + 1) + ' 个交易日考核';
    els.target.textContent = fmtMoney(tgt);
    const gap = tgt - R.eq;
    els.need.innerHTML = gap > 0 ? '还差 <b class="num">' + fmtMoney(gap) + '</b>（' + fmtPct((gap / Math.max(1, R.eq)) * 100, 1) + '）' : '<span class="up">已达标，多出 ' + fmtMoney(-gap) + '</span>';
    els.fill.style.width = (clamp((R.eq - base) / Math.max(1, tgt - base), 0, 1) * 100).toFixed(1) + '%';
    els.pool.textContent = fmtMoney(R.pool);
    els.tier.innerHTML = '<span class="chip tier t' + R.tier + '">' + tierName(R.tier) + '</span> 身价 <b class="num">' + fmtMoney(net()) + '</b>';
    renderMe();
    // 大盘
    els.idxName.textContent = '大盘 · ' + m.index;
    const ih = m.hist(D, VIS, 'idx'), last = ih[ih.length - 1];
    els.tiLast.textContent = last.c.toFixed(2);
    els.tiChg.textContent = fmtPct(last.ret); els.tiChg.className = 'num ti-chg ' + cls(last.ret);
    const r5 = (last.c / ih[ih.length - 6].c - 1) * 100, r30 = (last.c / ih[0].o - 1) * 100;
    els.tiRun.innerHTML = '近5日 <span class="' + cls(r5) + '">' + fmtPct(r5, 1) + '</span> · 近30日 <span class="' + cls(r30) + '">' + fmtPct(r30, 1) + '</span>';
    // 消息
    els.news.innerHTML = '';
    const addNews = (x, kind) => {
      const row = App.el('<div class="nw ' + kind + '"><span class="tag">' + (kind === 'good' ? '利好' : '利空') + '</span><b></b><span class="nw-t"></span><span class="nw-r num"></span></div>');
      row.querySelector('b').textContent = m.sectors[x.sec].name;
      row.querySelector('.nw-t').textContent = x.text;
      const r = row.querySelector('.nw-r');
      r.textContent = '近5日 ' + fmtPct(x.run5, 1); r.className = 'nw-r num ' + cls(x.run5);
      els.news.appendChild(row);
    };
    day.fav.forEach((x) => addNews(x, 'good'));
    day.bad.forEach((x) => addNews(x, 'bad'));
    if (has('qianzhan')) {
      const tm = m.at(D + 1).fav.map((x) => m.sectors[x.sec].name);
      els.news.appendChild(App.el('<div class="nw tmr"><span class="tag">题材前瞻</span><span class="nw-t">明天的利好板块：<b>' + (tm.length ? tm.join('、') : '暂时没有') + '</b></span></div>'));
    }
    // 三只股票
    const offers = offersNow();
    if (offers.indexOf(sel.sid) < 0) sel.sid = null;
    const tip = has('neimu') ? G.insiderTip(R.seed, D, offers, day.bars) : null;
    els.picks.innerHTML = '';
    const yday = m.at(D - 1);
    for (const sid of offers) {
      const st = m.stocks[sid], h = m.hist(D, VIS, sid, R.ov), lastC = h[h.length - 1].c;
      const c30 = (lastC / h[0].o - 1) * 100, c5 = (lastC / h[h.length - 6].c - 1) * 100;
      const fav = day.fav.some((x) => x.sec === st.sec), bad = day.bad.some((x) => x.sec === st.sec);
      const card = App.el('<button class="pick" data-sid="' + sid + '"><div class="pk-top"><b class="pk-name"></b><span class="pk-code num"></span><span class="chip pk-sec"></span></div>' +
        '<div class="pk-body"><canvas class="pk-cv"></canvas><div class="pk-stats">' +
        '<div><span>近30日</span><b class="num ' + cls(c30) + '">' + fmtPct(c30, 1) + '</b></div><div><span>近5日</span><b class="num ' + cls(c5) + '">' + fmtPct(c5, 1) + '</b></div>' +
        '<div><span>波动</span><b>' + volTag(st) + '</b></div><div><span>跟大盘</span><b>' + betaTag(st) + '</b></div></div></div><div class="pk-extra"></div></button>');
      card.querySelector('.pk-name').textContent = st.name;
      card.querySelector('.pk-code').textContent = st.code + ' · ' + lastC.toFixed(2);
      card.querySelector('.pk-sec').textContent = st.ind;
      const top = card.querySelector('.pk-top'), chip = (c, t) => top.insertAdjacentHTML('beforeend', '<span class="chip ' + c + '">' + t + '</span>');
      if (st.limit > 10) chip('gold', '20cm');
      if (fav) chip('up', '利好');
      if (bad) chip('down', '利空');
      if (day.bars[sid].earn) chip('gold', '今日财报');
      const yb = yday.bars[sid];
      if (st.limit && yb.c >= yb.lu - 1e-9) chip('up', '昨日涨停');
      else if (st.limit && yb.c <= yb.ld + 1e-9) chip('down', '昨日跌停');
      const ex = card.querySelector('.pk-extra'), line = (c, t) => ex.insertAdjacentHTML('beforeend', '<span class="pkx ' + c + '">' + t + '</span>');
      const pk = R.perks[sid];
      if (pk) line('perk', '🎁 ' + G.PERK[pk].name + (R.hold && R.hold.sid === sid ? ' · 老股东第 ' + (R.hold.n + 1) + ' 天' + (R.hold.n + 1 >= 3 ? '（福利翻倍）' : '') : ''));
      if (tip && tip.sid === sid) line('tip', '内幕群：今天大概率收' + (tip.dir > 0 ? '涨' : '跌'));
      if (R.call && R.call.D === D && R.call.sid === sid) line('tip', '内幕电话：今天收' + (R.call.dir > 0 ? '涨' : '跌'));
      card._bars = h;
      els.picks.appendChild(card);
    }
    // 控制区：按玩法显示方向 / 杠杆
    const levs = levsNow();
    els.dirRow.style.display = V.mode === 'fixed' ? '' : 'none';
    els.levRow.style.display = levs.length > 1 ? '' : 'none';
    els.levL.textContent = V.levLive ? '开盘杠杆' : '融资融券';
    els.lev.innerHTML = levs.map((l) => '<button data-lev="' + l + '" class="' + (l >= 5 ? 'hot' : '') + '">' + l + '×</button>').join('');
    if (levs.indexOf(sel.lev) < 0) sel.lev = levs[0];
    syncCtrl();
    requestAnimationFrame(drawCharts);
  }
  // 搭档、战法、道具、锦囊
  function renderMe() {

  function drawCharts() {
    if (!R || !els.tiCv.clientWidth) return;
    const m = market(), D = R.day;
    drawCandles(els.tiCv, m.hist(D, VIS + 10, 'idx'), { show: VIS, ma: [5, 10], axis: true });

  }

  const actName = () => (V.t1 ? (sel.dir > 0 ? (sel.lev > 1 ? '融资买入' : '买入') : '融券卖出') : V.mode === 'long' ? '买入' : '');
  function syncCtrl() {
    els.dir.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.getAttribute('data-dir') === sel.dir));
    els.lev.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.getAttribute('data-lev') === sel.lev));
    els.picks.querySelectorAll('.pick').forEach((c) => c.classList.toggle('on', +c.getAttribute('data-sid') === sel.sid));
    if (V.t1) els.lev.querySelectorAll('button').forEach((b) => { const l = +b.getAttribute('data-lev'); b.textContent = l === 1 ? (sel.dir > 0 ? '1× 普通' : '1×') : l + '×' + (sel.dir > 0 ? ' 融资' : ''); });
    const st = sel.sid != null && R ? market().stocks[sel.sid] : null;
    let risk;
    if (V.key === 'easy') risk = '简单难度：只做多、不加杠杆。按住买入，松开卖出。';
    else if (V.t1) risk = 'T+1：开了仓就锁到明天开盘。' + (sel.lev > 1 ? sel.lev + ' 倍：股价涨跌 1%，你赚亏 ' + sel.lev + '%。' : '') + (sel.dir < 0 ? '融券做空：跌了赚，涨了亏。' : '');
    else if (sel.lev === 1) risk = '开盘先用 1 倍，盘中随时能调。按左半边做空、右半边做多。';
    else risk = '开盘 ' + sel.lev + ' 倍（盘中随时能调）：股价涨跌 1%，你赚亏 ' + sel.lev + '%；<b>反向波动 ' + liqMove(sel.lev) + '% 就强平</b>。';
    if (st && st.limit > 10) risk += ' 这只是 20cm，一天最多能涨跌 20%。';
    if (st && market().at(R.day).bars[st.id].earn) risk += ' <b>今天是它的财报日</b>，可能大涨大跌。';
    if (st && R.perks[st.id]) { const p = G.PERK[R.perks[st.id]]; risk += ' 🎁 股东福利「' + p.name + '」：' + p.desc.replace('收盘时还持有：', '收盘时还做多就') + '。' + (V.mode === 'long' ? '' : '收盘时做空它要付借券费。'); }
    els.risk.innerHTML = risk;
    els.go.disabled = !st;
    els.go.textContent = !st ? '先选一只股票' : V.t1 ? '开盘：' + actName() + ' ' + st.name + (sel.lev > 1 ? ' ' + sel.lev + '×' : '') : V.mode === 'long' ? '开盘：买入 ' + st.name : '开盘：' + st.name + ' · ' + sel.lev + '×';
    els.go.classList.toggle('red', !!st && sel.lev >= 5);
  }

  // ---------- 锦囊（盘前用） ----------
  function useBag(id) {
    const i = R.bag.indexOf(id);
    if (i < 0) return;
    const D = R.day, bars = market().at(D).bars;
    if (id === 'dianhua' && sel.sid == null) { App.toast('先选中一只股票，再打内幕电话', '', 1600); return; }
    R.bag.splice(i, 1);
    App.sfx.tap();
    if (id === 'huan') { R.salt[D] = (R.salt[D] || 0) + 1; sel.sid = null; App.toast('换了一批新的候选', 'gold', 1400); }
    if (id === 'dianhua') { R.call = { D, sid: sel.sid, dir: G.dirOfBar(bars[sel.sid]) }; App.toast('内幕电话：' + market().stocks[sel.sid].name + '今天收' + (R.call.dir > 0 ? '涨' : '跌'), R.call.dir > 0 ? 'up' : 'down', 2200); }
    if (id === 'yanqi') { R.slen++; App.toast('延期考核：这一关多给一天', 'gold', 1600); }
    saveRun();
    renderPick();
  }

  function startDay() {
    if (!R || R.over || sel.sid == null) return;
    const m = market(), D = R.day, st = m.stocks[sel.sid];
    curDay = m.intraday(D, sel.sid);
    // 时光机：开盘前存一份，结算时可以回到这一刻
    const pre = R.bag.indexOf('shiguang') >= 0 ? JSON.stringify(Object.assign({}, R, { pre: null })) : null;
    R.inDay = { d: D, sid: sel.sid, dir: V.mode === 'fixed' ? sel.dir : 1, lev: sel.lev, eq0: R.eq, snap: null };
    R.pre = pre;
    saveRun();
    CH.bumpToday();
    App.sfx.tap();
    const levs = levsNow(), c = CH.cur();
    const feeK = (has('lingyong') ? 0.3 : 1) * (has('kuangren') ? 2 : 1) * (R.tier >= 1 ? 0.5 : 1);
    App.go('hold', { pro: {
      day: curDay, eq0: R.eq, mode: V.mode, dir: V.mode === 'fixed' ? sel.dir : 1, lev: V.key === 'easy' ? 1 : sel.lev,
      levs: V.levLive ? levs : null, t1: V.t1, nextOpen: V.t1 ? m.at(D + 1).bars[sel.sid].o : null,
      label: V.tag + '第 ' + R.stage + ' 关 · ' + (V.t1 ? actName() + (sel.lev > 1 ? ' ' + sel.lev + '×' : '') + ' · ' : '') + st.ind,
      fx: { feeK, stopLoss: has('zhisun'), meltdown: has('rongduan') && V.key === 'hard', t0Pass: has('t0') && V.t1 && !R.t0Used, newsLead: has('yanbao') ? 5 : 0 },
      ava: { html: CH.portrait(c.id, CH.stage(), 'head'), lines: { up: CH.line('up'), down: CH.line('down'), liq: CH.line('liq') } },
      onTrade: (snap) => { if (R && R.inDay) { R.inDay.snap = snap; saveRun(); } },
      onDone: (res) => App.go('trader', { done: res, variant: V.key }),
    } });
  }

  // 上次中途离开（刷新、关掉页面）：还拿着的仓位按当天收盘价平掉（大A 按次日开盘价）
  function settleInterrupted() {
    const inD = R.inDay, m = market(), bar = m.at(inD.d).bars[inD.sid];
    let eq = inD.eq0, liqs = 0;
    if (inD.snap) {
      liqs = inD.snap.liqs || 0;
      eq = inD.snap.pos ? E.proClose({ eq: 0, pos: inD.snap.pos, fees: 0 }, V.t1 ? m.at(inD.d + 1).bars[inD.sid].o : bar.c) : inD.snap.eq;
    }
    handleDone({ eq0: inD.eq0, eq, ret: (eq / inD.eq0 - 1) * 100, fees: 0, liqs, bankrupt: eq < 1, quit: true, trades: [], holdMask: [], ohlc: [bar.o, bar.h, bar.l, bar.c], overnight: null, closed: [], atClose: 0 }, true);
  }

  // ---------- 收盘结算 ----------
  function handleDone(res, interrupted) {
    const inD = R.inDay, m = market(), D = inD.d, sid = inD.sid, st = m.stocks[sid], day = m.at(D);
    if (!curDay || curDay.seed !== 'pro:' + V.market + ':' + R.seed + ':' + D + ':' + sid) curDay = m.intraday(D, sid);
    R.ov[sid + ':' + D] = res.ohlc.map(round2);
    const eq0 = res.eq0, raw = Math.max(0, res.eq), closed = res.closed || [], rep = { lines: [], ups: [] };
    let eq = raw, bankrupt = !!res.bankrupt || raw < 1;
    const add = (label, v, c) => { if (!v) return; eq += v; rep.lines.push([label, v, c || '']); };
    // 强平保险：每关第一次被强平，退还这一笔一半的亏损（爆仓也算）
    const liqTr = closed.find((t) => t.via === 'liq');
    if (liqTr && has('baoxian') && !R.insUsed && liqTr.pnl < 0) { R.insUsed = true; add('强平保险', Math.round(-liqTr.pnl * 0.5), 'gold'); if (eq >= 1) bankrupt = false; }
    if (!bankrupt) {
      // 战法
      const tc = G.settleTactics(R, V, closed, curDay);
      if (tc.bonus) add('战法加成（' + tc.used.map((id) => G.TAC[id].name + ' Lv' + G.lvOf(R, id)).join('、') + '）', tc.bonus, 'gold');
      rep.ups = tc.ups;
      // 股东福利 / 借券费
      const pk = R.perks[sid], at = res.atClose || 0;
      const nHold = (R.hold && R.hold.sid === sid ? R.hold.n : 0) + (pk && at > 0 ? 1 : 0);
      if (pk && at) {
        const mult = (has('youdai') ? 2 : 1) * (nHold >= 3 ? 2 : 1), v = G.settlePerk(pk, mult, at, eq0, raw, res.fees || 0);
        add(at > 0 ? '股东福利 · ' + G.PERK[pk].name + (mult > 1 ? ' ×' + mult : '') : '借券费（做空福利股）', v, at > 0 ? 'perk' : '');
      }
      R.hold = pk && at > 0 ? { sid, n: nHold } : null;
      // 北向资金 / 复利雪球
      if (has('beixiang') && day.idx.ret > 0 && closed.some((t) => t.dir > 0)) add('北向资金（大盘涨了）', Math.round(eq0 * 0.01), 'gold');
      R.streak = raw > eq0 * 1.0005 ? R.streak + 1 : 0;
      if (has('xueqiu') && raw > eq0 && R.streak) add('复利雪球（连赚 ' + R.streak + ' 天）', Math.round((raw - eq0) * Math.min(0.5, 0.1 * R.streak)), 'gold');
    } else { R.hold = null; R.streak = 0; }
    if (res.t0Used) R.t0Used = true;
    eq = Math.max(0, Math.round(eq));
    if (eq < 1) bankrupt = true;
    const ret = (eq / eq0 - 1) * 100;
    CH.addLife(eq - eq0);
    R.eq = eq;
    R.liqs += res.liqs;
    if (ret > 0.05) R.wins++;
    if (!R.best || ret > R.best.ret) R.best = { d: D, ret };
    R.hist.push({ d: D, k: R.stage, sid, dir: inD.dir, lev: inD.lev, eq0, eq, ret: Math.round(ret * 100) / 100, n: res.trades.length, liqs: res.liqs });
    while (R.hist.length > 300) R.hist.shift();
    R.inDay = null;
    R.call = null;
    // 关末考核 / 爆仓
    const k = R.stage, tgt = T();
    let check = null;
    if (bankrupt || R.sd >= R.slen) check = stageEnd(k, tgt, bankrupt, D);
    else R.sd++;
    R.day = D + 1;
    R.peakNet = Math.max(R.peakNet, net());
    saveRun();
    if (R.over) updateBest();
    headerFor();
    if (!R.over) renderPick(); else scr.classList.add('empty');
    showDayResult(res, { eq0, eq, ret, raw, bankrupt }, inD, st, day, check, rep, interrupted);
  }

  // 一关结束：过关 → 超出部分进池子、利息、打新、身份、开店；没过 → 用池子退关，付不起就输光
  function stageEnd(k, tgt, bankrupt, D) {
    const ck = { k, tgt, eq: R.eq, bankrupt, pass: !bankrupt && R.eq >= tgt };
    if (ck.pass) {
      ck.surplus = R.eq - tgt;
      R.pool += ck.surplus;
      ck.interest = G.interestOf(R.pool, tgt, has('licai'));
      R.pool += ck.interest;
      const rng = App.makeRng('ipo:' + R.seed + ':' + D);
      if (rng.chance(G.ipoChance(tgt + R.pool))) { ck.ipo = G.ipoPrize(tgt); R.pool += ck.ipo; }
      const t = Math.max(R.tier, G.tierFor(tgt + R.pool, V.key));
      if (t > R.tier) { ck.tierUp = t; R.tier = t; }
      R.maxStage = Math.max(R.maxStage, k);
      R.shop = G.rollShop(R, V, tgt, App.makeRng('shop:' + R.seed + ':' + D + ':' + R.sv));
      enterStage(k + 1, tgt);
      return ck;
    }
    const j = G.retreatTo(R.pool, k, V.key);
    if (!j) {
      R.over = { why: bankrupt ? 'bankrupt' : 'target', d: D, k, tgt, eq: R.eq, pool: R.pool };
      ck.over = true;
      return ck;
    }
    const cost = G.stageStart(j, V.key);
    R.pool -= cost; R.retreats++;
    ck.retreat = { to: j, cost, left: R.pool };
    enterStage(j, cost);
    return ck;
  }
  function enterStage(k, startEq) {
    R.stage = k; R.sd = 1; R.slen = G.STAGE_DAYS; R.eq = startEq; R.sv++;
    R.perks = G.rollPerks(R.seed, R.sv, market().stocks.length);
    R.insUsed = false; R.t0Used = false; R.hold = null;
  }

  function dayTitle(res, r) {
    if (r.bankrupt) return '穿仓破产';
    if (res.liqs) return '被强制平仓';
    const x = r.ret;
    if (x >= 20) return '一天翻身';
    if (x >= 8) return '大赚一笔';
    if (x >= 2) return '稳稳赚钱';
    if (x > 0.05) return '小赚一点';
    if (x > -0.05) return '空仓观望';
    if (x > -5) return '小亏离场';
    if (x > -15) return '亏得肉疼';
    return '关灯吃面';
  }

  function showDayResult(res, r, inD, st, day, check, rep, interrupted) {
    const q = (s) => els.res.querySelector(s), bar = day.bars[inD.sid], c = CH.cur();
    q('.rs-ava').innerHTML = CH.portrait(c.id, CH.stage(), 'head');
    const ev = check ? (check.pass ? 'pass' : 'fail') : res.liqs || r.bankrupt ? 'liq' : r.ret > 0.05 ? 'win' : 'lose';
    q('.rs-say').innerHTML = '<b>' + c.name + '：</b>' + CH.line(ev);
    q('.rs-title').textContent = '第 ' + inD.d + ' 天 · ' + dayTitle(res, r);
    const ret = q('.rs-ret'); ret.textContent = fmtPct(r.ret); ret.className = 'res-ret num rs-ret ' + cls(r.ret);
    q('.rs-eq').textContent = fmtMoney(r.eq0) + ' → ' + (res.eq < 0 ? '穿仓 ' : '') + fmtMoney(r.eq) + (interrupted ? (V.t1 ? '（上次中途离开，按次日开盘价结算）' : '（上次中途离开，按收盘价结算）') : '');
    const opName = V.t1 ? (inD.dir > 0 ? (inD.lev > 1 ? '融资买入 ' + inD.lev + '×' : '买入') : '融券卖出' + (inD.lev > 1 ? ' ' + inD.lev + '×' : '')) : V.mode === 'long' ? '只做多' : '多空 · 开盘 ' + inD.lev + '×';
    const facts = [
      ['你的操作', opName + ' · ' + res.trades.filter((t) => t.via !== 'nextOpen').length + ' 笔'],
      ['手续费', fmtMoney(res.fees)],
      [st.name, '<span class="' + cls(bar.ret) + '">' + fmtPct(bar.ret) + '</span>' + (bar.c >= bar.lu ? ' 涨停' : bar.c <= bar.ld ? ' 跌停' : '')],
      ['大盘', '<span class="' + cls(day.idx.ret) + '">' + fmtPct(day.idx.ret) + '</span>'],
    ];
    if (res.overnight != null) facts.push(['次日开盘', '<span class="' + cls(res.overnight) + '">' + fmtPct(res.overnight) + '</span>']);
    if (res.liqs) facts.push(['强制平仓', res.liqs + ' 次']);
    q('.rs-facts').innerHTML = facts.map((f) => '<div>' + f[0] + '<b>' + f[1] + '</b></div>').join('');
    // 结算明细：盘中赚亏 + 战法 / 福利 / 道具
    const sl = rep.lines.length ? ['<div class="st-row"><span>盘中赚亏</span><b class="num ' + cls(r.raw - r.eq0) + '">' + (r.raw >= r.eq0 ? '+' : '−') + fmtMoney(Math.abs(r.raw - r.eq0)) + '</b></div>']
      .concat(rep.lines.map((x) => '<div class="st-row ' + x[2] + '"><span>' + x[0] + '</span><b class="num ' + cls(x[1]) + '">' + (x[1] >= 0 ? '+' : '−') + fmtMoney(Math.abs(x[1])) + '</b></div>')) : [];
    rep.ups.forEach((id) => sl.push('<div class="st-up">🎉 战法升级：<b>' + G.TAC[id].name + ' Lv' + G.lvOf(R, id) + '</b>，这类交易以后多赚 ' + Math.round(G.lvOf(R, id) * G.TAC_STEP * 100) + '%</div>'));
    q('.rs-settle').innerHTML = sl.length ? '<div class="st-box">' + sl.join('') + '</div>' : '';
    q('.rs-lesson').innerHTML = '💡 ' + lessonFor(res, r, inD, st, day);
    q('.rs-week').innerHTML = stageBox(check);
    const tm = R.pre && R.bag.indexOf('shiguang') >= 0;
    q('.rs-tm').style.display = tm ? '' : 'none';
    q('.rs-next').textContent = R.over ? '查看结果' : check && check.pass ? '去商店' : check && check.retreat ? '退回第 ' + check.retreat.to + ' 关' : '下一天';
    App.show(els.res);
    if (r.ret >= 2) App.sfx.good(); else if (r.ret <= -2) App.sfx.bad();
    if (check && check.pass) App.confetti(scr);
    requestAnimationFrame(() => App.Hold.drawDay(q('.rs-chart'), curDay, { mask: res.holdMask.length ? res.holdMask : null, trades: res.trades.filter((t) => t.via !== 'nextOpen') }));
  }
  function stageBox(ck) {
    if (!ck) {
      const tgt = T(), gap = tgt - R.eq, left = R.slen - R.sd + 1;
      return '<div class="wk-box">第 ' + R.stage + ' 关还剩 <b>' + left + '</b> 个交易日 · 目标 ' + fmtMoney(tgt) + '<br>' +
        (gap > 0 ? '还差 <b class="num">' + fmtMoney(gap) + '</b>，平均每天要赚 ' + fmtPct((Math.pow(tgt / Math.max(1, R.eq), 1 / left) - 1) * 100, 1) : '<span class="up">已经达标了，超出的部分过关后进累计池</span>') + '</div>';
    }
    if (ck.pass) {
      const li = ['超出目标 <b class="num">' + fmtMoney(ck.surplus) + '</b> 进累计池'];
      if (ck.interest) li.push('累计池利息 <b class="num">+' + fmtMoney(ck.interest) + '</b>' + (has('licai') ? '（理财经理翻倍）' : ''));
      if (ck.ipo) li.push('🎉 打新中签 <b class="num">+' + fmtMoney(ck.ipo) + '</b>');
      if (ck.tierUp) li.push('🎉 身份升级：<b>' + tierName(ck.tierUp) + '</b>（' + G.TIERS[ck.tierUp].perk + '）');
      li.push('累计池现在 <b class="num">' + fmtMoney(R.pool) + '</b>；第 ' + R.stage + ' 关从 ' + fmtMoney(R.eq) + ' 起步，目标 ' + fmtMoney(T()));
      return '<div class="wk-box pass"><div class="big">✅ 第 ' + ck.k + ' 关通过</div>' + li.join('<br>') + '</div>';
    }
    const why = ck.bankrupt ? '爆仓了' : '资金 ' + fmtMoney(ck.eq) + '，目标 ' + fmtMoney(ck.tgt) + '，差 ' + fmtMoney(ck.tgt - ck.eq);
    if (ck.retreat) return '<div class="wk-box fail"><div class="big">❌ 第 ' + ck.k + ' 关没过</div>' + why + '，这一关的钱没了。<br>累计池付 <b class="num">' + fmtMoney(ck.retreat.cost) + '</b> 退回<b>第 ' + ck.retreat.to + ' 关</b>，池子还剩 <b class="num">' + fmtMoney(ck.retreat.left) + '</b>。道具和战法都还在。</div>';
    return '<div class="wk-box fail"><div class="big">' + (ck.bankrupt ? '资产归零' : '❌ 第 ' + ck.k + ' 关没过') + '</div>' + why + '。<br>累计池只有 <b class="num">' + fmtMoney(R.pool) + '</b>，付不起第 1 关的 ' + fmtMoney(G.stageStart(1, V.key)) + '，彻底输光了。</div>';
  }
  function useTimeMachine() {
    if (!R || !R.pre) return;
    const back = JSON.parse(R.pre), i = back.bag.indexOf('shiguang');
    if (i >= 0) back.bag.splice(i, 1);
    back.pre = null; back.inDay = null;
    R = back; saveRun();
    App.hide(els.res);
    App.toast('⏳ 时光机：回到今天开盘前，行情不变', 'gold', 2000);
    headerFor(); renderPick();
  }

  // 一句复盘：把当天最值得学的那条规律说出来（按玩家实际赚亏判断，不按股票收盘涨跌）
  function lessonFor(res, r, inD, st, day) {
    const m = market(), bar = day.bars[inD.sid], sec = m.sectors[st.sec].name, won = r.ret > 0.05;
    const long = V.mode === 'fixed' ? inD.dir > 0 : null;
    const fav = day.fav.find((x) => x.sec === st.sec), bad = day.bad.find((x) => x.sec === st.sec);
    const move = st.name + '收 ' + fmtPct(bar.ret, 1);
    if (r.bankrupt) return V.market === 'us' ? '没有跌停板托底的市场里，高杠杆遇上暴跌，强平都来不及。' : '高杠杆加上封死的涨跌停，强平单都卖不出去，亏损就会超过本金。';
    if (res.liqs) return '杠杆越高，强平线越近：' + (inD.lev > 1 ? inD.lev + ' 倍时' : '加了杠杆后') + '股价反向 ' + liqMove(Math.max(2, inD.lev)) + '% 就会亏掉一半本金。看错时早点松手，比等强平便宜得多。';
    if (bar.flash) return (bar.flash < 0 ? '盘中闪崩' : '盘中闪拉') + '：突发消息出来后只有一两秒，' + (won ? '你跑得够快。' : '反应慢一点就跑不掉了。');
    if (V.t1 && res.overnight != null) {
      const g = res.overnight, dir = inD.dir;
      if (bar.c >= bar.lu - 1e-9 && dir > 0) return '收盘封涨停的股票，第二天常常高开：次日开盘 ' + fmtPct(g, 1) + '。这就是“打板”。';
      if (bar.c <= bar.ld + 1e-9 && dir > 0) return '买在跌停当天，T+1 卖不掉，第二天开盘又是 ' + fmtPct(g, 1) + '。大A最怕的就是这个。';
      if (Math.abs(g) >= 2) return 'T+1 的风险在隔夜：今天收盘之后发生的事，要到明天开盘才能反映，次日开盘 ' + fmtPct(g, 1) + '。';
    }
    if (bar.earn) return '财报日：' + st.name + '收 ' + fmtPct(bar.ret, 1) + '。财报日波动大，赌对了一天翻倍，赌错了一天腰斩。';
    if (fav && fav.fade) return '利好出尽：' + sec + '板块近 5 日已经涨了 ' + fmtPct(fav.run5, 1) + '，再出利好，资金反而借机出货，' + move + '。';
    if (bad && bad.bounce) return '利空出尽：' + sec + '板块近 5 日已经跌了 ' + fmtPct(bad.run5, 1) + '，坏消息反而成了反弹的起点，' + move + '。';
    if (fav) {
      if (long === false) return sec + '板块有利好，' + move + '。' + (won ? '做空还赚了，是抓住了冲高回落，这种机会不常有。' : '和利好对着干，风险更大。');
      return sec + '板块有利好，' + move + '。' + (won ? '顺着消息做多，胜率更高。' : '利好常常在开盘就高开反映了，追高要小心。');
    }
    if (bad) {
      if (long === true) return sec + '板块有利空，' + move + '。' + (won ? '利空当天做多还赚了，是抓到了反弹，别当成常态。' : '利空当天做多，是在接飞刀。');
      return sec + '板块有利空，' + move + '。' + (won ? '利空当天做空，顺势而为。' : '坏消息常常一开盘就跌出来了，低开后再追空，容易被反弹打脸。');
    }
    if (!res.trades.length) return '空仓也是一种操作：没有把握的时候，不亏就是赚。';
    if (st.beta >= 1.2) return st.name + '跟大盘跟得很紧：今天大盘 ' + fmtPct(day.idx.ret, 1) + '，它收 ' + fmtPct(bar.ret, 1) + '。先看准大盘方向，再选这种股票。';
    return '今天大盘 ' + fmtPct(day.idx.ret, 1) + '，' + move + '。' + (won ? '赚到了。盘中拿得住、跑得快，比选对方向还重要。' : '亏损时越早认错，亏得越少。');
  }

  // ---------- 商店（每关过关后） ----------
  function showShop() {
    if (!R || !R.shop) { renderPick(); return; }
    const sh = R.shop, c = CH.cur(), st = CH.stage(), q = (s) => els.shop.querySelector(s);
    q('.sh-ava').innerHTML = CH.portrait(c.id, st, 'head');
    q('.sh-title').textContent = '第 ' + (R.stage - 1) + ' 关过关 · 商店';
    q('.sh-pool').innerHTML = '累计池 <b class="num">' + fmtMoney(R.pool) + '</b>';
    if (!q('.sh-say')._t || q('.sh-say')._t !== R.sv) { q('.sh-say')._t = R.sv; q('.sh-say').textContent = c.name + '：' + CH.line('shop'); }
    const slotsFull = R.items.length >= G.itemSlots(R), bagFull = R.bag.length >= G.BAG_SLOTS;
    const card = (key, it, price, sold, tag, note) => {
      const can = !sold && R.pool >= price && !note;
      return '<div class="sh-it r' + (it.r || 1) + (sold ? ' sold' : '') + '"><div class="sh-h"><b>' + it.name + '</b><span class="chip">' + tag + '</span></div><div class="sh-d">' + it.desc + '</div>' +
        '<button class="btn small' + (can ? '' : ' ghost') + '" data-buy="' + key + '"' + (can ? '' : ' disabled') + '>' + (sold ? '已买' : note || (R.pool >= price ? '买 ' + fmtMoney(price) : '钱不够 ' + fmtMoney(price))) + '</button></div>';
    };
    let html = sh.items.map((x, i) => { const it = G.itemInfo(x.id); return card('i' + i, it, x.price, x.sold, it.xd ? '心得' : G.RARE[it.r] + (slotsFull && !it.xd && !x.sold ? ' · 栏满要换' : ''), ''); }).join('');
    const b = G.BAGI[sh.bag.id];
    html += card('b', { name: '🎒 ' + b.name, desc: b.desc, r: b.rare ? 2 : 1 }, sh.bag.price, sh.bag.sold, '锦囊', !sh.bag.sold && bagFull ? '锦囊栏满了' : '');
    const treatName = ['奶茶', '咖啡和甜点', '珠宝'][st - 1];
    html += '<div class="sh-it treat"><div class="sh-h"><b>给' + c.name + '买' + treatName + '</b><span class="chip">请客</span></div><div class="sh-d">不影响数值，只会让 TA 开心一下（不买也没惩罚，只会被念叨）。</div>' +
      '<button class="btn small' + (!sh.treated && R.pool >= sh.treat ? '' : ' ghost') + '" data-buy="t"' + (!sh.treated && R.pool >= sh.treat ? '' : ' disabled') + '>' + (sh.treated ? '已请客' : '请客 ' + fmtMoney(sh.treat)) + '</button></div>';
    q('.sh-list').innerHTML = html;
    q('.sh-swap').innerHTML = pendingRep != null ? '<div class="sh-swapbox">道具栏满了（' + R.items.length + '/' + G.itemSlots(R) + '），换掉哪一件？<div>' +
      R.items.map((id) => '<button class="itm r' + G.itemInfo(id).r + '" data-swap="' + id + '">换掉 ' + G.itemInfo(id).name + '</button>').join('') + '<button class="itm" data-swap="">不买了</button></div></div>' : '';
    q('.sh-owned').innerHTML = '已有道具（' + R.items.length + '/' + G.itemSlots(R) + '）：' + (R.items.map((id) => G.itemInfo(id).name).join('、') || '无') +
      ' · 锦囊（' + R.bag.length + '/' + G.BAG_SLOTS + '）：' + (R.bag.map((id) => G.BAGI[id].name).join('、') || '无');
    q('.sh-go').textContent = '继续，开始第 ' + R.stage + ' 关';
    App.show(els.shop);
  }
  function buy(key) {
    const sh = R.shop;
    if (!sh) return;
    if (key === 't') {
      if (sh.treated || R.pool < sh.treat) return;
      R.pool -= sh.treat; sh.treated = true;
      App.sfx.good();
      els.shop.querySelector('.sh-say').textContent = CH.cur().name + '：' + CH.line('treat');
    } else if (key === 'b') {
      if (sh.bag.sold || R.pool < sh.bag.price || R.bag.length >= G.BAG_SLOTS) return;
      R.pool -= sh.bag.price; sh.bag.sold = true; R.bag.push(sh.bag.id);
      App.sfx.buy();
    } else {
      const i = +key.slice(1), x = sh.items[i], it = G.itemInfo(x.id);
      if (!x || x.sold || R.pool < x.price) return;
      if (it.xd) {
        const t = R.tac[it.xd] || (R.tac[it.xd] = { xp: 0, lv: 0 });
        if (t.lv < G.TAC_MAX) t.lv++;
        R.pool -= x.price; x.sold = true;
        App.toast('🎉 ' + G.TAC[it.xd].name + '升到 Lv' + t.lv, 'gold', 1800);
        App.sfx.good();
      } else if (R.items.length >= G.itemSlots(R)) { pendingRep = i; }
      else { R.pool -= x.price; x.sold = true; R.items.push(x.id); App.sfx.buy(); }
    }
    saveRun();
    showShop();
  }
  function swapItem(id) {
    const i = pendingRep;
    pendingRep = null;
    if (id && i != null) {
      const x = R.shop.items[i];
      if (x && !x.sold && R.pool >= x.price) { R.items.splice(R.items.indexOf(id), 1); R.pool -= x.price; x.sold = true; R.items.push(x.id); App.sfx.buy(); }
    }
    saveRun();
    showShop();
  }

  // ---------- 出局 ----------
  function showOver() {
    const o = R.over, q = (s) => els.over.querySelector(s), c = CH.cur();
    const days = R.day - 1;
    q('.ov-ava').innerHTML = CH.portrait(c.id, CH.stage(), 'head');
    q('.ov-title').textContent = V.name + ' · ' + (o.why === 'quit' ? '主动离场' : '彻底输光');
    q('.ov-big').textContent = R.maxStage ? '打到第 ' + (R.maxStage + 1) + ' 关' : '没过第 1 关';
    q('.ov-sub').textContent = o.why === 'quit' ? '最后身价 ' + fmtMoney(net()) + '。' : (o.why === 'bankrupt' ? '第 ' + o.d + ' 天爆仓' : '第 ' + o.k + ' 关没过') + '，累计池只剩 ' + fmtMoney(o.pool) + '，付不起第 1 关的启动资金。' + c.name + '：' + CH.line('fail');
    const winRate = days ? Math.round((R.wins / days) * 100) : 0;
    const stats = [
      [R.maxStage + ' 关', '通过'], [days + ' 天', '坚持'], [fmtMoney(R.peakNet), '最高身价'],
      [R.retreats + ' 次', '退关'], [R.liqs + ' 次', '被强平'], [winRate + '%', '赚钱的天数'],
    ];
    q('.ov-stats').innerHTML = stats.map((s) => '<div><b class="num">' + s[0] + '</b><span>' + s[1] + '</span></div>').join('');
    const b = bestRec();
    q('.ov-best').innerHTML = V.name + ' 历史最佳：通过 <b>' + b.maxStage + '</b> 关 · 最高身价 <b>' + fmtMoney(b.peakNet) + '</b> · 一共玩了 ' + b.runs + ' 局';
    App.show(els.over);
    App.sfx.bad();
  }

  // ---------- K 线小图 ----------
  function drawCandles(cv, all, o) {
    const { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    const bars = all.slice(-o.show), off = all.length - bars.length;
    if (!bars.length) return;
    const padL = 2, padR = o.axis ? 44 : 2, padT = 4, padB = 4;
    let lo = Infinity, hi = -Infinity;
    for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
    const pad = (hi - lo) * 0.08 || hi * 0.01;
    lo -= pad; hi += pad;
    const plotW = w - padL - padR, plotH = h - padT - padB, n = bars.length, slot = plotW / n;
    const xOf = (i) => padL + (i + 0.5) * slot, yOf = (p) => padT + ((hi - p) / (hi - lo)) * plotH;
    if (o.axis) {
      ctx.font = '10px ' + C.num; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      for (const f of [0.15, 0.5, 0.85]) {
        const p = hi - (hi - lo) * f, y = yOf(p);
        ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
        ctx.fillStyle = C.dim; ctx.fillText(p.toFixed(0), padL + plotW + 4, y);
      }
    }
    for (let i = 0; i < n; i++) {
      const b = bars[i], up = b.c >= b.o, col = up ? C.up : C.down, x = xOf(i), bw = Math.max(1.2, slot * 0.62);
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, yOf(b.h)); ctx.lineTo(x, yOf(b.l)); ctx.stroke();
      const y1 = yOf(Math.max(b.o, b.c)), y2 = yOf(Math.min(b.o, b.c)), hh = Math.max(1, y2 - y1);
      if (up && bw >= 4) { ctx.fillStyle = C.bg; ctx.fillRect(x - bw / 2, y1, bw, hh); ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, Math.max(0.5, hh - 1)); }
      else ctx.fillRect(x - bw / 2, y1, bw, hh);
    }
    if (o.ma) {
      o.ma.forEach((k, j) => {
        ctx.strokeStyle = j === 0 ? 'rgba(255,179,26,0.9)' : 'rgba(91,140,255,0.9)';
        ctx.lineWidth = 1.2; ctx.beginPath();
        let started = false;
        for (let i = 0; i < n; i++) {
          const g = i + off;
          if (g < k - 1) continue;
          let s = 0;
          for (let z = g - k + 1; z <= g; z++) s += all[z].c;
          const x = xOf(i), y = yOf(s / k);
          if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
        }
        ctx.stroke(); ctx.lineWidth = 1;
      });
    }
  }

  // 模式菜单、首页用的一行进度
  function summaryOf(v) {
    const r = loadRun(v), b = App.store.get(bestKey(v), null);
    if (r && !r.over) return '第 ' + r.stage + ' 关 · 第 ' + r.day + ' 天 · 身价 ' + fmtMoney(r.eq + r.pool);
    if (b && b.runs) return '最佳：通过 ' + b.maxStage + ' 关 · 最高身价 ' + fmtMoney(b.peakNet);
    return '10 万起步，看你能打到第几关';
  }
  function summary(group) {
    if (group === 'biga') return summaryOf(VARIANTS.biga);
    const parts = ['easy', 'normal', 'hard'].map((k) => {
      const v = VARIANTS[k], r = loadRun(v), b = App.store.get(bestKey(v), null);
      if (r && !r.over) return v.tag + '第 ' + r.stage + ' 关';
      if (b && b.runs) return v.tag + '最佳 ' + b.maxStage + ' 关';
      return null;
    }).filter(Boolean);
    return parts.length ? parts.join(' · ') : '三档难度，10 万起步';
  }
  function activeLine() {
    const k = App.store.get('pro3_last', null), v = k && VARIANTS[k], r = v && loadRun(v);
    return r && !r.over ? (v.group === 'pro' ? '操盘手' + v.tag : '大A') + '第 ' + r.stage + ' 关' : '';
  }

  App.Trader = {
    init, summary, activeLine, VARIANTS,
    _state: () => ({ V, R, sel }),
    _select: (sid, dir, lev) => { sel.sid = sid; if (dir) sel.dir = dir; if (lev) sel.lev = lev; syncCtrl(); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ④ 画出明天：看一段真实历史走势，用手指画出未来 20 天，揭晓后打分 */
(function (root) {
  'use strict';
  const App = root.App, E = App.Engine, U = App.U, C = App.C;
  const { fmtPct, cls, clamp, lerp } = U;
  const F = 20;
  let scr, cv, els = {}, S = null, raf = 0;

  const episodes = () => (App.EPISODES && App.EPISODES.length ? App.EPISODES : (App._synthEps || (App._synthEps = E.synthEpisodes(12))));
  const isReal = () => !!(App.EPISODES && App.EPISODES.length);

  function dailyEpisode() {
    const eps = episodes();
    const order = App.makeRng('draw-order-v1').shuffle(eps.map((_, i) => i));
    return eps[order[U.dayNumber() % eps.length]];
  }
  function practiceEpisode() {
    const eps = episodes(), daily = dailyEpisode().id;
    let seen = App.store.get('draw_seen', []);
    let pool = eps.filter((e) => seen.indexOf(e.id) < 0 && e.id !== daily);
    if (!pool.length) { seen = []; pool = eps.filter((e) => e.id !== daily); if (!pool.length) pool = eps.slice(); }
    const ep = pool[Math.floor(Math.random() * pool.length)];
    seen.push(ep.id);
    App.store.set('draw_seen', seen);
    return ep;
  }
  const loadStats = () => App.store.get('draw_stats', { played: 0, right: 0, sum: 0, streakR: 0, bestR: 0, streakW: 0, bestW: 0 });

  function init() {
    scr = App.el(`
<section class="screen" id="scr-draw">
  <div class="topbar">
    <button class="icon-btn" data-act="back" aria-label="返回">‹</button>
    <div class="tb-title"><div class="t1">画出明天</div><div class="t2 d-sub">每日一题</div></div>
    <div class="tb-badge d-badge"></div>
  </div>
  <div class="draw-info"><div class="di-q d-q">某指数 · 日 K 线（名称和日期已隐藏）</div><div class="di-hint d-hint">用手指在右边画出接下来 20 个交易日的走势</div></div>
  <div class="draw-stage"><canvas class="draw-canvas"></canvas><div class="draw-prompt">从这里开始画 →</div></div>
  <div class="legend d-legend"></div>
  <div class="draw-bottom d-bottom"></div>
  <div class="overlay d-menu"><div class="sheet">
    <div class="menu-head"><div class="mascot">${App.mascot('neutral')}</div>
      <div><div class="menu-title">画出明天</div><div class="menu-sub">给你一段真实的历史走势，<br>用手指画出接下来 20 天会怎么走。</div></div></div>
    <div class="stat-row"><div><b class="num s-played">0</b><span>答题数</span></div><div><b class="num s-acc">--</b><span>方向正确率</span></div><div><b class="num s-avg">--</b><span>平均分</span></div></div>
    <div class="stat-row"><div><b class="num s-sr">0</b><span>当前连对</span></div><div><b class="num s-bestr up">0</b><span>股神指数</span></div><div><b class="num s-bestw down">0</b><span>反指指数</span></div></div>
    <button class="mode-card" data-mode="daily"><div class="mc-title">每日一题 <span class="chip gold">全服同题</span></div>
      <div class="mc-sub">每天一段知名历史行情，第一次作答计入成绩</div><div class="mc-rec r-daily"></div></button>
    <button class="mode-card" data-mode="practice"><div class="mc-title">练习模式 <span class="chip blue r-bank">题库</span></div>
      <div class="mc-sub">随机抽题，见识各种走势</div><div class="mc-rec r-prac"></div></button>
    <details class="rules"><summary>怎么算分</summary><ul>
      <li><b>方向</b>（35%）：20 天后是涨、是跌还是横盘（±1.5% 以内算横盘）。</li>
      <li><b>终点</b>（25%）和<b>整体形状</b>（40%）：画得越贴近越高分。</li>
      <li>连续猜对方向会刷新「股神指数」，连续猜反会刷新「反指指数」——反指也是一种天赋。</li>
      <li>题目来自真实的历史指数行情，揭晓时告诉你这是哪一段、发生了什么。</li></ul></details>
    <button class="link-btn" data-act="home">返回首页</button>
  </div></div>
</section>`);
    document.getElementById('app').appendChild(scr);
    const q = (s) => scr.querySelector(s);
    cv = q('.draw-canvas');
    Object.assign(els, { sub: q('.d-sub'), badge: q('.d-badge'), q: q('.d-q'), hint: q('.d-hint'), prompt: q('.draw-prompt'), legend: q('.d-legend'), bottom: q('.d-bottom'), menu: q('.d-menu') });
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    scr.addEventListener('click', onClick);
    root.addEventListener('resize', () => { if (App.current === 'draw' && S) draw(); });
    App.register('draw', { enter, leave });
  }

  function onClick(e) {
    const b = e.target.closest('[data-act],[data-mode]');
    if (!b) return;
    const mode = b.getAttribute('data-mode'), act = b.getAttribute('data-act');
    if (mode) { App.hide(els.menu); start(mode); return; }
    switch (act) {
      case 'back': case 'menu': openMenu(); break;
      case 'home': App.go('home'); break;
      case 'clear': clearDrawing(); break;
      case 'submit': submit(); break;
      case 'share': App.share(shareText()); break;
      case 'next': App.hide(els.menu); start('practice'); break;
      default: break;
    }
  }

  // ---------- 开一道题 ----------
  function start(mode) {
    cancelAnimationFrame(raf);
    const daily = mode === 'daily';
    const ep = daily ? dailyEpisode() : practiceEpisode();
    const split = ep.split || 60;
    const base = ep.ohlc[split - 1][3];
    const toPct = (v) => (v / base - 1) * 100;
    const hist = ep.ohlc.slice(0, split).map((r) => r.map(toPct));
    const fut = ep.ohlc.slice(split, split + F).map((r) => r.map(toPct));
    let hlo = Infinity, hhi = -Infinity;
    for (const r of hist) { hlo = Math.min(hlo, r[2]); hhi = Math.max(hhi, r[1]); }
    const room = Math.max((hhi - hlo) * 0.8, 8);
    const lo = Math.min(hlo, -room), hi = Math.max(hhi, room), pad = (hi - lo) * 0.05;
    S = {
      mode, ep, base, hist, fut, actual: fut.map((r) => r[3]), phase: 'draw',
      pred: new Float64Array(F), mask: new Uint8Array(F), drawing: false, lastCol: null, lastPc: 0,
      yr0: { lo: lo - pad, hi: hi + pad }, yr: { lo: lo - pad, hi: hi + pad }, revealK: 0, crowdA: 0, replay: false,
    };
    const rec = daily ? App.store.get('draw_daily', {})[U.dateKey()] : null;
    App.setText(els.sub, daily ? '每日一题 · ' + U.dateLabel() : '练习模式');
    App.setText(els.q, (isReal() ? '某指数' : '模拟走势') + ' · 日 K 线（名称和日期已隐藏）');
    App.setText(els.hint, '用手指在右边画出接下来 20 个交易日的走势');
    els.prompt.style.display = '';
    updateBadge();
    if (rec && rec.id === ep.id && rec.pred) {
      // 今天已经答过：直接回放
      S.replay = true;
      rec.pred.forEach((v, i) => { S.pred[i] = v; S.mask[i] = 1; });
      els.prompt.style.display = 'none';
      submit();
      return;
    }
    setLegend(false);
    renderDrawingPanel();
    requestAnimationFrame(draw);
  }

  function renderDrawingPanel() {
    els.bottom.innerHTML = '<div class="draw-btns"><button class="btn ghost" data-act="clear">重画</button><button class="btn d-submit" data-act="submit" disabled>确定，揭晓答案</button></div>' +
      '<div class="draw-tips">· 从“今天”那根 K 线右边开始，一直画到最右边。<br>· 画错了可以直接重新画，新的笔迹会覆盖旧的。<br>· 坐标是相对“今天”收盘价的涨跌幅。</div>';
  }
  function setLegend(revealed) {
    els.legend.innerHTML = revealed
      ? '<span><i style="background:#eef1f7"></i>实际走势</span><span><i style="background:' + C.gold + '"></i>你的预测</span><span><i style="background:rgba(91,140,255,0.7);height:8px"></i>玩家预测分布</span><span><i style="background:' + C.blue + '"></i>大众中位数</span>'
      : '<span><i style="background:' + C.gold + '"></i>你的预测</span><span class="small">红涨绿跌 · 空心为阳线</span>';
  }
  function updateBadge() {
    const st = loadStats();
    App.setText(els.badge, st.streakR >= 2 ? '🔥 连对 ' + st.streakR : st.streakW >= 2 ? '🙃 连反 ' + st.streakW : '');
  }

  // ---------- 画线 ----------
  function localXY(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onDown(e) {
    if (!S || S.phase !== 'draw') return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    S.drawing = true; S.lastCol = null;
    addPoint(localXY(e));
  }
  function onMove(e) {
    if (!S || !S.drawing) return;
    e.preventDefault();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length) list.forEach((ev) => addPoint(localXY(ev), true)); else addPoint(localXY(e), true);
    draw();
  }
  function onUp() {
    if (!S || !S.drawing) return;
    S.drawing = false;
    updateSubmit();
  }
  function addPoint(p, noDraw) {
    const g = S.g;
    if (!g || p.x < g.fx0 - g.slotF * 0.6) return;
    if (els.prompt.style.display !== 'none') els.prompt.style.display = 'none';
    const col = clamp(Math.floor((p.x - g.fx0) / g.slotF), 0, F - 1);
    const pc = clamp(pcOf(g, p.y), S.yr.lo, S.yr.hi);
    if (S.lastCol == null) { S.pred[col] = pc; S.mask[col] = 1; }
    else {
      const a = S.lastCol, b = col, pa = S.lastPc, step = a <= b ? 1 : -1;
      for (let c = a; c !== b + step; c += step) {
        const u = a === b ? 1 : (c - a) / (b - a);
        S.pred[c] = pa + (pc - pa) * u; S.mask[c] = 1;
      }
    }
    S.lastCol = col; S.lastPc = pc;
    if (!noDraw) draw();
    updateSubmit();
  }
  function coverageOK() {
    let last = -1, cnt = 0;
    for (let c = 0; c < F; c++) if (S.mask[c]) { cnt++; last = c; }
    return last >= F - 3 && cnt >= 8;
  }
  function updateSubmit() {
    const b = els.bottom.querySelector('.d-submit');
    if (b) b.disabled = !coverageOK();
  }
  function clearDrawing() {
    if (!S || S.phase !== 'draw') return;
    S.pred.fill(0); S.mask.fill(0); S.lastCol = null;
    updateSubmit(); draw();
  }
  function finalPred() {
    const p = new Float64Array(F), m = S.mask;
    for (let c = 0; c < F; c++) {
      if (m[c]) { p[c] = S.pred[c]; continue; }
      let a = -1, b = -1;
      for (let k = c - 1; k >= 0; k--) if (m[k]) { a = k; break; }
      for (let k = c + 1; k < F; k++) if (m[k]) { b = k; break; }
      const va = a >= 0 ? S.pred[a] : 0;
      p[c] = b >= 0 ? va + (S.pred[b] - va) * ((c - a) / (b - a)) : va;
    }
    const s = Float64Array.from(p);
    for (let c = 1; c < F - 1; c++) s[c] = (p[c - 1] + 2 * p[c] + p[c + 1]) / 4;
    return s;
  }

  // ---------- 揭晓 ----------
  function submit() {
    if (!S || S.phase !== 'draw') return;
    if (!S.replay && !coverageOK()) { App.toast('要一直画到最右边哦', 'warn'); return; }
    S.final = S.replay ? Float64Array.from(S.pred) : finalPred();
    S.score = E.scoreDrawing(S.final, S.actual);
    S.crowd = E.crowdPredictions(S.hist.map((r) => r[3]), 'crowd:' + S.ep.id, 260, F);
    const sc = S.crowd.map((c) => E.scoreDrawing(c, S.actual));
    S.crowdScores = sc.map((x) => x.score).sort((a, b) => a - b);
    S.crowdDirRight = sc.filter((x) => x.dirPred === x.dirAct).length / sc.length;
    const ext = [S.yr0.lo, S.yr0.hi];
    for (const r of S.fut) { ext.push(r[1], r[2]); }
    for (const v of S.final) ext.push(v);
    const lo = Math.min.apply(null, ext), hi = Math.max.apply(null, ext), pad = (hi - lo) * 0.05;
    S.yrT = { lo: lo - pad, hi: hi + pad };
    buildHeat();
    if (!S.replay) saveStats();
    S.phase = 'reveal';
    App.setText(els.hint, S.replay ? '今天的题已经答过了，这是回放' : '揭晓中……');
    els.bottom.innerHTML = '<div class="draw-tips" style="text-align:center;margin-top:24px">真实走势正在一根一根揭晓……</div>';
    S.t0 = performance.now();
    let lastK = -1;
    const dur = S.replay ? 1200 : 2400;
    const frame = (now) => {
      if (!S || S.phase !== 'reveal') return;
      const t = Math.min(1, (now - S.t0) / dur);
      S.revealK = t * F;
      const k = Math.floor(S.revealK);
      if (k !== lastK && k < F && !S.replay) { App.sfx.tick(); lastK = k; }
      const e = 1 - Math.pow(1 - Math.min(1, t * 1.3), 3);
      S.yr = { lo: lerp(S.yr0.lo, S.yrT.lo, e), hi: lerp(S.yr0.hi, S.yrT.hi, e) };
      draw();
      if (t < 1) { raf = requestAnimationFrame(frame); return; }
      S.phase = 'crowd'; S.t1 = performance.now();
      const f2 = (n2) => {
        if (!S || S.phase !== 'crowd') return;
        S.crowdA = Math.min(1, (n2 - S.t1) / 700);
        draw();
        if (S.crowdA < 1) raf = requestAnimationFrame(f2); else { S.phase = 'done'; draw(); showResult(); }
      };
      raf = requestAnimationFrame(f2);
    };
    raf = requestAnimationFrame(frame);
  }

  function buildHeat() {
    const bins = 48, lo = S.yrT.lo, hi = S.yrT.hi;
    const H = [];
    let max = 1;
    for (let d = 0; d < F; d++) H.push(new Float32Array(bins));
    for (const path of S.crowd) {
      for (let d = 0; d < F; d++) {
        const b = Math.floor(((hi - path[d]) / (hi - lo)) * bins);
        if (b >= 0 && b < bins) { H[d][b]++; if (H[d][b] > max) max = H[d][b]; }
      }
    }
    S.heat = { H, bins, max };
    S.crowdMed = [];
    for (let d = 0; d < F; d++) {
      const col = S.crowd.map((p) => p[d]).sort((a, b) => a - b);
      S.crowdMed.push(col[Math.floor(col.length / 2)]);
    }
  }

  function saveStats() {
    const sc = S.score, st = loadStats();
    st.played++; st.sum += sc.score;
    if (sc.dirPred === sc.dirAct) { st.right++; st.streakR++; st.streakW = 0; }
    else if (sc.dirScore === 0) { st.streakW++; st.streakR = 0; }
    else { st.streakR = 0; st.streakW = 0; }
    st.bestR = Math.max(st.bestR, st.streakR); st.bestW = Math.max(st.bestW, st.streakW);
    App.store.set('draw_stats', st);
    S.statsAfter = st;
    if (S.mode === 'daily') {
      const rec = App.store.get('draw_daily', {});
      const k = U.dateKey();
      if (!rec[k]) rec[k] = { id: S.ep.id, score: sc.score, pred: Array.from(S.final).map((v) => Math.round(v * 100) / 100) };
      const keys = Object.keys(rec).sort();
      while (keys.length > 40) delete rec[keys.shift()];
      App.store.set('draw_daily', rec);
    }
  }

  function titleFor(sc) {
    if (sc.dirScore === 0 && Math.abs(sc.actEnd) > 3 && sc.score < 50) return '人形反指';
    if (sc.score >= 85) return '股神附体';
    if (sc.score >= 70) return '老股民的直觉';
    if (sc.score >= 50) return '有点东西';
    if (sc.score >= 30) return '凭感觉画的吧';
    return '纯属瞎画';
  }
  const arrow = (v) => (v > 1.5 ? '↗' : v < -1.5 ? '↘' : '→');
  const fmtDate = (s) => (s ? s.replace(/-/g, '.') : '');

  function showResult() {
    const sc = S.score, ep = S.ep;
    const beat = Math.round(E.percentile(S.crowdScores, sc.score));
    const dirOK = sc.dirPred === sc.dirAct;
    const dirChip = dirOK ? '<span class="chip up">方向 ✔</span>' : sc.dirScore === 0 ? '<span class="chip down">方向猜反了</span>' : '<span class="chip">方向差一点</span>';
    let maxUp = -Infinity, maxDn = Infinity;
    for (const r of S.fut) { maxUp = Math.max(maxUp, r[1]); maxDn = Math.min(maxDn, r[2]); }
    const period = ep.dates ? fmtDate(ep.dates[0]) + ' – ' + fmtDate(ep.dates[ep.dates.length - 1]) : '';
    const lastClose = ep.ohlc[(ep.split || 60) - 1][3];
    const endClose = ep.ohlc[(ep.split || 60) + F - 1][3];
    const st = S.statsAfter || loadStats();
    let streakNote = '';
    if (!S.replay) {
      if (dirOK && st.streakR >= 2) streakNote = '已经连续猜对 ' + st.streakR + ' 次方向！';
      else if (sc.dirScore === 0 && st.streakW >= 2) streakNote = '已经连续猜反 ' + st.streakW + ' 次——反着买说不定能发财。';
    }
    els.bottom.innerHTML =
      '<div class="dr-top"><div class="dr-score num">0</div><div><div class="dr-title">' + titleFor(sc) + (S.replay ? '（回放）' : '') + '</div>' +
      '<div class="dr-sub">' + dirChip + '<span class="chip">跑赢 ' + beat + '% 玩家*</span></div></div></div>' +
      (streakNote ? '<div class="res-box" style="margin-top:10px">' + streakNote + '</div>' : '') +
      '<div class="dr-grid">' +
      '<div><span>你画的 20 天后</span><b class="num ' + cls(sc.predEnd) + '">' + arrow(sc.predEnd) + ' ' + fmtPct(sc.predEnd, 1) + '</b></div>' +
      '<div><span>实际 20 天后</span><b class="num ' + cls(sc.actEnd) + '">' + arrow(sc.actEnd) + ' ' + fmtPct(sc.actEnd, 1) + '</b></div>' +
      '<div><span>猜对方向的玩家*</span><b class="num">' + Math.round(S.crowdDirRight * 100) + '%</b></div>' +
      '<div><span>期间最高 / 最低</span><b class="num nowrap"><span class="up">' + fmtPct(maxUp, 1) + '</span> <span class="down">' + fmtPct(maxDn, 1) + '</span></b></div>' +
      '</div>' +
      '<div class="dr-reveal"><div class="dr-name"></div><div class="dr-period"></div><div class="dr-story"></div><div class="dr-facts"></div></div>' +
      '<div class="res-note">* “玩家”是原型阶段的 260 个模拟预测（趋势派、抄底派、随机派……），上线后换成真实玩家数据。</div>' +
      '<div class="dr-btns"><button class="btn ghost" data-act="share">分享</button><button class="btn" data-act="next">' + (S.mode === 'daily' ? '去练习模式' : '下一题') + '</button></div>' +
      '<button class="link-btn" data-act="menu">返回菜单</button>';
    const q = (s) => els.bottom.querySelector(s);
    q('.dr-name').textContent = ep.index + (ep.title ? ' · ' + ep.title : '');
    q('.dr-period').textContent = [period, ep.market].filter(Boolean).join(' · ');
    q('.dr-story').textContent = ep.story || '';
    q('.dr-facts').textContent = isReal() ? '“今天”收盘 ' + lastClose.toFixed(2) + ' → 20 个交易日后 ' + endClose.toFixed(2) : '';
    App.setText(els.hint, S.replay ? '今天的题已经答过了，这是回放' : '揭晓！');
    setLegend(true);
    updateBadge();
    // 分数滚动
    const el = q('.dr-score'), t0 = performance.now();
    const roll = (now) => {
      const t = Math.min(1, (now - t0) / 800);
      el.textContent = Math.round(sc.score * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(roll);
    };
    requestAnimationFrame(roll);
    if (!S.replay) { if (sc.score >= 60) App.sfx.good(); else if (sc.score < 30) App.sfx.bad(); }
    els.bottom.scrollTop = 0;
  }

  function shareText() {
    const sc = S.score;
    const lines = [
      '✍️ 画出明天 · ' + (S.mode === 'daily' ? '每日一题 ' + U.dateLabel() : '练习'),
      '得分 ' + sc.score + '｜' + titleFor(sc),
      '我画 ' + arrow(sc.predEnd) + ' ' + fmtPct(sc.predEnd, 1) + '｜实际 ' + arrow(sc.actEnd) + ' ' + fmtPct(sc.actEnd, 1),
      '只有 ' + Math.round(S.crowdDirRight * 100) + '% 的人猜对了方向',
      '（这是一段真实的历史行情，你能画对吗？）',
    ];
    return lines.join('\n');
  }

  // ---------- 菜单 ----------
  function openMenu() {
    cancelAnimationFrame(raf);
    if (S && (S.phase === 'reveal' || S.phase === 'crowd')) { S.phase = 'done'; }
    const st = loadStats(), q = (s) => scr.querySelector(s);
    q('.s-played').textContent = st.played;
    q('.s-acc').textContent = st.played ? Math.round((st.right / st.played) * 100) + '%' : '--';
    q('.s-avg').textContent = st.played ? Math.round(st.sum / st.played) : '--';
    q('.s-sr').textContent = st.streakR;
    q('.s-bestr').textContent = st.bestR;
    q('.s-bestw').textContent = st.bestW;
    const rec = App.store.get('draw_daily', {})[U.dateKey()];
    q('.r-daily').textContent = rec ? '今天已作答：' + rec.score + ' 分 · 点开看回放' : '今天还没答';
    q('.r-bank').textContent = (isReal() ? '真实题库 ' : '模拟题 ') + episodes().length + ' 段';
    q('.r-prac').textContent = '已练习 ' + Math.max(0, st.played - Object.keys(App.store.get('draw_daily', {})).length) + ' 题';
    App.show(els.menu);
  }
  function enter() { openMenu(); }
  function leave() { cancelAnimationFrame(raf); }

  // ---------- 绘图 ----------
  function geom(w, h) {
    const padL = 6, padR = 40, padT = 12, padB = 20;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const hx0 = padL, hx1 = padL + plotW * 0.58;
    return { w, h, padL, padR, padT, padB, plotW, plotH, hx0, hx1, fx0: hx1, fx1: padL + plotW, slotH: (hx1 - hx0) / S.hist.length, slotF: (padL + plotW - hx1) / F };
  }
  const yOf = (g, pc) => g.padT + ((S.yr.hi - pc) / (S.yr.hi - S.yr.lo)) * g.plotH;
  const pcOf = (g, y) => S.yr.hi - ((y - g.padT) / g.plotH) * (S.yr.hi - S.yr.lo);
  const hxOf = (g, i) => g.hx0 + (i + 0.5) * g.slotH;
  const fxOf = (g, d) => g.fx0 + (d + 0.5) * g.slotF;

  function candle(ctx, g, x, slot, r) {
    const o = r[0], h = r[1], l = r[2], c = r[3], up = c >= o;
    const col = up ? C.up : C.down, bw = Math.max(1.2, slot * 0.68);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yOf(g, h)); ctx.lineTo(x, yOf(g, l)); ctx.stroke();
    const y1 = yOf(g, Math.max(o, c)), y2 = yOf(g, Math.min(o, c)), hh = Math.max(1, y2 - y1);
    if (up && bw >= 4) { ctx.fillStyle = C.bg; ctx.fillRect(x - bw / 2, y1, bw, hh); ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, Math.max(0.5, hh - 1)); }
    else ctx.fillRect(x - bw / 2, y1, bw, hh);
  }

  function draw() {
    if (!S) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    const g = (S.g = geom(w, h));
    ctx.clearRect(0, 0, w, h);
    // 未来区底色
    ctx.fillStyle = S.phase === 'draw' ? 'rgba(255,179,26,0.05)' : 'rgba(255,255,255,0.025)';
    ctx.fillRect(g.fx0, g.padT, g.fx1 - g.fx0, g.plotH);
    // 横向网格
    const span = S.yr.hi - S.yr.lo;
    const step = span > 90 ? 20 : span > 45 ? 10 : span > 20 ? 5 : span > 9 ? 2 : 1;
    ctx.font = '10px ' + C.num; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (let v = Math.ceil(S.yr.lo / step) * step; v <= S.yr.hi + 1e-9; v += step) {
      const y = yOf(g, v);
      ctx.strokeStyle = Math.abs(v) < 1e-9 ? 'rgba(255,255,255,0.2)' : C.grid;
      ctx.setLineDash(Math.abs(v) < 1e-9 ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(g.padL, y); ctx.lineTo(g.fx1, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = v > 0 ? C.up : v < 0 ? C.down : C.sub;
      ctx.fillText((v > 0 ? '+' : '') + Math.round(v) + '%', g.fx1 + 4, y);
    }
    // 分隔线与未来刻度
    ctx.strokeStyle = 'rgba(255,179,26,0.45)'; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(g.fx0, g.padT); ctx.lineTo(g.fx0, g.padT + g.plotH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = C.grid;
    for (let d = 5; d < F; d += 5) { const x = g.fx0 + d * g.slotF; ctx.beginPath(); ctx.moveTo(x, g.padT); ctx.lineTo(x, g.padT + g.plotH); ctx.stroke(); }
    // 底部标注
    ctx.font = '10px ' + C.font; ctx.fillStyle = C.dim; ctx.textBaseline = 'top';
    const by = g.padT + g.plotH + 5;
    const revealed = S.phase !== 'draw' && S.ep.dates;
    ctx.textAlign = 'left'; ctx.fillText(revealed ? fmtDate(S.ep.dates[0]) : '60 个交易日前', g.hx0 + 2, by);
    ctx.textAlign = 'center'; ctx.fillStyle = C.gold; ctx.fillText(revealed ? fmtDate(S.ep.dates[(S.ep.split || 60) - 1]) : '今天', g.fx0, by);
    ctx.textAlign = 'right'; ctx.fillStyle = C.dim; ctx.fillText(revealed ? fmtDate(S.ep.dates[S.ep.dates.length - 1]) : '+20 天', g.fx1, by);
    // 玩家热力图
    if ((S.phase === 'crowd' || S.phase === 'done') && S.heat) {
      const { H, bins, max } = S.heat, bh = g.plotH / bins;
      for (let d = 0; d < F; d++) {
        for (let b = 0; b < bins; b++) {
          const v = H[d][b];
          if (!v) continue;
          ctx.fillStyle = 'rgba(91,140,255,' + (0.62 * Math.sqrt(v / max) * S.crowdA).toFixed(3) + ')';
          ctx.fillRect(g.fx0 + d * g.slotF, g.padT + b * bh, g.slotF + 0.5, bh + 0.5);
        }
      }
    }
    // 历史 K 线
    for (let i = 0; i < S.hist.length; i++) candle(ctx, g, hxOf(g, i), g.slotH, S.hist[i]);
    const ax = hxOf(g, S.hist.length - 1), ay = yOf(g, 0);
    // 揭晓的真实 K 线
    const k = S.phase === 'draw' ? 0 : Math.min(F, S.revealK);
    const kn = Math.floor(k);
    for (let d = 0; d < kn; d++) candle(ctx, g, fxOf(g, d), g.slotF, S.fut[d]);
    if (kn > 0) {
      ctx.strokeStyle = 'rgba(238,241,247,0.9)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ax, ay);
      for (let d = 0; d < kn; d++) ctx.lineTo(fxOf(g, d), yOf(g, S.actual[d]));
      ctx.stroke();
    }
    // 大众中位数
    if ((S.phase === 'crowd' || S.phase === 'done') && S.crowdMed) {
      ctx.strokeStyle = C.blue; ctx.globalAlpha = S.crowdA; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(ax, ay);
      for (let d = 0; d < F; d++) ctx.lineTo(fxOf(g, d), yOf(g, S.crowdMed[d]));
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // 你的预测
    const line = S.final || S.pred;
    const drawnAny = S.final || S.mask.some((m) => m);
    if (drawnAny) {
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255,179,26,0.5)'; ctx.shadowBlur = 6;
      ctx.beginPath();
      let started = false;
      if (S.final || S.mask[0]) { ctx.moveTo(ax, ay); started = true; }
      for (let d = 0; d < F; d++) {
        if (!S.final && !S.mask[d]) { started = false; continue; }
        const x = fxOf(g, d), y = yOf(g, line[d]);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // “今天”锚点
    ctx.fillStyle = C.gold;
    ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, Math.PI * 2); ctx.fill();
    if (S.phase === 'done' && isReal()) {
      ctx.font = '10px ' + C.num; ctx.fillStyle = C.sub; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(S.base.toFixed(2), ax - 4, ay - 4);
    }
    // 终点标签
    if (S.phase === 'done') {
      ctx.font = 'bold 10px ' + C.font; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
      const labs = [[yOf(g, S.final[F - 1]), '你', C.gold], [yOf(g, S.actual[F - 1]), '实际', '#eef1f7']];
      if (Math.abs(labs[0][0] - labs[1][0]) < 12) labs[0][0] += labs[0][0] < labs[1][0] ? -7 : 7;
      for (const L of labs) { ctx.fillStyle = L[2]; ctx.fillText(L[1], g.fx1 - 3, clamp(L[0], g.padT + 6, g.padT + g.plotH - 6) - 9); }
    }
  }

  App.Draw = { init, _state: () => S };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

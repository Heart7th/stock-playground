    cv.addEventListener('pointercancel', onUp);
    root.addEventListener('resize', () => { if (App.current === 'unstuck' && S) draw(); });
    App.register('unstuck', { enter, leave });
  }

  function onClick(e) {
    const b = e.target.closest('[data-act],[data-lv]');
    if (!b) return;
    const lvId = b.getAttribute('data-lv');
    if (lvId) { const lv = App.LEVELS.find((x) => String(x.id) === lvId); if (lv) openLevel(lv); return; }
    const act = b.getAttribute('data-act');
    switch (act) {
      case 'home': App.go('home'); break;
      case 'endless': openLevel(endlessCfg()); break;
      case 'go': App.hide(els.intro); App.sfx.tap(); break;
      case 'levels':
        if (S && S.phase !== 'end' && S.dayIdx > 0 && !els.end.classList.contains('show') && !els.intro.classList.contains('show')) {
          App.confirm('放弃这一关？', '现在退出，这一关的进度不会保存。', '放弃并退出', showSelect);
        } else showSelect();
        break;
      case 'menu': if (S && S.phase !== 'end') App.show(els.menu); break;
      case 'closemenu': App.hide(els.menu); break;
      case 'hint': App.hide(els.menu); App.toast('💡 ' + S.lv.hint, 'ok', 4200); break;
      case 'retry': App.hide(els.menu); App.hide(els.end); openLevel(S.lv.endless ? S.lv : S.lv, true); break;
      case 'cut': App.hide(els.menu); cutLoss(); break;
      case 'nextlv': nextLevel(); break;
      case 'tsell': if (canPlan()) { S.sellOn = !S.sellOn; App.sfx.tap(); refreshOrders(); draw(); } break;
      case 'tbuy': if (canPlan()) { S.buyOn = !S.buyOn; App.sfx.tap(); refreshOrders(); draw(); } break;
      case 'qminus': if (canPlan()) { S.qty = Math.max(100, S.qty - 100); refreshOrders(); } break;
      case 'qplus': if (canPlan()) { S.qty = Math.min(maxQty(), S.qty + 100); refreshOrders(); } break;
      case 'next': if (canPlan()) runDay(); break;
      case 'auto': setAuto(!S.auto); if (S.auto && canPlan()) runDay(); break;
      default: break;
    }
  }
  const canPlan = () => S && S.phase === 'plan';

  // ---------- 关卡列表 ----------
  function renderSelect() {
    const rec = levelRec();
    let stars = 0, done = 0;
    els.grid.innerHTML = '';
    for (const lv of App.LEVELS) {
      const r = rec[lv.id], s = r ? r.stars : 0;
      stars += s; if (s) done++;
      els.grid.insertAdjacentHTML('beforeend',
        '<button class="lv-card ' + (s ? 'done' : '') + '" data-lv="' + lv.id + '"><div class="lv-no"><span>第 ' + lv.id + ' 关</span><span>' + lv.days + ' 天</span></div>' +
        '<div class="lv-name">' + lv.name + '</div><div class="lv-tag"><span class="chip ' + (lv.tag === 'Boss' ? 'up' : 'gold') + '">' + lv.tag + '</span></div>' +
        '<div class="lv-stars">' + starsHtml(s) + (r && r.bestDays ? ' <span class="small" style="letter-spacing:0">最快 ' + r.bestDays + ' 天</span>' : '') + '</div></button>');
    }
    els.selSub.textContent = '已解套 ' + done + '/' + App.LEVELS.length + ' 关 · ★ ' + stars + '/' + App.LEVELS.length * 3;
    const en = App.store.get('uk_endless', { wins: 0, plays: 0 });
    els.endlessRec.textContent = en.plays ? '解套 ' + en.wins + ' 次 / 挑战 ' + en.plays + ' 次' : '还没玩过';
  }
  function showSelect() {
    stopAll();
    [els.intro, els.end, els.menu].forEach(App.hide);
    renderSelect();
    els.play.classList.remove('show'); els.select.classList.add('show');
    S = null;
  }

  // ---------- 开局 ----------
  function openLevel(lv, quick) {
    stopAll();
    const series = E.genLevel(lv);
    const start = series.hist[series.H - 1].c;
    const target = lv.shares * lv.cost + lv.cash;
    S = {
      lv, series, dayIdx: 0, acct: { cash: lv.cash, shares: lv.shares }, tradesLeft: lv.trades, target,
      eq0: lv.shares * start + lv.cash, start,
      sellOn: true, buyOn: true, sellPrice: round2(start * 1.05), buyPrice: round2(start * 0.95),
      qty: Math.max(100, Math.round((lv.shares * 0.3) / 100) * 100), auto: false, phase: 'plan',
      fills: [], openT: null, tCount: 0, tProfit: 0, logs: [], anim: null,
    };
    clampOrders();
    els.select.classList.remove('show'); els.play.classList.add('show');
    [els.end, els.menu].forEach(App.hide);
    els.title.textContent = (lv.endless ? '无尽模式' : '第 ' + lv.id + ' 关') + ' · ' + lv.name;
    els.stock.textContent = stockName(lv) + ' ' + stockCode(lv);
    els.days.textContent = lv.days;
    scr.querySelector('.uk-drag-tip').style.display = App.store.get('uk_dragged', false) ? 'none' : '';
    setAuto(false);
    log('开局：现价 ' + start.toFixed(2) + '，成本 ' + lv.cost.toFixed(2) + '，挂好单子就点「下一天」', 'hl');
    updateHud(); refreshOrders();
    requestAnimationFrame(draw);
    if (!quick) showIntro();
  }

  function showIntro() {
    const lv = S.lv;
    els.introBody.innerHTML =
      '<div class="menu-head"><div class="mascot">' + App.mascot('sad') + '</div><div><div class="menu-title"></div><div class="menu-sub"></div></div></div>' +
      '<div class="intro-story">你在 <b class="num">' + lv.cost.toFixed(2) + '</b> 元买了 <b class="num">' + lv.shares + '</b> 股，现在它只剩 <b class="num down">' + S.start.toFixed(2) + '</b> 元。<br>你已经在山顶站岗 ' + stoodDays(lv) + ' 天了……</div>' +
      '<div class="intro-goal">🎯 <b>' + lv.days + '</b> 个交易日内解套：总资产回到 <b class="num">' + fmtMoney(S.target) + '</b><br>现在 ' + fmtMoney(S.eq0) + '，还差 <b class="num">' + fmtMoney(S.target - S.eq0) + '</b></div>' +
      '<div class="intro-hint">💡 <span class="k-hint"></span></div>' +
      '<div class="intro-rules">· 每天开盘前挂一张「高抛」卖单和一张「低吸」买单，当天价格碰到就成交。拖动图上的红线、绿线改价格。<br>' +
      '· 今天买的股票明天才能卖（T+1）。手续费 0.1%，最低 5 元。本关最多成交 <b>' + lv.trades + '</b> 笔。<br>' +
      '· 另有 <b>' + fmtMoney(lv.cash) + '</b> 闲钱可以用来补仓。</div>' +
      '<button class="btn block" data-act="go">开始自救</button><button class="link-btn" data-act="levels">返回关卡列表</button>';
    els.introBody.querySelector('.menu-title').textContent = (lv.endless ? '无尽模式' : '第 ' + lv.id + ' 关') + ' · ' + lv.name;
    els.introBody.querySelector('.menu-sub').textContent = stockName(lv) + ' · ' + stockCode(lv);
    els.introBody.querySelector('.k-hint').textContent = lv.hint;
    App.show(els.intro);
  }

  // ---------- 账户计算 ----------
  const lastClose = () => (S.dayIdx > 0 ? S.series.days[S.dayIdx - 1].c : S.start);
  const equity = () => S.acct.cash + S.acct.shares * lastClose();
  const costPrice = () => (S.acct.shares > 0 ? (S.target - S.acct.cash) / S.acct.shares : null);
  const band = () => {
    const d = S.series.days[Math.min(S.dayIdx, S.lv.days - 1)];
    return { lo: d.lo, hi: d.hi };
  };
  function maxQty() {
    const afford = Math.floor(S.acct.cash / (S.buyPrice * 1.001) / 100) * 100;
    return Math.max(100, Math.floor(Math.max(S.acct.shares, afford) / 100) * 100);
  }
  // 挂单价保留玩家设定的价格；超出当天涨跌停的单子只是当天成交不了，不会被偷偷改价
  function clampOrders() {
    S.sellPrice = round2(Math.max(0.02, S.sellPrice));
    S.buyPrice = round2(Math.max(0.01, S.buyPrice));
    if (S.sellPrice <= S.buyPrice) S.sellPrice = round2(S.buyPrice + 0.02);
    S.qty = clamp(S.qty, 100, maxQty());
  }

  function updateHud() {
    const p = lastClose(), cp = costPrice(), eq = equity();
    els.cost.textContent = cp == null ? '已清仓' : cp.toFixed(2);
    els.cost.className = 'num p-cost ' + (cp != null && cp <= p ? 'up' : 'gold');
    const dayCh = S.dayIdx > 0 ? (p / S.series.days[S.dayIdx - 1].prevClose - 1) * 100 : 0;
    els.price.textContent = p.toFixed(2);
    els.price.className = 'num p-price ' + cls(dayCh);
    els.day.textContent = Math.min(S.dayIdx + 1, S.lv.days);
    const prog = clamp((eq - S.eq0) / (S.target - S.eq0), 0, 1);
    els.fill.style.width = (prog * 100).toFixed(1) + '%';
    els.prog.textContent = Math.round(prog * 100) + '%';
    const gap = S.target - eq;
    els.need.innerHTML = gap > 0 ? '还差 <b class="num">' + fmtMoney(gap) + '</b>' : '<b class="num up">已解套，多出 ' + fmtMoney(-gap) + '</b>';
    els.shares.textContent = S.acct.shares + ' 股';
    els.cash.textContent = fmtMoney(S.acct.cash);
    els.trades.textContent = (S.lv.trades - S.tradesLeft) + '/' + S.lv.trades;
  }
  function refreshOrders() {
    clampOrders();
    const noTrades = S.tradesLeft <= 0;
    els.sellChip.className = 'ord-chip sell' + (S.sellOn && !noTrades ? ' on' : '');
    els.buyChip.className = 'ord-chip buy' + (S.buyOn && !noTrades ? ' on' : '');
    els.sell.textContent = S.sellPrice.toFixed(2);
    els.buy.textContent = S.buyPrice.toFixed(2);
    els.qty.textContent = S.qty;
    els.next.disabled = S.phase !== 'plan';
  }
  function log(msg, c) {
    S.logs.unshift({ msg, c: c || '' });
    S.logs.length = Math.min(S.logs.length, 3);
    els.log.innerHTML = '';
    S.logs.slice(0, 2).forEach((l) => { const d = document.createElement('div'); d.className = l.c; d.textContent = l.msg; els.log.appendChild(d); });
  }
  function setAuto(v) {
    if (!S) return;
    S.auto = v;
    els.auto.classList.toggle('on', v);
    els.auto.textContent = v ? '❚❚ 暂停' : '▶▶ 自动';
    if (!v) clearTimeout(autoTimer);
  }

  // ---------- 推进一天 ----------
  function runDay() {
    if (!canPlan() || S.dayIdx >= S.lv.days) return;
    clampOrders();
    const day = S.series.days[S.dayIdx];
    const can = S.tradesLeft > 0;
    const orders = {
      sell: S.sellOn && can && S.acct.shares >= 100 ? { price: S.sellPrice, qty: S.qty } : null,
      buy: S.buyOn && can ? { price: S.buyPrice, qty: S.qty } : null,
    };
    const res = E.runLevelDay(S.acct, day, orders, S.tradesLeft);
    S.phase = 'anim';
    S.anim = { day, res, t0: performance.now(), k: 0, orders };
    res.fills.forEach((f) => { f.shown = false; });
    refreshOrders();
    const dur = S.auto ? 650 : 1000;
    const frame = (now) => {
      if (!S || S.phase !== 'anim') return;
      const a = S.anim, u = Math.min(1, (now - a.t0) / dur);
      a.k = u * (a.day.path.length - 1);
      for (const f of a.res.fills) {
        if (!f.shown && f.k <= a.k) {
          f.shown = true;
          if (f.type === 'sell') { App.sfx.sell(); App.toast('高抛成交 ' + f.qty + ' 股 @' + f.price.toFixed(2), 'down', 1300); }
          else { App.sfx.buy(); App.toast('低吸成交 ' + f.qty + ' 股 @' + f.price.toFixed(2), 'up', 1300); }
          App.buzz(10);
        }
      }
      draw();
      if (u < 1) raf = requestAnimationFrame(frame); else completeDay();
    };
    raf = requestAnimationFrame(frame);
  }

  function completeDay() {
    const { res, day } = S.anim;
    S.acct = res.acct; S.tradesLeft -= res.tradesUsed;
    S.dayIdx++;
    const dayNo = S.dayIdx;
    for (const f of res.fills) { S.fills.push({ day: dayNo - 1, type: f.type, price: f.price, qty: f.qty }); matchT(f, dayNo); }
    res.notes.forEach((n) => log('第 ' + dayNo + ' 天：' + n));
    if (!res.fills.length && !res.notes.length) log('第 ' + dayNo + ' 天：收盘 ' + day.c.toFixed(2) + '（' + fmtPct((day.c / day.prevClose - 1) * 100) + '），没有成交');
    S.anim = null;
    S.phase = 'plan';
    if (S.dayIdx < S.lv.days) clampOrders();
    updateHud(); refreshOrders(); draw();
    if (equity() >= S.target - 0.5) { win(); return; }
    if (S.dayIdx >= S.lv.days) { fail(); return; }
    if (S.tradesLeft <= 0 && !S.noTradeTip) { S.noTradeTip = true; App.toast('成交次数用完了，只能拿着等', 'warn', 2200); }
    if (S.auto) {
      if (res.fills.length) { setAuto(false); App.toast('有成交，自动已暂停，看看要不要改单', 'ok', 1800); }
      else autoTimer = setTimeout(() => { if (S && S.auto && canPlan()) runDay(); }, 380);
    }
  }

  function matchT(f, dayNo) {
    const verb = f.type === 'sell' ? '高抛' : '低吸';
    const o = S.openT;
    if (o && o.type !== f.type) {
      const q = Math.min(o.qty, f.qty);
      const sellP = f.type === 'sell' ? f.price : o.price, buyP = f.type === 'buy' ? f.price : o.price;
      const profit = (sellP - buyP) * q - o.feePer * q - (f.fee / f.qty) * q;
      S.tCount++; S.tProfit += profit;
      log('第 ' + dayNo + ' 天：' + verb + ' ' + f.qty + ' 股 @' + f.price.toFixed(2) + '，完成一次 T：' + (profit >= 0 ? '赚 ' : '亏 ') + fmtMoney(Math.abs(profit)), profit >= 0 ? 'up' : 'down');
      o.qty -= q;
      const rest = f.qty - q;
      if (o.qty <= 0) S.openT = rest > 0 ? { type: f.type, price: f.price, qty: rest, feePer: f.fee / f.qty } : null;
    } else {
      if (o) {
        const tot = o.qty + f.qty;
        o.price = (o.price * o.qty + f.price * f.qty) / tot;
        o.feePer = (o.feePer * o.qty + f.fee) / tot;
        o.qty = tot;
      } else S.openT = { type: f.type, price: f.price, qty: f.qty, feePer: f.fee / f.qty };
      log('第 ' + dayNo + ' 天：' + verb + ' ' + f.qty + ' 股 @' + f.price.toFixed(2) + (f.type === 'sell' ? '，等跌下来接回' : '，等涨上去卖出'), f.type === 'sell' ? 'down' : 'up');
    }
  }

  // ---------- 结局 ----------
  function win() {
    S.phase = 'end'; setAuto(false);
    const lv = S.lv, used = S.dayIdx, tUsed = lv.trades - S.tradesLeft;
    const fast = used <= Math.ceil(lv.days * 0.6), thrift = tUsed <= Math.floor(lv.trades / 2);
    const stars = 1 + (fast ? 1 : 0) + (thrift ? 1 : 0);
    let isNewBest = false;
    if (lv.endless) {
      const en = App.store.get('uk_endless', { wins: 0, plays: 0 }); en.wins++; en.plays++; App.store.set('uk_endless', en);
    } else {
      const rec = levelRec(), r = rec[lv.id] || { stars: 0, bestDays: null };
      if (stars > r.stars) { r.stars = stars; isNewBest = true; }
      if (!r.bestDays || used < r.bestDays) r.bestDays = used;
      rec[lv.id] = r; App.store.set('uk_levels', rec);
    }
    const cp = costPrice(), p = lastClose();
    const hasNext = !lv.endless && App.LEVELS.some((x) => x.id === lv.id + 1);
    els.endBody.innerHTML =
      '<div class="end-head"><div class="mascot">' + App.mascot('happy') + '</div><div class="end-title">解套成功！</div>' +
      '<div class="end-sub">用时 <b>' + used + '</b>/' + lv.days + ' 天 · 成交 <b>' + tUsed + '</b>/' + lv.trades + ' 笔<br>' +
      (cp != null ? '成本价 <b class="num">' + cp.toFixed(2) + '</b> ≤ 现价 <b class="num up">' + p.toFixed(2) + '</b>' : '已经清仓回本') +
      '<br>做了 ' + S.tCount + ' 次完整的 T，价差 ' + (S.tProfit >= 0 ? '赚了 ' : '亏了 ') + fmtMoney(Math.abs(S.tProfit)) + '<br>站岗 ' + (stoodDays(lv) + used) + ' 天，终于下山了</div></div>' +
      '<div class="stars-big">' + starsHtml(stars) + '</div>' +
      '<div class="star-notes"><span class="up">★ 解套成功</span>　<span class="' + (fast ? 'up' : '') + '">★ 用时 ≤ ' + Math.ceil(lv.days * 0.6) + ' 天</span>　<span class="' + (thrift ? 'up' : '') + '">★ 成交 ≤ ' + Math.floor(lv.trades / 2) + ' 笔</span>' + (isNewBest ? '<br>新纪录！' : '') + '</div>' +
      '<div class="end-btns"><button class="btn ghost" data-act="retry">再玩一次</button>' +
      (lv.endless ? '<button class="btn" data-act="endless">下一只</button>' : hasNext ? '<button class="btn" data-act="nextlv">下一关</button>' : '<button class="btn" data-act="levels">全部通关！</button>') +
      '</div><button class="link-btn" data-act="levels">关卡列表</button>';
    App.show(els.end);
    App.sfx.good(); App.buzz(30);
    App.confetti(scr);
  }
  function fail() {
    S.phase = 'end'; setAuto(false);
    const lv = S.lv, gap = S.target - equity();
    if (lv.endless) { const en = App.store.get('uk_endless', { wins: 0, plays: 0 }); en.plays++; App.store.set('uk_endless', en); }
    els.endBody.innerHTML =
      '<div class="end-head"><div class="mascot">' + App.mascot('sad') + '</div><div class="end-title">还没解套……</div>' +
      '<div class="end-sub">' + lv.days + ' 天到了，总资产还差 <b class="num">' + fmtMoney(gap) + '</b>。<br>你在山顶又站了 ' + lv.days + ' 天岗。' +
      (S.tCount ? '<br>做了 ' + S.tCount + ' 次 T，价差 ' + (S.tProfit >= 0 ? '赚了 ' : '亏了 ') + fmtMoney(Math.abs(S.tProfit)) : '') + '</div></div>' +
      '<div class="intro-hint" style="margin-top:14px">💡 <span class="k-hint"></span></div>' +
      '<div class="end-btns"><button class="btn ghost" data-act="levels">关卡列表</button><button class="btn" data-act="retry">再来一次</button></div>';
    els.endBody.querySelector('.k-hint').textContent = lv.hint;
    App.show(els.end);
    App.sfx.bad();
  }
  function cutLoss() {
    const loss = S.target - equity();
    App.confirm('割肉离场？', '按现价全部卖出，这一关算失败。<br>实际亏损 <b class="down">' + fmtMoney(loss) + '</b>', '割了', () => {
      S.phase = 'end'; setAuto(false);
      if (S.lv.endless) { const en = App.store.get('uk_endless', { wins: 0, plays: 0 }); en.plays++; App.store.set('uk_endless', en); }
      els.endBody.innerHTML =
        '<div class="end-head"><div class="mascot">' + App.mascot('sad') + '</div><div class="end-title">割肉离场</div>' +
        '<div class="end-sub">亏损 <b class="num down">' + fmtMoney(loss) + '</b>。今晚关灯吃面。<br>（说不定明天它就涨了。）</div></div>' +
        '<div class="end-btns"><button class="btn ghost" data-act="levels">关卡列表</button><button class="btn" data-act="retry">再来一次</button></div>';
      App.show(els.end);
      App.sfx.bad();
    });
  }
  function nextLevel() {
    const nx = App.LEVELS.find((x) => x.id === S.lv.id + 1);
    App.hide(els.end);
    if (nx) openLevel(nx); else showSelect();
  }

  // ---------- 无尽模式 ----------
  function endlessCfg() {
    const seed = Date.now() % 1000000007;
    const rng = App.makeRng('endless-' + seed);
    const type = rng.pick(['sine', 'sine', 'downtrend', 'breakout', 'fakeout', 'vshape', 'shakeout', 'wild']);
    const center = Math.round(rng.range(8, 60));
    const per = rng.int(4, 8);
    const P = {
      sine: { type: 'sine', amp: rng.range(0.06, 0.12), period: per, phase: Math.PI + (2 * Math.PI) / per, noise: 0.008, intra: 0.02 },
      downtrend: { type: 'downtrend', drift: -rng.range(0.004, 0.007), amp: rng.range(0.04, 0.06), period: rng.int(5, 7), phase: 0.6, noise: 0.008, intra: 0.02 },
      breakout: { type: 'breakout', amp: 0.05, period: 5, phase: 4.398, start: rng.int(10, 14), rise: rng.range(0.15, 0.22), len: 4, noise: 0.008, intra: 0.02 },
      fakeout: { type: 'fakeout', amp: 0.045, period: 5, start: rng.int(7, 10), rise: rng.range(0.12, 0.16), len: 3, fall: rng.range(0.18, 0.22), flen: 6, rec: rng.range(0.05, 0.08), noise: 0.008, intra: 0.022 },
      vshape: { type: 'vshape', drop: rng.range(0.25, 0.32), bottom: rng.int(6, 9), rec: rng.range(0.28, 0.33), noise: 0.01, intra: 0.025 },
      shakeout: { type: 'shakeout', drift: rng.range(0.003, 0.005), amp: 0.03, period: 6, shocks: [rng.int(2, 5), rng.int(8, 11), rng.int(13, 16)], depth: rng.range(0.1, 0.13), noise: 0.008, intra: 0.022 },
      wild: { type: 'wild', amp: rng.range(0.14, 0.18), period: rng.int(6, 8), amp2: rng.range(0.06, 0.08), period2: 3.1, jumpP: 0.12, noise: 0.02, intra: 0.04 },
    }[type];
    P.center = center;
    const hints = {
      sine: '看看过去一个月的高点和低点，在箱体上沿卖、下沿买。',
      downtrend: '一路阴跌，反弹是卖点，急着补仓只会越补越套。',
      breakout: '横盘越久，拉升越猛，别把底仓全卖光。',
      fakeout: '放量冲高未必是真突破，冲高时卖一部分，回落再接。',
      vshape: '恐慌暴跌之后往往有反弹，闲钱留给最绝望的时候。',
      shakeout: '大阴线吓人但很快拉回，别人恐慌时可以接一点。',
      wild: '妖股波动巨大，赚得快也亏得快，挂单别太贪。',
    };
    const shares = rng.pick([1000, 1000, 1500, 2000]);
    const days = rng.int(18, 24);
    return {
      id: 'E' + seed, endless: true, name: '随机股票', tag: '无尽', stock: [rng.pick(E.FOODS), rng.pick(E.INDS)],
      cost: round2(center * rng.range(1.08, 1.2)), shares, cash: Math.round((center * shares * rng.range(0.15, 0.35)) / 1000) * 1000,
      days, trades: rng.int(10, 16), pattern: P, hint: hints[type], seed,
    };
  }

  // ---------- 拖动挂单线 ----------
  function localY(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onDown(e) {
    if (!canPlan() || !S.g) return;
    const p = localY(e), g = S.g;
    const cand = [];
    if (S.sellOn) cand.push(['sell', Math.abs(p.y - g.yOf(S.sellPrice))]);
    if (S.buyOn) cand.push(['buy', Math.abs(p.y - g.yOf(S.buyPrice))]);
    cand.sort((a, b) => a[1] - b[1]);
    const lim = p.x > g.plotR - 30 ? 34 : 26;
    if (!cand.length || cand[0][1] > lim) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    drag = { which: cand[0][0], id: e.pointerId };
    S.frozen = { lo: g.lo, hi: g.hi };
    App.sfx.tap();
    if (!App.store.get('uk_dragged', false)) { App.store.set('uk_dragged', true); const t = scr.querySelector('.uk-drag-tip'); if (t) t.style.display = 'none'; }
  }
  function onMove(e) {
    if (!drag || !S || !S.g) return;
    e.preventDefault();
    const f = S.frozen;
    const price = round2(clamp(S.g.pOf(localY(e).y), Math.max(0.01, f.lo), f.hi));
    if (drag.which === 'sell') {
      S.sellPrice = Math.max(0.03, price);
      if (S.buyPrice >= S.sellPrice - 0.01) S.buyPrice = round2(S.sellPrice - 0.02);
    } else {
      S.buyPrice = price;
      if (S.sellPrice <= S.buyPrice + 0.01) S.sellPrice = round2(S.buyPrice + 0.02);
    }
    refreshOrders(); draw();
  }
  function onUp() {
    if (!drag) return;
    drag = null;
    if (S) { S.frozen = null; draw(); }
  }

  // ---------- 绘图 ----------
  function draw() {
    if (!S) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    const padL = 6, padR = 66, padT = 26, padB = 18;
    const plotW = w - padL - padR, plotH = h - padT - padB, plotR = padL + plotW;
    const all = S.series.hist.concat(S.series.days.slice(0, S.dayIdx));
    const vis = all.slice(-VIS), off = all.length - vis.length;
    const slot = plotW / (VIS + 2.6);
    const x0 = plotR - (vis.length + 2.6) * slot;
    const xOf = (i) => x0 + (i + 0.5) * slot;
    const tmX0 = x0 + vis.length * slot + 0.3 * slot, tmX1 = tmX0 + 2.1 * slot;
    const playing = S.dayIdx < S.lv.days;
    const b = playing ? band() : null;
    let lo = Infinity, hi = -Infinity;
    for (const d of vis) { lo = Math.min(lo, d.l); hi = Math.max(hi, d.h); }
    if (b) { lo = Math.min(lo, b.lo); hi = Math.max(hi, b.hi); }
    if (S.sellOn) hi = Math.max(hi, S.sellPrice);
    if (S.buyOn) lo = Math.min(lo, S.buyPrice);
    const cp = costPrice();
    const span0 = hi - lo;
    const showCost = cp != null && cp <= hi + span0 * 0.35;
    if (showCost) hi = Math.max(hi, cp);
    const pad = (hi - lo) * 0.06;
    lo -= pad; hi += pad;
    if (S.frozen) { lo = S.frozen.lo; hi = S.frozen.hi; }
    const yOf = (p) => padT + ((hi - p) / (hi - lo)) * plotH;
    const pOf = (y) => hi - ((y - padT) / plotH) * (hi - lo);
    S.g = { yOf, pOf, plotR, lo, hi };

    // 网格
    const span = hi - lo, raw = span / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
    ctx.font = '10px ' + C.num; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const y = yOf(v);
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke();
      ctx.fillStyle = C.dim; ctx.fillText(v.toFixed(step < 1 ? 2 : 1), padL + 2, y - 1);
    }
    // 明天的涨跌停区间
    if (b) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(tmX0, yOf(b.hi), tmX1 - tmX0, yOf(b.lo) - yOf(b.hi));
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([3, 3]);
      ctx.strokeRect(tmX0 + 0.5, yOf(b.hi) + 0.5, tmX1 - tmX0 - 1, yOf(b.lo) - yOf(b.hi) - 1);
      ctx.setLineDash([]);
      ctx.font = '10px ' + C.font; ctx.fillStyle = C.sub; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(S.phase === 'anim' ? '今天' : '明天', (tmX0 + tmX1) / 2, padT + plotH + 4);
    }
    // 成本线
    if (cp != null) {
      ctx.font = 'bold 10px ' + C.font; ctx.textAlign = 'left';
      if (showCost) {
        const y = yOf(cp);
        ctx.strokeStyle = C.gold; ctx.lineWidth = 1.2; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
        ctx.fillStyle = C.gold; ctx.textBaseline = 'bottom'; ctx.textAlign = 'right'; ctx.fillText('成本线 ' + cp.toFixed(2), plotR - 4, y - 2);
      } else {
        ctx.fillStyle = C.gold; ctx.textBaseline = 'top';
        ctx.textAlign = 'right'; ctx.fillText('↑ 成本 ' + cp.toFixed(2) + '（还在上面）', plotR - 4, 7);
      }
    }
    // K 线
    for (let i = 0; i < vis.length; i++) {
      const d = vis[i], x = xOf(i), up = d.c >= d.o, col = up ? C.up : C.down;
      const bw = Math.max(1.5, slot * 0.66);
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, yOf(d.h)); ctx.lineTo(x, yOf(d.l)); ctx.stroke();
      const y1 = yOf(Math.max(d.o, d.c)), y2 = yOf(Math.min(d.o, d.c)), hh = Math.max(1, y2 - y1);
      if (up && bw >= 4) { ctx.fillStyle = C.bg; ctx.fillRect(x - bw / 2, y1, bw, hh); ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, Math.max(0.5, hh - 1)); }
      else ctx.fillRect(x - bw / 2, y1, bw, hh);
    }
    // 买入点（你站岗的地方）
    if (off === 0 && vis.length) {
      const x = xOf(0), y = yOf(vis[0].h) - 6;
      ctx.fillStyle = C.gold; ctx.font = 'bold 10px ' + C.font; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y - 6); ctx.lineTo(x + 4, y - 6); ctx.closePath(); ctx.fill();
      ctx.fillText('你在这儿买的', Math.max(padL + 2, x - 6), y - 8);
    }
    // 成交标记
    ctx.font = 'bold 9px ' + C.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of S.fills) {
      const i = S.series.H + f.day - off;
      if (i < 0 || i >= vis.length) continue;
      const x = xOf(i), y = yOf(f.price);
      ctx.fillStyle = f.type === 'buy' ? C.up : C.down;
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(f.type === 'buy' ? 'B' : 'S', x, y + 0.5);
    }
    // 当日动画：日内走势
    if (S.phase === 'anim' && S.anim) {
      const a = S.anim, P = a.day.path, M = P.length - 1, kk = a.k;
      ctx.strokeStyle = '#eef1f7'; ctx.lineWidth = 1.6; ctx.beginPath();
      for (let k = 0; k <= Math.floor(kk); k++) {
        const x = tmX0 + (k / M) * (tmX1 - tmX0), y = yOf(P[k]);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke(); ctx.lineWidth = 1;
      for (const f of a.res.fills) {
        if (!f.shown) continue;
        const x = tmX0 + (f.k / M) * (tmX1 - tmX0), y = yOf(f.price);
        ctx.fillStyle = f.type === 'buy' ? C.up : C.down;
        ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 9px ' + C.font; ctx.fillText(f.type === 'buy' ? 'B' : 'S', x, y + 0.5);
      }
    }
    // 挂单线与把手
    const lines = [];
    if (playing || S.phase === 'anim') {
      const ords = S.phase === 'anim' ? S.anim.orders : { sell: S.sellOn && S.tradesLeft > 0 ? 1 : null, buy: S.buyOn && S.tradesLeft > 0 ? 1 : null };
      lines.push(['sell', S.sellPrice, !!ords.sell, C.up, '卖']);
      lines.push(['buy', S.buyPrice, !!ords.buy, C.down, '买']);
    }
    for (const L of lines) {
      const y = yOf(L[1]);
      const outOfReach = b && S.phase !== 'anim' && L[2] && ((L[0] === 'sell' && L[1] > b.hi) || (L[0] === 'buy' && L[1] < b.lo));
      if (outOfReach) {
        ctx.font = '10px ' + C.font; ctx.fillStyle = L[3]; ctx.textAlign = 'right'; ctx.textBaseline = L[0] === 'sell' ? 'bottom' : 'top';
        ctx.fillText(L[0] === 'sell' ? '高过明天涨停价，成交不了' : '低过明天跌停价，成交不了', plotR - 4, L[0] === 'sell' ? y - 3 : y + 3);
      }
      ctx.globalAlpha = !L[2] ? 0.28 : outOfReach ? 0.55 : 1;
      ctx.strokeStyle = L[3]; ctx.lineWidth = L[2] ? 1.4 : 1; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
      const hy = clamp(y, padT + 2, padT + plotH - 2);
      const hx = plotR + 3, hw = padR - 6, hh = 22;
      ctx.fillStyle = L[3];
      roundRect(ctx, hx, hy - hh / 2, hw, hh, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px ' + C.num; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(L[4] + ' ' + L[1].toFixed(2), hx + hw / 2, hy + 0.5);
      ctx.globalAlpha = 1;
    }
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function stopAll() { cancelAnimationFrame(raf); clearTimeout(autoTimer); drag = null; if (S) S.auto = false; }
  function enter() { showSelect(); }
  function leave() { stopAll(); }

  App.Unstuck = { init, _state: () => S };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 首页与启动 */
(function (root) {
  'use strict';
  const App = root.App, U = App.U, E = App.Engine;
  const { fmtPct, cls } = U;

  const ICONS = {
    hold: '<svg viewBox="0 0 40 40"><polyline points="4,27 11,21 16,24 23,13 29,17 36,7" fill="none" stroke="#f5474b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="22" cy="30" r="4.5" fill="#ffb31a"/><circle cx="22" cy="30" r="8.5" fill="none" stroke="#ffb31a" stroke-width="1.3" opacity="0.55"/></svg>',
    draw: '<svg viewBox="0 0 40 40"><line x1="7" y1="11" x2="7" y2="31" stroke="#17b26a" stroke-width="1.5"/><rect x="5" y="15" width="4" height="10" fill="#17b26a"/>' +
      '<line x1="14" y1="13" x2="14" y2="31" stroke="#f5474b" stroke-width="1.5"/><rect x="12" y="17" width="4" height="9" fill="#1c2230" stroke="#f5474b" stroke-width="1.5"/>' +
      '<path d="M18 22 Q23 11 28 18 T37 9" fill="none" stroke="#ffb31a" stroke-width="2.6" stroke-dasharray="3 3" stroke-linecap="round"/></svg>',
    unstuck: '<svg viewBox="0 0 40 40"><path d="M3 34 L17 10 L24 21 L28 16 L37 34 Z" fill="#2a3346" stroke="#5d6579" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<line x1="17" y1="10" x2="17" y2="2.5" stroke="#ffb31a" stroke-width="1.6"/><path d="M17 2.5 L24 5 L17 7.5 Z" fill="#f5474b"/>' +
      '<path d="M6 31 Q14 24 20 28 T35 23" fill="none" stroke="#17b26a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2.5 3"/></svg>',
  };

  let home;
  function buildHome() {
    home = App.el(`
<section class="screen" id="scr-home">
  <div class="home-wrap">
    <div class="home-hero">
      <div class="hero-mascot mascot">${App.mascot('happy')}</div>
      <div class="hero-title">股市游乐场</div>
      <div class="hero-sub">三个玩法原型 · 竖屏单手就能玩</div>
      <div class="ticker"><div class="ticker-inner"></div></div>
    </div>
    <button class="game-card" data-go="hold"><div class="gc-icon" style="background:rgba(245,71,75,0.14)">${ICONS.hold}</div>
      <div class="gc-body"><div class="gc-title">按住别松手 <span class="gc-no">①</span></div><div class="gc-desc">按住满仓，松开空仓，45 秒一个交易日。涨停买不进，跌停卖不掉。</div><div class="gc-rec rec-hold"></div></div><div class="gc-arrow">›</div></button>
    <button class="game-card" data-go="draw"><div class="gc-icon" style="background:rgba(255,179,26,0.13)">${ICONS.draw}</div>
      <div class="gc-body"><div class="gc-title">画出明天 <span class="gc-no">④</span></div><div class="gc-desc">看一段真实历史行情，用手指画出未来 20 天。你是股神，还是人形反指？</div><div class="gc-rec rec-draw"></div></div><div class="gc-arrow">›</div></button>
    <button class="game-card" data-go="unstuck"><div class="gc-icon" style="background:rgba(91,140,255,0.14)">${ICONS.unstuck}</div>
      <div class="gc-body"><div class="gc-title">解套大作战 <span class="gc-no">⑤</span></div><div class="gc-desc">50 元买的，现在 40 元。靠高抛低吸做 T，把成本做到现价以下。</div><div class="gc-rec rec-unstuck"></div></div><div class="gc-arrow">›</div></button>
    <div class="home-foot">
      <button class="link-btn" data-act="sound"></button>
      <div class="disclaimer">原型 v0.1 · 所有公司均为虚构 · ④ 的题目来自真实历史指数行情<br>仅供娱乐，不构成任何投资建议</div>
      <button class="link-btn" data-act="reset" style="font-size:12px;color:var(--dim)">清空本地记录</button>
    </div>
  </div>
</section>`);
    document.getElementById('app').appendChild(home);
    home.addEventListener('click', (e) => {
      const b = e.target.closest('[data-go],[data-act]');
      if (!b) return;
      const go = b.getAttribute('data-go');
      if (go) { App.sfx.tap(); App.go(go); return; }
      const act = b.getAttribute('data-act');
      if (act === 'sound') { App.sfx.toggle(); refresh(); }
      if (act === 'reset') App.confirm('清空本地记录？', '三个玩法的成绩、生涯和关卡星星都会被清空。', '清空', () => { App.store.clearAll(); refresh(); App.toast('已清空', 'ok'); });
    });
    // 假行情跑马灯（每天固定一组）
    const rng = App.makeRng('ticker-' + U.dateKey());
    let html = '';
    for (let i = 0; i < 12; i++) {
      const p = rng.range(-9.9, 9.9);
      html += '<span>' + rng.pick(E.FOODS) + rng.pick(E.INDS) + '<b class="num ' + cls(p) + '">' + fmtPct(p) + '</b></span>';
    }
    home.querySelector('.ticker-inner').innerHTML = html + html;
    App.register('home', { enter: refresh });
  }

  function refresh() {
    const q = (s) => home.querySelector(s);
    const hd = App.store.get('hold_daily', {})[U.dateKey()];
    const hc = App.store.get('hold_career', null);
    const parts = [];
    if (hd) parts.push('今日 <span class="' + cls(hd.first) + '">' + fmtPct(hd.first) + '</span>');
    if (hc && !hc.over) parts.push('生涯第 ' + hc.day + ' 天');
    q('.rec-hold').innerHTML = parts.join(' · ') || '今天的行情已经开盘';
    const dd = App.store.get('draw_daily', {})[U.dateKey()];
    const ds = App.store.get('draw_stats', null);
    q('.rec-draw').textContent = dd ? '今日 ' + dd.score + ' 分' + (ds && ds.streakR >= 2 ? ' · 连对 ' + ds.streakR : '') : '今日一题等你作答';
    const lr = App.store.get('uk_levels', {});
    const ids = Object.keys(lr).filter((k) => lr[k].stars > 0);
    const stars = ids.reduce((s, k) => s + lr[k].stars, 0);
    q('.rec-unstuck').textContent = ids.length ? '已解套 ' + ids.length + '/' + App.LEVELS.length + ' 关 · ★ ' + stars : App.LEVELS.length + ' 关等你下山';
    q('[data-act=sound]').textContent = App.sfx.enabled ? '🔊 音效：开' : '🔇 音效：关';
  }

  function boot() {
    App.Hold.init();
    App.Draw.init();
    App.Unstuck.init();
    buildHome();
    App.go('home');
    document.addEventListener('pointerdown', () => App.sfx.unlock(), { once: true });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
  }

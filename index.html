  // 每关过关后开店：3 件道具（牛散 4 件）+ 1 个锦囊，价格按当关目标的百分比折成金额
  function rollShop(R, V, T, rng) {
    const owned = {};
    R.items.forEach((id) => { owned[id] = 1; });
    const cand = ITEMS.filter((it) => okFor(it, V) && !owned[it.id])
      .concat(tacticsFor(V).filter((t) => lvOf(R, t.id) < TAC_MAX).map((t) => xdOf(t.id)));
    const n = 3 + (R.tier >= 2 ? 1 : 0), items = [];
    for (let i = 0; i < n && cand.length; i++) {
      const ws = cand.map((c) => (c.r === 3 ? 5 : c.r === 2 ? 25 : c.xd ? 30 : 70));
      let x = rng() * ws.reduce((s, w) => s + w, 0), j = 0;
      while (j < ws.length - 1 && (x -= ws[j]) > 0) j++;
      const it = cand.splice(j, 1)[0];
      items.push({ id: it.id, price: priceOf(PRICE_PCT[it.r], T), sold: false });
    }
    const bags = BAG.filter((b) => !b.rare || rng.chance(0.3));
    const b = rng.pick(bags);
    return { items, bag: { id: b.id, price: priceOf(2, T), sold: false }, treat: priceOf(1, T), treated: false };
  }

  // ---------- 股东福利（参考株主优待）：收盘那一刻还在做多才生效；收盘持空要付借券费 ----------
  const PERKS = [
    { id: 'gouwu', name: '购物卡', desc: '收盘时还持有：资产 +0.5%' },

  ];
  const PERK = {};

  // 每进一关重新发：16 只股票里 4 只带福利（按局种子和第几次进关决定）
  function rollPerks(seed, visit, nStocks) {
    const rng = App.makeRng('perk:' + seed + ':' + visit), ids = rng.shuffle(Array.from({ length: nStocks }, (_, i) => i)).slice(0, 4), out = {};

      els.ctip.textContent = S.tut && S.tut.day === 1 ? '' : S.pro ? proOpenTip() : S.mode === 't1' ? 'T+1：今天只能买一次，买了就锁定到明天开盘' : '开盘那一刻按住屏幕，就是以开盘价买入';

      els.cinfo.innerHTML = S.pro ? (S.pro.charge ? (S.acct.pos ? '已经下过单了<br>明天开盘自动平仓' : '按住 = 蓄力下单（行情暂停）<br>松手 = 成交') : S.pro.mode === 'switch' ? '按住左半边 = 做空，右半边 = 做多<br>不按 = 平仓 / 空仓' : '按住屏幕 = 继续持有 / 开仓<br>不按 = 平仓 / 空仓') : '按住屏幕 = 继续持有 / 买入<br>不按 = 卖出 / 空仓';
      els.ctip.textContent = '';
    }
    S.phase = opening ? 'count' : 'resume';
    App.setClass(els.cnum, 'count-num');
    App.show(els.count);
    const step = () => {
      if (!S || (S.phase !== 'count' && S.phase !== 'resume')) return;
      if (n > 0) {
        els.cnum.textContent = n;
        els.cnum.style.animation = 'none'; void els.cnum.offsetWidth; els.cnum.style.animation = '';
        App.sfx.count(); n--; later(step, 650);
      } else {
        els.cnum.textContent = opening ? '开盘' : '继续';
        App.sfx.go();
        later(() => { App.hide(els.count); beginRun(); }, 420);
      }
    };
    step();
  }

  function beginRun() {
    S.phase = 'run'; S.paused = false; S.last = performance.now();
    S.pressing = active.size > 0;
    if (S.pro && S.tut && !S.tutBegun) { S.tutBegun = true; tutBegin(); }
    if (S.pro) proInput();
    else if (S.pressing && !S.holding) tryBuy();
    else if (!S.pressing && S.holding) trySell();
    loop();
  }

  // 行情暂停：大A 按住下单时（charge）、新手引导等玩家照做时（tut）。暂停时不走时间，画面照常刷新
  function setFreeze(why) {
    S.freeze = why || null;
    scr.classList.toggle('frozen', S.freeze === 'charge');
  }

  function loop() {
    cancelAnimationFrame(raf);
    const frame = (now) => {
      if (!S || S.phase !== 'run') return;
      const dt = Math.min(64, now - S.last);
      S.last = now;
      if (S.charge) chargeTick(now);
      if (!S.paused && !S.freeze) {
        S.t = Math.min(N - 1, S.t + (dt * speed) / TICK_MS);
        while (S.processed < Math.floor(S.t)) {
          S.processed++;
          onTick(S.processed);
          if (!S || S.phase !== 'run') return;
        }
        if (S.t >= N - 1) { updateHud(); draw(); endDay(); return; }
      }
      updateHud(); draw();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  function onTick(i) {
    const d = S.day;
    const lead = (S.fx && S.fx.newsLead) || 0;
    for (const n of d.news) if ((lead ? Math.max(1, n.t - lead) : n.t) === i) showNews(n);
    if (d.sealUp[i] && !d.sealUp[i - 1]) { App.sfx.alarm(); App.toast('涨停！', 'up big', 1100); tutTip('sealUp'); }
    if (!d.sealUp[i] && d.sealUp[i - 1]) { App.sfx.alarm(); App.toast('炸板！', 'warn big', 1100); }
    if (d.sealDown[i] && !d.sealDown[i - 1]) { App.sfx.alarm(); App.toast('跌停！', 'down big', 1100); tutTip('sealDown'); }
    if (!d.sealDown[i] && d.sealDown[i - 1]) { App.sfx.alarm(); App.toast('撬板了！', 'warn big', 1100); }
    if (S.pro) { proTick(i); if (!S || S.phase !== 'run') return; } else processQueue(i);
    if (S.holding && d.sealUp[i]) S.flags.ateLimit = true;
    S.holdMask[i] = S.pro ? (S.acct.pos ? (S.acct.pos.dir > 0 ? 1 : 2) : 0) : S.holding ? 1 : 0;
  }

  const curIdx = () => Math.min(N - 1, Math.round(S.t));
  function curPrice() {
    const d = S.day, k = curIdx();
    if (d.sealUp[k]) return d.limitUp;
    if (d.sealDown[k]) return d.limitDown;
    const i = Math.floor(S.t), f = S.t - i;
    if (i >= N - 1) return d.price[N - 1];
    return Math.round((d.price[i] + (d.price[i + 1] - d.price[i]) * f) * 100) / 100;
  }

  // ---------- 交易 ----------
  function tryBuy() {
    if (S.pro) { proInput(); return; }
    if (S.holding) {
      if (S.queue && S.queue.type === 'sell') { S.queue = null; App.toast('已撤单，继续持有'); }
      return;
    }
    if (S.locked) return;
    const d = S.day, k = curIdx();
    if (d.sealUp[k]) {
      S.queue = { type: 'buy', ahead: d.sealAmt[k] * S.rng.range(0.55, 1) };
      App.sfx.tap();
      return;
    }
    execBuy(curPrice(), k);
  }
  function execBuy(px, k, via) {
    const fee = S.cash * FEE;
    S.shares = (S.cash - fee) / px; S.fees += fee; S.cash = 0; S.holding = true; S.queue = null;
    S.trades.push({ type: 'buy', i: k, price: px, via: via || '' });
    if (S.mode === 't1') { S.locked = true; scr.classList.add('locked'); }
    scr.classList.add('holding');
    S.holdMask[k] = 1;
    App.sfx.buy(); App.buzz(12);
    floatText('买入 ' + px.toFixed(2), 'up');
    updatePad();
  }
  function trySell() {
    if (S.pro) { proInput(); return; }
    if (!S.holding) {
      if (S.queue && S.queue.type === 'buy') { S.queue = null; App.toast('已撤单'); }
      return;
    }
    if (S.locked) {
      if (!S.flags.lockTip) { S.flags.lockTip = true; App.toast('T+1：今天买的，明天开盘才能卖', 'warn'); }
      return;
    }
    const d = S.day, k = curIdx();
    if (d.sealDown[k]) {
      S.queue = { type: 'sell', ahead: d.sealAmt[k] * S.rng.range(0.55, 1) };
      S.flags.queuedDown = true;
      App.sfx.tap();
      return;
    }
    execSell(curPrice(), k);
  }
  function execSell(px, k, via) {
    const gross = S.shares * px, fee = gross * FEE;
    S.cash = gross - fee; S.fees += fee; S.shares = 0; S.holding = false; S.queue = null;
    S.trades.push({ type: 'sell', i: k, price: px, via: via || '' });
    scr.classList.remove('holding');
    App.sfx.sell(); App.buzz(8);
    floatText('卖出 ' + px.toFixed(2), 'down');
    updatePad();
  }
  function processQueue(i) {
    const q = S.queue;
    if (!q) return;
    const d = S.day;
    if (q.type === 'buy') {
      if (!S.pressing) { S.queue = null; return; }
      if (!d.sealUp[i]) { execBuy(d.limitUp, i, 'break'); S.flags.zhaban = true; App.toast('炸板了！排队的买单在涨停价成交', 'warn', 2400); return; }
      q.ahead -= d.vol[i] * S.rng.range(0.5, 1.1);
      if (q.ahead <= 0) { execBuy(d.limitUp, i, 'queue'); S.flags.paiban = true; App.toast('排到了！涨停价买入成功', 'up'); }
    } else {
      if (S.pressing) { S.queue = null; return; }
      if (!d.sealDown[i]) { execSell(d.limitDown, i, 'open'); App.toast('撬板了，排队的卖单成交', 'warn'); return; }
      q.ahead -= d.vol[i] * S.rng.range(0.5, 1.1);
      if (q.ahead <= 0) { execSell(d.limitDown, i, 'queue'); App.toast('排到了！跌停价卖出', 'down'); }
    }
  }

  // ---------- 操盘手 / 大A：做多 / 做空 + 杠杆 + 强平 ----------
  // 按住 = 用全部本金开仓（本金 × 杠杆），松开 = 平仓，收盘自动平仓。
  // 普通 / 困难：按在左半边做空、右半边做多，滑过中线就反手；杠杆盘中随时能调。
  // 大A：按住时行情暂停、蓄力选仓位（一成 → 满仓 → 融资），松手下单；开了仓就锁到次日开盘。
  // 股价碰到强平线（亏掉一半保证金）就强制平仓；涨停 / 跌停封死时强平单也只能排队，可能穿仓。
  const liqMove = (lev) => String(Math.round((E.PRO_MAINT / lev) * 1000) / 10);
  const blockedBy = (side, k) => (side === 'buy' ? S.day.sealUp[k] : S.day.sealDown[k]);
  const limitPx = (side) => (side === 'buy' ? S.day.limitUp : S.day.limitDown);
  const dirName = (dir, lev) => (S.pro.t1 ? (dir > 0 ? (lev > 1 ? '融资买入' : '买入') : '融券卖出') : dir > 0 ? '做多' : '做空');
  const posName = (pos) => (pos.size ? sizeName(pos.size, pos.dir) : pos.lev + '×');
  function proOpenTip() {
    const p = S.pro;
    if (p.charge) return '按住下单时行情会暂停：按得越久仓位越大，松手成交。今天买的明天开盘才能卖';
    if (p.t1) return 'T+1：一天只能开一次仓，开了就锁到明天开盘自动平掉';
    if (p.mode === 'long') return '开盘那一刻按住屏幕，就是以开盘价满仓买入';
    return '按住左半边做空、右半边做多，滑过中线就反手；杠杆随时能调' + (S.lev > 1 ? '。现在 ' + S.lev + ' 倍，反向波动 ' + liqMove(S.lev) + '% 会被强平' : '');
  }
  function proSave() { if (S.pro.onTrade) S.pro.onTrade({ eq: S.acct.eq, pos: S.acct.pos ? Object.assign({}, S.acct.pos) : null, liqs: S.liqs }); }
  // 手指状态 → 想要的仓位：0 空仓，1 多，-1 空
  function proInput() {
    const p = S.pro;
    if (!active.size) S.needRelease = false;
    S.want = !active.size ? 0 : p.mode === 'switch' ? sides.get(lastPtr) || 1 : p.mode === 'fixed' ? p.dir : 1;
    if (S.phase === 'run' && !S.paused) {
      // 新手引导停在那儿等玩家：要求“按住试试”的，这一按就算照做了；要求点“知道了”的，先不下单
      if (S.freeze === 'tut' && S.coach) {
        if (S.coach.wait !== 'press' || !active.size) { updatePad(); return; }
        tutPressed();
      }
      if (p.charge) chargeInput(); else proReconcile(curIdx());
    }
    updatePad();
  }
  // 大A：一次按压只做一件事——蓄力下单 / 撤掉排队的单 / T+0 平仓
  function chargeInput() {
    const a = S.acct;
    if (!active.size) {
      S.pressUsed = false;
      if (S.charge) fireCharge();
      return;
    }
    if (S.pressUsed || S.charge || S.freeze === 'tut') return;
    S.pressUsed = true;
    if (a.pos) {
      if (S.fx.t0Pass && !S.t0Used && !S.queue) { S.t0Used = true; App.toast('T+0 特权：当天平仓（这一关不能再用了）', 'gold', 1800); proCloseAt(curIdx()); }
      return;
    }
    if (S.queue && S.queue.act === 'open') { S.queue = null; App.sfx.tap(); App.toast('已撤单', '', 1200); return; }
    if (S.t1Used) { App.toast('大A规则：一天只能下一次单', '', 1400); return; }
    if (S.halted || a.eq < 1) return;
    S.charge = { t0: performance.now(), p: chargeAt(0, S.pro.charge.max) };
    setFreeze('charge');
    scr.classList.add('charging');
    App.sfx.tap(); App.buzz(6);
    syncGauge();
  }
  function chargeTick(now) {
    const c = S.charge, p = chargeAt((now - c.t0) / 1000, S.pro.charge.max);
    if (p === c.p) return;
    c.p = p;
    if (p === 0.5 || p === 1 || p === S.pro.charge.max) { App.buzz(14); App.sfx.tap(); } else App.buzz(3);
    syncGauge(); updatePad();
  }
  function syncGauge() {
    const c = S.charge;
    els.pgFill.style.width = c ? (gaugeX(c.p, S.pro.charge.max) * 100).toFixed(1) + '%' : '0%';
    els.pad.classList.toggle('lev', !!c && c.p > 1);
  }
  function fireCharge() {
    const p = S.charge.p;
    S.charge = null;
    setFreeze(null);
    scr.classList.remove('charging');
    syncGauge();
    proOpenAt(S.pro.dir, curIdx(), p);
  }
  function cancelCharge() {
    if (!S || !S.charge) return;
    S.charge = null; S.pressUsed = false;
    setFreeze(null);
    scr.classList.remove('charging');
    syncGauge();
    App.toast('已取消下单', '', 1200);
    updatePad();
  }
  // 让实际仓位追上想要的仓位：反手 = 先平再开；持仓中改了杠杆就按新杠杆调仓
  function proReconcile(k) {
    const a = S.acct, p = S.pro;
    if (S.queue || p.charge || S.freeze) return;
    const want = S.needRelease ? 0 : S.want;
    if (a.pos) {
      if (p.t1) {
        // T+0 特权（每关一次）：锁定后先松开，再按一下就当天平仓
        if (S.fx.t0Pass && !S.t0Used) {
          if (!want) S.t0Ready = true;
          else if (S.t0Ready) { S.t0Used = true; App.toast('T+0 特权：当天平仓（这一关不能再用了）', 'gold', 1800); proCloseAt(k); }
        }
        return;
      }
      if (want === a.pos.dir) { if (S.lev !== a.pos.lev) proChangeLev(k); return; }
      proCloseAt(k);
      if (!S || S.phase !== 'run' || a.pos || S.queue) return;
    }
    if (want && !S.halted && !(p.t1 && S.t1Used) && a.eq >= 1) proOpenAt(want, k);
  }
  // size（大A）：仓位，0.1 = 一成仓，1 = 满仓，超过 1 是融资 / 融券加倍
  function proOpenAt(dir, k, size) {
    const side = dir > 0 ? 'buy' : 'sell';
    if (blockedBy(side, k)) {
      S.queue = { act: 'open', dir, side, ahead: S.day.sealAmt[k] * S.rng.range(0.55, 1), size };
      App.sfx.tap();
      if (S.pro.charge) App.toast((side === 'buy' ? '涨停封板，买单在排队' : '跌停封死，卖单在排队') + ' · 再按一下撤单', 'warn', 2200);
      updatePad();
      return;
    }
    proExecOpen(dir, curPrice(), k, '', size);
  }
  function proCloseAt(k) {
    const side = S.acct.pos.dir > 0 ? 'sell' : 'buy';
    if (blockedBy(side, k)) {
      S.queue = { act: 'close', side, ahead: S.day.sealAmt[k] * S.rng.range(0.55, 1) };
      if (side === 'sell') S.flags.queuedDown = true;
      App.sfx.tap();
      return;
    }
    proExecClose(curPrice(), k, '');
    if (S.acct.eq < 1) proBankrupt();
  }
  function proChangeLev(k) {
    const a = S.acct, more = S.lev > a.pos.lev, side = (a.pos.dir > 0) === more ? 'buy' : 'sell';
    if (blockedBy(side, k)) return; // 封板时加减不了仓，等开板再调
    E.proRebase(a, curPrice(), S.lev);
    floatText('杠杆 ' + S.lev + '×', 'gold');
    updatePad(); proSave();
  }
  function proSetLev(v) {
    if (S.pro.levs.indexOf(v) < 0 || S.lev === v) return;
    S.lev = v;
    App.sfx.tap();
    syncLevBar();
    if (S.phase === 'run' && !S.paused) proReconcile(curIdx());
    updatePad();
  }
  function syncLevBar() {
    els.levBar.querySelectorAll('button').forEach((b) => { const v = +b.getAttribute('data-lev'); b.classList.toggle('on', !!S && v === S.lev); b.classList.toggle('hot', v >= 5); });
  }
  function proExecOpen(dir, px, k, via, size) {
    S.openInfo = { dir, oi: k, opx: px, eq: S.acct.eq, ov: via, size: size || 0 };
    if (size) { E.proOpen(S.acct, px, dir, Math.max(1, size), Math.min(1, size)); S.acct.pos.size = size; }
    else E.proOpen(S.acct, px, dir, S.lev);
    S.queue = null; S.holding = true; S.holdMask[k] = dir > 0 ? 1 : 2;
    S.trades.push({ type: dir > 0 ? 'buy' : 'sell', i: k, price: px, via });
    scr.classList.add('holding'); scr.classList.toggle('short', dir < 0);
    if (S.pro.t1) { S.t1Used = true; S.locked = true; scr.classList.add('locked'); }
    App.sfx.buy(); App.buzz(12);
    floatText((size ? orderName(size, dir) : dirName(dir, S.lev)) + ' ' + px.toFixed(2), dir > 0 ? 'up' : 'down');
    updatePad(); proSave();
    if (S.tut && S.tut.day === 1) tutTip(S.pro.charge ? 'lockedT1' : S.pro.mode === 'switch' ? 'afterSwitch' : 'afterLong');
  }
  function proExecClose(px, k, via) {
    const dir = S.acct.pos.dir;
    E.proClose(S.acct, px);
    if (S.openInfo) { const o = S.openInfo; S.closed.push({ dir, oi: o.oi, opx: o.opx, ov: o.ov, ci: k, cpx: px, via, size: o.size, pnl: Math.round((S.acct.eq - o.eq) * 100) / 100 }); S.openInfo = null; }
    S.queue = null; S.holding = false; S.locked = false;
    S.trades.push({ type: dir > 0 ? 'sell' : 'buy', i: k, price: px, via });
    scr.classList.remove('holding', 'short', 'locked');
    if (via !== 'liq' && via !== 'close' && via !== 'nextOpen') { App.sfx.sell(); App.buzz(8); floatText('平仓 ' + px.toFixed(2), dir > 0 ? 'down' : 'up'); }
    updatePad(); proSave();
  }
  function proTick(i) {
    const d = S.day, q = S.queue, a = S.acct;
    if (q) {
      const want = S.needRelease ? 0 : S.want;
      // 大A 的单子松手后还挂在那儿排队（再按一下才撤）；其它玩法松手就撤
      if (q.act === 'open' && want !== q.dir && !S.pro.charge) S.queue = null;
      else if (q.act === 'close' && !q.forced && a.pos && want === a.pos.dir && !S.pro.charge) S.queue = null;
      else {
        const blocked = blockedBy(q.side, i);
        if (blocked) q.ahead -= d.vol[i] * S.rng.range(0.5, 1.1);
        if (!blocked || q.ahead <= 0) {
          const px = limitPx(q.side);
          if (q.act === 'open') {
            proExecOpen(q.dir, px, i, blocked ? 'queue' : 'break', q.size);
            App.toast(blocked ? (q.side === 'buy' ? '排到了！涨停价买入' : '排到了！跌停价卖出') : q.side === 'buy' ? '炸板了！排队的买单在涨停价成交' : '撬板了！排队的空单在跌停价成交', 'warn', 2200);
          } else {
            const margin = a.pos.margin + (a.pos.cash || 0);
            proExecClose(px, i, q.forced ? 'liq' : blocked ? 'queue' : 'open');
            if (q.forced) proLiquidated(margin);
            else App.toast(blocked ? '排到了，平仓成交' : q.side === 'sell' ? '撬板了，排队的卖单成交' : '炸板了，排队的买单成交', 'warn');
          }
        }
      }
    }
    if (!S || S.phase !== 'run') return;
    if (a.pos && E.proHitLiq(a.pos, d.price[i])) {
      if (S.queue && S.queue.act === 'close') {
        if (!S.queue.forced) {
          S.queue.forced = true; S.liqs++; S.needRelease = true;
          App.sfx.alarm(); App.toast('触发强平！平仓单还卡在' + (S.queue.side === 'sell' ? '跌停' : '涨停') + '板上', 'warn', 2400);
        }
      } else proForceClose(i);
      if (!S || S.phase !== 'run') return;
    }
    if (a.pos && !S.queue && S.fx.stopLoss && !S.pro.t1 && E.proEquity(a, d.price[i]) - (a.pos.cash || 0) <= a.pos.margin * 0.95) {
      S.needRelease = true;
      App.toast('止损纪律：这一笔亏到 5%，自动平仓', 'warn', 2000);
      proCloseAt(i);
      if (!S || S.phase !== 'run') return;
    }
    if (S.fx.meltdown && !S.halted && E.proEquity(a, d.price[i]) <= S.eq0 * 0.8) {
      S.halted = true; S.needRelease = true;
      App.toast('熔断机制：今天亏到 20%，停止交易', 'warn', 2400);
      avaSay('down');
      if (a.pos && !S.queue) proCloseAt(i);
      if (!S || S.phase !== 'run') return;
    }
    proReconcile(i);
  }
  // 陪伴角色：盘中跟着盈亏变脸，偶尔冒一句（引导框正显示时不插嘴）
  function avaSay(ev, txt, ms) {
    if (!S || !S.pro || !S.pro.ava || S.coach) return;
    if (!ms && S.tipUntil && performance.now() < S.tipUntil) return; // 引导提示没讲完，搭档先别插嘴
    const t = txt || (S.pro.ava.lines && S.pro.ava.lines[ev]);
    if (!t) return;
    if (ms) S.tipUntil = performance.now() + ms;
    els.avaBub.textContent = t;
    els.avaBub.className = 'ha-bub show' + (ms ? ' tip' : '');
    clearTimeout(S.bubT); S.bubT = setTimeout(() => { if (els.avaBub && !(S && S.coach)) els.avaBub.className = 'ha-bub'; }, ms || 2600);
  }

  // ---------- 新手引导（操盘手 / 大A 第 1 关） ----------
  // 第 1 天开盘先停在 09:30，搭档教会怎么按再走；第 2 天讲杠杆；之后第一次遇到涨停、快讯、强平时各说一句

  function tutBegin() {

        p.mode === 'switch' ? '按住右半边 = 做多，涨了赚；按住左半边 = 做空，跌了赚。松手就平仓。先按住右边试试！' :
        '按住下面的大按钮就是买入，松手就是卖出。按住试试！';
      setFreeze('tut');
      coachShow({ text, at: p.mode === 'switch' ? 'padR' : 'pad', wait: 'press' });
    } else if (t.day === 2 && p.levs && !t.seen.lev) {
      t.seen.lev = 1;

    }

  // 引导手势：指着要按的地方（整块按键 / 右半边 / 杠杆按钮）
  function placeHand() {
    const at = els.hand.getAttribute('data-at');
    if (!at || !S || !S.coach) { els.hand.style.display = 'none'; return; }
    const r = (at === 'lev' ? els.levBar : els.pad).getBoundingClientRect(), sr = scr.getBoundingClientRect();

  // 不挡操作的一句提示：引导关里每种情况只讲一次
  function tutTip(key) {
    if (!S || !S.tut || S.tut.seen[key] || !S.pro || !S.pro.ava || S.coach) return;

  function avaMood(r) {

    if (r >= 5 && !S.said.up) { S.said.up = true; avaSay('up'); }

  }
  function proForceClose(i) {
    const a = S.acct, side = a.pos.dir > 0 ? 'sell' : 'buy', margin = a.pos.margin + (a.pos.cash || 0);
    S.liqs++; S.needRelease = true;
    App.sfx.alarm(); App.buzz(60);
    if (blockedBy(side, i)) {
      S.queue = { act: 'close', side, ahead: S.day.sealAmt[i] * S.rng.range(0.55, 1), forced: true };
      App.toast('触发强平！但' + (side === 'sell' ? '跌停' : '涨停') + '封死了，强平单也只能排队', 'warn', 2600);
      updatePad();

    }
    proExecClose(S.day.price[i], i, 'liq');

  function proLiquidated(margin) {

  function proBankrupt() {
    if (S.bankrupt) return;

  function proBanner(k, dropping) {
    const d = S.day, q = S.queue, a = S.acct;
    if (q) {
      const ahead = ' · 前面还有 ' + fmtWan(Math.max(0, q.ahead)) + '手';
      if (q.forced) return ['强平单在排队：' + (q.side === 'sell' ? '跌停' : '涨停') + '封死' + ahead, 'warn'];
      if (q.act === 'open') return [q.side === 'buy' ? '涨停封板买不进，排队中' + ahead : '跌停封死，空单卖不出去' + ahead, q.side === 'buy' ? 'up' : 'down'];
      return [q.side === 'sell' ? '跌停卖不掉，排队中' + ahead : '涨停买不回来，排队中' + ahead, q.side === 'sell' ? 'down' : 'up'];
    }
    if (d.sealUp[k]) return ['涨停封板 · 封单 ' + fmtWan(d.sealAmt[k]) + '手' + (dropping ? ' ↓ 在减少' : ''), 'up'];
    if (d.sealDown[k]) return ['跌停封死 · 卖单 ' + fmtWan(d.sealAmt[k]) + '手' + (dropping ? ' ↓ 在减少' : ''), 'down'];
    if (a.pos && a.pos.lev > 1) {
      const px = curPrice(), dist = (a.pos.dir > 0 ? px / a.pos.liq - 1 : a.pos.liq / px - 1) * 100;
      if (dist < Math.max(1.2, ((E.PRO_MAINT * 100) / a.pos.lev) * 0.45)) return ['⚠ 离强平线只剩 ' + Math.max(0, dist).toFixed(1) + '%', 'warn'];
    }
    return ['', ''];
  }
  // why：close 收盘 / quit 中途退出 / bankrupt 穿仓。大A 还拿着仓位的，先过夜，次日开盘平仓
  function proFinishDay(why) {
    if (!S || S.phase === 'done' || S.finishing) return;
    S.finishing = true;
    clearTimers(); cancelAnimationFrame(raf);
    S.phase = 'closing';
    const a = S.acct, P = S.day.price;
    S.queue = null;
    S.atClose = a.pos && why !== 'bankrupt' && (why === 'close' || S.pro.t1) ? a.pos.dir : 0;
    S.atCloseK = a.pos && a.pos.size ? Math.min(1, a.pos.size) : 1;
    if (S.charge) { S.charge = null; setFreeze(null); scr.classList.remove('charging'); syncGauge(); }
    coachHide();
    updateHud(); draw();
    if (a.pos && S.pro.t1 && why !== 'bankrupt') {
      App.toast(why === 'quit' ? 'T+1：今天开的仓锁到明天开盘' : '收盘 15:00', '', 1100);
      later(proOvernight, 900);
      return;
    }
    if (a.pos) proExecClose(why === 'close' ? P[N - 1] : curPrice(), why === 'close' ? N - 1 : curIdx(), why === 'close' ? 'close' : 'quit');

  }
  function proOvernight() {
    const p = S.pro, a = S.acct, dir = a.pos.dir, g = (p.nextOpen / S.day.price[N - 1] - 1) * 100;
    els.cnum.textContent = '🌙'; App.setClass(els.cnum, 'count-num');

    App.show(els.count);
    later(() => {
      els.cnum.textContent = fmtPct(g, 1);

      if (dir * g >= 0) App.sfx.good(); else App.sfx.bad();
      proExecClose(p.nextOpen, N - 1, 'nextOpen');
      S.overnight = g;
      updateHud(); draw();
      later(() => { App.hide(els.count); proDone('close'); }, 1900);
    }, 1200);
  }
  function proDone(why) {
    const a = S.acct, P = S.day.price;
    if (a.eq < 1) S.bankrupt = true;
    scr.classList.remove('holding', 'short', 'locked');
    updateHud(); draw();
    if (why !== 'bankrupt') App.toast(why === 'quit' ? '已平仓，结束今天' : S.bankrupt ? '结算：穿仓了' : S.pro.t1 ? '已按次日开盘价结算' : '收盘 15:00 · 自动平仓', S.bankrupt ? 'down big' : '', 1200);
    later(() => {
      S.phase = 'done';
      let hi = -Infinity, lo = Infinity;
      for (let i = 0; i < N; i++) { hi = Math.max(hi, P[i]); lo = Math.min(lo, P[i]); }
      S.pro.onDone({
        eq0: S.eq0, eq: a.eq, ret: (a.eq / S.eq0 - 1) * 100, fees: a.fees, liqs: S.liqs, bankrupt: S.bankrupt, quit: why === 'quit',
        trades: S.trades.slice(), holdMask: Array.from(S.holdMask), ohlc: [P[0], hi, lo, P[N - 1]], overnight: S.overnight == null ? null : S.overnight,
        closed: S.closed.slice(), atClose: S.atClose, atCloseK: S.atCloseK, t0Used: S.t0Used, halted: S.halted, tutSeen: S.tut ? S.tut.seen : null,
      });
    }, why === 'bankrupt' ? 500 : 1000);
  }

  // ---------- HUD ----------
  function equityNow() { return S.pro ? E.proEquity(S.acct, curPrice()) : S.holding ? S.shares * curPrice() : S.cash; }
  function updateHud() {
    if (!S) return;
    const d = S.day, p = curPrice(), pc = (p / d.prevClose - 1) * 100;

    App.setText(els.clock, S.phase === 'done' || S.phase === 'closing' ? '15:00' : clockOf(Math.floor(S.t)));
    const eq = equityNow(), r = (eq / S.eq0 - 1) * 100;
    App.setText(els.eq, fmtMoney(eq));
    App.setText(els.pnl, fmtPct(r)); App.setClass(els.pnl, 'num h-pnl ' + cls(r));

      else if (S.queue) { st = '排队中'; sc = 'chip gold'; }
      else if (pos && S.pro.t1) { st = '锁到明天 · ' + (pos.dir > 0 ? '多 ' : '空 ') + (pos.size ? sizeName(pos.size, pos.dir).replace(/^融[资券] /, '') : pos.lev > 1 ? pos.lev + '×' : ''); sc = 'chip gold'; }
      else if (pos) { st = (pos.dir > 0 ? '持多 ' : '持空 ') + pos.lev + '×'; sc = pos.dir > 0 ? 'chip up' : 'chip down'; }

      else if (d.sealDown[k]) { txt = '跌停封死 · 卖单 ' + fmtWan(d.sealAmt[k]) + '手' + (dropping ? ' ↓ 在减少' : ''); bc = 'down'; }

  // ---------- 收盘结算 ----------
  function endDay() {
    S.phase = 'closing';
    cancelAnimationFrame(raf);
    S.holdMask[N - 1] = S.holding ? 1 : 0;
    if (S.pro) { proFinishDay('close'); return; }
    S.queue = null;
    updateHud(); draw();
    App.toast('收盘 15:00', '', 1100);
    if (S.mode === 't1' && S.holding) later(overnight, 800); else later(finish, 800);
  }
  function overnight() {
    const d = S.day;
    els.cnum.textContent = '🌙'; App.setClass(els.cnum, 'count-num');
    els.cinfo.innerHTML = '持股过夜中……<br>明天开盘自动卖出'; els.ctip.textContent = '';
    App.show(els.count);
    later(() => {
      const g = d.gapNext;
      els.cnum.textContent = fmtPct(g, 1);
      App.setClass(els.cnum, 'count-num num ' + cls(g));
      els.cinfo.innerHTML = '次日开盘 <b class="num">' + d.nextOpen.toFixed(2) + '</b>' +
        (d.gapNews ? '<br><span class="small">盘后公告：' + d.gapNews + '</span>' : '');
      if (g >= 0) App.sfx.good(); else App.sfx.bad();
      later(() => { App.hide(els.count); finish(); }, 1900);
    }, 1200);
  }

  function finish() {
    const d = S.day, t1 = S.mode === 't1';
    S.phase = 'done';
    let eq;
    if (S.holding && t1) {
      const gross = S.shares * d.nextOpen;
      S.fees += gross * FEE; eq = gross * (1 - FEE);
      S.trades.push({ type: 'sell', i: N, price: d.nextOpen, via: 'nextOpen' });
    } else eq = S.holding ? S.shares * d.price[N - 1] : S.cash;
    const ret = (eq / S.eq0 - 1) * 100;
    const bh = t1 ? ((1 - FEE) * (1 - FEE) * d.nextOpen / d.open - 1) * 100 : ((1 - FEE) * d.price[N - 1] / d.open - 1) * 100;
    const best = t1 ? E.perfectT1(d) : E.perfectHold(d);
    const pct = E.holdPercentile(d, t1, ret);
    S.result = { eq, ret, bh, best, pct, moments: detectMoments(ret) };
    saveResult();
    showResult();
    if (ret >= 2) App.sfx.good(); else if (ret <= -2) App.sfx.bad();
  }

  function detectMoments(ret) {
    const d = S.day, P = d.price, out = [];
    let hi = -Infinity, lo = Infinity;
    for (let i = 0; i < N; i++) { hi = Math.max(hi, P[i]); lo = Math.min(lo, P[i]); }
    const maxAfter = (i) => { let m = -Infinity; for (let k = i + 1; k < N; k++) m = Math.max(m, P[k]); return m; };
    const tr = S.trades.filter((t) => t.i < N);
    const t1 = S.mode === 't1';
    if (S.flags.zhaban) out.push({ k: 'zb', name: '炸板接盘', tone: 'down', desc: '排队等涨停，等来的却是炸板——排队的买单都在最高价成交了。' });
    let fly = null;
    for (const t of tr) {
      if (t.type !== 'sell') continue;
      const m = maxAfter(t.i), g = (m / t.price - 1) * 100;
      if (g >= 3.5 && (!fly || g > fly.g)) fly = { t, m, g };
    }
    if (fly) out.push({ k: 'fly', name: '卖飞', tone: 'down', desc: clockOf(fly.t.i) + ' 卖在 ' + fly.t.price.toFixed(2) + '，之后最高涨到 ' + fly.m.toFixed(2) + '（+' + fly.g.toFixed(1) + '%）。' });
    const top = tr.find((t) => t.type === 'buy' && t.price >= hi * 0.993 && hi / P[0] > 1.02);
    if (top) out.push({ k: 'top', name: '买在山顶', tone: 'down', desc: clockOf(top.i) + ' 买在 ' + top.price.toFixed(2) + '，正好是全天最高点附近。' });
    const floor = tr.find((t) => t.type === 'sell' && t.price <= lo * 1.007 && maxAfter(t.i) / t.price > 1.03);
    if (floor) out.push({ k: 'floor', name: '割在地板', tone: 'down', desc: clockOf(floor.i) + ' 卖在 ' + floor.price.toFixed(2) + '，几乎是全天最低价，之后就涨回去了。' });
    const bottom = tr.find((t) => t.type === 'buy' && t.price <= lo * 1.008);
    if (bottom) out.push({ k: 'bottom', name: '抄底成功', tone: 'up', desc: clockOf(bottom.i) + ' 买在 ' + bottom.price.toFixed(2) + '，离全天最低只差 ' + ((bottom.price / lo - 1) * 100).toFixed(1) + '%。' });
    const esc = tr.find((t) => t.type === 'sell' && t.price >= hi * 0.993);
    if (esc) out.push({ k: 'esc', name: '逃顶成功', tone: 'up', desc: clockOf(esc.i) + ' 卖在 ' + esc.price.toFixed(2) + '，几乎卖在全天最高点。' });
    if (S.flags.ateLimit) out.push({ k: 'limit', name: '吃到涨停', tone: 'up', desc: '涨停板上你手里有货，这种感觉值得截图。' });
    if (S.flags.queuedDown) out.push({ k: 'qd', name: '跌停排队', tone: 'down', desc: '跌停板上排队卖不出去，体验了一把 A 股特色。' });
    // 踏空：全天最大一段上涨，你几乎没拿着
    let bestRun = null, minI = 0;
    for (let i = 1; i < N; i++) {
      if (P[i] < P[minI]) minI = i;
      const g = (P[i] / P[minI] - 1) * 100;
      if (!bestRun || g > bestRun.g) bestRun = { a: minI, b: i, g };
    }
    if (!t1 && bestRun && bestRun.g >= 5) {
      let held = 0;
      for (let i = bestRun.a; i <= bestRun.b; i++) held += S.holdMask[i];
      if (held / (bestRun.b - bestRun.a + 1) < 0.2) out.push({ k: 'miss', name: '踏空', tone: 'down', desc: clockOf(bestRun.a) + ' 到 ' + clockOf(bestRun.b) + ' 涨了 ' + bestRun.g.toFixed(1) + '%，你基本都在场外看着。' });
    }
    const seenTrap = S.newsSeen.find((n) => n.note);
    if (seenTrap) out.push({ k: 'trap', name: seenTrap.kind === 'good' ? '利好出尽' : '利空出尽', tone: 'gold', desc: clockOf(seenTrap.t) + ' 那条快讯：' + seenTrap.note + '。' });
    if (tr.length >= 16) out.push({ k: 'fee', name: '手续费战士', tone: 'gold', desc: '交易了 ' + tr.length + ' 次，光手续费就交了 ' + fmtMoney(S.fees) + '。' });
    if (tr.length === 1 && tr[0].type === 'buy' && tr[0].i <= 2 && !t1) out.push({ k: 'allin', name: '开盘梭哈', tone: 'gold', desc: '开盘满仓，一拿到底。' });
    if (!tr.length) out.push({ k: 'none', name: '空仓观望', tone: 'gold', desc: '一整天都没出手，至少没亏手续费。' });
    if (ret <= -5) out.push({ k: 'noodle', name: '关灯吃面', tone: 'down', desc: '今天就别再看盘了。' });
    return out.slice(0, 4);
  }

  function titleFor(ret) {
    if (S.mode === 't1') {
      if (ret >= 6) return '打板之王';
      if (ret >= 2) return '隔夜赢家';
      if (ret >= 0) return '小赚一笔';
      if (ret >= -3) return '小亏离场';
      return '隔夜惊魂';
    }
    if (ret >= 9) return '涨停敢死队';
    if (ret >= 5) return '股神附体';
    if (ret >= 2) return '小赚是福';
    if (ret > 0.005) return '保住本金';
    if (ret >= -2) return '白忙一场';
    if (ret >= -5) return '被割了一刀';
    return '关灯吃面';
  }

  function saveResult() {
    const r = S.result;
    if (S.mode === 'daily') {
      const rec = App.store.get('hold_daily', {});
      const k = U.dateKey();
      if (!rec[k]) rec[k] = { first: r.ret, best: r.ret, plays: 1, pct: r.pct };
      else { rec[k].best = Math.max(rec[k].best, r.ret); rec[k].plays++; }
      const keys = Object.keys(rec).sort();
      while (keys.length > 40) delete rec[keys.shift()];
      App.store.set('hold_daily', rec);
      S.dailyRec = rec[k];
    } else if (S.mode === 'career') {
      const c = loadCareer();
      const before = rankOf(c.equity);
      c.equity = r.eq; c.day += 1; c.peak = Math.max(c.peak, r.eq);
      if (r.ret > 0) c.wins = (c.wins || 0) + 1;
      c.over = r.eq < START_CASH * 0.5;
      saveCareer(c);
      S.career = c; S.rankUp = rankOf(c.equity) !== before && c.equity > S.eq0 ? rankOf(c.equity) : null;
    } else {
      const rec = App.store.get('hold_t1', { best: null, plays: 0 });
      rec.plays++; rec.best = rec.best == null ? r.ret : Math.max(rec.best, r.ret);
      App.store.set('hold_t1', rec);
    }
  }

  function showResult() {
    const r = S.result, q = (s) => scr.querySelector(s);
    q('.r-mascot').innerHTML = App.mascot(r.ret >= 2 ? 'happy' : r.ret <= -2 ? 'sad' : 'neutral');
    q('.r-title').textContent = titleFor(r.ret);
    const ret = q('.r-ret');
    ret.textContent = fmtPct(r.ret); ret.className = 'res-ret num r-ret ' + cls(r.ret);
    q('.r-eq').textContent = fmtMoney(S.eq0) + ' → ' + fmtMoney(r.eq) + '  ·  手续费 ' + fmtMoney(S.fees);
    const bh = q('.r-bh'); bh.textContent = fmtPct(r.bh, 1); bh.className = 'num r-bh ' + cls(r.bh);
    q('.r-best').textContent = '+' + r.best.toFixed(1) + '%';
    q('.r-best').className = 'num r-best up';
    q('.r-pct').textContent = Math.round(r.pct) + '%';
    const mm = q('.r-moments');
    mm.innerHTML = '';
    for (const m of r.moments) {
      const row = App.el('<div class="moment ' + m.tone + '"><b></b><span></span></div>');
      row.querySelector('b').textContent = m.name; row.querySelector('span').textContent = m.desc;
      mm.appendChild(row);
    }
    const extra = q('.r-extra');
    extra.innerHTML = '';
    const again = q('.r-again');
    again.textContent = '再来一局';
    if (S.mode === 'daily') {
      const rec = S.dailyRec;
      extra.innerHTML = '<div class="res-box">' + (rec.plays > 1
        ? '今日首次成绩 <b class="num ' + cls(rec.first) + '">' + fmtPct(rec.first) + '</b>（已记录）· 这是第 ' + rec.plays + ' 次'
        : '这是今天的首次成绩，已记录。明天会换一只股票。') + '</div>';
      again.textContent = '再练一次';
    } else if (S.mode === 'career') {
      const c = S.career, nr = nextRank(c.equity);
      if (c.over) {
        extra.innerHTML = '<div class="res-box bad">资产跌破 5 万，<b>被迫离场</b>。这一局坚持了 ' + (c.day - 1) + ' 天。</div>' +
          (c.revived ? '' : '<button class="btn block" style="margin-top:10px" data-act="revive">补仓复活（看一段广告）</button>') +
          '<button class="btn ghost block" style="margin-top:8px" data-act="newcareer">重新开始</button>';
        again.textContent = '返回菜单';
        again.setAttribute('data-act', 'menu');
      } else {
        again.setAttribute('data-act', 'again');
        extra.innerHTML = '<div class="res-box">快速模式第 ' + (c.day - 1) + ' 天结束 · 总资产 <b class="num">' + fmtMoney(c.equity) + '</b> · 段位 <b>' + rankOf(c.equity) + '</b>' +
          (S.rankUp ? '<br>🎉 晋级「' + S.rankUp + '」！' : '') + (nr ? '<br><span class="small">距离「' + nr[1] + '」还差 ' + fmtMoney(nr[0] - c.equity) + '</span>' : '') + '</div>';
        again.textContent = '下一天';
      }
    } else {
      const d = S.day;
      extra.innerHTML = '<div class="res-box">次日开盘 ' + fmtPct(d.gapNext, 1) + (d.gapNews ? '（盘后公告：' + d.gapNews + '）' : '') + '。收盘封涨停的股票，第二天往往高开；尾盘跳水的，第二天往往低开。</div>';
    }
    if (S.mode !== 'career') again.setAttribute('data-act', 'again');
    q('.r-note').textContent = '* 与 400 位模拟股民炒同一只股票比较（原型阶段，上线后换成真实玩家排名）。本局剧本：' + S.day.archName + '。';
    App.show(els.result);
    requestAnimationFrame(drawResultChart);
  }

  function again() {
    App.hide(els.result);
    if (S && S.mode === 'career' && S.career && S.career.over) { quitToMenu(); return; }
    startSession(S ? S.mode : 'daily');
  }

  function showCareerOver() {
    refreshMenu(); App.show(els.menu);
    App.confirm('这一局已结束', '上一局资产腰斩、被迫离场了。要重新开始吗？', '重新开始', () => {
      saveCareer({ id: Date.now().toString(36), day: 1, equity: START_CASH, peak: START_CASH, revived: false, over: false, wins: 0 });
      App.hide(els.menu); startSession('career');
    });
  }

  function revive() {
    const ov = App.el('<div class="overlay center show"><div class="dialog ad-box"><div class="dialog-title">广告位</div>' +
      '<div class="ad-screen">这里接激励视频广告<br><b class="num ad-n">3</b></div><div class="dialog-text">原型演示：看完广告，补仓到 10 万继续</div></div></div>');
    scr.appendChild(ov);
    let n = 3;
    const tick = () => {
      n--;
      if (n > 0) { ov.querySelector('.ad-n').textContent = n; later(tick, 1000); return; }
      ov.remove();
      const c = loadCareer();
      c.equity = START_CASH; c.over = false; c.revived = true;
      saveCareer(c);
      App.toast('补仓成功，继续战斗！', 'ok');
      App.hide(els.result);
      startSession('career');
    };
    later(tick, 1000);
  }

  // ---------- 分享 ----------
  function shareText() {
    const r = S.result, d = S.day;
    const blocks = [];
    for (let b = 0; b < 12; b++) {
      const a = b * 20, e = a + 19;
      let held = 0;
      for (let i = a; i <= e; i++) held += S.holdMask[i];
      blocks.push(held >= 10 ? (d.price[e] >= d.price[a] ? '🟥' : '🟩') : '⬜');
    }
    const head = S.mode === 'daily' ? '📈 按住别松手 · ' + U.dateLabel() + '每日行情' : S.mode === 'career' ? '📈 按住别松手 · 快速模式第 ' + S.careerDay + ' 天' : '📈 按住别松手 · T+1 硬核';
    const lines = [head, '收益 ' + fmtPct(r.ret) + '｜跑赢 ' + Math.round(r.pct) + '% 的股民', blocks.join('')];
    if (r.moments.length) lines.push('名场面：' + r.moments.map((m) => m.name).join(' · '));
    return lines.join('\n');
  }

  // ---------- 菜单记录 ----------
  function refreshMenu() {
    const q = (s) => scr.querySelector(s);
    const rec = App.store.get('hold_daily', {})[U.dateKey()];
    q('.r-daily').innerHTML = rec ? '今日首次 <span class="' + cls(rec.first) + '">' + fmtPct(rec.first) + '</span> · 最佳 ' + fmtPct(rec.best) : '今天还没玩';
    const c = App.store.get('hold_career', null);
    q('.r-career').textContent = c ? (c.over ? '上一局已结束 · 坚持了 ' + (c.day - 1) + ' 天' : '第 ' + c.day + ' 天 · ' + fmtMoney(c.equity) + ' · ' + rankOf(c.equity)) : '还没开始';
    q('.r-pro').textContent = App.Trader ? App.Trader.summary('pro') : '';
    q('.r-biga').textContent = App.Trader ? App.Trader.summary('biga') : '';
  }

  function enter(arg) {
    if (arg && arg.pro) { [els.menu, els.pause, els.count, els.result].forEach(App.hide); startSession('pro', arg.pro); return; }
    refreshMenu();
    [els.pause, els.count, els.result].forEach(App.hide);
    App.show(els.menu);
    requestAnimationFrame(draw);
  }
  function leave() {
    clearTimers(); cancelAnimationFrame(raf);
    if (S) S.phase = 'idle';
    active.clear();
  }

  // ---------- 绘图 ----------
  function draw() {
    if (!cv) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    if (!S) return;
    const tEnd = S.phase === 'done' || S.phase === 'closing' ? N - 1 : S.t;
    const pos = S.pro && S.acct.pos;
    const lines = pos ? [{ p: pos.entry, c: '#e8930c', t: '开仓 ' + pos.entry.toFixed(2) }].concat(pos.lev > 1 ? [{ p: pos.liq, c: K.liq, t: '强平 ' + pos.liq.toFixed(2), bold: true }] : []) : null;
    const g = drawDayChart(ctx, w, h, S.day, tEnd, { live: true, mask: S.holdMask, trades: S.trades, holding: S.holding, holdV: pos && pos.dir < 0 ? 2 : 1, news: S.newsSeen, lines });
    S.headX = g.headX; S.headY = g.headY;
  }
  function drawResultChart() {
    if (!S || !S.result) return;
    const { ctx, w, h } = App.fitCanvas(resCv);
    ctx.clearRect(0, 0, w, h);
    drawDayChart(ctx, w, h, S.day, N - 1, { live: false, mask: S.holdMask, trades: S.trades.filter((t) => t.i < N), news: S.day.news, compact: true });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawDayChart(ctx, w, h, d, tEnd, o) {
    const padL = 6, padR = o.compact ? 40 : 46, padT = o.compact ? 8 : 12, padB = 4;
    const volH = Math.max(o.compact ? 22 : 34, h * (o.compact ? 0.16 : 0.15));
    const chartB = h - padB - volH - 6;
    const plotW = w - padL - padR, plotH = chartB - padT;
    const xOf = (i) => padL + (i / (N - 1)) * plotW;
    const iEnd = Math.floor(tEnd);
    let maxDev = 2.5;
    for (let i = 0; i <= iEnd; i++) maxDev = Math.max(maxDev, Math.abs(d.pct[i]));
    let range;
    const cap = d.limitPct ? d.limitPct * 1.06 : 1000; // 20cm 的股票、没有涨跌停的市场，图表范围跟着放大
    if (o.live) {
      const want = Math.min(cap, maxDev * 1.18);
      S.range = S.range ? S.range + (want - S.range) * 0.08 : want;
      range = Math.max(S.range, Math.min(cap, maxDev * 1.04));
    } else range = Math.min(cap, maxDev * 1.15);
    const midY = padT + plotH / 2;
    const yOf = (pc) => midY - (pc / range) * (plotH / 2);
    const yP = (p) => yOf((p / d.prevClose - 1) * 100);

    // 网格与刻度
    ctx.font = '600 10px ' + K.num;
    ctx.textBaseline = 'middle';
    for (const f of [-1, -0.5, 0, 0.5, 1]) {
      const y = yOf(f * range);
      ctx.strokeStyle = f === 0 ? K.zero : K.grid;
      ctx.setLineDash(f === 0 ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = f > 0 ? K.up : f < 0 ? K.down : K.sub;
      ctx.textAlign = 'left';
      ctx.fillText((f > 0 ? '+' : '') + (f * range).toFixed(1) + '%', padL + plotW + 4, y);
    }
    ctx.strokeStyle = K.grid;
    for (const i of [60, 120, 180]) { const x = xOf(i); ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, chartB); ctx.stroke(); }
    // 涨跌停线
    // 涨跌停线：只画落在图表范围里的那条（范围不到 10% 时，另一条会掉进成交量区）
    if (d.limitPct && range > d.limitPct * 0.85) {
      ctx.setLineDash([3, 4]); ctx.font = '10px ' + C.font; ctx.textAlign = 'left';
      const yu = yOf(d.upPct), yd = yOf(d.downPct);
      if (yu >= padT - 1) {
        ctx.strokeStyle = 'rgba(255,77,94,0.5)';
        ctx.beginPath(); ctx.moveTo(padL, yu); ctx.lineTo(padL + plotW, yu); ctx.stroke();
        ctx.fillStyle = K.up; ctx.fillText('涨停 ' + d.limitUp.toFixed(2), padL + 4, yu + 8);
      }
      if (yd <= chartB + 1) {
        ctx.strokeStyle = 'rgba(25,176,122,0.5)';
        ctx.beginPath(); ctx.moveTo(padL, yd); ctx.lineTo(padL + plotW, yd); ctx.stroke();
        ctx.fillStyle = K.down; ctx.fillText('跌停 ' + d.limitDown.toFixed(2), padL + 4, yd - 8);
      }
      ctx.setLineDash([]);
    }
    // 持仓区间
    // 持仓区间：做多红色，做空绿色（mask：1 多，2 空）
    if (o.mask) {
      let a = -1, av = 0;
      const last = o.live ? iEnd : N - 1;
      for (let i = 0; i <= last + 1; i++) {
        const v = i > last ? 0 : o.mask[i] || (o.live && i === last && o.holding ? o.holdV || 1 : 0);
        if (a >= 0 && v !== av) {
          const x1 = i - 1 === last && o.live ? xOf(tEnd) : xOf(i - 1);
          ctx.fillStyle = av === 2 || o.short ? K.holdDn : K.holdUp;
          ctx.fillRect(xOf(a), padT, Math.max(2, x1 - xOf(a)), plotH);
          a = -1;
        }
        if (v && a < 0) { a = i; av = v; }
      }
    }
    // 均价线
    ctx.strokeStyle = K.gold; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i <= iEnd; i++) { const x = xOf(i), y = yP(d.avg[i]); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }

      }
    }

        ctx.beginPath(); ctx.arc(x, y, o.compact ? 6 : 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;

    if (pts.length) {

      headX = hp[0]; headY = hp[1];
      if (o.live) {
        ctx.setLineDash([2, 3]); ctx.strokeStyle = lineCol; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(hp[0], hp[1]); ctx.lineTo(padL + plotW, hp[1]); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
        const pulse = 4 + 2 * Math.sin(performance.now() / 160);
        ctx.fillStyle = lineCol; ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(hp[0], hp[1], pulse + 4, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(hp[0], hp[1], 3.5, 0, Math.PI * 2); ctx.fill();
        // 右侧价签
        ctx.font = '800 10px ' + K.num;
        const tag = headP.toFixed(2);
        const tw = ctx.measureText(tag).width + 8;
        const ty = clamp(hp[1], padT + 7, chartB - 7);

        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(tag, padL + plotW + 5, ty + 0.5);
      }

      case 'newrun': App.hide(els.over); newRun(); renderPick(); break;
      case 'abandon':
        App.confirm('放弃这一局？', '这一局会按现在的成绩结束，不能恢复。', '放弃', () => {
          App.hide(els.menu);
          R.over = { why: 'quit', d: R.day - 1 };
          saveRun(); updateBest(); showOver();
        });
        break;
      case 'go': startDay(1); break;
      case 'next':
        App.hide(els.res);
        if (R.over) showOver(); else if (R.shop) showShop(); else renderPick();
        break;
      case 'timemachine': useTimeMachine(); break;
      case 'shopdone': App.hide(els.shop); R.shop = null; pendingRep = null; saveRun(); renderPick(); break;
      case 'tutok': coachOk(); break;
      case 'tutskip': skipTut(); break;
      default: break;
    }
  }

  // ---------- 进入：选搭档 / 选难度 / 开局 / 接着玩 ----------

      if (R && R.inDay) { handleDone(arg.done, false); return; }
    }
    const go = () => {
      if (arg && arg.variant && VARIANTS[arg.variant]) openVariant(VARIANTS[arg.variant]);
      else showDiff();

    go();

  function newRun() {
    R = {
      v: 3, variant: V.key, seed: Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36),
      day: 1, stage: 1, sd: 1, slen: G.STAGE_DAYS, eq: G.stageStart(1, V.key), pool: 0, sv: 1, perks: {},
      tac: {}, items: [], bag: [], tier: 0, streak: 0, insUsed: false, t0Used: false, hold: null, salt: {}, call: null, shop: null,
      retreats: 0, maxStage: 0, peakNet: G.stageStart(1, V.key), liqs: 0, wins: 0, best: null, hist: [], ov: {}, inDay: null, over: null, pre: null,
      tut: !App.store.get(tutKey(V), false), tutSeen: {}, tutRetry: false,

  const bestRec = (v) => App.store.get(bestKey(v || V), { runs: 0, maxStage: 0, peakNet: E.PRO_START, days: 0 });
  function updateBest() {
    const b = bestRec();
    b.maxStage = Math.max(b.maxStage, R.maxStage); b.peakNet = Math.max(b.peakNet, R.peakNet); b.days = Math.max(b.days, R.day - 1);
    App.store.set(bestKey(V), b);
  }

  function renderMe(pro) {

  // 大盘：简洁 = 天气 + 一句话；专业 = 近 30 日 K 线
  function weatherOf(r5) {
    if (r5 >= 3) return ['☀️', '大晴天', '最近一周大盘涨了 ' + pctAbs(r5) + '，大部分股票都好赚'];
    if (r5 >= 1) return ['🌤️', '晴', '最近一周大盘小涨 ' + pctAbs(r5)];
    if (r5 > -1) return ['⛅', '多云', '最近一周大盘没怎么动，主要看个股'];
    if (r5 > -3) return ['🌧️', '小雨', '最近一周大盘小跌 ' + pctAbs(r5) + '，小心一点'];
    return ['⛈️', '暴雨', '最近一周大盘跌了 ' + pctAbs(r5) + '，大部分股票都难赚'];
  }
  function renderIdx(pro) {
    const m = market(), ih = m.hist(R.day, VIS, 'idx'), last = ih[ih.length - 1];
    const r5 = (last.c / ih[ih.length - 6].c - 1) * 100, r30 = (last.c / ih[0].o - 1) * 100;

        '<span class="small ti-run">近5日 <span class="' + cls(r5) + '">' + fmtPct(r5, 1) + '</span> · 近30日 <span class="' + cls(r30) + '">' + fmtPct(r30, 1) + '</span></span></div>' +

  // 消息：简洁模式把“近 5 日涨跌”翻译成一句提醒（涨多了的利好要小心，跌多了的利空可能见底）
  function renderNews(pro) {

      const row = App.el('<div class="nw ' + kind + '"><span class="tag">' + (kind === 'good' ? (pro ? '利好' : '📈 利好') : (pro ? '利空' : '📉 利空')) + '</span><b></b><span class="nw-t"></span>' + (pro ? '<span class="nw-r num"></span>' : '') + '</div>');
      row.querySelector('b').textContent = m.sectors[x.sec].name;
      row.querySelector('.nw-t').textContent = x.text;

      else if (kind === 'good' && x.run5 > 7) row.insertAdjacentHTML('beforeend', '<span class="nw-hint">⚠️ 这个板块已经连涨好几天了，小心利好出尽</span>');

    day.bad.forEach((x) => addNews(x, 'bad'));

  // 一只股票的一句话介绍（简洁模式）
  function introOf(st, c30, c5) {
    const a = c30 >= 15 ? '最近一个月大涨 ' + pctAbs(c30) : c30 >= 4 ? '最近一个月涨了 ' + pctAbs(c30) : c30 > -4 ? '最近一个月没怎么动' : c30 > -15 ? '最近一个月跌了 ' + pctAbs(c30) : '最近一个月大跌 ' + pctAbs(c30);
    const b = c5 >= 5 ? (c30 >= 4 ? '，这周还在猛涨' : '，这周突然猛涨') : c5 <= -5 ? (c30 <= -4 ? '，这周还在大跌' : '，这周突然大跌') : c5 >= 2 && c30 < 0 ? '，这周开始反弹' : c5 <= -2 && c30 > 0 ? '，这周在回调' : '';
    const t = st.limit > 10 ? '20cm 股：一天最多能涨跌 20%' : st.vol >= 2.4 ? '脾气急，上蹿下跳' : st.vol < 1.7 ? '性子慢，走得稳' : '波动不大不小';
    const be = st.beta >= 1.2 ? ' · 跟着大盘走' : st.beta < 0.85 ? ' · 不太看大盘脸色' : '';
    return [(c30 >= 4 ? '📈 ' : c30 <= -4 ? '📉 ' : '➖ ') + a + b, t + be];
  }
  function renderPicks(pro) {

      if (st && R.perks[st.id]) { const p = G.PERK[R.perks[st.id]]; risk += ' 🎁 股东福利「' + p.name + '」：' + p.desc.replace('收盘时还持有：', '收盘时还做多就') + '。' + (V.mode === 'long' ? '' : '收盘时做空它要付借券费。'); }

    const two = V.t1 && !!st;

    els.go2.style.display = two ? '' : 'none';
    els.go.disabled = !st;
    els.go.textContent = !st ? '先选一只股票' : V.mode === 'long' ? '开盘：买入 ' + st.name : '开盘：' + st.name + (sel.lev > 1 ? ' · ' + sel.lev + '×' : '');
    els.go.classList.toggle('red', !!st && sel.lev >= 5);
  }

  // ---------- 锦囊（盘前用） ----------
  function useBag(id) {
    const i = R.bag.indexOf(id);
    if (i < 0) return;
    const D = R.day, bars = market().at(D).bars;
    if (id === 'dianhua' && sel.sid == null) { App.toast('先选中一只股票，再打内幕电话', '', 1600); return; }
    R.bag.splice(i, 1);
    App.sfx.tap();
    if (id === 'huan') { R.salt[D] = (R.salt[D] || 0) + 1; sel.sid = null; App.toast('换了一批新的候选', 'gold', 1400); }
    if (id === 'dianhua') { R.call = { D, sid: sel.sid, dir: G.dirOfBar(bars[sel.sid]) }; App.toast('内幕电话：' + market().stocks[sel.sid].name + '今天收' + (R.call.dir > 0 ? '涨' : '跌'), R.call.dir > 0 ? 'up' : 'down', 2200); }
    if (id === 'yanqi') { R.slen++; App.toast('延期考核：这一关多给一天', 'gold', 1600); }
    saveRun();
    renderPick();
  }

  // dir：大A 由“看涨 / 看跌”两个按钮决定（看跌 = 融券卖出）
  function startDay(dir) {
    if (!R || R.over || sel.sid == null) return;
    coachAct('go');
    hideCoach();
    if (V.t1) sel.dir = dir < 0 ? -1 : 1;
    const m = market(), D = R.day, st = m.stocks[sel.sid];
    curDay = m.intraday(D, sel.sid);
    // 时光机：开盘前存一份，结算时可以回到这一刻
    const pre = R.bag.indexOf('shiguang') >= 0 ? JSON.stringify(Object.assign({}, R, { pre: null })) : null;
    const lev = V.levLive ? sel.lev : 1;
    R.inDay = { d: D, sid: sel.sid, dir: V.mode === 'fixed' ? sel.dir : 1, lev, eq0: R.eq, snap: null };
    R.pre = pre;
    saveRun();
    CH.bumpToday();
    App.sfx.tap();
    const levs = levsNow(), c = CH.cur();
    const feeK = (has('lingyong') ? 0.3 : 1) * (has('kuangren') ? 2 : 1) * (R.tier >= 1 ? 0.5 : 1);
    App.go('hold', { pro: {
      day: curDay, eq0: R.eq, mode: V.mode, dir: V.mode === 'fixed' ? sel.dir : 1, lev,
      levs: V.levLive ? levs : null, t1: V.t1, nextOpen: V.t1 ? m.at(D + 1).bars[sel.sid].o : null,
      charge: V.t1 ? { max: levs[levs.length - 1] } : null,
      label: V.tag + '第 ' + R.stage + ' 关 · ' + (V.t1 ? (sel.dir > 0 ? '看涨' : '看跌') + ' · ' : '') + st.ind,
      fx: { feeK, stopLoss: has('zhisun'), meltdown: has('rongduan') && V.key === 'hard', t0Pass: has('t0') && V.t1 && !R.t0Used, newsLead: has('yanbao') ? 5 : 0 },
      ava: { html: CH.portrait(c.id, CH.stage(), 'head'), lines: { up: CH.line('up'), down: CH.line('down'), liq: CH.line('liq') } },
      tut: tutOn() ? { day: R.sd, seen: Object.assign({}, R.tutSeen) } : null,
      onTrade: (snap) => { if (R && R.inDay) { R.inDay.snap = snap; saveRun(); } },
      onDone: (res) => App.go('trader', { done: res, variant: V.key }),
    } });
  }

  // 上次中途离开（刷新、关掉页面）：还拿着的仓位按当天收盘价平掉（大A 按次日开盘价）
  function settleInterrupted() {
    const inD = R.inDay, m = market(), bar = m.at(inD.d).bars[inD.sid];
    let eq = inD.eq0, liqs = 0;
    if (inD.snap) {
      liqs = inD.snap.liqs || 0;
      eq = inD.snap.pos ? E.proClose({ eq: 0, pos: inD.snap.pos, fees: 0 }, V.t1 ? m.at(inD.d + 1).bars[inD.sid].o : bar.c) : inD.snap.eq;
    }
    handleDone({ eq0: inD.eq0, eq, ret: (eq / inD.eq0 - 1) * 100, fees: 0, liqs, bankrupt: eq < 1, quit: true, trades: [], holdMask: [], ohlc: [bar.o, bar.h, bar.l, bar.c], overnight: null, closed: [], atClose: 0 }, true);
  }

  // ---------- 收盘结算 ----------
  function handleDone(res, interrupted) {
    const inD = R.inDay, m = market(), D = inD.d, sid = inD.sid, st = m.stocks[sid], day = m.at(D);
    if (!curDay || curDay.seed !== 'pro:' + V.market + ':' + R.seed + ':' + D + ':' + sid) curDay = m.intraday(D, sid);
    R.ov[sid + ':' + D] = res.ohlc.map(round2);
    if (res.tutSeen) R.tutSeen = Object.assign(R.tutSeen || {}, res.tutSeen);
    const eq0 = res.eq0, raw = Math.max(0, res.eq), closed = res.closed || [], rep = { lines: [], ups: [] };
    let eq = raw, bankrupt = !!res.bankrupt || raw < 1;
    const add = (label, v, c) => { if (!v) return; eq += v; rep.lines.push([label, v, c || '']); };
    // 强平保险：每关第一次被强平，退还这一笔一半的亏损（爆仓也算）
    const liqTr = closed.find((t) => t.via === 'liq');
    if (liqTr && has('baoxian') && !R.insUsed && liqTr.pnl < 0) { R.insUsed = true; add('强平保险', Math.round(-liqTr.pnl * 0.5), 'gold'); if (eq >= 1) bankrupt = false; }
    if (!bankrupt) {
      // 战法
      const tc = G.settleTactics(R, V, closed, curDay);
      if (tc.bonus) add('战法加成（' + tc.used.map((id) => G.TAC[id].name + ' Lv' + G.lvOf(R, id)).join('、') + '）', tc.bonus, 'gold');
      rep.ups = tc.ups;
      // 股东福利 / 借券费（大A 只买了几成仓的，按仓位打折）
      const pk = R.perks[sid], at = res.atClose || 0;
      const nHold = (R.hold && R.hold.sid === sid ? R.hold.n : 0) + (pk && at > 0 ? 1 : 0);
      if (pk && at) {
        const mult = (has('youdai') ? 2 : 1) * (nHold >= 3 ? 2 : 1), v = G.settlePerk(pk, mult, at, eq0, raw, res.fees || 0, res.atCloseK);
        add(at > 0 ? '股东福利 · ' + G.PERK[pk].name + (mult > 1 ? ' ×' + mult : '') : '借券费（做空福利股）', v, at > 0 ? 'perk' : '');
      }
      R.hold = pk && at > 0 ? { sid, n: nHold } : null;
      // 北向资金 / 复利雪球
      if (has('beixiang') && day.idx.ret > 0 && closed.some((t) => t.dir > 0)) add('北向资金（大盘涨了）', Math.round(eq0 * 0.01), 'gold');
      R.streak = raw > eq0 * 1.0005 ? R.streak + 1 : 0;
      if (has('xueqiu') && raw > eq0 && R.streak) add('复利雪球（连赚 ' + R.streak + ' 天）', Math.round((raw - eq0) * Math.min(0.5, 0.1 * R.streak)), 'gold');
    } else { R.hold = null; R.streak = 0; }
    if (res.t0Used) R.t0Used = true;
    eq = Math.max(0, Math.round(eq));
    if (eq < 1) bankrupt = true;
    const ret = (eq / eq0 - 1) * 100;
    CH.addLife(eq - eq0);
    R.eq = eq;
    R.liqs += res.liqs;
    if (ret > 0.05) R.wins++;
    if (!R.best || ret > R.best.ret) R.best = { d: D, ret };
    R.hist.push({ d: D, k: R.stage, sid, dir: inD.dir, lev: V.t1 ? (closed[0] && closed[0].size) || 0 : inD.lev, eq0, eq, ret: Math.round(ret * 100) / 100, n: res.trades.length, liqs: res.liqs });
    while (R.hist.length > 300) R.hist.shift();
    R.inDay = null;
    R.call = null;
    // 关末考核 / 爆仓
    const k = R.stage, tgt = T();
    let check = null;
    if (bankrupt || R.sd >= R.slen) check = stageEnd(k, tgt, bankrupt, D);
    else R.sd++;
    R.day = D + 1;
    R.peakNet = Math.max(R.peakNet, net());
    saveRun();
    if (R.over) updateBest();
    headerFor();
    if (!R.over) renderPick(); else scr.classList.add('empty');
    hideCoach();
    showDayResult(res, { eq0, eq, ret, raw, bankrupt }, inD, st, day, check, rep, interrupted);
  }

  // 一关结束：过关 → 超出部分进池子、利息、打新、身份、开店；没过 → 用池子退关，付不起就输光
  // 新手引导关（第 1 关）没过、池子又付不起：免费重打一次
  function stageEnd(k, tgt, bankrupt, D) {
    const ck = { k, tgt, eq: R.eq, bankrupt, pass: !bankrupt && R.eq >= tgt };
    const tutStage = R.tut && k === 1;
    if (ck.pass) {
      ck.surplus = R.eq - tgt;
      R.pool += ck.surplus;
      ck.interest = G.interestOf(R.pool, tgt, has('licai'));
      R.pool += ck.interest;
      const rng = App.makeRng('ipo:' + R.seed + ':' + D);
      if (rng.chance(G.ipoChance(tgt + R.pool))) { ck.ipo = G.ipoPrize(tgt); R.pool += ck.ipo; }
      const t = Math.max(R.tier, G.tierFor(tgt + R.pool, V.key));
      if (t > R.tier) { ck.tierUp = t; R.tier = t; }
      R.maxStage = Math.max(R.maxStage, k);
      R.shop = G.rollShop(R, V, tgt, App.makeRng('shop:' + R.seed + ':' + D + ':' + R.sv));
      if (tutStage) { R.tut = false; ck.tutDone = true; App.store.set(tutKey(V), true); }
      enterStage(k + 1, tgt);
      return ck;
    }
    const j = G.retreatTo(R.pool, k, V.key);
    if (!j) {
      if (tutStage && !R.tutRetry) {
        R.tutRetry = true; ck.retry = true;
        enterStage(1, G.stageStart(1, V.key));
        return ck;
      }
      if (tutStage) { R.tut = false; App.store.set(tutKey(V), true); }
      R.over = { why: bankrupt ? 'bankrupt' : 'target', d: D, k, tgt, eq: R.eq, pool: R.pool };
      ck.over = true;
      return ck;
    }
    const cost = G.stageStart(j, V.key);
    R.pool -= cost; R.retreats++;
    ck.retreat = { to: j, cost, left: R.pool };
    enterStage(j, cost);
    return ck;
  }
  function enterStage(k, startEq) {
    R.stage = k; R.sd = 1; R.slen = G.STAGE_DAYS; R.eq = startEq; R.sv++;
    R.perks = G.rollPerks(R.seed, R.sv, market().stocks.length);
    R.insUsed = false; R.t0Used = false; R.hold = null;
  }

  function dayTitle(res, r) {
    if (r.bankrupt) return '穿仓破产';
    if (res.liqs) return '被强制平仓';
    const x = r.ret;
    if (x >= 20) return '一天翻身';
    if (x >= 8) return '大赚一笔';
    if (x >= 2) return '稳稳赚钱';
    if (x > 0.05) return '小赚一点';
    if (x > -0.05) return '空仓观望';
    if (x > -5) return '小亏离场';
    if (x > -15) return '亏得肉疼';
    return '关灯吃面';
  }

  function showDayResult(res, r, inD, st, day, check, rep, interrupted) {
    const q = (s) => els.res.querySelector(s), bar = day.bars[inD.sid], c = CH.cur(), tr0 = (res.closed || [])[0];
    q('.rs-ava').innerHTML = CH.portrait(c.id, CH.stage(), 'head');
    const ev = check ? (check.pass ? 'pass' : 'fail') : res.liqs || r.bankrupt ? 'liq' : r.ret > 0.05 ? 'win' : 'lose';
    q('.rs-say').innerHTML = '<b>' + c.name + '：</b>' + CH.line(ev);
    q('.rs-title').textContent = '第 ' + inD.d + ' 天 · ' + dayTitle(res, r);
    const ret = q('.rs-ret'); ret.textContent = fmtPct(r.ret); ret.className = 'res-ret num rs-ret ' + cls(r.ret);
    q('.rs-eq').textContent = fmtMoney(r.eq0) + ' → ' + (res.eq < 0 ? '穿仓 ' : '') + fmtMoney(r.eq) + (interrupted ? (V.t1 ? '（上次中途离开，按次日开盘价结算）' : '（上次中途离开，按收盘价结算）') : '');
    const nTr = res.trades.filter((t) => t.via !== 'nextOpen').length;
    const opName = V.t1 ? (tr0 && tr0.size ? App.Hold.orderName(tr0.size, tr0.dir) : interrupted ? '中途离开' : '没出手') : V.mode === 'long' ? '只做多 · ' + nTr + ' 笔' : '多空 · ' + nTr + ' 笔';
    const facts = [
      ['你的操作', opName],
      [st.name, '<span class="' + cls(bar.ret) + '">' + fmtPct(bar.ret) + '</span>' + (bar.c >= bar.lu ? ' 涨停' : bar.c <= bar.ld ? ' 跌停' : '')],
      res.overnight != null ? ['次日开盘', '<span class="' + cls(res.overnight) + '">' + fmtPct(res.overnight) + '</span>'] : ['大盘', '<span class="' + cls(day.idx.ret) + '">' + fmtPct(day.idx.ret) + '</span>'],
      res.liqs ? ['强制平仓', res.liqs + ' 次'] : ['手续费', fmtMoney(res.fees)],
    ];
    q('.rs-facts').innerHTML = facts.map((f) => '<div>' + f[0] + '<b>' + f[1] + '</b></div>').join('');
    // 结算明细：盘中赚亏 + 战法 / 福利 / 道具
    const sl = rep.lines.length ? ['<div class="st-row"><span>盘中赚亏</span><b class="num ' + cls(r.raw - r.eq0) + '">' + (r.raw >= r.eq0 ? '+' : '−') + fmtMoney(Math.abs(r.raw - r.eq0)) + '</b></div>']
      .concat(rep.lines.map((x) => '<div class="st-row ' + x[2] + '"><span>' + x[0] + '</span><b class="num ' + cls(x[1]) + '">' + (x[1] >= 0 ? '+' : '−') + fmtMoney(Math.abs(x[1])) + '</b></div>')) : [];
    rep.ups.forEach((id) => sl.push('<div class="st-up">🎉 战法升级：<b>' + G.TAC[id].name + ' Lv' + G.lvOf(R, id) + '</b>，这类交易以后多赚 ' + Math.round(G.lvOf(R, id) * G.TAC_STEP * 100) + '%</div>'));
    q('.rs-settle').innerHTML = sl.length ? '<div class="st-box">' + sl.join('') + '</div>' : '';
    q('.rs-lesson').innerHTML = '💡 ' + lessonFor(res, r, inD, st, day);
    q('.rs-week').innerHTML = stageBox(check);
    const tm = R.pre && R.bag.indexOf('shiguang') >= 0;
    q('.rs-tm').style.display = tm ? '' : 'none';
    q('.rs-next').textContent = R.over ? '查看结果' : check && check.pass ? '去商店' : check && check.retry ? '重打第 1 关' : check && check.retreat ? '退回第 ' + check.retreat.to + ' 关' : '下一天';
    App.show(els.res);
    els.res.querySelector('.sheet').scrollTop = 0;
    if (r.ret >= 2) App.sfx.good(); else if (r.ret <= -2) App.sfx.bad();
    if (check && check.pass) App.confetti(scr);
    requestAnimationFrame(() => App.Hold.drawDay(q('.rs-chart'), curDay, { mask: res.holdMask.length ? res.holdMask : null, trades: res.trades.filter((t) => t.via !== 'nextOpen') }));
    // 新手引导：讲讲“5 天一关”、过关后的存钱罐、免费重打
    if (tutOn() || (check && (check.tutDone || check.retry))) {
      const steps = [];
      if (check && check.pass) steps.push({ id: 'pass1', el: '.rs-week', text: '过关啦！🎉 比目标多出来的钱进了存钱罐，等会儿可以去商店买道具。' });
      else if (check && check.retry) steps.push({ id: 'retry1', el: '.rs-week', text: '没过也别灰心！新手关可以免费重打一次，战法等级都留着。' });
      else if (!check) steps.push({ id: 'res1', el: '.rs-week', text: '每关 5 天：第 5 天收盘时，资金达到目标就过关。' });
      setTimeout(() => { if (els.res.classList.contains('show')) coach(steps); }, 450);
    }
  }
  function stageBox(ck) {
    if (!ck) {
      const tgt = T(), gap = tgt - R.eq, left = R.slen - R.sd + 1;
      return '<div class="wk-box">第 ' + R.stage + ' 关还剩 <b>' + left + '</b> 天 · 目标 ' + fmtMoney(tgt) + '<br>' +
        (gap > 0 ? '还差 <b class="num">' + fmtMoney(gap) + '</b>，平均每天要赚 ' + fmtPct((Math.pow(tgt / Math.max(1, R.eq), 1 / left) - 1) * 100, 1) : '<span class="up">已经达标了，多出来的钱过关后进存钱罐</span>') + '</div>';
    }
    if (ck.pass) {
      const li = ['超出目标 <b class="num">' + fmtMoney(ck.surplus) + '</b> 进存钱罐'];
      if (ck.interest) li.push('存钱罐利息 <b class="num">+' + fmtMoney(ck.interest) + '</b>' + (has('licai') ? '（理财经理翻倍）' : ''));
      if (ck.ipo) li.push('🎉 打新中签 <b class="num">+' + fmtMoney(ck.ipo) + '</b>');
      if (ck.tierUp) li.push('🎉 身份升级：<b>' + tierName(ck.tierUp) + '</b>（' + G.TIERS[ck.tierUp].perk + '）');
      if (ck.tutDone) li.push('🎓 新手引导完成！');
      li.push('存钱罐现在 <b class="num">' + fmtMoney(R.pool) + '</b>；第 ' + R.stage + ' 关从 ' + fmtMoney(R.eq) + ' 起步，目标 ' + fmtMoney(T()));
      return '<div class="wk-box pass"><div class="big">✅ 第 ' + ck.k + ' 关通过</div>' + li.join('<br>') + '</div>';
    }
    const why = ck.bankrupt ? '爆仓了' : '资金 ' + fmtMoney(ck.eq) + '，目标 ' + fmtMoney(ck.tgt) + '，差 ' + fmtMoney(ck.tgt - ck.eq);
    if (ck.retry) return '<div class="wk-box fail"><div class="big">❌ 第 1 关没过</div>' + why + '。<br>🐣 新手保护：免费从第 1 关重新开始（只有这一次）。战法等级都还在。</div>';
    if (ck.retreat) return '<div class="wk-box fail"><div class="big">❌ 第 ' + ck.k + ' 关没过</div>' + why + '，这一关的钱没了。<br>存钱罐付 <b class="num">' + fmtMoney(ck.retreat.cost) + '</b> 退回<b>第 ' + ck.retreat.to + ' 关</b>，还剩 <b class="num">' + fmtMoney(ck.retreat.left) + '</b>。道具和战法都还在。</div>';
    return '<div class="wk-box fail"><div class="big">' + (ck.bankrupt ? '资产归零' : '❌ 第 ' + ck.k + ' 关没过') + '</div>' + why + '。<br>存钱罐只有 <b class="num">' + fmtMoney(R.pool) + '</b>，付不起第 1 关的 ' + fmtMoney(G.stageStart(1, V.key)) + '，彻底输光了。</div>';
  }
  function useTimeMachine() {
    if (!R || !R.pre) return;
    const back = JSON.parse(R.pre), i = back.bag.indexOf('shiguang');
    if (i >= 0) back.bag.splice(i, 1);
    back.pre = null; back.inDay = null;
    R = back; saveRun();
    App.hide(els.res);
    App.toast('⏳ 时光机：回到今天开盘前，行情不变', 'gold', 2000);
    headerFor(); renderPick();
  }

  // 一句复盘：把当天最值得学的那条规律说出来（按玩家实际赚亏判断，不按股票收盘涨跌）
  function lessonFor(res, r, inD, st, day) {
    const m = market(), bar = day.bars[inD.sid], sec = m.sectors[st.sec].name, won = r.ret > 0.05;
    const long = V.mode === 'fixed' ? inD.dir > 0 : null, tr0 = (res.closed || [])[0];
    const levUsed = V.t1 ? Math.max(1, (tr0 && tr0.size) || 1) : inD.lev;
    const fav = day.fav.find((x) => x.sec === st.sec), bad = day.bad.find((x) => x.sec === st.sec);
    const move = st.name + '收 ' + fmtPct(bar.ret, 1);
    if (r.bankrupt) return V.market === 'us' ? '没有跌停板托底的市场里，高杠杆遇上暴跌，强平都来不及。' : '高杠杆加上封死的涨跌停，强平单都卖不出去，亏损就会超过本金。';
    if (res.liqs) return '杠杆越高，强平线越近：' + (levUsed > 1 ? levUsed + ' 倍时' : '加了杠杆后') + '股价反向 ' + liqMove(Math.max(2, levUsed)) + '% 就会亏掉一半保证金。看错时早点松手，比等强平便宜得多。';
    if (bar.flash) return (bar.flash < 0 ? '盘中闪崩' : '盘中闪拉') + '：突发消息出来后只有一两秒，' + (won ? '你跑得够快。' : '反应慢一点就跑不掉了。');
    if (V.t1 && res.overnight != null) {
      const g = res.overnight, dir = inD.dir;
      if (bar.c >= bar.lu - 1e-9 && dir > 0) return '收盘封涨停的股票，第二天常常高开：次日开盘 ' + fmtPct(g, 1) + '。这就是“打板”。';
      if (bar.c <= bar.ld + 1e-9 && dir > 0) return '买在跌停当天，T+1 卖不掉，第二天开盘又是 ' + fmtPct(g, 1) + '。大A最怕的就是这个。';
      if (Math.abs(g) >= 2) return 'T+1 的风险在隔夜：今天收盘之后发生的事，要到明天开盘才能反映，次日开盘 ' + fmtPct(g, 1) + '。';
      if (tr0 && tr0.size && tr0.size < 1 && !won) return '只买了' + App.Hold.sizeName(tr0.size, tr0.dir) + '，亏也只亏这一部分。没把握的时候少买点，是老股民的保命习惯。';
    }
    if (bar.earn) return '财报日：' + st.name + '收 ' + fmtPct(bar.ret, 1) + '。财报日波动大，赌对了一天翻倍，赌错了一天腰斩。';
    if (fav && fav.fade) return '利好出尽：' + sec + '板块近 5 日已经涨了 ' + fmtPct(fav.run5, 1) + '，再出利好，资金反而借机出货，' + move + '。';
    if (bad && bad.bounce) return '利空出尽：' + sec + '板块近 5 日已经跌了 ' + fmtPct(bad.run5, 1) + '，坏消息反而成了反弹的起点，' + move + '。';
    if (fav) {
      if (long === false) return sec + '板块有利好，' + move + '。' + (won ? '做空还赚了，是抓住了冲高回落，这种机会不常有。' : '和利好对着干，风险更大。');
      return sec + '板块有利好，' + move + '。' + (won ? '顺着消息做多，胜率更高。' : '利好常常在开盘就高开反映了，追高要小心。');
    }
    if (bad) {
      if (long === true) return sec + '板块有利空，' + move + '。' + (won ? '利空当天做多还赚了，是抓到了反弹，别当成常态。' : '利空当天做多，是在接飞刀。');
      return sec + '板块有利空，' + move + '。' + (won ? '利空当天做空，顺势而为。' : '坏消息常常一开盘就跌出来了，低开后再追空，容易被反弹打脸。');
    }
    if (!res.trades.length) return '空仓也是一种操作：没有把握的时候，不亏就是赚。';
    if (st.beta >= 1.2) return st.name + '跟大盘跟得很紧：今天大盘 ' + fmtPct(day.idx.ret, 1) + '，它收 ' + fmtPct(bar.ret, 1) + '。先看准大盘方向，再选这种股票。';
    return '今天大盘 ' + fmtPct(day.idx.ret, 1) + '，' + move + '。' + (won ? '赚到了。盘中拿得住、跑得快，比选对方向还重要。' : '亏损时越早认错，亏得越少。');
  }

  // ---------- 商店（每关过关后） ----------
  function showShop() {
    if (!R || !R.shop) { renderPick(); return; }
    const sh = R.shop, c = CH.cur(), st = CH.stage(), q = (s) => els.shop.querySelector(s);
    q('.sh-ava').innerHTML = CH.portrait(c.id, st, 'head');
    q('.sh-title').textContent = '第 ' + (R.stage - 1) + ' 关过关 · 商店';
    q('.sh-pool').innerHTML = '🐷 存钱罐 <b class="num">' + fmtMoney(R.pool) + '</b>';
    if (!q('.sh-say')._t || q('.sh-say')._t !== R.sv) { q('.sh-say')._t = R.sv; q('.sh-say').textContent = c.name + '：' + CH.line('shop'); }
    const slotsFull = R.items.length >= G.itemSlots(R), bagFull = R.bag.length >= G.BAG_SLOTS;
    const card = (key, it, price, sold, tag, note) => {
      const can = !sold && R.pool >= price && !note;
      return '<div class="sh-it r' + (it.r || 1) + (sold ? ' sold' : '') + '"><div class="sh-h"><b>' + it.name + '</b><span class="chip">' + tag + '</span></div><div class="sh-d">' + it.desc + '</div>' +
        '<button class="btn small' + (can ? '' : ' ghost') + '" data-buy="' + key + '"' + (can ? '' : ' disabled') + '>' + (sold ? '已买' : note || (R.pool >= price ? '买 ' + fmtMoney(price) : '钱不够 ' + fmtMoney(price))) + '</button></div>';
    };
    let html = sh.items.map((x, i) => { const it = G.itemInfo(x.id); return card('i' + i, it, x.price, x.sold, it.xd ? '心得' : G.RARE[it.r] + (slotsFull && !it.xd && !x.sold ? ' · 栏满要换' : ''), ''); }).join('');
    const b = G.BAGI[sh.bag.id];
    html += card('b', { name: '🎒 ' + b.name, desc: b.desc, r: b.rare ? 2 : 1 }, sh.bag.price, sh.bag.sold, '锦囊', !sh.bag.sold && bagFull ? '锦囊栏满了' : '');
    const treatName = ['奶茶', '咖啡和甜点', '珠宝'][st - 1];
    html += '<div class="sh-it treat"><div class="sh-h"><b>给' + c.name + '买' + treatName + '</b><span class="chip">请客</span></div><div class="sh-d">不影响数值，只会让 TA 开心一下（不买也没惩罚，只会被念叨）。</div>' +
      '<button class="btn small' + (!sh.treated && R.pool >= sh.treat ? '' : ' ghost') + '" data-buy="t"' + (!sh.treated && R.pool >= sh.treat ? '' : ' disabled') + '>' + (sh.treated ? '已请客' : '请客 ' + fmtMoney(sh.treat)) + '</button></div>';
    q('.sh-list').innerHTML = html;
    q('.sh-swap').innerHTML = pendingRep != null ? '<div class="sh-swapbox">道具栏满了（' + R.items.length + '/' + G.itemSlots(R) + '），换掉哪一件？<div>' +
      R.items.map((id) => '<button class="itm r' + G.itemInfo(id).r + '" data-swap="' + id + '">换掉 ' + G.itemInfo(id).name + '</button>').join('') + '<button class="itm" data-swap="">不买了</button></div></div>' : '';
    q('.sh-owned').innerHTML = '已有道具（' + R.items.length + '/' + G.itemSlots(R) + '）：' + (R.items.map((id) => G.itemInfo(id).name).join('、') || '无') +
      ' · 锦囊（' + R.bag.length + '/' + G.BAG_SLOTS + '）：' + (R.bag.map((id) => G.BAGI[id].name).join('、') || '无');
    q('.sh-go').textContent = '继续，开始第 ' + R.stage + ' 关';
    const first = !els.shop.classList.contains('show');
    App.show(els.shop);
    if (first && !App.store.get('tut_shop', false)) {
      setTimeout(() => {
        if (els.shop.classList.contains('show')) coach([{ id: 'shop', el: '.sh-list', text: '这是商店：用存钱罐的钱买道具。道具一直有效，锦囊用一次就没了。给我买点好吃的，我也会很开心哦～', done: () => App.store.set('tut_shop', true) }]);
      }, 450);
    }
  }
  function buy(key) {
    const sh = R.shop;
    if (!sh) return;
    if (key === 't') {
      if (sh.treated || R.pool < sh.treat) return;
      R.pool -= sh.treat; sh.treated = true;
      App.sfx.good();
      els.shop.querySelector('.sh-say').textContent = CH.cur().name + '：' + CH.line('treat');
    } else if (key === 'b') {
      if (sh.bag.sold || R.pool < sh.bag.price || R.bag.length >= G.BAG_SLOTS) return;
      R.pool -= sh.bag.price; sh.bag.sold = true; R.bag.push(sh.bag.id);
      App.sfx.buy();
    } else {
      const i = +key.slice(1), x = sh.items[i], it = G.itemInfo(x.id);
      if (!x || x.sold || R.pool < x.price) return;
      if (it.xd) {
        const t = R.tac[it.xd] || (R.tac[it.xd] = { xp: 0, lv: 0 });
        if (t.lv < G.TAC_MAX) t.lv++;
        R.pool -= x.price; x.sold = true;
        App.toast('🎉 ' + G.TAC[it.xd].name + '升到 Lv' + t.lv, 'gold', 1800);
        App.sfx.good();
      } else if (R.items.length >= G.itemSlots(R)) { pendingRep = i; }
      else { R.pool -= x.price; x.sold = true; R.items.push(x.id); App.sfx.buy(); }
    }
    saveRun();
    showShop();
  }
  function swapItem(id) {
    const i = pendingRep;
    pendingRep = null;
    if (id && i != null) {
      const x = R.shop.items[i];
      if (x && !x.sold && R.pool >= x.price) { R.items.splice(R.items.indexOf(id), 1); R.pool -= x.price; x.sold = true; R.items.push(x.id); App.sfx.buy(); }
    }
    saveRun();
    showShop();
  }

  // ---------- 出局 ----------
  function showOver() {
    const o = R.over, q = (s) => els.over.querySelector(s), c = CH.cur();
    const days = R.day - 1;
    q('.ov-ava').innerHTML = CH.portrait(c.id, CH.stage(), 'head');
    q('.ov-title').textContent = V.name + ' · ' + (o.why === 'quit' ? '主动离场' : '彻底输光');
    q('.ov-big').textContent = R.maxStage ? '打到第 ' + (R.maxStage + 1) + ' 关' : '没过第 1 关';
    q('.ov-sub').textContent = o.why === 'quit' ? '最后身价 ' + fmtMoney(net()) + '。' : (o.why === 'bankrupt' ? '第 ' + o.d + ' 天爆仓' : '第 ' + o.k + ' 关没过') + '，存钱罐只剩 ' + fmtMoney(o.pool) + '，付不起第 1 关的启动资金。' + c.name + '：' + CH.line('fail');
    const winRate = days ? Math.round((R.wins / days) * 100) : 0;
    const stats = [
      [R.maxStage + ' 关', '通过'], [days + ' 天', '坚持'], [fmtMoney(R.peakNet), '最高身价'],
      [R.retreats + ' 次', '退关'], [R.liqs + ' 次', '被强平'], [winRate + '%', '赚钱的天数'],
    ];
    q('.ov-stats').innerHTML = stats.map((s) => '<div><b class="num">' + s[0] + '</b><span>' + s[1] + '</span></div>').join('');
    const b = bestRec();
    q('.ov-best').innerHTML = V.name + ' 历史最佳：通过 <b>' + b.maxStage + '</b> 关 · 最高身价 <b>' + fmtMoney(b.peakNet) + '</b> · 一共玩了 ' + b.runs + ' 局';
    App.show(els.over);
    App.sfx.bad();
  }

  // ---------- 新手引导（第 1 关）：搭档指着界面一步步讲，每一步只讲一次 ----------
  // step = { id, el（选择器或元素）, text, wait（'pick' 选股 / 'go' 开盘：等玩家照做；不写就点“知道了”）, done（讲完的回调） }
  let coachQ = [], coachCur = null;
  const tutOn = () => !!R && !!R.tut && R.stage === 1;
  const coachEl = (s) => (typeof s.el === 'string' ? scr.querySelector(s.el) : s.el);
  function tutPick() {
    if (!tutOn() || App.current !== 'trader' || allOverlays().some((o) => o.classList.contains('show'))) return;
    const d = R.sd, steps = [];
    if (d === 1) {
      steps.push({ id: 'idx', el: '.tr-idx', text: isPro() ? '这是大盘最近 30 天的 K 线。大盘涨的时候，大部分股票都好涨。' : '先看大盘天气：晴天的时候大部分股票都好涨，下雨天就难赚。' });
      steps.push({ id: 'news', el: '.tr-news', text: '这是今天开盘前的消息：有利好的板块容易涨，有利空的容易跌。' });
      steps.push({ id: 'pick', el: '.tr-picks', text: '从这三只里挑一只今天要炒的，点一下选中它。', wait: 'pick' });
      steps.push({ id: 'go', el: V.t1 ? '.tr-go2' : '.tr-go', wait: 'go',
        text: V.t1 ? '大A要先定方向：觉得它今天会涨就点「看涨」，觉得会跌就点「看跌」（融券卖出）。' : V.mode === 'long' ? '选好了就点「开盘」！' : '点「开盘」进场。进去以后：右边按住做多，左边按住做空。' });
    }
    if (d === 2) steps.push({ id: 'view', el: '.tr-view', text: '想看 K 线和详细数据，可以切到「专业」；看不懂就留在「简洁」。' });
    const perkCard = Array.prototype.find.call(els.picks.querySelectorAll('.pick'), (c) => R.perks[+c.getAttribute('data-sid')]);
    if (perkCard && d >= 2) steps.push({ id: 'perk', el: perkCard, text: '带 🎁 的股票有股东福利：收盘时还拿着它（做多），就能领一份福利。' });
    if (d >= R.slen) steps.push({ id: 'exam', el: '.tr-acct', text: '今天是这一关的最后一天，收盘就考核！资金达到目标就过关。' });
    coach(steps);
  }
  function coach(steps) {
    coachQ = steps.filter((s) => !(R.tutSeen || {})[s.id]);
    nextCoach();
  }
  function nextCoach() {
    coachCur = coachQ.shift() || null;
    if (!coachCur) { hideCoach(); return; }
    const el = coachEl(coachCur);
    if (!el || !el.offsetParent || (coachCur.wait === 'pick' && sel.sid != null)) { markSeen(coachCur); nextCoach(); return; }
    const box = el.closest('.tr-scroll, .sheet');
    if (box) {
      const br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (r.top < br.top + 10) box.scrollTop -= br.top + 10 - r.top;
      else if (r.bottom > br.bottom - 10) box.scrollTop += Math.min(r.bottom - br.bottom + 10, r.top - br.top - 10);
    }
    els.ccAva.innerHTML = CH.portrait(CH.cur().id, CH.stage(), 'head');
    els.ccText.textContent = coachCur.text;
    els.ccOk.style.display = coachCur.wait ? 'none' : '';
    els.coach.classList.toggle('wait', !!coachCur.wait);
    els.coach.classList.add('show');
    placeCoach();
  }
  // 聚光框跟着目标走；说明卡放在目标上方或下方空间大的一边
  function placeCoach() {
    if (!coachCur || !els.coach.classList.contains('show')) return;
    const el = coachEl(coachCur);
    if (!el) return;
    const r = el.getBoundingClientRect(), sr = scr.getBoundingClientRect(), p = 6;
    Object.assign(els.spot.style, { left: r.left - sr.left - p + 'px', top: r.top - sr.top - p + 'px', width: r.width + p * 2 + 'px', height: r.height + p * 2 + 'px' });
    const above = r.top - sr.top, below = sr.bottom - r.bottom, ch = els.card.offsetHeight || 120;
    if (below >= ch + 24 || below >= above) { els.card.style.top = Math.max(8, Math.min(sr.height - ch - 10, r.bottom - sr.top + 14)) + 'px'; els.card.style.bottom = 'auto'; }
    else { els.card.style.top = 'auto'; els.card.style.bottom = Math.max(8, Math.min(sr.height - ch - 10, sr.bottom - r.top + 14)) + 'px'; }
  }
  function markSeen(s) { if (!R) return; (R.tutSeen || (R.tutSeen = {}))[s.id] = 1; if (s.done) s.done(); saveRun(); }
  function coachOk() { if (!coachCur) return; App.sfx.tap(); markSeen(coachCur); nextCoach(); }
  function coachAct(kind) { if (coachCur && coachCur.wait === kind) { markSeen(coachCur); nextCoach(); } }
  function hideCoach() { coachQ = []; coachCur = null; if (els.coach) els.coach.classList.remove('show'); }
  function skipTut() {
    if (coachCur && coachCur.id === 'shop') { App.store.set('tut_shop', true); hideCoach(); return; }
    hideCoach();
    if (R) { R.tut = false; saveRun(); }
    App.store.set(tutKey(V), true); App.store.set('tut_shop', true);
    App.toast('已跳过新手引导，玩法速查在右上角菜单里', '', 2200);
    if (R && !R.over) renderAcct();
  }

  // ---------- K 线小图（专业模式） ----------
  function drawCandles(cv, all, o) {
    const K = App.Hold.CHART, { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    const bars = all.slice(-o.show), off = all.length - bars.length;
    if (!bars.length) return;
    const padL = 2, padR = o.axis ? 44 : 2, padT = 4, padB = 4;
    let lo = Infinity, hi = -Infinity;
    for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
    const pad = (hi - lo) * 0.08 || hi * 0.01;
    lo -= pad; hi += pad;
    const plotW = w - padL - padR, plotH = h - padT - padB, n = bars.length, slot = plotW / n;
    const xOf = (i) => padL + (i + 0.5) * slot, yOf = (p) => padT + ((hi - p) / (hi - lo)) * plotH;
    if (o.axis) {
      ctx.font = '600 10px ' + K.num; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      for (const f of [0.15, 0.5, 0.85]) {
        const p = hi - (hi - lo) * f, y = yOf(p);
        ctx.strokeStyle = K.grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
        ctx.fillStyle = K.sub; ctx.fillText(p.toFixed(0), padL + plotW + 4, y);
      }
    }
    for (let i = 0; i < n; i++) {
      const b = bars[i], up = b.c >= b.o, col = up ? K.up : K.down, x = xOf(i), bw = Math.max(1.2, slot * 0.62);
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, yOf(b.h)); ctx.lineTo(x, yOf(b.l)); ctx.stroke();
      const y1 = yOf(Math.max(b.o, b.c)), y2 = yOf(Math.min(b.o, b.c)), hh = Math.max(1, y2 - y1);
      if (up && bw >= 4) { ctx.fillStyle = '#fff'; ctx.fillRect(x - bw / 2, y1, bw, hh); ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, Math.max(0.5, hh - 1)); }
      else ctx.fillRect(x - bw / 2, y1, bw, hh);
    }
    if (o.ma) {
      o.ma.forEach((k, j) => {
        ctx.strokeStyle = j === 0 ? K.gold : '#4f8cff';
        ctx.lineWidth = 1.4; ctx.beginPath();
        let started = false;
        for (let i = 0; i < n; i++) {
          const g = i + off;
          if (g < k - 1) continue;
          let s = 0;
          for (let z = g - k + 1; z <= g; z++) s += all[z].c;
          const x = xOf(i), y = yOf(s / k);
          if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
        }
        ctx.stroke(); ctx.lineWidth = 1;
      });
    }
  }

  // 模式菜单、首页用的一行进度
  function summaryOf(v) {
    const r = loadRun(v), b = App.store.get(bestKey(v), null);
    if (r && !r.over) return '第 ' + r.stage + ' 关 · 第 ' + r.day + ' 天 · 身价 ' + fmtMoney(r.eq + r.pool);
    if (b && b.runs) return '最佳：通过 ' + b.maxStage + ' 关 · 最高身价 ' + fmtMoney(b.peakNet);
    return '10 万起步，看你能打到第几关';
  }
  function summary(group) {
    if (group === 'biga') return summaryOf(VARIANTS.biga);
    const parts = ['easy', 'normal', 'hard'].map((k) => {
      const v = VARIANTS[k], r = loadRun(v), b = App.store.get(bestKey(v), null);
      if (r && !r.over) return v.tag + '第 ' + r.stage + ' 关';
      if (b && b.runs) return v.tag + '最佳 ' + b.maxStage + ' 关';
      return null;
    }).filter(Boolean);
    return parts.length ? parts.join(' · ') : '三档难度，10 万起步';
  }
  function activeLine() {
    const k = App.store.get('pro3_last', null), v = k && VARIANTS[k], r = v && loadRun(v);
    return r && !r.over ? (v.group === 'pro' ? '操盘手' + v.tag : '大A') + '第 ' + r.stage + ' 关' : '';
  }

  App.Trader = {
    init, summary, activeLine, VARIANTS,
    _state: () => ({ V, R, sel }),
    _select: (sid, dir, lev) => { sel.sid = sid; if (dir) sel.dir = dir; if (lev) sel.lev = lev; syncCtrl(); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ④ 画出明天：看一段真实历史走势，用手指画出未来 20 天，揭晓后打分 */
(function (root) {
  'use strict';
  const App = root.App, E = App.Engine, U = App.U, C = App.C;
  const { fmtPct, cls, clamp, lerp } = U;
  const F = 20;
  let scr, cv, els = {}, S = null, raf = 0;

  const episodes = () => (App.EPISODES && App.EPISODES.length ? App.EPISODES : (App._synthEps || (App._synthEps = E.synthEpisodes(12))));
  const isReal = () => !!(App.EPISODES && App.EPISODES.length);

  function dailyEpisode() {
    const eps = episodes();
    const order = App.makeRng('draw-order-v1').shuffle(eps.map((_, i) => i));
    return eps[order[U.dayNumber() % eps.length]];
  }
  function practiceEpisode() {
    const eps = episodes(), daily = dailyEpisode().id;
    let seen = App.store.get('draw_seen', []);
    let pool = eps.filter((e) => seen.indexOf(e.id) < 0 && e.id !== daily);
    if (!pool.length) { seen = []; pool = eps.filter((e) => e.id !== daily); if (!pool.length) pool = eps.slice(); }
    const ep = pool[Math.floor(Math.random() * pool.length)];
    seen.push(ep.id);
    App.store.set('draw_seen', seen);
    return ep;
  }
  const loadStats = () => App.store.get('draw_stats', { played: 0, right: 0, sum: 0, streakR: 0, bestR: 0, streakW: 0, bestW: 0 });

  function init() {
    scr = App.el(`
<section class="screen" id="scr-draw">
  <div class="topbar">
    <button class="icon-btn" data-act="back" aria-label="返回">‹</button>
    <div class="tb-title"><div class="t1">画出明天</div><div class="t2 d-sub">每日一题</div></div>
    <div class="tb-badge d-badge"></div>
  </div>

      title: q('.p-title'), stock: q('.p-stock'), goal: q('.uk-goal'), cost: q('.p-cost'), price: q('.p-price'), day: q('.p-day'), days: q('.p-days'),
      fill: q('.p-fill'), prog: q('.p-prog'), need: q('.p-need'), shares: q('.p-shares'), cash: q('.p-cash'), trades: q('.p-trades'),
      coach: q('.uk-coach'), ccStep: q('.cc-step'), ccTitle: q('.cc-title'), ccText: q('.cc-text'), ccNext: q('.cc-next'), ccSkip: q('.cc-skip'),
      dragTip: q('.uk-drag-tip'),
      sellChip: q('.ord-chip.sell'), buyChip: q('.ord-chip.buy'), sell: q('.p-sell'), buy: q('.p-buy'), qty: q('.p-qty'),
      qminus: q('.q-minus'), qplus: q('.q-plus'), auto: q('.p-auto'), next: q('.p-next'), log: q('.p-log'),
      intro: q('.k-intro'), introBody: q('.k-intro-body'), end: q('.k-end'), endBody: q('.k-end-body'), menu: q('.k-menu'),
    });
    scr.addEventListener('click', onClick);
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    root.addEventListener('resize', () => { if (App.current === 'unstuck' && S) draw(); });
    App.register('unstuck', { enter, leave });
  }

  function onClick(e) {
    const b = e.target.closest('[data-act],[data-lv]');
    if (!b || b.disabled) return;
    const lvId = b.getAttribute('data-lv');
    if (lvId) { const lv = App.LEVELS.find((x) => String(x.id) === lvId); if (lv) openLevel(lv); return; }
    const act = b.getAttribute('data-act');
    switch (act) {
      case 'home': App.go('home'); break;
      case 'endless': openLevel(endlessCfg()); break;
      case 'go': App.hide(els.intro); App.sfx.tap(); break;
      case 'go-tut': App.hide(els.intro); App.sfx.tap(); tutStart(); break;
      case 'go-notut': App.hide(els.intro); App.store.set('uk_tut_done', true); S.tutAvail = false; App.sfx.tap(); break;
      case 'levels':
        if (S && S.phase !== 'end' && S.dayIdx > 0 && !els.end.classList.contains('show') && !els.intro.classList.contains('show')) {
          App.confirm('放弃这一关？', '现在退出，这一关的进度不会保存。', '放弃并退出', showSelect);
        } else showSelect();
        break;
      case 'menu': if (S && S.phase !== 'end') App.show(els.menu); break;
      case 'closemenu': App.hide(els.menu); break;
      case 'hint': App.hide(els.menu); App.toast('💡 ' + S.lv.hint, 'ok', 4200); break;
      case 'tutorial': App.hide(els.menu); App.hide(els.end); openLevel(App.LEVELS[0], false, { forceTut: true }); break;
      case 'retry': App.hide(els.menu); App.hide(els.end); openLevel(S.lv, true); break;
      case 'cut': App.hide(els.menu); cutLoss(); break;
      case 'nextlv': nextLevel(); break;
      case 'tutnext': if (S && S.tut && S.tut.step === 1) tutGo(2); break;
      case 'tutskip': tutEnd(); App.toast('已跳过教学，右上角菜单里随时可以重看', '', 2200); break;
      case 'tsell': if (canPlan()) { S.sellOn = !S.sellOn; App.sfx.tap(); refreshOrders(); draw(); } break;
      case 'tbuy': if (canPlan()) { S.buyOn = !S.buyOn; App.sfx.tap(); refreshOrders(); draw(); } break;
      case 'qminus': if (canPlan()) { S.qtyAuto = false; S.qty = Math.max(100, S.qty - 100); refreshOrders(); draw(); } break;
      case 'qplus': if (canPlan()) { S.qtyAuto = false; S.qty = Math.min(maxQty(), S.qty + 100); refreshOrders(); draw(); } break;
      case 'next': if (canPlan()) runDay(); break;
      case 'auto': setAuto(!S.auto); if (S.auto && canPlan()) runDay(); break;
      default: break;
    }
  }
  const canPlan = () => S && S.phase === 'plan';

  // ---------- 关卡列表 ----------
  function renderSelect() {
    const rec = levelRec();
    let stars = 0, done = 0;
    els.grid.innerHTML = '';
    for (const lv of App.LEVELS) {
      const r = rec[lv.id], s = r ? r.stars : 0;
      stars += s; if (s) done++;
      const tag = lv.tutorial && !tutDone() ? '<span class="chip blue">新手教学</span>' : '<span class="chip ' + (lv.tag === 'Boss' ? 'up' : 'gold') + '">' + lv.tag + '</span>';
      els.grid.insertAdjacentHTML('beforeend',
        '<button class="lv-card ' + (s ? 'done' : '') + '" data-lv="' + lv.id + '"><div class="lv-no"><span>第 ' + lv.id + ' 关</span><span>' + lv.days + ' 天</span></div>' +
        '<div class="lv-name">' + lv.name + '</div><div class="lv-tag">' + tag + '</div>' +
        '<div class="lv-stars">' + starsHtml(s) + (r && r.bestDays ? ' <span class="small" style="letter-spacing:0">最快 ' + r.bestDays + ' 天</span>' : '') + '</div></button>');
    }
    els.selSub.textContent = '已解套 ' + done + '/' + App.LEVELS.length + ' 关 · ★ ' + stars + '/' + App.LEVELS.length * 3;
    const en = App.store.get('uk_endless', { wins: 0, plays: 0 });
    els.endlessRec.textContent = en.plays ? '解套 ' + en.wins + ' 次 / 挑战 ' + en.plays + ' 次' : '还没玩过';
  }
  function showSelect() {
    stopAll();
    [els.intro, els.end, els.menu].forEach(App.hide);
    renderSelect();
    els.play.classList.remove('show'); els.select.classList.add('show');
    S = null;
  }

  // ---------- 开局 ----------
  function openLevel(lv, quick, opts) {
    opts = opts || {};
    stopAll();
    const series = E.genLevel(lv);
    const start = series.hist[series.H - 1].c;
    const target = lv.shares * lv.cost + lv.cash;
    const tutAvail = !!lv.tutorial && (!!opts.forceTut || !tutDone());
    S = {
      lv, series, dayIdx: 0, acct: { cash: lv.cash, shares: lv.shares }, tradesLeft: lv.trades, target,
      eq0: lv.shares * start + lv.cash, start,
      sellOn: true, buyOn: true,
      sellPrice: tutAvail ? lv.tutorial.startSell : round2(start * 1.05),
      buyPrice: tutAvail ? lv.tutorial.startBuy : round2(start * 0.95),
      qty: 100, qtyAuto: true, auto: false, phase: 'plan',
      fills: [], openT: null, tCount: 0, tProfit: 0, logs: [], anim: null,
      tutAvail, tut: null, tutJustDone: false, costFx: null, frozen: null,
    };
    clampOrders();
    els.select.classList.remove('show'); els.play.classList.add('show');
    [els.end, els.menu].forEach(App.hide);
    els.play.classList.remove('tut');
    els.coach.classList.remove('show');
    els.goal.classList.remove('hl-pulse'); els.next.classList.remove('hl-pulse');
    els.title.textContent = (lv.endless ? '无尽模式' : '第 ' + lv.id + ' 关') + ' · ' + lv.name;
    els.stock.textContent = stockName(lv) + ' ' + stockCode(lv);
    els.days.textContent = lv.days;
    els.dragTip.style.display = App.store.get('uk_dragged', false) || tutAvail ? 'none' : '';
    setAuto(false);
    log('开局：现价 ' + start.toFixed(2) + '，成本价 ' + lv.cost.toFixed(2) + '。挂好两条线，就点「下一天」', 'hl');
    updateHud(); refreshOrders();
    requestAnimationFrame(draw);
    if (!quick) showIntro();
  }

  function showIntro() {
    const lv = S.lv;
    const head = '<div class="menu-head"><div class="mascot">' + App.mascot('sad') + '</div><div><div class="menu-title"></div><div class="menu-sub"></div></div></div>' +
      '<div class="intro-story">你在 <b class="num">' + lv.cost.toFixed(2) + '</b> 元买了 <b class="num">' + lv.shares + '</b> 股，现在它只剩 <b class="num down">' + S.start.toFixed(2) + '</b> 元。<br>你已经在山顶站岗 ' + stoodDays(lv) + ' 天了……</div>' +
      '<div class="intro-goal">🎯 <b>' + lv.days + '</b> 个交易日内解套：总资产回到 <b class="num">' + fmtMoney(S.target) + '</b><br>现在 ' + fmtMoney(S.eq0) + '，还差 <b class="num">' + fmtMoney(S.target - S.eq0) + '</b></div>';
    if (S.tutAvail) {
      els.introBody.innerHTML = head +
        '<div class="intro-hint">这一关会手把手带你走一遍：挂买入线、挂卖出线、点下一天，看着成本价降下来。跟着提示做就行，一共 5 步。</div>' +
        '<button class="btn block" style="margin-top:14px" data-act="go-tut">开始教学</button><button class="link-btn" data-act="go-notut">我会玩，跳过教学</button>';
    } else {
      els.introBody.innerHTML = head +
        '<div class="intro-hint">💡 <span class="k-hint"></span></div><div class="intro-rules">' + rulesHtml(lv) + '</div>' +
        '<button class="btn block" data-act="go">开始自救</button><button class="link-btn" data-act="levels">返回关卡列表</button>';
      els.introBody.querySelector('.k-hint').textContent = lv.hint;
    }
    els.introBody.querySelector('.menu-title').textContent = (lv.endless ? '无尽模式' : '第 ' + lv.id + ' 关') + ' · ' + lv.name + (S.tutAvail ? '（新手教学）' : '');
    els.introBody.querySelector('.menu-sub').textContent = stockName(lv) + ' · ' + stockCode(lv);
    App.show(els.intro);
  }

  // ---------- 新手教学（第 1 关，5 步） ----------
  function tutStart() {
    S.tut = { step: 1, msg: '', firstFill: null, final: null };
    els.play.classList.add('tut');
    renderTut();
  }
  function tutGo(step) {
    S.tut.step = step; S.tut.msg = '';
    renderTut();
  }
  function tutEnd() {
    if (!S || !S.tut) return;
    S.tut = null;
    App.store.set('uk_tut_done', true);
    els.play.classList.remove('tut');
    els.coach.classList.remove('show');
    els.goal.classList.remove('hl-pulse'); els.next.classList.remove('hl-pulse');
    refreshOrders(); draw();
  }
  function tutContent() {
    const t = S.tut, tu = S.lv.tutorial;
    switch (t.step) {
      case 1: return ['你被套住了',
        '你在 <b>' + S.lv.cost.toFixed(2) + '</b> 元买了 ' + S.lv.shares + ' 股，现在只剩 <b>' + S.start.toFixed(2) + '</b>。图上金色虚线是你的成本价，把它压到现价以下，就算解套。'];
      case 2: return ['挂买入线：跌到就买',
        '按住右边绿色的「买」，往下拖到发光的区域（<b>' + tu.buyHint + '</b> 左右，前几天的低点）。闲钱 ' + fmtMoney(S.acct.cash) + ' 只够买 <b>' + S.qty + '</b> 股，股数已经自动设好。'];
      case 3: return ['挂卖出线：涨到就卖',
        '按住右边红色的「卖」，往上拖到发光的区域（<b>' + tu.sellHint + '</b> 左右，前几天的高点）。'];
      case 4: return ['点「下一天」',
        '两条线都挂好了。点下面的「下一天」：股价碰到哪条线，就按那条线的价格自动成交。'];
      default: {
        if (t.final) {
          const f = t.final;
          return ['完成一次 T！',
            '低处买、高处卖，这一来一回赚了 <b>' + fmtMoney(f.profit) + '</b>，成本价从 <b>' + f.from.toFixed(2) + '</b> 降到 <b>' + f.to.toFixed(2) + '</b>' +
            (equity() >= S.target - 0.5 ? '，已经低于现价，解套了！' : '。以后每关都是这个思路。')];
        }
        const ff = t.firstFill;
        if (ff && ff.type === 'sell') {
          return ['等它跌下来，完成一次 T',
            '卖出成交 ' + ff.qty + ' 股 @' + ff.price.toFixed(2) + '，卖出线自动关掉了，只等跌到买入线。继续点「下一天」，一卖一买就叫做一次 T。'];
        }
        return ['等它涨上去，完成一次 T',
          '买入成交 ' + (ff ? ff.qty : S.qty) + ' 股 @' + (ff ? ff.price : S.buyPrice).toFixed(2) + '，买入线自动关掉了，只等涨到卖出线。继续点「下一天」，一买一卖就叫做一次 T。'];
      }
    }
  }
  function renderTut() {
    const t = S.tut;
    if (!t) return;
    const c = tutContent();
    els.ccStep.textContent = t.step + '/5';
    els.ccTitle.textContent = c[0];
    els.ccText.innerHTML = c[1] + (t.msg ? '<div class="cc-msg">' + t.msg + '</div>' : '');
    els.ccNext.parentNode.style.display = t.step === 1 ? '' : 'none';
    els.ccSkip.style.display = t.final ? 'none' : '';
    els.coach.classList.add('show');
    els.goal.classList.toggle('hl-pulse', t.step === 1);
    els.next.classList.toggle('hl-pulse', t.step >= 4 && !t.final);
    refreshOrders(); draw();
    if (t.step <= 3) startFx();
  }
  function tutAfterDay(res, tDone, won) {
    const t = S.tut;
    if (tDone) {
      if (!t.firstFill) t.firstFill = res.fills[0];
      t.step = 5; t.final = tDone; t.msg = '';
      S.tutJustDone = true;
      renderTut();
      later(tutEnd, 1800);
      return;
    }
    if (t.step === 4) {
      if (res.fills.length) { t.firstFill = res.fills[0]; tutGo(5); }
      else { t.msg = '今天没碰到线，继续点「下一天」。'; renderTut(); }
    } else if (t.step === 5) {
      t.msg = '还没碰到' + (S.sellOn ? '卖出线' : '买入线') + '，继续点「下一天」。';
      renderTut();
    }
    if (won) { S.tutJustDone = true; later(tutEnd, 1800); }
  }

  // ---------- 账户计算 ----------
  const lastClose = () => (S.dayIdx > 0 ? S.series.days[S.dayIdx - 1].c : S.start);
  const equity = () => S.acct.cash + S.acct.shares * lastClose();
  const costOf = (a) => (a.shares > 0 ? (S.target - a.cash) / a.shares : null);
  const costPrice = () => costOf(S.acct);
  const band = () => {
    const d = S.series.days[Math.min(S.dayIdx, S.lv.days - 1)];
    return { lo: d.lo, hi: d.hi };
  };
  function affordQty(price) {
    let q = Math.floor(S.acct.cash / (price * 1.001) / 100) * 100;
    while (q >= 100 && q * price + E.lvFee(q * price) > S.acct.cash + 1e-6) q -= 100;
    return Math.max(0, q);
  }
  const shareLots = () => Math.floor(S.acct.shares / 100) * 100;
  // 默认股数：按闲钱能买多少来定；做了一半的 T，就按那一半的股数收尾
  function suggestedQty() {
    const afford = affordQty(S.buyPrice), lots = shareLots();
    let q;
    if (S.openT && S.openT.type === 'buy') q = Math.min(S.openT.qty, lots);
    else if (S.openT && S.openT.type === 'sell') q = afford >= 100 ? Math.min(S.openT.qty, afford) : S.openT.qty;
    else q = Math.min(afford, lots);
    if (q < 100) q = Math.min(Math.max(100, Math.round((S.lv.shares * 0.3) / 100) * 100), Math.max(100, lots));
    return q;
  }
  function maxQty() { return Math.max(100, shareLots(), affordQty(S.buyPrice)); }
  // 挂单价保留玩家设定的价格；超出当天涨跌停的单子只是当天成交不了，不会被偷偷改价
  function clampOrders() {
    S.sellPrice = round2(Math.max(0.02, S.sellPrice));
    S.buyPrice = round2(Math.max(0.01, S.buyPrice));
    if (S.sellPrice <= S.buyPrice) S.sellPrice = round2(S.buyPrice + 0.02);
    if (S.qtyAuto) S.qty = suggestedQty();
    S.qty = clamp(S.qty, 100, maxQty());
  }

  function updateHud() {
    const p = lastClose(), cp = costPrice(), eq = equity();
    els.cost.textContent = cp == null ? '已清仓' : cp.toFixed(2);
    els.cost.className = 'num p-cost ' + (cp != null && cp <= p ? 'up' : 'gold');
    const dayCh = S.dayIdx > 0 ? (p / S.series.days[S.dayIdx - 1].prevClose - 1) * 100 : 0;
    els.price.textContent = p.toFixed(2);
    els.price.className = 'num p-price ' + cls(dayCh);
    els.day.textContent = Math.min(S.dayIdx + 1, S.lv.days);
    const prog = clamp((eq - S.eq0) / (S.target - S.eq0), 0, 1);
    els.fill.style.width = (prog * 100).toFixed(1) + '%';
    els.prog.textContent = Math.round(prog * 100) + '%';
    const gap = S.target - eq;
    els.need.innerHTML = gap > 0 ? '还差 <b class="num">' + fmtMoney(gap) + '</b>' : '<b class="num up">已解套，多出 ' + fmtMoney(-gap) + '</b>';
    els.shares.textContent = S.acct.shares + ' 股';
    els.cash.textContent = fmtMoney(S.acct.cash);
    els.trades.textContent = (S.lv.trades - S.tradesLeft) + '/' + S.lv.trades;
  }
  function refreshOrders() {
    clampOrders();
    const noTrades = S.tradesLeft <= 0;
    els.sellChip.className = 'ord-chip sell' + (S.sellOn && !noTrades ? ' on' : '');
    els.buyChip.className = 'ord-chip buy' + (S.buyOn && !noTrades ? ' on' : '');
    els.sell.textContent = S.sellPrice.toFixed(2);
    els.buy.textContent = S.buyPrice.toFixed(2);
    els.qty.textContent = S.qty;
    const t = S.tut;
    els.next.disabled = S.phase !== 'plan' || (!!t && (t.step < 4 || !!t.final));
    [els.auto, els.sellChip, els.buyChip, els.qminus, els.qplus].forEach((b) => { b.disabled = !!t; });
  }
  function log(msg, c) {
    S.logs.unshift({ msg, c: c || '' });
    S.logs.length = Math.min(S.logs.length, 3);
    els.log.innerHTML = '';
    S.logs.slice(0, 2).forEach((l) => { const d = document.createElement('div'); d.className = l.c; d.textContent = l.msg; els.log.appendChild(d); });
  }
  function setAuto(v) {
    if (!S) return;
    S.auto = v;
    els.auto.classList.toggle('on', v);
    els.auto.textContent = v ? '❚❚ 暂停' : '▶▶ 自动';
    if (!v) clearTimeout(autoTimer);
  }

  // ---------- 推进一天 ----------
  function runDay() {
    if (!canPlan() || S.dayIdx >= S.lv.days) return;
    clampOrders();
    const day = S.series.days[S.dayIdx];
    const can = S.tradesLeft > 0;
    const orders = {
      sell: S.sellOn && can && S.acct.shares >= 100 ? { price: S.sellPrice, qty: S.qty } : null,
      buy: S.buyOn && can ? { price: S.buyPrice, qty: S.qty } : null,
    };
    const res = E.runLevelDay(S.acct, day, orders, S.tradesLeft);
    S.phase = 'anim';
    S.anim = { day, res, t0: performance.now(), k: 0, orders };
    res.fills.forEach((f) => { f.shown = false; });
    refreshOrders();
    const dur = S.auto ? 650 : 1000;
    const frame = (now) => {
      if (!S || S.phase !== 'anim') return;
      const a = S.anim, u = Math.min(1, (now - a.t0) / dur);
      a.k = u * (a.day.path.length - 1);
      for (const f of a.res.fills) {
        if (!f.shown && f.k <= a.k) {
          f.shown = true;
          if (f.type === 'sell') { App.sfx.sell(); App.toast('卖出成交 ' + f.qty + ' 股 @' + f.price.toFixed(2), 'down', 1300); }
          else { App.sfx.buy(); App.toast('买入成交 ' + f.qty + ' 股 @' + f.price.toFixed(2), 'up', 1300); }
          App.buzz(10);
        }
      }
      draw();
      if (u < 1) raf = requestAnimationFrame(frame); else completeDay();
    };
    raf = requestAnimationFrame(frame);
  }

  function completeDay() {
    const { res, day } = S.anim;
    const before = { cash: S.acct.cash, shares: S.acct.shares };
    S.acct = res.acct; S.tradesLeft -= res.tradesUsed;
    S.dayIdx++;
    const dayNo = S.dayIdx;
    // 逐笔重放，算出每笔成交前后的成本价
    const a = { cash: before.cash, shares: before.shares };
    let tDone = null;
    for (const f of res.fills) {
      const cb = costOf(a);
      if (f.type === 'sell') { a.cash += f.qty * f.price - f.fee; a.shares -= f.qty; } else { a.cash -= f.qty * f.price + f.fee; a.shares += f.qty; }
      S.fills.push({ day: dayNo - 1, type: f.type, price: f.price, qty: f.qty });
      const t = matchT(f, dayNo, cb, costOf(a));
      if (t) tDone = t;
    }
    res.notes.forEach((n) => log('第 ' + dayNo + ' 天：' + n));
    if (!res.fills.length && !res.notes.length) log('第 ' + dayNo + ' 天：收盘 ' + day.c.toFixed(2) + '（' + fmtPct((day.c / day.prevClose - 1) * 100) + '），没有成交');
    // 成交后只留下下一步该挂的那条线
    const sold = res.fills.some((f) => f.type === 'sell'), bought = res.fills.some((f) => f.type === 'buy');
    let tip = '';
    if (sold && !bought) { S.sellOn = false; S.buyOn = true; tip = '卖出线先关掉了，等它跌到买入线再买回来'; }
    else if (bought && !sold) { S.buyOn = false; S.sellOn = true; tip = '买入线先关掉了，等它涨到卖出线再卖出'; }
    else if (bought && sold) { S.sellOn = true; S.buyOn = true; }
    S.anim = null;
    S.phase = 'plan';
    updateHud(); refreshOrders(); draw();
    if (tDone) celebrateT(tDone);
    else if (tip && !S.tut) App.toast(tip, 'ok', 2400);
    const won = equity() >= S.target - 0.5;
    if (S.tut) tutAfterDay(res, tDone, won);
    if (won) {
      if (S.tutJustDone || tDone) { S.phase = 'end'; setAuto(false); refreshOrders(); later(win, S.tutJustDone ? 1900 : 1200); } else win();
      return;
    }
    if (S.dayIdx >= S.lv.days) { fail(); return; }
    if (S.tradesLeft <= 0 && !S.noTradeTip) { S.noTradeTip = true; App.toast('成交次数用完了，只能拿着等', 'warn', 2200); }
    if (S.auto) {
      if (res.fills.length) { setAuto(false); App.toast('有成交，自动已暂停，看看要不要改单', 'ok', 1800); }
      else autoTimer = setTimeout(() => { if (S && S.auto && canPlan()) runDay(); }, 380);
    }
  }

  // 记录 T：先买后卖或先卖后买，凑成一对就结算差价
  function matchT(f, dayNo, costBefore, costAfter) {
    const verb = f.type === 'sell' ? '卖出' : '买入';
    const o = S.openT;
    if (o && o.type !== f.type) {
      const q = Math.min(o.qty, f.qty);
      const sellP = f.type === 'sell' ? f.price : o.price, buyP = f.type === 'buy' ? f.price : o.price;
      const profit = (sellP - buyP) * q - o.feePer * q - (f.fee / f.qty) * q;
      S.tCount++; S.tProfit += profit;
      const from = o.costStart, to = costAfter;
      // 日志一行放不下时会截断，所以先写赚了多少和成本价变化
      log('第 ' + dayNo + ' 天完成一次 T：' + (profit >= 0 ? '赚 ' : '亏 ') + fmtMoney(Math.abs(profit)) +
        (from != null && to != null ? '，成本价 ' + from.toFixed(2) + ' → ' + to.toFixed(2) : '') + '（' + verb + ' ' + f.qty + ' 股 @' + f.price.toFixed(2) + '）', profit >= 0 ? 'up' : 'down');
      o.qty -= q;
      const rest = f.qty - q;
      if (o.qty <= 0) S.openT = rest > 0 ? { type: f.type, price: f.price, qty: rest, feePer: f.fee / f.qty, costStart: costAfter } : null;
      return { profit, from, to };
    }
    if (o) {
      const tot = o.qty + f.qty;
      o.price = (o.price * o.qty + f.price * f.qty) / tot;
      o.feePer = (o.feePer * o.qty + f.fee) / tot;
      o.qty = tot;
    } else S.openT = { type: f.type, price: f.price, qty: f.qty, feePer: f.fee / f.qty, costStart: costBefore };
    log('第 ' + dayNo + ' 天：' + verb + ' ' + f.qty + ' 股 @' + f.price.toFixed(2) + (f.type === 'sell' ? '，等跌下来买回' : '，等涨上去卖出'), f.type === 'sell' ? 'down' : 'up');
    return null;
  }

  function celebrateT(t) {
    const good = t.profit >= 0;
    if (!S.tut) App.toast('完成一次 T：' + (good ? '赚了 ' : '亏了 ') + fmtMoney(Math.abs(t.profit)) +
      (t.from != null && t.to != null ? '<br>成本价 ' + t.from.toFixed(2) + ' → ' + t.to.toFixed(2) : ''), good ? 'tdone' : 'down', 3200);
    if (good) App.sfx.good(); else App.sfx.bad();
    App.buzz(good ? 30 : 15);
    els.cost.classList.remove('flash'); void els.cost.offsetWidth; els.cost.classList.add('flash');
    if (t.from != null && t.to != null && Math.abs(t.from - t.to) >= 0.005) { S.costFx = { from: t.from, t0: performance.now() }; startFx(); }
  }

  // 需要持续重绘的效果：教学高亮、成本线下滑
  function startFx() {
    if (fxRaf) return;
    const tick = (now) => {
      fxRaf = 0;
      if (!S) return;
      if (S.costFx && now - S.costFx.t0 > 1600) S.costFx = null;
      if (S.phase !== 'anim') draw();
      const more = S.costFx || (S.tut && S.tut.step <= 3 && S.phase === 'plan');
      if (more) fxRaf = requestAnimationFrame(tick);
    };
    fxRaf = requestAnimationFrame(tick);
  }

  // ---------- 结局 ----------
  function win() {
    if (!S) return;
    S.phase = 'end'; setAuto(false);
    const lv = S.lv, used = S.dayIdx, tUsed = lv.trades - S.tradesLeft;
    const fast = used <= Math.ceil(lv.days * 0.6), thrift = tUsed <= Math.floor(lv.trades / 2);
    const stars = 1 + (fast ? 1 : 0) + (thrift ? 1 : 0);
    let isNewBest = false;
    if (lv.endless) {
      const en = App.store.get('uk_endless', { wins: 0, plays: 0 }); en.wins++; en.plays++; App.store.set('uk_endless', en);
    } else {
      const rec = levelRec(), r = rec[lv.id] || { stars: 0, bestDays: null };
      if (stars > r.stars) { r.stars = stars; isNewBest = true; }
      if (!r.bestDays || used < r.bestDays) r.bestDays = used;
      rec[lv.id] = r; App.store.set('uk_levels', rec);
    }
    const cp = costPrice(), p = lastClose();
    const hasNext = !lv.endless && App.LEVELS.some((x) => x.id === lv.id + 1);
    els.endBody.innerHTML =
      '<div class="end-head"><div class="mascot">' + App.mascot('happy') + '</div><div class="end-title">解套成功！</div>' +
      '<div class="end-sub">用时 <b>' + used + '</b>/' + lv.days + ' 天 · 成交 <b>' + tUsed + '</b>/' + lv.trades + ' 笔<br>' +
      (cp != null ? '成本价 <b class="num">' + cp.toFixed(2) + '</b> ≤ 现价 <b class="num up">' + p.toFixed(2) + '</b>' : '已经清仓回本') +
      '<br>做了 ' + S.tCount + ' 次完整的 T，差价' + (S.tProfit >= 0 ? '赚了 ' : '亏了 ') + fmtMoney(Math.abs(S.tProfit)) + '<br>站岗 ' + (stoodDays(lv) + used) + ' 天，终于下山了</div></div>' +
      (S.tutJustDone ? '<div class="res-box" style="margin-top:12px">教学完成！以后每关都是这个思路：看清股价在哪个区间晃，低处买、高处卖，把成本价一点点压下来。</div>' : '') +
      '<div class="stars-big">' + starsHtml(stars) + '</div>' +
      '<div class="star-notes"><span class="up">★ 解套成功</span>　<span class="' + (fast ? 'up' : '') + '">★ 用时 ≤ ' + Math.ceil(lv.days * 0.6) + ' 天</span>　<span class="' + (thrift ? 'up' : '') + '">★ 成交 ≤ ' + Math.floor(lv.trades / 2) + ' 笔</span>' + (isNewBest ? '<br>新纪录！' : '') + '</div>' +
      '<div class="end-btns"><button class="btn ghost" data-act="retry">再玩一次</button>' +
      (lv.endless ? '<button class="btn" data-act="endless">下一只</button>' : hasNext ? '<button class="btn" data-act="nextlv">下一关</button>' : '<button class="btn" data-act="levels">全部通关！</button>') +
      '</div><button class="link-btn" data-act="levels">关卡列表</button>';
    App.show(els.end);
    App.sfx.good(); App.buzz(30);
    App.confetti(scr);
  }
  function fail() {
    S.phase = 'end'; setAuto(false);
    const lv = S.lv, gap = S.target - equity();
    if (lv.endless) { const en = App.store.get('uk_endless', { wins: 0, plays: 0 }); en.plays++; App.store.set('uk_endless', en); }

      (S.tCount ? '<br>做了 ' + S.tCount + ' 次 T，差价' + (S.tProfit >= 0 ? '赚了 ' : '亏了 ') + fmtMoney(Math.abs(S.tProfit)) : '') + '</div></div>' +
      '<div class="intro-hint" style="margin-top:14px">💡 <span class="k-hint"></span></div>' +

  function cutLoss() {

    App.confirm('割肉离场？', '按现价全部卖出，这一关算失败。<br>实际亏损 <b class="down">' + fmtMoney(loss) + '</b>', '割了', () => {
      S.phase = 'end'; setAuto(false);
      if (S.tut) tutEnd();

      els.endBody.innerHTML =
        '<div class="end-head"><div class="mascot">' + App.mascot('sad') + '</div><div class="end-title">割肉离场</div>' +
        '<div class="end-sub">亏损 <b class="num down">' + fmtMoney(loss) + '</b>。今晚关灯吃面。<br>（说不定明天它就涨了。）</div></div>' +
        '<div class="end-btns"><button class="btn ghost" data-act="levels">关卡列表</button><button class="btn" data-act="retry">再来一次</button></div>';
      App.show(els.end);

  }
  function nextLevel() {
    const nx = App.LEVELS.find((x) => x.id === S.lv.id + 1);
    App.hide(els.end);
    if (nx) openLevel(nx); else showSelect();
  }

  // ---------- 无尽模式 ----------
  function endlessCfg() {
    const seed = Date.now() % 1000000007;
    const rng = App.makeRng('endless-' + seed);
    const type = rng.pick(['sine', 'sine', 'downtrend', 'breakout', 'fakeout', 'vshape', 'shakeout', 'wild']);
    const center = Math.round(rng.range(8, 60));
    const per = rng.int(4, 8);
    const P = {
      sine: { type: 'sine', amp: rng.range(0.06, 0.12), period: per, phase: Math.PI + (2 * Math.PI) / per, noise: 0.008, intra: 0.028 },
      downtrend: { type: 'downtrend', drift: -rng.range(0.004, 0.007), amp: rng.range(0.04, 0.06), period: rng.int(5, 7), phase: 0.6, noise: 0.008, intra: 0.028 },
      breakout: { type: 'breakout', amp: 0.05, period: 6, phase: 4.189, start: rng.int(10, 14), rise: rng.range(0.15, 0.22), len: 4, noise: 0.008, intra: 0.028 },
      fakeout: { type: 'fakeout', amp: 0.045, period: 5, start: rng.int(7, 10), rise: rng.range(0.12, 0.16), len: 3, fall: rng.range(0.18, 0.22), flen: 6, rec: rng.range(0.05, 0.08), noise: 0.008, intra: 0.028 },
      vshape: { type: 'vshape', drop: rng.range(0.25, 0.32), bottom: rng.int(6, 9), rec: rng.range(0.28, 0.33), noise: 0.01, intra: 0.03 },
      shakeout: { type: 'shakeout', drift: rng.range(0.003, 0.005), amp: 0.03, period: 6, shocks: [rng.int(2, 5), rng.int(8, 11), rng.int(13, 16)], depth: rng.range(0.1, 0.13), noise: 0.008, intra: 0.028 },
      wild: { type: 'wild', amp: rng.range(0.14, 0.18), period: rng.int(6, 8), amp2: rng.range(0.06, 0.08), period2: 3.1, jumpP: 0.12, noise: 0.02, intra: 0.045 },
    }[type];
    P.center = center;
    const hints = {
      sine: '看看过去一个月的高点和低点，在区间上沿卖、下沿买。',
      downtrend: '一路阴跌，反弹是卖点，急着补仓只会越补越套。',
      breakout: '横盘越久，拉升越猛，别把底仓全卖光。',
      fakeout: '放量冲高未必是真突破，冲高时卖一部分，回落再接。',
      vshape: '恐慌暴跌之后往往有反弹，闲钱留给最绝望的时候。',
      shakeout: '大阴线吓人但很快拉回，别人恐慌时可以接一点。',
      wild: '妖股波动巨大，赚得快也亏得快，挂单别太贪。',
    };
    const shares = rng.pick([1000, 1000, 1500, 2000]);
    const days = rng.int(18, 24);
    return {
      id: 'E' + seed, endless: true, name: '随机股票', tag: '无尽', stock: [rng.pick(E.FOODS), rng.pick(E.INDS)],
      cost: round2(center * rng.range(1.08, 1.2)), shares, cash: Math.round((center * shares * rng.range(0.15, 0.35)) / 1000) * 1000,
      days, trades: rng.int(10, 16), pattern: P, hint: hints[type], seed,
    };
  }

  // ---------- 拖动挂单线 ----------
  function localY(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onDown(e) {
    if (!canPlan() || !S.g) return;
    const p = localY(e), g = S.g;
    let allowed = ['sell', 'buy'];
    if (S.tut) allowed = S.tut.step === 2 ? ['buy'] : S.tut.step === 3 ? ['sell'] : [];
    const cand = [];
    if (S.sellOn && allowed.indexOf('sell') >= 0) cand.push(['sell', Math.abs(p.y - g.yOf(S.sellPrice))]);
    if (S.buyOn && allowed.indexOf('buy') >= 0) cand.push(['buy', Math.abs(p.y - g.yOf(S.buyPrice))]);
    cand.sort((a, b) => a[1] - b[1]);
    const lim = p.x > g.plotR - 30 ? 34 : 26;
    if (!cand.length || cand[0][1] > lim) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    drag = { which: cand[0][0], id: e.pointerId };
    S.frozen = { lo: g.lo, hi: g.hi };
    App.sfx.tap();
    if (!App.store.get('uk_dragged', false)) { App.store.set('uk_dragged', true); els.dragTip.style.display = 'none'; }
  }
  function onMove(e) {
    if (!drag || !S || !S.g) return;
    e.preventDefault();
    const f = S.frozen;
    const price = round2(clamp(S.g.pOf(localY(e).y), Math.max(0.01, f.lo), f.hi));
    if (drag.which === 'sell') {
      S.sellPrice = Math.max(0.03, price);
      if (S.buyPrice >= S.sellPrice - 0.01) S.buyPrice = round2(S.sellPrice - 0.02);
    } else {
      S.buyPrice = price;
      if (S.sellPrice <= S.buyPrice + 0.01) S.sellPrice = round2(S.buyPrice + 0.02);
    }
    refreshOrders(); draw();
  }
  function onUp() {
    if (!drag) return;
    const which = drag.which;
    drag = null;
    if (!S) return;
    S.frozen = null;
    if (S.tut && ((S.tut.step === 2 && which === 'buy') || (S.tut.step === 3 && which === 'sell'))) {
      const range = S.lv.tutorial[which];
      const p = which === 'buy' ? S.buyPrice : S.sellPrice;
      if (p >= range[0] && p <= range[1]) {
        App.sfx.good();
        App.toast(which === 'buy' ? '买入线挂好了' : '卖出线挂好了', 'ok', 1100);
        tutGo(S.tut.step + 1);
        return;
      }
      const tooHigh = p > range[1];
      S.tut.msg = which === 'buy' ? (tooHigh ? '还要再往下一点。' : '拖过头了，往上一点。') : (tooHigh ? '拖过头了，往下一点。' : '还要再往上一点。');
      renderTut();
      return;
    }
    draw();
  }

  // ---------- 绘图 ----------
  function draw() {
    if (!S) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    const padL = 6, padR = 66, padT = 26, padB = 18;
    const plotW = w - padL - padR, plotH = h - padT - padB, plotR = padL + plotW, plotB = padT + plotH;
    const all = S.series.hist.concat(S.series.days.slice(0, S.dayIdx));
    const vis = all.slice(-VIS), off = all.length - vis.length;
    const slot = plotW / (VIS + 2.6);
    const x0 = plotR - (vis.length + 2.6) * slot;
    const xOf = (i) => x0 + (i + 0.5) * slot;
    const tmX0 = x0 + vis.length * slot + 0.3 * slot, tmX1 = tmX0 + 2.1 * slot;
    const playing = S.dayIdx < S.lv.days && S.phase !== 'end';
    const b = playing ? band() : null;
    const tutWhich = S.tut && S.phase === 'plan' ? (S.tut.step === 2 ? 'buy' : S.tut.step === 3 ? 'sell' : null) : null;
    const tutBand = tutWhich ? S.lv.tutorial[tutWhich] : null;
    let lo = Infinity, hi = -Infinity;
    for (const d of vis) { lo = Math.min(lo, d.l); hi = Math.max(hi, d.h); }
    if (b) { lo = Math.min(lo, b.lo); hi = Math.max(hi, b.hi); }
    if (S.sellOn) hi = Math.max(hi, S.sellPrice);
    if (S.buyOn) lo = Math.min(lo, S.buyPrice);
    if (tutBand) { lo = Math.min(lo, tutBand[0]); hi = Math.max(hi, tutBand[1]); }
    const cp = costPrice();
    const span0 = hi - lo;
    const showCost = cp != null && cp <= hi + span0 * 0.35;
    if (showCost) hi = Math.max(hi, cp);
    const fx = S.costFx ? Math.min(1, (performance.now() - S.costFx.t0) / 1200) : 1;
    if (S.costFx && showCost && S.costFx.from <= hi + span0 * 0.35) hi = Math.max(hi, S.costFx.from);
    const pad = (hi - lo) * 0.06;
    lo -= pad; hi += pad;
    if (S.frozen) { lo = S.frozen.lo; hi = S.frozen.hi; }
    const yOf = (p) => padT + ((hi - p) / (hi - lo)) * plotH;
    const pOf = (y) => hi - ((y - padT) / plotH) * (hi - lo);
    S.g = { yOf, pOf, plotR, lo, hi, handles: {} };
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);

    // 网格
    const span = hi - lo, raw = span / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
    ctx.font = '10px ' + C.num; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const y = yOf(v);
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke();
      ctx.fillStyle = C.dim; ctx.fillText(v.toFixed(step < 1 ? 2 : 1), padL + 2, y - 1);
    }
    // 明天的涨跌停区间
    if (b) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(tmX0, yOf(b.hi), tmX1 - tmX0, yOf(b.lo) - yOf(b.hi));
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([3, 3]);
      ctx.strokeRect(tmX0 + 0.5, yOf(b.hi) + 0.5, tmX1 - tmX0 - 1, yOf(b.lo) - yOf(b.hi) - 1);
      ctx.setLineDash([]);
      ctx.font = '10px ' + C.font; ctx.fillStyle = C.sub; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(S.phase === 'anim' ? '今天' : '明天', (tmX0 + tmX1) / 2, plotB + 4);
    }
    // 教学：要拖进去的目标区间
    if (tutBand) {
      const col = tutWhich === 'buy' ? '23,178,106' : '245,71,75';
      const y1 = yOf(tutBand[1]), y2 = yOf(tutBand[0]);
      ctx.fillStyle = 'rgba(' + col + ',' + (0.12 + 0.12 * pulse).toFixed(3) + ')';
      ctx.fillRect(padL, y1, plotW, y2 - y1);
      ctx.strokeStyle = 'rgba(' + col + ',0.8)'; ctx.setLineDash([4, 3]);
      ctx.strokeRect(padL + 0.5, y1 + 0.5, plotW - 1, y2 - y1 - 1);
      ctx.setLineDash([]);
    }
    // 成本线（成本价下降时，旧位置淡出，箭头指向新位置）
    if (cp != null) {
      ctx.font = 'bold 10px ' + C.font;
      if (showCost) {
        if (S.costFx && fx < 1) {
          const yOld = yOf(S.costFx.from), yNew = yOf(cp), dir = Math.sign(yNew - yOld) || 1;
          ctx.globalAlpha = 1 - fx;
          ctx.strokeStyle = C.gold; ctx.lineWidth = 1.2; ctx.setLineDash([6, 4]);
          ctx.beginPath(); ctx.moveTo(padL, yOld); ctx.lineTo(plotR, yOld); ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
          const ax = plotR - 18, ay = yOld + (yNew - yOld) * Math.min(1, fx * 1.4);
          ctx.beginPath(); ctx.moveTo(ax, yOld); ctx.lineTo(ax, ay); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(ax - 4, ay - 5 * dir); ctx.lineTo(ax, ay); ctx.lineTo(ax + 4, ay - 5 * dir); ctx.stroke();
          ctx.lineWidth = 1;
        }
        const y = yOf(cp);
        const glow = !!(S.tut && S.tut.step === 1);
        ctx.strokeStyle = C.gold; ctx.lineWidth = glow ? 2.4 + pulse : 1.2; ctx.setLineDash([6, 4]);
        if (glow) { ctx.shadowColor = 'rgba(255,179,26,0.8)'; ctx.shadowBlur = 8; }
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(plotR, y); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 1; ctx.shadowBlur = 0;
        ctx.fillStyle = C.gold; ctx.textBaseline = 'bottom'; ctx.textAlign = 'right';
        ctx.fillText((glow ? '这是你的成本价 ' : '成本价 ') + cp.toFixed(2), plotR - 4, y - 2);
      } else {
        ctx.fillStyle = C.gold; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
        ctx.fillText('↑ 成本价 ' + cp.toFixed(2) + '（还在上面）', plotR - 4, 7);
      }
    }
    // K 线
    for (let i = 0; i < vis.length; i++) {
      const d = vis[i], x = xOf(i), up = d.c >= d.o, col = up ? C.up : C.down;
      const bw = Math.max(1.5, slot * 0.66);
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, yOf(d.h)); ctx.lineTo(x, yOf(d.l)); ctx.stroke();
      const y1 = yOf(Math.max(d.o, d.c)), y2 = yOf(Math.min(d.o, d.c)), hh = Math.max(1, y2 - y1);

    // 庄家：单机庄家局在电脑股民里挑，“我当庄家”就是你；联机庄家局从所有人里随机挑（可能是真人）
    const pool2 = opts.bankerPool || 'bots';
    if (S.mode === 'banker') S.bankerId = pool2 === 'all' || B < 1 ? Math.floor(rnd(S) * n0) : H + Math.floor(rnd(S) * B);
    if (S.mode === 'me') S.bankerId = 0;
    if (S.bankerId >= 0) {
      const b = S.pl[S.bankerId];
      b.banker = true; b.hidden = b.hidden0 = lot100(0.2 * S.cfg.capTotal);
    }
    // 盘中消息：六成概率有一条，利空居多
    if (rnd(S) < 0.6) {
      const bad = rnd(S) < 0.65;
      S.news = { t: Math.round(rr(S, 38, 72) / DT), sign: bad ? -1 : 1, df: bad ? -rr(S, 0.08, 0.14) : rr(S, 0.03, 0.06),
        text: rpick(S, bad ? NEWS.bad : NEWS.good).replace('{s}', S.stock) };
    }
    return S;
  }

  // 联机时真人中途进场：带着 10 万现金，马上能交易
  function addHuman(S, h) {
    const p = addPlayer(S, { key: 'h' + S.pl.length, name: h.name, emoji: h.emoji, type: 'human', tag: '玩家' }, true, S.t * DT);
    p.active = true; p.peak = priceOf(S.x);
    pushFeed(S, { kind: 'join', id: p.id });
    return p.id;
  }

  function addPlayer(S, c, human, joinT) {
    const A = ARCH[c.type];
    const p = {
      id: S.pl.length, key: c.key, name: c.name, emoji: c.emoji, type: c.type, tag: c.tag, human, banker: false,
      cash: CASH0, shares: 0, cost: 0, hidden: 0, hidden0: 0, hidCash: 0, resCash: 0, qBuy: 0, qSell: 0,
      joinT, active: joinT <= 0, urge: 0, trust: {}, peak: P0, nextThink: 0, newsAt: -1, newsSign: 0,
      lastShout: null, busted: 0, realized: 0, phase: 'wait', entries: 0, target: 0, readyT: 0, reentryAt: 0,
    };
    if (A) {
      p.tp = rr(S, A.tp[0], A.tp[1]);
      p.exitT = rr(S, A.exitT[0], A.exitT[1]);
      p.holdRoll = rnd(S);
      p.nextThink = Math.round((joinT + rr(S, 0.3, 2.2)) / DT);
      p.readyT = c.type === 'influencer' ? rr(S, 1, 5) : c.type === 'gambler' ? rr(S, 5, 55) : rr(S, 2, 28);
    }
    S.pl.push(p);
    return p;
  }

  // ---------- 撮合 ----------
  const qSum = (Q) => { let s = 0; for (const o of Q) s += o.q; return s; };
  function logTrade(S, pl, side, q, px, kind) {
    if (q <= 0) return;
    if (pl) {
      S.log.push({ t: S.t, id: pl.id, side, q, px, kind });
      if (kind !== 'qfill') S.recent.push({ t: S.t, id: pl.id, side, q });
    }
  }
  function credit(pl, side, q, px, hidden) {
    if (!pl || q <= 0) return;
    if (side === 'buy') { pl.cash -= q * px; pl.shares += q; pl.cost += q * px; return; }
    pl.cash += q * px;
    if (hidden) { pl.hidden -= q; pl.hidCash += q * px; return; } // 底仓砸出去的钱单独记，不算进明仓
    const avg = pl.shares > 0 ? pl.cost / pl.shares : px;
    pl.realized += (px - avg) * q;
    pl.cost -= avg * q; pl.shares -= q;
    if (pl.shares <= 0) { pl.shares = 0; pl.cost = 0; }
  }
  // 吃掉对面排队的单（涨停时卖给排队买的人，跌停时买排队卖的人），价格不动
  function eatQueue(S, Q, side, q, px, taker, hidden) {
    let left = q;
    while (left > 0 && Q.length) {
      const o = Q[0], m = Math.min(left, o.q), maker = S.pl[o.id];
      if (side === 'sell') { // 吃排队买单：maker 买入
        maker.resCash -= m * px; maker.qBuy -= m;
        maker.shares += m; maker.cost += m * px;
        logTrade(S, maker, 'buy', m, px, 'qfill');
      } else { // 吃排队卖单：maker 卖出
        maker.qSell -= m;
        maker.cash += m * px;
        if (o.h) { maker.hidden -= m; maker.hidCash += m * px; }
        else { const avg = maker.shares > 0 ? maker.cost / maker.shares : px; maker.realized += (px - avg) * m; maker.cost -= avg * m; maker.shares -= m; if (maker.shares <= 0) { maker.shares = 0; maker.cost = 0; } }
        logTrade(S, maker, 'sell', m, px, o.h ? 'dump' : 'qfill');
      }
      o.q -= m; left -= m;
      if (o.q <= 0) Q.shift();
    }
    const done = q - left;
    if (taker && done > 0) { credit(taker, side, done, px, !!hidden); logTrade(S, taker, side, done, px, hidden ? 'dump' : 'mkt'); }
    return done;
  }
  function cancelSide(S, pl, side) {
    if (side === 'buy' && pl.qBuy > 0) {
      S.buyQ = S.buyQ.filter((o) => o.id !== pl.id);
      pl.cash += pl.resCash; pl.resCash = 0; pl.qBuy = 0;
    }
    if (side === 'sell' && pl.qSell > 0) {
      S.sellQ = S.sellQ.filter((o) => o.id !== pl.id);
      pl.qSell = 0;
    }
  }

  // 市价单。id = -1 是场外资金（钱和股票无限，不排队）。返回 { q 成交, px 均价, queued 排队 }
  function order(S, id, side, want, hidden) {
    const pl = id >= 0 ? S.pl[id] : null;
    let q = Math.max(0, Math.floor(want));
    const lam = S.cfg.lambda;
    let filled = 0, value = 0, queued = 0;
    const take = (n, px) => { filled += n; value += n * px; };
    if (pl) {
      if (!pl.active) return { q: 0, px: 0, queued: 0 };
      if (side === 'buy') {
        if (pl.qSell > 0) cancelSide(S, pl, 'sell');
      } else {
        if (pl.qBuy > 0) cancelSide(S, pl, 'buy');
        const avail = hidden ? pl.hidden - pl.qSell : pl.shares - pl.qSell;
        q = Math.min(q, Math.max(0, avail));
      }
      if (q <= 0) return { q: 0, px: 0, queued: 0 };
    }
    if (side === 'buy') {
      // 1) 跌停时先买排队卖的
      if (S.sellQ.length) {
        const n = Math.min(q, pl ? lot100(pl.cash / DOWN) : q);
        const got = eatQueue(S, S.sellQ, 'buy', n, DOWN, pl);
        take(got, DOWN); q -= got;
      }
      // 2) 推高价格
      if (q > 0 && S.x < XUP - 1e-12) {
        const room = (XUP - S.x) / lam;
        let n = Math.min(q, room);
        if (pl) { const aff = (Math.log(Math.exp(S.x) + (pl.cash * lam) / P0) - S.x) / lam; if (aff < n) n = lot100(aff); } // 钱不够时按整手（100 股）买
        n = Math.floor(n);
        const hit = n >= Math.floor(room) && q > n; // 买到涨停：价格贴住涨停价，剩下的去排队
        if (n > 0 || hit) {
          const x1 = hit ? XUP : Math.min(XUP, S.x + lam * n), px = avgPx(S.x, x1);
          S.x = x1; credit(pl, 'buy', n, px, false); logTrade(S, pl, 'buy', n, px, 'mkt'); take(n, px); q -= n;
        }
      }
      // 3) 涨停了就排队
      if (q > 0 && pl && S.x >= XUP - 1e-9) {
        const n = Math.min(q, lot100(pl.cash / UP));
        if (n > 0) { pl.cash -= n * UP; pl.resCash += n * UP; pl.qBuy += n; S.buyQ.push({ id: pl.id, q: n }); queued = n; }
      }
    } else {
      if (S.buyQ.length) { const got = eatQueue(S, S.buyQ, 'sell', q, UP, pl, hidden); take(got, UP); q -= got; }
      if (q > 0 && S.x > XDN + 1e-12) {
        const room = (S.x - XDN) / lam;
        const n = Math.floor(Math.min(q, room));
        const hit = n >= Math.floor(room) && q > n;
        if (n > 0 || hit) {
          const x1 = hit ? XDN : Math.max(XDN, S.x - lam * n), px = avgPx(x1, S.x);
          S.x = x1; credit(pl, 'sell', n, px, hidden); logTrade(S, pl, 'sell', n, px, hidden ? 'dump' : 'mkt'); take(n, px); q -= n;
        }
      }
      if (q > 0 && pl && S.x <= XDN + 1e-9) { pl.qSell += q; S.sellQ.push({ id: pl.id, q, h: !!hidden }); queued = q; }
    }
    if (pl && filled > 0) checkBust(S, pl, side, filled);
    return { q: filled, px: filled ? value / filled : 0, queued };
  }

  // 喊多以后马上卖（或喊空以后马上买）：被大家识破，之后喊单没人信
  function checkBust(S, pl, side, q) {
    const ls = pl.lastShout;
    const big = q >= 2000 || q >= 0.4 * (pl.shares + q);
    if (!ls || !big || S.t - ls.t > 50) return;
    const s = SHOUTS[ls.key].sent;
    if ((s >= 0.5 && side === 'sell') || (s <= -0.5 && side === 'buy')) {
      pl.lastShout = null; pl.busted++;
      for (const o of S.pl) if (o.id !== pl.id) o.trust[pl.id] = (o.trust[pl.id] == null ? 0.7 : o.trust[pl.id]) * 0.35;
      pushFeed(S, { kind: 'bust', id: pl.id, key: ls.key });
    }
  }

  function shout(S, id, key) {
    const sp = S.pl[id], sh = SHOUTS[key];
    if (!sp || !sh) return false;
    sp.lastShout = { t: S.t, key };
    for (const o of S.pl) {
      if (o.id === id || o.human || !o.active) continue;
      const A = ARCH[o.type];
      const tr = o.trust[id] == null ? 0.7 : o.trust[id];
      o.urge = clamp(o.urge + sh.sent * A.cred * tr, -1.5, 1.5);
    }
    const text = sp.human ? sh.human.replace(/^\S+\s/, '') : rpick(S, sh.lines); // 预演里也要抽，保证随机数顺序一致
    if (!S.inForecast) {
      S.shoutLog.push({ t: S.t, id, key, text });
      pushFeed(S, { kind: 'shout', id, key, text });
    }
    return true;
  }
  function pushFeed(S, ev) { if (!S.inForecast) { ev.t = S.t; S.feed.push(ev); } }

  // 庄家的底仓一次性砸出去（匿名）
  function dump(S, id) {
    const b = S.pl[id];
    if (!b || !b.banker || S.dumped || b.hidden <= 0) return null;
    S.dumped = true; S.dumpT = S.t;
    const before = priceOf(S.x);
    const r = order(S, id, 'sell', b.hidden, true);
    pushFeed(S, { kind: 'dump', id, q: b.hidden0, from: before, to: priceOf(S.x) });
    return r;
  }

  // ---------- 盘面特征（所有人都看得到的东西） ----------
  function features(S) {
    const hx = S.hx, n = hx.length - 1, x = S.x;
    const at = (k) => hx[Math.max(0, n - k)];
    let hi10 = -9, lo10 = 9;
    for (let i = Math.max(0, n - 100); i <= n; i++) { if (hx[i] > hi10) hi10 = hx[i]; if (hx[i] < lo10) lo10 = hx[i]; }
    let buys3 = 0, sells3 = 0;
    for (const r of S.recent) { if (r.q < 300) continue; if (r.side === 'buy') buys3++; else sells3++; }
    const sealQ = S.x >= XUP - 1e-9 ? qSum(S.buyQ) : 0;
    const prevSeal = S.sealHist.length > 20 ? S.sealHist[S.sealHist.length - 21] : 0;
    let inv = 0, eqs = 0;
    for (const p of S.pl) { if (!p.active) continue; const v = p.shares * priceOf(x); inv += v; eqs += p.cash - p.hidCash + p.resCash + v; }
    return {
      p: priceOf(x), m1: x - at(15), m3: x - at(40), m10: x - at(100), fromHi10: x - hi10, atHi10: x >= hi10 - 0.002,
      buys3, sells3, sealUp: S.x >= XUP - 1e-9 && S.buyQ.length > 0, sealQ, sealTrend: prevSeal > 0 ? sealQ / prevSeal - 1 : 0,
      sealDown: S.x <= XDN + 1e-9 && S.sellQ.length > 0, crowd: eqs > 0 ? inv / eqs : 0,
    };
  }

  // ---------- 对手怎么想 ----------
  function act(S, b, side, q) {
    q = lot100(q);
    if (q < 100) return null;
    const r = order(S, b.id, side, q);
    return r.q > 0 || r.queued > 0 ? side : null;
  }
  // 每个人一局大致是“等机会 → 分几笔进场 → 拿着 → 分几笔离场”，少数类型会再进一次
  function think(S, b, F) {
    const A = ARCH[b.type], t = S.t * DT, p = F.p;
    if (b.banker) return bankerThink(S, b, F);
    const eqv = b.cash + b.resCash + b.shares * p;
    const pos = (b.shares * p) / eqv;
    const free = b.shares - b.qSell;
    const ret = b.shares > 0 ? p / (b.cost / b.shares) - 1 : 0;
    b.peak = b.shares > 0 ? Math.max(b.peak, p) : p;
    const dd = p / b.peak - 1;
    // 涨停排队的买单：封单在减少、或者快收盘了，就撤
    if (b.qBuy > 0 && (F.sealTrend < -0.25 || t > b.exitT - 2) && rnd(S) < 0.4 + A.panic * 0.4) cancelSide(S, b, 'buy');
    let did = null, why = '';
    // ---- 离场 ----
    if (free >= 100) {
      let frac = 0;
      // 刚喊完多，先不好意思卖；听信了别人喊“别卖”的，也会多拿一会儿
      const honest = S.t < (b.honestUntil || 0) || (b.urge > 0.3 && rnd(S) < b.urge * A.cred);
      if (t >= b.exitT) {
        const keep = F.sealUp && F.sealQ >= S.cfg.sealHold && b.holdRoll < A.holdSeal;
        if (!keep) { frac = rr(S, 0.45, 1); why = 'exit'; }
      }
      if (!frac && ret <= A.sl && rnd(S) < 0.7) { frac = b.type === 'diamond' ? 0.5 : rr(S, 0.6, 1); why = 'stop'; }
      if (!frac && dd <= -A.dd && rnd(S) < 0.6) { frac = rr(S, 0.5, 1); why = 'trail'; }
      if (!frac && S.fear * A.panic > 0.35 + rnd(S) * 0.6) { frac = rr(S, 0.4, 0.9); why = 'fear'; }
      if (!frac && b.newsAt >= 0 && S.t >= b.newsAt && b.newsSign < 0 && rnd(S) < A.news) { frac = rr(S, 0.5, 1); why = 'news'; }
      if (!frac && !honest && b.urge < -0.3 && rnd(S) < -b.urge * A.cred) { frac = rr(S, 0.3, 0.7); why = 'urge'; }
      if (!frac && !honest && ret >= b.tp && rnd(S) < 0.6) { frac = rr(S, 0.4, 0.75); why = 'tp'; b.tp *= 1.4; }
      if (!frac && !honest) {
        if (b.type === 'momentum' && F.m3 < -0.009 && rnd(S) < 0.6) { frac = rr(S, 0.5, 1); why = 'mom'; }
        if (b.type === 'herd' && F.sells3 - F.buys3 >= 3 && rnd(S) < 0.6) { frac = rr(S, 0.5, 1); why = 'herd'; }
        if (b.type === 'fund' && S.sealHist.length && b.wasSealed && !F.sealUp && F.fromHi10 < -0.015 && rnd(S) < 0.5) { frac = rr(S, 0.6, 1); why = 'break'; }
        if (b.type === 'influencer' && ret >= b.tp * 0.7 && F.buys3 >= 1 && rnd(S) < 0.5) { frac = rr(S, 0.4, 0.7); why = 'bluff'; }
        if (b.type === 'gambler' && rnd(S) < 0.06) { frac = rr(S, 0.5, 1); why = 'yolo'; }
      }
      if (frac) {
        did = act(S, b, 'sell', Math.max(100, free * frac));
        if (did && b.shares - b.qSell < 100) { b.phase = 'out'; b.reentryAt = S.t + Math.round(rr(S, 6, 12) / DT); }
      }
    }
    if (F.sealUp && b.shares > 0) b.wasSealed = true;
    if (b.newsAt >= 0 && S.t >= b.newsAt) {
      if (!did && b.newsSign > 0 && pos < A.maxPos && rnd(S) < A.news * 0.6 && t < b.exitT - 8) did = act(S, b, 'buy', (b.cash / p) * A.lot);
      b.newsAt = -1;
    }
    // ---- 进场 ----
    if (!did && t < b.exitT - 8 && t < 82) {
      if (b.phase === 'wait' || (b.phase === 'out' && S.t >= (b.reentryAt || 1e9) && b.entries < A.reentry + 1)) {
        let go = false;
        switch (b.type) {
          case 'influencer': go = b.entries === 0 ? t >= b.readyT : F.fromHi10 < -0.05 && t < 66; break;
          case 'diamond': case 'steady': go = t >= b.readyT && F.m10 > -0.02; break;
          case 'momentum': go = t > 3 && F.m3 > 0.006; break;
          case 'follower': go = b.urge > 0.35 || F.m10 > 0.045; break;
          case 'herd': go = F.buys3 - F.sells3 >= 2 || F.m10 > 0.06; break;
          case 'whale': go = (p >= P0 * 1.05 && F.m3 > 0.003) || b.urge > 0.6; break;
          case 'scalper': go = F.m1 > 0.002; break;
          case 'dip': go = F.fromHi10 < -0.045 && F.m1 > -0.002; break;
          case 'panicky': go = t < 40 && F.m3 > 0.005; break;
          case 'quant': go = t > 5 && F.atHi10 && F.m3 > 0.004; break;
          case 'gambler': go = t >= b.readyT; break;
          case 'fund': go = F.sealUp || F.m10 > 0.05; break;
          default: break;
        }
        if (b.joinT > 0 && b.entries === 0 && t - b.joinT < 8 && p >= P0 * 0.98) go = go || rnd(S) < 0.8; // 刚进场的人最上头
        if (b.urge > 0.45 && rnd(S) < b.urge * A.cred) go = true; // 被喊单带进场
        if (go && rnd(S) < 0.85) { b.phase = 'in'; b.entries++; b.target = A.maxPos * rr(S, 0.6, 1); }
      }
      if (b.phase === 'in') {
        if (pos >= b.target - 0.04 || b.cash < p * 100) b.phase = 'hold';
        else if (F.m3 < -0.008 && b.type !== 'dip' && b.type !== 'diamond') { /* 正在跌，先等等 */ }
        else if (rnd(S) < 0.75) {
          const room = Math.max(0, b.target - pos) * eqv / p;
          did = act(S, b, 'buy', Math.min(room, (b.cash / p) * A.lot * rr(S, 0.8, 1.3) * (b.joinT > 0 && b.entries === 1 ? 1.4 : 1)));
          if (!did && S.x >= XUP - 1e-9 && b.type !== 'steady' && b.type !== 'scalper') did = null;
        }
      }
    }
    botShout(S, b, F, did, ret, why);
    return did;
  }

  function botShout(S, b, F, did, ret, why) {
    const A = ARCH[b.type];
    if (b.lastSpoke != null && S.t - b.lastSpoke < 70) return;
    let key = null;
    const pr = A.shout;
    if (b.type === 'influencer') {
      if (did === 'sell' && rnd(S) < 0.8) key = rpick(S, ['pump', 'hold', 'target']); // 嘴上喊冲，手上在卖
      else if (did === 'buy' && rnd(S) < 0.6) key = rpick(S, ['pump', 'target']);
      else if (b.shares === 0 && F.m3 < -0.02 && rnd(S) < 0.25) key = 'gloat';
    } else if (did === 'buy' && rnd(S) < pr) key = rpick(S, ['pump', 'target', 'hold']);
    else if (did === 'sell' && rnd(S) < pr * 1.2) key = why === 'tp' && F.m3 >= 0 ? 'leek' : 'run';
    else if (b.shares > 0 && F.sealUp && rnd(S) < pr * 0.6) key = b.type === 'diamond' ? 'diamond' : 'hold';
    else if (b.shares > 0 && F.m1 < -0.012 && rnd(S) < pr) key = b.type === 'diamond' ? 'diamond' : 'cry';
    else if (b.shares === 0 && b.realized > 1500 && F.m3 < -0.015 && rnd(S) < pr * 0.8) key = 'gloat';
    if (!key) return;
    b.lastSpoke = S.t;
    if (SHOUTS[key].sent >= 0.5 && b.type !== 'influencer' && b.type !== 'gambler') b.honestUntil = S.t + 50;
    shout(S, b.id, key);
  }

  // 庄家：能看到未来 5 秒（假设自己不动），拉高、先卖明仓、再匿名砸底仓，跌深了再接回来
  function bankerThink(S, b, F) {
    if (S.inForecast) return null;
    const t = S.t * DT, p = F.p;
    const fc = forecast(S, 50, b.id);
    let hi = -9, lo = 9;
    for (const v of fc) { if (v > hi) hi = v; if (v < lo) lo = v; }
    const up = hi - S.x, dn = lo - S.x, end = fc[fc.length - 1] - S.x;
    const eqv = b.cash + b.resCash + b.shares * p, pos = (b.shares * p) / eqv, free = b.shares - b.qSell;
    let did = null;
    if (!S.dumped) {
      const peakish = p >= P0 * 1.07 && t > 25 && (dn < -0.02 || up < 0.003);
      if (peakish || t > 74) {
        if (free >= 100) { did = act(S, b, 'sell', free); if (did && rnd(S) < 0.5) { b.lastSpoke = S.t; shout(S, b.id, rpick(S, ['hold', 'pump'])); } b.dumpAt = S.t + Math.round(rr(S, 1.5, 6) / DT); }
        else if (S.t >= (b.dumpAt || 0)) { dump(S, b.id); did = 'dump'; }
      } else if (t < 55 && pos < 0.85 && end > -0.004 && p < P0 * 1.12) {
        did = act(S, b, 'buy', (b.cash / p) * 0.3);
        if (did && (b.lastSpoke == null || S.t - b.lastSpoke > 60) && rnd(S) < 0.45) { b.lastSpoke = S.t; shout(S, b.id, rpick(S, ['pump', 'target'])); }
      }
    } else {
      const ret = b.shares > 0 ? p / (b.cost / b.shares) - 1 : 0;
      if (free >= 100 && (dn < -0.015 || t >= 84 || ret > 0.05)) did = act(S, b, 'sell', free);
      else if (t < 82 && p <= P0 * 0.97 && end > 0.01 && pos < 0.5) did = act(S, b, 'buy', (b.cash / p) * 0.35);
      if ((b.lastSpoke == null || S.t - b.lastSpoke > 50) && S.t - S.dumpT < 40 && rnd(S) < 0.25) { b.lastSpoke = S.t; shout(S, b.id, rpick(S, ['run', 'banker'])); }
    }
    return did;
  }

  // ---------- 推进一格（0.1 秒） ----------
  function step(S) {
    if (S.t >= TICKS) return false;
    S.t++;
    const t = S.t * DT;
    // 中途进场
    for (const p of S.pl) {
      if (p.active || p.joinT <= 0) continue;
      if (t >= p.joinT) {
        if (S.x < -0.03 && t < 60) { p.joinT += 5; continue; } // 正在跌，晚点再来
        p.active = true; p.peak = priceOf(S.x); p.nextThink = S.t + Math.round(rr(S, 0.3, 1.2) / DT);
        pushFeed(S, { kind: 'join', id: p.id });
      }
    }
    // 盘中消息
    if (S.news && S.t === S.news.t) {
      S.f += S.news.df;
      pushFeed(S, { kind: 'news', sign: S.news.sign, text: S.news.text });
      for (const p of S.pl) if (!p.human && p.active) { p.newsAt = S.t + Math.round(rr(S, 0.6, 3.5) / DT); p.newsSign = S.news.sign; }
    }
    // 场外资金：拉回价值 + 一点跟风 + 随机
    const hx = S.hx, n = hx.length - 1;
    const m3 = S.x - hx[Math.max(0, n - 40)];
    const H = S.hype, tt = S.t * DT;
    const bump = tt <= H.peak ? Math.sin((Math.PI / 2) * (tt / H.peak)) : Math.max(0, Math.cos((Math.PI / 2) * Math.min(1, (tt - H.peak) / H.fade)));
    const fNow = S.f + H.h * bump;
    const dx = (-(S.x - fNow) / TAU + TREND * (m3 / 4)) * DT + NOISE * Math.sqrt(DT) * rnorm(S);
    const qOut = Math.abs(dx) / S.cfg.lambda;
    if (qOut >= 1) order(S, -1, dx > 0 ? 'buy' : 'sell', qOut);
    // 恐慌：价格跌得越快越怕，慢慢消退
    const m1 = S.x - hx[Math.max(0, n - 15)];
    S.fear = Math.max(0, S.fear * Math.exp(-DT / 2.5) + Math.max(0, -m1 - 0.006) * 2.2);
    // 对手决策
    const F = features(S);
    for (const p of S.pl) {
      if (p.human || !p.active || S.t < p.nextThink) continue;
      if (S.inForecast && p.id === S.passiveId) { p.nextThink = S.t + 5; continue; }
      think(S, p, F);
      const A = ARCH[p.type];
      p.nextThink = S.t + Math.max(1, Math.round(rr(S, A.think[0], A.think[1]) / DT));
    }
    // 喊单效果衰减，信任慢慢恢复
    const decay = Math.exp(-DT / 3.5);
    for (const p of S.pl) {
      p.urge *= decay;
      for (const k in p.trust) if (p.trust[k] < 0.7) p.trust[k] = Math.min(0.7, p.trust[k] + 0.004);
    }
    // 封板 / 炸板
    const st = S.x >= XUP - 1e-9 && S.buyQ.length ? 'up' : S.x <= XDN + 1e-9 && S.sellQ.length ? 'down' : null;
    if (st !== S.seal) {
      if (st) pushFeed(S, { kind: 'seal', dir: st });
      else if (S.seal) pushFeed(S, { kind: 'break', dir: S.seal });
      S.seal = st;
    }
    S.sealHist.push(S.x >= XUP - 1e-9 ? qSum(S.buyQ) : 0);
    if (S.sealHist.length > 60) S.sealHist.shift();
    while (S.recent.length && S.t - S.recent[0].t > 30) S.recent.shift();
    hx.push(S.x);
    if (S.t >= TICKS) S.over = true;
    return true;
  }

  // ---------- 预演未来（庄家的“透视”） ----------
  function cloneState(S) {
    const C = Object.assign({}, S);
    C.pl = S.pl.map((p) => Object.assign({}, p, { trust: Object.assign({}, p.trust), lastShout: p.lastShout ? Object.assign({}, p.lastShout) : null }));
    C.buyQ = S.buyQ.map((o) => Object.assign({}, o));
    C.sellQ = S.sellQ.map((o) => Object.assign({}, o));
    C.hx = S.hx.slice(-120);
    C.recent = S.recent.slice();
    C.sealHist = S.sealHist.slice();
    C.log = []; C.feed = []; C.shoutLog = [];
    return C;
  }
  function forecast(S, ticks, passiveId) {
    const C = cloneState(S);
    C.inForecast = true; C.passiveId = passiveId == null ? -1 : passiveId;
    const out = [];
    for (let k = 0; k < ticks && C.t < TICKS; k++) { step(C); out.push(C.x); }
    if (!out.length) out.push(S.x);
    return out;
  }

  // ---------- 收盘结算 ----------
  function settle(S) {
    const pClose = priceOf(S.x);
    const upQ = S.x >= XUP - 1e-9 ? qSum(S.buyQ) : 0, dnQ = S.x <= XDN + 1e-9 ? qSum(S.sellQ) : 0;
    for (const p of S.pl) { cancelSide(S, p, 'buy'); cancelSide(S, p, 'sell'); }
    let next, kind;
    if (upQ >= S.cfg.sealHold) { kind = 'board'; next = UP * (1 + 0.03 + 0.07 * Math.min(1, upQ / (0.2 * S.cfg.capTotal))); }
    else if (dnQ >= S.cfg.sealHold) { kind = 'down'; next = DOWN * (1 - 0.03 - 0.07 * Math.min(1, dnQ / (0.2 * S.cfg.capTotal))); }
    else { kind = 'fade'; next = P0 * Math.exp(S.f + 0.2 * (S.x - S.f) + 0.015 * rnorm(S)); }
    next = Math.round(next * 100) / 100;
    let hiT = 0, loT = 0;
    for (let i = 1; i < S.hx.length; i++) { if (S.hx[i] > S.hx[hiT]) hiT = i; if (S.hx[i] < S.hx[loT]) loT = i; }
    const res = { close: pClose, next, kind, sealUpQ: upQ, sealDownQ: dnQ, hi: priceOf(S.hx[hiT]), hiT, lo: priceOf(S.hx[loT]), loT, players: [] };
    for (const p of S.pl) {
      const start = CASH0 + p.hidden0 * P0;
      const fin = p.cash + (p.shares + p.hidden) * next;
      res.players.push({ id: p.id, pnl: fin - start, pct: (fin - start) / start * 100, held: p.shares, start, fin, visPnl: p.cash - p.hidCash + p.shares * next - CASH0 });
    }
    res.clues = clues(S, res);
    S.result = res;
    return res;
  }

  // 线索：卖点准不准、砸盘前有没有先跑、喊多又卖几次
  function clues(S, res) {
    const out = {};
    const pAt = (tk) => priceOf(S.hx[Math.min(S.hx.length - 1, Math.max(0, tk))]);
    for (const p of S.pl) {
      const mine = S.log.filter((r) => r.id === p.id && r.kind !== 'dump');
      let edge = 0, w = 0, topSells = 0, preDump = 0, sold = 0, bought = 0;
      for (const r of mine) {
        const later = pAt(r.t + 50), chg = later / r.px - 1;
        edge += (r.side === 'sell' ? -chg : chg) * r.q; w += r.q;
        if (r.side === 'sell') { sold += r.q; if (r.px >= res.hi * 0.975) topSells += r.q; if (S.dumpT >= 0 && r.t <= S.dumpT && r.t >= S.dumpT - 80) preDump += r.q; }
        else bought += r.q;
      }
      out[p.id] = { edge: w ? (edge / w) * 100 : 0, topSells, preDump, busted: p.busted, sold, bought, trades: mine.length };
    }
    return out;
  }

  // ---------- 投票揪庄家 ----------
  // humanVote：你投的人（你当庄家时传 null）。返回每个人的票、被揪出的人、庄家是谁、分钱结果
  // humanVote：单机传你投的人（你当庄家时传 null）；联机传 { 玩家id: 投给谁 }，没投的真人算弃权
  function vote(S, humanVote) {
    const hv = humanVote != null && typeof humanVote === 'object' ? humanVote : { 0: humanVote };
    const res = S.result, C = res.clues;
    const voters = S.pl.filter((p) => p.active || p.joinT <= DUR);
    const cand = S.pl;
    const visPnl = {};
    for (const r of res.players) visPnl[r.id] = r.visPnl;
    const pnls = cand.map((p) => visPnl[p.id]);
    const mean = pnls.reduce((a, b) => a + b, 0) / pnls.length;
    const sd = Math.sqrt(pnls.reduce((a, b) => a + (b - mean) * (b - mean), 0) / pnls.length) || 1;
    // 每个人看重的线索不一样：有人只看谁赚得多，有人盯着砸盘前谁先跑，有人记仇喊单骗人的
    const sus = (p, w) => {
      const c = C[p.id];
      return w[0] * ((visPnl[p.id] - mean) / sd) + 0.15 * c.edge + (c.preDump > 0 ? w[1] * (1 + Math.min(0.8, c.preDump / 8000)) : 0) + w[2] * c.busted + (c.topSells > 0 ? 0.35 : 0) +
        (p.type === 'diamond' && c.sold > 0 && c.topSells > 0 ? 0.5 : 0);
    };
    const tally = {};
    const ballots = [];
    for (const v of voters) {
      let pick = null;
      if (v.human) { pick = hv[v.id]; if (pick == null || pick === v.id || !S.pl[pick]) pick = null; }
      else {
        let best = -1e9;
        const w = [rr(S, 0, 0.8), rr(S, 0.3, 1.8), rr(S, 0.1, 1.1)];
        for (const c of cand) {
          if (c.id === v.id) continue;
          let s = sus(c, w) + rnorm(S) * (1.1 + 0.9 * (ARCH[v.type] ? ARCH[v.type].cred : 0.5));
          if (v.banker && c.banker) s = -1e9;
          if (v.banker && c.human) s += 0.6; // 庄家想甩锅给你
          if (s > best) { best = s; pick = c.id; }
        }
      }
      if (pick == null) continue;
      ballots.push({ from: v.id, to: pick });
      tally[pick] = (tally[pick] || 0) + 1;
    }
    let top = -1, topN = 0, tie = false;
    for (const k in tally) { if (tally[k] > topN) { topN = tally[k]; top = +k; tie = false; } else if (tally[k] === topN) tie = true; }
    const caught = !tie && top === S.bankerId;
    const out = { ballots, tally, accused: tie ? -1 : top, caught, tie, bankerId: S.bankerId, split: 0, seized: 0 };
    const bk = res.players.find((r) => r.id === S.bankerId);
    if (caught && bk && bk.pnl > 0) {
      const retail = res.players.filter((r) => r.id !== S.bankerId);
      out.seized = bk.pnl; out.split = bk.pnl / retail.length;
      bk.pnl = 0; bk.pct = 0;
      for (const r of retail) { r.pnl += out.split; r.pct = (r.pnl / r.start) * 100; }
    }
    res.vote = out;
    return out;
  }

  // 名次：按盈亏排，最后一名戴韭菜头套
  function ranking(S) {
    return S.result.players.slice().sort((a, b) => b.pnl - a.pnl);
  }

  App.BagEngine = {
    DT, DUR, TICKS, P0, UP, DOWN, XUP, XDN, CASH0, LOT, CAST, ARCH, SHOUTS, HUMAN_SHOUTS,
    create, addHuman, step, order, cancelSide, shout, dump, forecast, settle, vote, ranking, features, priceOf, qSum,
  };
})(typeof window !== 'undefined' ? window : globalThis);

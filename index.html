<style>
/* 股市游乐场 · 原型样式（红涨绿跌） */
:root {
  --bg: #0b0e14;
  --card: #161b25;
  --card2: #1c2230;
  --line: #262d3c;
  --text: #e9ecf3;
  --sub: #8a93a8;
  --dim: #5d6579;
  --up: #f5474b;
  --down: #17b26a;
  --gold: #ffb31a;
  --blue: #5b8cff;
  --num: "DIN Alternate", "DIN Condensed", "Bahnschrift", "Roboto Mono", "SF Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; background: #05070a; color: var(--text); overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
b { font-weight: 700; }
#app { position: relative; max-width: 520px; height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden;
  background: radial-gradient(120% 60% at 50% 0%, #182033 0%, var(--bg) 55%); }
@media (min-width: 560px) { #app { box-shadow: 0 0 0 1px var(--line), 0 0 80px rgba(0,0,0,0.6); } }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--sub); }
.small { font-size: 12px; color: var(--sub); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 6px; min-height: 54px; flex: none; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.06); display: grid; place-items: center; font-size: 20px; line-height: 1; flex: none; }
.icon-btn:active { background: rgba(255,255,255,0.14); }
.tb-title { flex: 1; min-width: 0; }
.tb-title .t1 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title .t2 { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-badge { font-size: 13px; font-weight: 700; color: var(--gold); }

/* ---------- buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 18px; border-radius: 14px; font-size: 16px; font-weight: 700;
  color: #1a1205; background: linear-gradient(180deg, #ffc84a, #ffa514); box-shadow: 0 6px 18px rgba(255,170,20,0.22), inset 0 1px 0 rgba(255,255,255,0.4); }
.btn:active { transform: translateY(1px) scale(0.99); filter: brightness(0.95); }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.btn.ghost { background: rgba(255,255,255,0.07); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.btn.ghost.on { box-shadow: inset 0 0 0 1.5px var(--gold); color: var(--gold); background: rgba(255,179,26,0.08); }
.btn.red { background: linear-gradient(180deg, #ff6a6d, #e8383c); color: #fff; box-shadow: 0 6px 18px rgba(245,71,75,0.3); }
.btn.block { width: 100%; }
.link-btn { display: block; margin: 4px auto 0; color: var(--sub); font-size: 14px; padding: 10px 14px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.08); color: var(--sub); white-space: nowrap; }
.chip.up { background: rgba(245,71,75,0.16); color: var(--up); }
.chip.down { background: rgba(23,178,106,0.16); color: var(--down); }
.chip.gold { background: rgba(255,179,26,0.16); color: var(--gold); }
.chip.blue { background: rgba(91,140,255,0.16); color: var(--blue); }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(4,6,10,0.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.overlay.show { display: flex; animation: fadeIn 0.2s ease; }
.overlay.center { align-items: center; }
.overlay.clear { background: rgba(4,6,10,0.35); -webkit-backdrop-filter: none; backdrop-filter: none; }
.overlay.passthru { pointer-events: none; }
.sheet { width: 100%; max-height: 94%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 18px 18px max(18px, env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,0.4); animation: slideUp 0.28s cubic-bezier(.2,.9,.3,1); }
.dialog { width: calc(100% - 40px); max-width: 380px; max-height: 90%; overflow-y: auto; background: var(--card); border-radius: 22px; padding: 20px; animation: popIn 0.25s cubic-bezier(.2,.9,.3,1.2); }
.dialog-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; text-align: center; }
.dialog-text { font-size: 14px; color: var(--sub); line-height: 1.6; text-align: center; margin-bottom: 14px; }
.dialog .btn { width: 100%; margin-top: 8px; }
.share-ta { width: 100%; height: 140px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 10px; font-size: 14px; line-height: 1.5; -webkit-user-select: text; user-select: text; resize: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- toast ---------- */
.toast-wrap { position: absolute; left: 0; right: 0; top: calc(max(10px, env(safe-area-inset-top)) + 54px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { max-width: 88%; padding: 9px 14px; border-radius: 12px; background: rgba(30,36,50,0.96); color: var(--text); font-size: 14px; font-weight: 600; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35); opacity: 0; transform: translateY(-8px); transition: opacity 0.22s ease, transform 0.22s ease; }
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: rgba(255,179,26,0.96); color: #1a1205; }
.toast.up { background: rgba(245,71,75,0.96); color: #fff; }
.toast.down { background: rgba(23,178,106,0.96); color: #fff; }
.toast.warn { background: rgba(255,140,30,0.97); color: #1a1205; }
.toast.big { font-size: 22px; font-weight: 800; padding: 10px 22px; letter-spacing: 2px; }

/* ---------- mascot ---------- */
.mascot svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ---------- home ---------- */
.home-wrap { flex: 1; overflow-y: auto; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.home-hero { text-align: center; padding-top: 4px; }
.hero-mascot { width: 84px; height: 100px; margin: 0 auto; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
.hero-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-top: 4px; background: linear-gradient(90deg, #ffd36b, #ff8a4c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }
.ticker { margin: 10px -16px 2px; overflow: hidden; white-space: nowrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.02); }
.ticker-inner { display: inline-block; padding: 7px 0; animation: marquee 36s linear infinite; font-size: 12px; }
.ticker-inner span { margin: 0 12px; color: var(--sub); }
.ticker-inner b { margin-left: 4px; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.game-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 16px 14px 16px 16px; border-radius: 20px;
  background: linear-gradient(160deg, var(--card2), var(--card)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.25); }
.game-card:active { transform: scale(0.985); }
.gc-icon { width: 58px; height: 58px; border-radius: 16px; flex: none; display: grid; place-items: center; }
.gc-icon svg { width: 40px; height: 40px; }
.gc-body { flex: 1; min-width: 0; }
.gc-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.gc-no { font-size: 12px; font-weight: 700; color: var(--gold); border: 1px solid rgba(255,179,26,0.5); border-radius: 6px; padding: 0 5px; line-height: 18px; }
.gc-desc { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
.gc-rec { font-size: 12px; color: var(--gold); margin-top: 6px; min-height: 16px; }
.gc-arrow { color: var(--dim); font-size: 24px; }
.home-foot { margin-top: auto; text-align: center; padding-top: 4px; }
.disclaimer { font-size: 11px; color: var(--dim); line-height: 1.6; padding: 0 10px; }

/* ---------- mode menu sheet ---------- */
.menu-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.menu-head .mascot { width: 62px; height: 74px; flex: none; }
.menu-title { font-size: 22px; font-weight: 800; }
.menu-sub { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
.mode-card { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--card2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); margin-bottom: 10px; }
.mode-card:active { transform: scale(0.985); }
.mc-title { font-size: 17px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mc-sub { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
.mc-rec { font-size: 12px; color: var(--gold); margin-top: 6px; }
.rules { margin: 6px 0 4px; background: rgba(255,255,255,0.03); border-radius: 14px; padding: 11px 14px; font-size: 13px; color: var(--sub); line-height: 1.65; }
.rules summary { color: var(--text); font-weight: 700; font-size: 14px; list-style: none; cursor: pointer; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary::after { content: " ▾"; color: var(--dim); }
.rules ul { margin: 8px 0 2px; padding-left: 18px; }
.rules li { margin-bottom: 4px; }
.rules b { color: var(--text); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 12px; }
.stat-row > div { background: var(--card2); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat-row b { display: block; font-size: 18px; }
.stat-row span { font-size: 11px; color: var(--sub); }

/* ---------- ① 按住别松手 ---------- */
#scr-hold { touch-action: none; }
.hold-quote { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px; flex: none; }
.q-price { font-size: 40px; font-weight: 700; line-height: 1; }
.q-chg { font-size: 15px; margin-top: 6px; }
.q-right { text-align: right; }
.q-clock { font-size: 22px; }
.q-state { margin-top: 8px; }
.hold-account { display: flex; justify-content: space-between; padding: 10px 16px 8px; font-size: 13px; color: var(--sub); flex: none; }
.hold-account .num { color: var(--text); font-size: 16px; margin-left: 6px; }
.hold-account .num.up { color: var(--up); } .hold-account .num.down { color: var(--down); }
.hold-stage { position: relative; flex: 1; min-height: 190px; margin: 0 8px; border-radius: 18px; background: rgba(255,255,255,0.025); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); overflow: hidden; transition: box-shadow 0.2s; }
#scr-hold.holding .hold-stage { box-shadow: inset 0 0 0 1.5px rgba(245,71,75,0.55), inset 0 0 44px rgba(245,71,75,0.16); }
#scr-hold.locked .hold-stage { box-shadow: inset 0 0 0 1.5px rgba(255,179,26,0.55), inset 0 0 44px rgba(255,179,26,0.12); }
.hold-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.news-layer { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.news { padding: 8px 10px; border-radius: 12px; background: rgba(18,22,32,0.94); box-shadow: 0 6px 20px rgba(0,0,0,0.4); font-size: 13px; line-height: 1.45; border-left: 3px solid var(--sub); animation: newsIn 0.25s ease; transition: opacity 0.3s, transform 0.3s; }
.news .tag { font-size: 11px; font-weight: 800; margin-right: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); }
.news.good { border-left-color: var(--up); } .news.good .tag { background: rgba(245,71,75,0.2); color: var(--up); }
.news.bad { border-left-color: var(--down); } .news.bad .tag { background: rgba(23,178,106,0.2); color: var(--down); }
.news.rumor { border-left-color: var(--gold); } .news.rumor .tag { color: var(--gold); background: rgba(255,179,26,0.16); }
.news.out { opacity: 0; transform: translateY(-6px); }
@keyframes newsIn { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
.seal-banner { position: absolute; left: 50%; bottom: 24%; transform: translateX(-50%); padding: 7px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; white-space: nowrap; display: none; pointer-events: none; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.seal-banner.show { display: block; }
.seal-banner.up { background: rgba(245,71,75,0.94); color: #fff; animation: pulse 1s infinite; }
.seal-banner.down { background: rgba(23,178,106,0.94); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.04); } }
.float-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float-txt { position: absolute; font-size: 14px; font-weight: 800; white-space: nowrap; animation: floatUp 1.1s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -42px); } }
.hold-pad { flex: none; height: 100px; margin: 8px 8px max(10px, env(safe-area-inset-bottom)); border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); position: relative; overflow: hidden; transition: background 0.15s; }
.pad-text { font-size: 18px; font-weight: 800; position: relative; }
.pad-sub { font-size: 12px; color: var(--sub); margin-top: 6px; position: relative; }
#scr-hold.holding .hold-pad { background: linear-gradient(180deg, rgba(245,71,75,0.38), rgba(245,71,75,0.18)); box-shadow: inset 0 0 0 1.5px rgba(245,71,75,0.75); }
#scr-hold.holding .pad-sub { color: rgba(255,255,255,0.75); }
#scr-hold.locked .hold-pad { background: linear-gradient(180deg, rgba(255,179,26,0.28), rgba(255,179,26,0.12)); box-shadow: inset 0 0 0 1.5px rgba(255,179,26,0.6); }
.pad-ring { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 2px solid rgba(245,71,75,0.7); opacity: 0; }
#scr-hold.holding .pad-ring { animation: ring 1.2s ease-out infinite; }
#scr-hold.locked .pad-ring { border-color: rgba(255,179,26,0.7); }
@keyframes ring { from { opacity: 0.8; transform: scale(0.6); } to { opacity: 0; transform: scale(3.4); } }
.count-box { text-align: center; padding: 0 24px; }
.count-num { font-size: 92px; font-weight: 800; color: var(--gold); text-shadow: 0 8px 30px rgba(255,179,26,0.35); animation: popIn 0.3s; line-height: 1.1; }
.count-num.up { color: var(--up); text-shadow: 0 8px 30px rgba(245,71,75,0.35); }
.count-num.down { color: var(--down); text-shadow: 0 8px 30px rgba(23,178,106,0.35); }
.count-info { font-size: 15px; margin-top: 10px; line-height: 1.7; }
.count-tip { font-size: 13px; color: var(--sub); margin-top: 14px; line-height: 1.5; }
.res-head { display: flex; align-items: center; gap: 14px; }
.res-mascot { width: 74px; height: 88px; flex: none; }
.res-title { font-size: 15px; font-weight: 800; color: var(--gold); }
.res-ret { font-size: 42px; font-weight: 800; line-height: 1.1; }
.res-eq { font-size: 13px; color: var(--sub); }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 10px; }
.res-stats > div { background: var(--card2); border-radius: 12px; padding: 10px 4px; text-align: center; }
.res-stats b { display: block; font-size: 18px; }
.res-stats span { font-size: 11px; color: var(--sub); }
.res-chart { width: 100%; height: 150px; display: block; border-radius: 12px; background: rgba(255,255,255,0.025); }
.moments { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.moment { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--card2); font-size: 13px; line-height: 1.5; color: var(--sub); }
.moment b { flex: none; color: var(--text); font-size: 12px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.08); }
.moment.up b { background: rgba(245,71,75,0.18); color: var(--up); }
.moment.down b { background: rgba(23,178,106,0.18); color: var(--down); }
.moment.gold b { background: rgba(255,179,26,0.18); color: var(--gold); }
.res-note { font-size: 11px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
.res-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 14px; }
.res-box { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,179,26,0.08); font-size: 13px; line-height: 1.6; }
.res-box.bad { background: rgba(23,178,106,0.1); }
.ad-box { text-align: center; }
.ad-screen { height: 180px; border-radius: 14px; background: repeating-linear-gradient(45deg, #1d2433, #1d2433 12px, #20283a 12px, #20283a 24px); display: grid; place-items: center; color: var(--sub); font-size: 14px; margin: 6px 0 10px; }

/* ---------- ④ 画出明天 ---------- */
.draw-info { padding: 0 16px 8px; flex: none; }
.di-q { font-size: 12px; color: var(--sub); }
.di-hint { font-size: 15px; font-weight: 700; margin-top: 3px; }
.draw-stage { position: relative; flex: none; height: 47%; min-height: 250px; margin: 0 8px; border-radius: 18px; background: rgba(255,255,255,0.025); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); overflow: hidden; touch-action: none; }
.draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.draw-prompt { position: absolute; right: 14px; top: 44%; font-size: 13px; font-weight: 700; color: var(--gold); pointer-events: none; animation: nudge 1.4s ease-in-out infinite; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
@keyframes nudge { 0%,100% { transform: translateX(0); opacity: 0.6; } 50% { transform: translateX(-6px); opacity: 1; } }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); padding: 7px 18px 0; flex-wrap: wrap; flex: none; min-height: 24px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.draw-bottom { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px max(14px, env(safe-area-inset-bottom)); }
.draw-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.draw-tips { font-size: 12px; color: var(--sub); line-height: 1.7; margin-top: 12px; }
.dr-top { display: flex; align-items: center; gap: 14px; }
.dr-score { font-size: 56px; font-weight: 800; color: var(--gold); line-height: 1; min-width: 70px; }
.dr-title { font-size: 18px; font-weight: 800; }
.dr-sub { font-size: 13px; color: var(--sub); margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.dr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }

<body>
<div id="app"></div>
<script>
/* 股市游乐场 · core：随机数、格式化、存储、音效、界面小工具、吉祥物 */
(function (root) {
  'use strict';
  const App = root.App || (root.App = {});

  // ---------- 可复现随机数（每日同题靠它） ----------
  function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }

  function makeRng(seed) {
    let a = (typeof seed === 'number' ? seed : hashStr(String(seed))) >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const rng = () => next();
    rng.range = (lo, hi) => lo + (hi - lo) * next();
    rng.int = (lo, hi) => lo + Math.floor((hi - lo + 1) * next());
    rng.pick = (arr) => arr[Math.floor(next() * arr.length)];
    rng.chance = (p) => next() < p;
    rng.sign = () => (next() < 0.5 ? -1 : 1);
    rng.normal = () => {
      let u = 0;
      while (u === 0) u = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * next());
    };
    rng.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    rng.weighted = (pairs) => {
      let total = 0;
      for (const p of pairs) total += p[0];
      let x = next() * total;
      for (const p of pairs) { x -= p[0]; if (x <= 0) return p[1]; }
      return pairs[pairs.length - 1][1];
    };
    return rng;
  }

  // ---------- 数学与格式化 ----------
  const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);
  const round2 = (x) => Math.round(x * 100) / 100;

  function fmtPct(p, d = 2) {
    if (!isFinite(p)) return '--';
    const v = Number(p.toFixed(d));
    if (v === 0) return (0).toFixed(d) + '%';
    return (v > 0 ? '+' : '') + v.toFixed(d) + '%';
  }
  function fmtMoney(x, d = 0) {
    if (!isFinite(x)) return '--';
    const neg = x < -1e-9;
    const s = Math.abs(x).toFixed(d);
    const parts = s.split('.');
    const int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '¥' + int + (parts[1] ? '.' + parts[1] : '');
  }
  function fmtWan(x) {
    if (x >= 1e8) return (x / 1e8).toFixed(2) + '亿';
    if (x >= 1e4) return (x / 1e4).toFixed(1) + '万';
    return String(Math.max(0, Math.round(x)));
  }
  const cls = (p) => (p > 0.0001 ? 'up' : p < -0.0001 ? 'down' : 'flat');
  function dateKey(d = new Date()) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayNumber(d = new Date()) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }
  const dateLabel = (d = new Date()) => (d.getMonth() + 1) + '月' + d.getDate() + '日';

  App.makeRng = makeRng;
  App.hashStr = hashStr;
  App.U = { clamp, lerp, smooth, round2, fmtPct, fmtMoney, fmtWan, cls, dateKey, dayNumber, dateLabel };

  // 画布配色（红涨绿跌）
  App.C = {
    up: '#f5474b', down: '#17b26a', gold: '#ffb31a', blue: '#5b8cff', text: '#e9ecf3', sub: '#8a93a8', dim: '#5d6579',
    grid: 'rgba(255,255,255,0.055)', bg: '#10131a',
    font: '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif',
    num: '"DIN Alternate", "Bahnschrift", "Roboto Mono", "SF Mono", monospace',
  };

  // ---------- 本地存储 ----------
  const PREFIX = 'gpy1_';
  App.store = {
    get(k, def) {
      try { const v = root.localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
    },
    set(k, v) { try { root.localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* 隐私模式 */ } },
    clearAll() {
      try { Object.keys(root.localStorage).filter((k) => k.indexOf(PREFIX) === 0).forEach((k) => root.localStorage.removeItem(k)); } catch (e) { /* ignore */ }
    },
  };

  // ---------- 合成音效（无需音频文件） ----------
  App.sfx = (function () {
    let ctx = null;
    let enabled = App.store.get('sound', true);
    function ensure() {
      if (!enabled) return null;
      if (!ctx) {
        const AC = root.AudioContext || root.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch (e) { return null; }
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, opt) {
      opt = opt || {};
      const c = ensure();
      if (!c) return;
      const t0 = c.currentTime + (opt.delay || 0);
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = opt.type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t0 + dur);
      const vol = opt.vol == null ? 0.07 : opt.vol;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    return {
      unlock: ensure,
      get enabled() { return enabled; },
      toggle() { enabled = !enabled; App.store.set('sound', enabled); if (enabled) ensure(); return enabled; },
      buy() { tone(523, 0.09, { type: 'triangle' }); tone(784, 0.12, { type: 'triangle', delay: 0.06 }); },
      sell() { tone(659, 0.09, { type: 'triangle' }); tone(440, 0.12, { type: 'triangle', delay: 0.06 }); },
      tap() { tone(880, 0.05, { vol: 0.04 }); },
      tick() { tone(1250, 0.03, { vol: 0.025 }); },
      news() { tone(1046, 0.07, { type: 'square', vol: 0.025 }); tone(1318, 0.09, { type: 'square', vol: 0.025, delay: 0.08 }); },
      alarm() { tone(880, 0.12, { type: 'sawtooth', vol: 0.035 }); tone(660, 0.16, { type: 'sawtooth', vol: 0.035, delay: 0.13 }); },
      good() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.15, { type: 'triangle', delay: i * 0.07 })); },
      bad() { [392, 330, 262].forEach((f, i) => tone(f, 0.22, { delay: i * 0.11, vol: 0.06 })); },
      count() { tone(660, 0.08, { vol: 0.05 }); },
      go() { tone(990, 0.2, { type: 'triangle', vol: 0.07 }); },
    };
  })();
  App.buzz = (ms) => { try { if (root.navigator && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } };

  // ---------- DOM 小工具 ----------
  App.el = function (html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  App.show = (node) => node && node.classList.add('show');
  App.hide = (node) => node && node.classList.remove('show');
  App.setText = (node, txt) => { if (node && node.textContent !== txt) node.textContent = txt; };
  App.setClass = (node, c) => { if (node && node.className !== c) node.className = c; };

  let toastWrap = null;
  App.toast = function (msg, kind, ms) {
    const app = document.getElementById('app');
    if (!toastWrap || !toastWrap.isConnected) { toastWrap = App.el('<div class="toast-wrap"></div>'); app.appendChild(toastWrap); }
    const t = App.el('<div class="toast ' + (kind || '') + '"></div>');
    t.innerHTML = msg;
    toastWrap.appendChild(t);
    while (toastWrap.children.length > 3) toastWrap.firstChild.remove();
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 260); }, ms || 1700);
  };

  App.fitCanvas = function (canvas) {
    const dpr = Math.min(root.devicePixelRatio || 1, 3);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(h * dpr));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h, dpr };
  };

  // ---------- 页面切换 ----------
  const screens = {};
  App.register = (id, mod) => { screens[id] = mod; };
  App.go = function (id, arg) {
    const prev = App.current;
    if (prev && screens[prev] && screens[prev].leave) screens[prev].leave();
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 'scr-' + id));
    App.current = id;
    if (screens[id] && screens[id].enter) screens[id].enter(arg);
  };

  // ---------- 分享 / 复制 ----------
  App.share = async function (text) {
    const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    if (navigator.share && mobile) {
      try { await navigator.share({ text }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    try {
      if (navigator.clipboard && root.isSecureContext) { await navigator.clipboard.writeText(text); App.toast('成绩已复制，去粘贴给朋友吧', 'ok'); return true; }
    } catch (e) { /* fall through */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) { App.toast('成绩已复制，去粘贴给朋友吧', 'ok'); return true; }
    const ov = App.el('<div class="overlay center show"><div class="dialog"><div class="dialog-title">长按复制成绩</div><textarea class="share-ta" readonly></textarea><button class="btn">好的</button></div></div>');
    ov.querySelector('textarea').value = text;
    ov.querySelector('button').onclick = () => ov.remove();
    document.getElementById('app').appendChild(ov);
    return false;
  };

  App.confirm = function (title, text, okText, onOk) {
    const ov = App.el('<div class="overlay center show"><div class="dialog"><div class="dialog-title"></div><div class="dialog-text"></div>' +
      '<button class="btn" data-k="ok"></button><button class="btn ghost" data-k="no">再想想</button></div></div>');
    ov.querySelector('.dialog-title').textContent = title;
    ov.querySelector('.dialog-text').innerHTML = text;
    ov.querySelector('[data-k=ok]').textContent = okText;
    ov.addEventListener('click', (e) => {
      const k = e.target.getAttribute('data-k');
      if (k === 'ok') { ov.remove(); onOk(); } else if (k === 'no' || e.target === ov) ov.remove();
    });
    document.getElementById('app').appendChild(ov);
  };

  App.confetti = function (host) {
    const box = App.el('<div class="confetti"></div>');
    const colors = ['#ffb31a', '#f5474b', '#ffd36b', '#ff8a4c', '#ffffff', '#5b8cff'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      p.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      box.appendChild(p);
    }
    (host || document.getElementById('app')).appendChild(box);
    setTimeout(() => box.remove(), 4200);
  };

  // ---------- 吉祥物：小韭菜（涨了支棱，跌了蔫掉） ----------
  let mascotId = 0;
  App.mascot = function (mood) {
    mood = mood || 'happy';
    const id = 'mg' + (++mascotId);
    const perky = [
      'M44 68 Q36 40 27 8 Q44 36 52 68 Z',
      'M46 68 Q47 30 53 2 Q57 30 56 68 Z',
      'M50 68 Q63 40 78 12 Q64 46 58 68 Z',
    ];
    const droopy = [
      'M44 68 Q28 34 8 58 Q32 44 52 68 Z',
      'M46 68 Q49 34 70 34 Q56 42 56 68 Z',
      'M50 68 Q74 40 94 62 Q70 50 58 68 Z',
    ];
    const leaves = (mood === 'sad' ? droopy : perky)
      .map((d) => '<path d="' + d + '" fill="#3cc46e" stroke="#1f8f4c" stroke-width="1.6" stroke-linejoin="round"/>').join('');
    let face;
    if (mood === 'happy') {
      face = '<path d="M38 88 Q42 82 46 88" stroke="#2b2b2b" stroke-width="2.8" fill="none" stroke-linecap="round"/>' +
        '<path d="M54 88 Q58 82 62 88" stroke="#2b2b2b" stroke-width="2.8" fill="none" stroke-linecap="round"/>' +
        '<path d="M44 95 Q50 103 56 95 Z" fill="#c2413a"/>';
    } else if (mood === 'sad') {
      face = '<circle cx="42" cy="89" r="3.2" fill="#2b2b2b"/><circle cx="58" cy="89" r="3.2" fill="#2b2b2b"/>' +
        '<path d="M44 101 Q50 94 56 101" stroke="#2b2b2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
        '<path d="M69 70 Q74 79 69 82 Q64 79 69 70 Z" fill="#7cc7ff"/>';
    } else if (mood === 'shock') {
      face = '<circle cx="42" cy="87" r="3.6" fill="#2b2b2b"/><circle cx="58" cy="87" r="3.6" fill="#2b2b2b"/>' +
        '<ellipse cx="50" cy="99" rx="4" ry="5" fill="#2b2b2b"/>';
    } else {
      face = '<circle cx="42" cy="88" r="3.2" fill="#2b2b2b"/><circle cx="58" cy="88" r="3.2" fill="#2b2b2b"/>' +
        '<path d="M45 98 L55 98" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round"/>';
    }

  // ---------- ① 模拟股民（用来算“跑赢了多少人”） ----------
  function simHold(day, policy, t1) {

    const P = day.price;
    for (let t = 0; t < N; t++) {

        cash = shares * P[t] * (1 - FEE); shares = 0; holding = false;
      }
    }
    if (!holding) return (cash - 1) * 100;
    return t1 ? (shares * day.nextOpen * (1 - FEE) - 1) * 100 : (shares * P[N - 1] - 1) * 100;
  }

  function makeBot(day, rng) {

    const type = rng.weighted([[30, 'random'], [15, 'news'], [20, 'mom'], [15, 'dip'], [10, 'chase'], [7, 'hold'], [3, 'none']]);
    switch (type) {
      case 'hold': return () => true;
      case 'none': return () => false;
      case 'random': {

        let s = rng.chance(0.4);

  function holdBots(day, t1, n) {
    n = n || 400;
    const key = t1 ? '_botsT1' : '_bots';
    if (day[key]) return day[key];
    const rng = App.makeRng(day.seed + (t1 ? ':botsT1' : ':bots'));

  function percentile(sorted, x) {

    }
    return ((below + eq * 0.5) / sorted.length) * 100;
  }

  // 事后诸葛亮：全知视角下的最优收益

      A = nA; B = nB;
    }
    return (Math.max(A, B * day.price[N - 1]) - 1) * 100;
  }
  function perfectT1(day) {
    let best = 0;
    for (let t = 0; t < N; t++) {
      if (day.sealUp[t]) continue;
      best = Math.max(best, ((1 - FEE) * (1 - FEE) * day.nextOpen / day.price[t] - 1) * 100);
    }
    return best;
  }

  // ---------- ⑤ 解套关卡：日线 + 日内路径 ----------
  function patternFn(pat, D, rng, cost) {
    const C = pat.center;
    const per = pat.period || 5, ph = pat.phase || 0, amp = pat.amp || 0;
    const sine = (d) => Math.sin((2 * Math.PI * d) / per + ph);
    switch (pat.type) {
      case 'sine': return (d) => C * (1 + amp * sine(d)) * Math.exp((pat.drift || 0) * d);
      case 'downtrend': return (d) => C * Math.exp((pat.drift || -0.006) * d) * (1 + amp * sine(d));
      case 'breakout': return (d) => {
        if (d < pat.start) return C * (1 + amp * sine(d));
        const u = Math.min(1, (d - pat.start) / pat.len);
        return C * (1 + amp * 0.4 * sine(d)) * (1 + pat.rise * smooth(u));
      };
      case 'fakeout': return (d) => {
        const s1 = pat.start, s2 = s1 + pat.len, s3 = s2 + pat.flen;
        if (d < s1) return C * (1 + amp * sine(d));
        if (d < s2) return C * (1 + pat.rise * smooth((d - s1) / pat.len));
        if (d < s3) return C * (1 + pat.rise - (pat.rise + pat.fall) * smooth((d - s2) / pat.flen));
        const r = Math.max(1, D - s3);
        return C * (1 - pat.fall + (pat.fall + (pat.rec || 0)) * smooth(Math.min(1, (d - s3) / r)));
      };
      case 'vshape': return (d) => {
        if (d < 0) return C * (1 + 0.035 * sine(d)) * (1 - 0.002 * d);
        if (d <= pat.bottom) return C * (1 - pat.drop * smooth(d / pat.bottom));
        return C * (1 - pat.drop + pat.rec * smooth(Math.min(1, (d - pat.bottom) / Math.max(1, D - pat.bottom - 2))));
      };
      case 'shakeout': {
        const shocks = pat.shocks || [];
        const shape = [1, 0.55, 0.2];
        return (d) => {
          let v = C * Math.exp((pat.drift || 0) * d) * (1 + amp * sine(d));
          for (const s of shocks) { const k = d - s; if (k >= 0 && k < shape.length) v *= 1 - pat.depth * shape[k]; }
          return v;
        };
      }
      case 'wild': { // 妖股：两段大振幅波动叠加，外加随机暴涨暴跌
        const jumps = {};
        for (let d = -40; d < D + 5; d++) if (rng.chance(pat.jumpP || 0.12)) jumps[d] = rng.sign() * rng.range(0.06, 0.1);
        let acc = 0;
        const cum = {};
        for (let d = -40; d < D + 5; d++) { acc = acc * 0.6 + (jumps[d] || 0); cum[d] = acc; }
        return (d) => C * (1 + amp * sine(d) + (pat.amp2 || 0) * Math.sin((2 * Math.PI * d) / (pat.period2 || 3.1) + 1.3)) * (1 + (cum[d] || 0));
      }
      default: return () => C;
    }
  }

  function genLevel(cfg, salt) {
    const rng = App.makeRng('lv:' + cfg.id + ':' + (cfg.seed || 1) + (salt || ''));
    const H = cfg.hist || 30, D = cfg.days, total = H + D;
    const pat = cfg.pattern;
    const fn = patternFn(pat, D, rng, cfg.cost);
    const target = new Float64Array(total);
    for (let i = 0; i < total; i++) target[i] = fn(i - H);
    // 历史开头：从买入价附近一路跌下来（“你就是在那儿站岗的”）
    const fall = Math.min(10, H - 1);
    for (let i = 0; i < fall; i++) target[i] = U.lerp(cfg.cost * 1.03, target[fall], smooth(i / fall));
    const days = [];
    let prev = target[0] * 1.01;
    for (let i = 0; i < total; i++) {
      const lo = round2(prev * 0.9), hi = round2(prev * 1.1);
      const c = clamp(target[i] * Math.exp((pat.noise == null ? 0.008 : pat.noise) * rng.normal()), lo, hi);
      const o = clamp(prev * Math.exp((pat.gap || 0.004) * rng.normal()), lo, hi);
      const M = 40, path = new Float64Array(M + 1);
      const sig = ((pat.intra || 0.02) * prev) / Math.sqrt(M) * 1.15;
      const W = [0];
      for (let k = 1; k <= M; k++) W.push(W[k - 1] + rng.normal() * sig);
      for (let k = 0; k <= M; k++) {
        const u = k / M;
        path[k] = round2(clamp(o + (c - o) * u + (W[k] - u * W[M]), lo, hi));
      }
      let h = -Infinity, l = Infinity;
      for (let k = 0; k <= M; k++) { if (path[k] > h) h = path[k]; if (path[k] < l) l = path[k]; }
      days.push({ o: path[0], h, l, c: path[M], prevClose: round2(prev), lo, hi, path });
      prev = path[M];
    }
    return { hist: days.slice(0, H), days: days.slice(H), H, D };
  }

  const LV_FEE = 0.001, LV_MIN_FEE = 5;
  const lvFee = (amount) => Math.max(LV_MIN_FEE, amount * LV_FEE);

  // 一天的撮合：挂单碰到即成交；今天买的明天才能卖（T+1）
  function runLevelDay(acct, day, orders, tradesLeft) {
    const a = { cash: acct.cash, shares: acct.shares };
    let sellable = acct.shares, left = tradesLeft;
    const fills = [], notes = [];
    let sellDone = !orders.sell, buyDone = !orders.buy;
    const P = day.path;
    for (let k = 0; k < P.length; k++) {
      const p = P[k];
      if (!sellDone && p >= orders.sell.price) {
        sellDone = true;
        const px = k === 0 ? p : orders.sell.price;
        const qty = Math.floor(Math.min(orders.sell.qty, sellable) / 100) * 100;
        if (left <= 0) notes.push('交易次数用完了，卖单没有成交');
        else if (qty < 100) notes.push('没有可卖的股票，卖单没有成交');
        else {
          const amt = qty * px, fee = lvFee(amt);
          a.cash += amt - fee; a.shares -= qty; sellable -= qty; left--;
          fills.push({ type: 'sell', qty, price: px, fee, k });
        }
      }
      if (!buyDone && p <= orders.buy.price) {
        buyDone = true;
        const px = k === 0 ? p : orders.buy.price;
        let qty = Math.floor(orders.buy.qty / 100) * 100;
        while (qty >= 100 && qty * px + lvFee(qty * px) > a.cash + 1e-6) qty -= 100;
        if (left <= 0) notes.push('交易次数用完了，买单没有成交');
        else if (qty < 100) notes.push('现金不够，买单没有成交');
        else {
          if (qty < orders.buy.qty) notes.push('现金只够买 ' + qty + ' 股');
          const amt = qty * px, fee = lvFee(amt);
          a.cash -= amt + fee; a.shares += qty; left--;
          fills.push({ type: 'buy', qty, price: px, fee, k });
        }
      }
    }
    return { acct: a, fills, notes, tradesUsed: tradesLeft - left };
  }

  // ---------- ④ 模拟“全服玩家”的预测分布 ----------
  function crowdPredictions(closes, seed, n, F) {
    n = n || 260; F = F || 20;
    const rng = App.makeRng(seed);
    const L = closes.length;
    const last = closes[L - 1];
    const slope10 = (last - closes[Math.max(0, L - 11)]) / 10;
    const chg15 = last - closes[Math.max(0, L - 16)];
    let mean30 = 0;
    for (let i = Math.max(0, L - 30); i < L; i++) mean30 += closes[i];
    mean30 /= Math.min(30, L);
    let vol = 0;
    for (let i = Math.max(1, L - 30); i < L; i++) vol += Math.abs(closes[i] - closes[i - 1]);
    vol = Math.max(0.4, vol / Math.min(29, L - 1));
    const out = [];
    for (let k = 0; k < n; k++) {
      const type = rng.weighted([[30, 'trend'], [20, 'revert'], [20, 'contra'], [15, 'random'], [10, 'opt'], [5, 'pes']]);
      const path = new Float64Array(F);
      let y = last, w = 0;
      const nz = vol * rng.range(0.25, 0.7);
      const kScale = rng.range(0.35, 1.1);
      const rate = rng.range(0.08, 0.3);
      const target = chg15 < -6 ? rng.range(3, 10) : chg15 > 6 ? -rng.range(3, 10) : rng.range(-3, 3);
      const drift = rng.range(0.15, 0.5);
      for (let d = 1; d <= F; d++) {
        w = 0.7 * w + nz * rng.normal();
        switch (type) {
          case 'trend': y = last + slope10 * kScale * d; break;
          case 'revert': y += (mean30 - y) * rate; break;
          case 'contra': y = last + target * smooth(d / F); break;
          case 'random': y += vol * 0.9 * rng.normal(); break;
          case 'opt': y += drift; break;
          default: y -= drift;
        }
        path[d - 1] = y + w - last;
      }
      out.push(path);
    }
    return out;
  }

  // ---------- ④ 评分 ----------
  function scoreDrawing(pred, actual) {
    const F = pred.length;
    const pe = pred[F - 1], ae = actual[F - 1];
    const dir = (x) => (x > 1.5 ? 1 : x < -1.5 ? -1 : 0);
    const dp = dir(pe), da = dir(ae);
    let dirScore;
    if (dp === da) dirScore = 1;
    else if (dp === 0 || da === 0) dirScore = Math.sign(pe) === Math.sign(ae) ? 0.5 : 0.25;
    else dirScore = 0;
    let maxAbs = 0;
    for (const v of actual) maxAbs = Math.max(maxAbs, Math.abs(v));
    const scale = Math.max(6, 0.6 * maxAbs);
    const endErr = Math.abs(pe - ae);
    const endScore = Math.max(0, 1 - endErr / (scale * 1.6));
    let mae = 0;
    for (let i = 0; i < F; i++) mae += Math.abs(pred[i] - actual[i]);
    mae /= F;
    const shapeScore = Math.max(0, 1 - mae / (scale * 1.3));
    let mp = 0, ma = 0;
    for (let i = 0; i < F; i++) { mp += pred[i]; ma += actual[i]; }
    mp /= F; ma /= F;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < F; i++) { const x = pred[i] - mp, y = actual[i] - ma; sxy += x * y; sxx += x * x; syy += y * y; }
    const corr = sxx > 1e-6 && syy > 1e-6 ? sxy / Math.sqrt(sxx * syy) : 0;
    const score = Math.round(100 * (0.35 * dirScore + 0.25 * endScore + 0.25 * shapeScore + 0.15 * Math.max(0, corr)));
    return { score, dirScore, dirPred: dp, dirAct: da, endErr, mae, corr, predEnd: pe, actEnd: ae };
  }

        const h = Math.max(o, c) * Math.exp(Math.abs(rng.normal()) * vol * 0.5);

  function onClick(e) {
    const b = e.target.closest('[data-act],[data-mode]');
    if (!b) return;
    const act = b.getAttribute('data-act'), mode = b.getAttribute('data-mode');
    if (mode) { App.hide(els.menu); startSession(mode); return; }
    switch (act) {
      case 'back': if (S && S.phase === 'run') pause(); else if (S && (S.phase === 'count' || S.phase === 'resume')) quitToMenu(); else App.go('home'); break;
      case 'pause': if (S && S.phase === 'run') pause(); break;
      case 'home': App.go('home'); break;
      case 'resume': resume(); break;
      case 'restart': App.hide(els.pause); startSession(S.mode); break;
      case 'quit': quitToMenu(); break;
      case 'share': App.share(shareText()); break;
      case 'again': again(); break;
      case 'menu': quitToMenu(); break;
      case 'revive': revive(); break;
      case 'newcareer': saveCareer(Object.assign(loadCareer(), { id: Date.now().toString(36), day: 1, equity: START_CASH, peak: START_CASH, revived: false, over: false, wins: 0 })); App.hide(els.result); startSession('career'); break;
      default: break;
    }
  }

  // ---------- 按压 ----------
  const isUi = (e) => !!e.target.closest('.topbar, .overlay.show, button, summary, a');
  function onDown(e) {
    if (!S || isUi(e)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    active.add(e.pointerId);
    try { scr.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    e.preventDefault();
    setPressing(true);
  }
  function onUp(e) {
    if (!active.has(e.pointerId)) return;
    active.delete(e.pointerId);
    if (active.size === 0) setPressing(false);
  }
  function releaseAll() { active.clear(); setPressing(false); }
  function setPressing(v) {
    if (!S || S.pressing === v) return;
    S.pressing = v;
    if (S.phase !== 'run' || S.paused) return;
    if (v) tryBuy(); else trySell();
  }

  // ---------- 一局 ----------
  function seedFor(mode) {
    if (mode === 'daily') return 'daily-' + U.dateKey();
    if (mode === 'career') { const c = loadCareer(); return 'career-' + c.id + '-' + c.day; }
    return 't1-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
  }

  function startSession(mode) {
    clearTimers();
    cancelAnimationFrame(raf);
    let eq0 = START_CASH, careerDay = 0;
    if (mode === 'career') { const c = loadCareer(); if (c.over) { showCareerOver(); return; } eq0 = c.equity; careerDay = c.day; }
    const seed = seedFor(mode);
    const day = E.genDay(seed);
    S = {
      mode, seed, day, phase: 'count', t: 0, processed: 0, paused: false, pressing: active.size > 0,
      holding: false, locked: false, cash: eq0, shares: 0, eq0, careerDay,
      trades: [], fees: 0, queue: null, holdMask: new Uint8Array(N), flags: {}, newsSeen: [], range: 0,
      rng: App.makeRng(seed + ':ui'), last: 0,

    els.news.innerHTML = ''; els.floats.innerHTML = '';
    App.setText(els.name, day.name);
    App.setText(els.code, day.code + ' · ' + (mode === 'daily' ? '每日挑战 ' + U.dateLabel() : mode === 'career' ? '生涯第 ' + careerDay + ' 天' : 'T+1 硬核'));
    [els.menu, els.pause, els.result].forEach(App.hide);

  function countdown(n, opening) {
    const d = S.day;
    if (opening) {
      const gap = (d.open / d.prevClose - 1) * 100;
      els.cinfo.innerHTML = '集合竞价：昨收 <b class="num">' + d.prevClose.toFixed(2) + '</b> → 开盘 <b class="num ' + cls(gap) + '">' + d.open.toFixed(2) + '</b><br>' +

  }

  function beginRun() {

    if (S.pressing && !S.holding) tryBuy();
    else if (!S.pressing && S.holding) trySell();
    loop();
  }

  function loop() {
    cancelAnimationFrame(raf);
    const frame = (now) => {
      if (!S || S.phase !== 'run') return;
      const dt = Math.min(64, now - S.last);
      S.last = now;
      if (!S.paused) {
        S.t = Math.min(N - 1, S.t + dt / TICK_MS);
        while (S.processed < Math.floor(S.t)) {
          S.processed++;
          onTick(S.processed);
          if (!S || S.phase !== 'run') return;
        }
        if (S.t >= N - 1) { updateHud(); draw(); endDay(); return; }
      }
      updateHud(); draw();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  function onTick(i) {
    const d = S.day;
    for (const n of d.news) if (n.t === i) showNews(n);
    if (d.sealUp[i] && !d.sealUp[i - 1]) { App.sfx.alarm(); App.toast('涨停！', 'up big', 1100); }
    if (!d.sealUp[i] && d.sealUp[i - 1]) { App.sfx.alarm(); App.toast('炸板！', 'warn big', 1100); }
    if (d.sealDown[i] && !d.sealDown[i - 1]) { App.sfx.alarm(); App.toast('跌停！', 'down big', 1100); }
    if (!d.sealDown[i] && d.sealDown[i - 1]) { App.sfx.alarm(); App.toast('撬板了！', 'warn big', 1100); }
    processQueue(i);
    if (S.holding && d.sealUp[i]) S.flags.ateLimit = true;
    S.holdMask[i] = S.holding ? 1 : 0;
  }

  const curIdx = () => Math.min(N - 1, Math.round(S.t));
  function curPrice() {
    const d = S.day, k = curIdx();
    if (d.sealUp[k]) return d.limitUp;
    if (d.sealDown[k]) return d.limitDown;
    const i = Math.floor(S.t), f = S.t - i;
    if (i >= N - 1) return d.price[N - 1];
    return Math.round((d.price[i] + (d.price[i + 1] - d.price[i]) * f) * 100) / 100;
  }

  // ---------- 交易 ----------
  function tryBuy() {
    if (S.holding) {
      if (S.queue && S.queue.type === 'sell') { S.queue = null; App.toast('已撤单，继续持有'); }
      return;
    }
    if (S.locked) return;
    const d = S.day, k = curIdx();
    if (d.sealUp[k]) {
      S.queue = { type: 'buy', ahead: d.sealAmt[k] * S.rng.range(0.55, 1) };
      App.sfx.tap();

    execBuy(curPrice(), k);
  }
  function execBuy(px, k, via) {
    const fee = S.cash * FEE;
    S.shares = (S.cash - fee) / px; S.fees += fee; S.cash = 0; S.holding = true; S.queue = null;
    S.trades.push({ type: 'buy', i: k, price: px, via: via || '' });
    if (S.mode === 't1') { S.locked = true; scr.classList.add('locked'); }
    scr.classList.add('holding');
    S.holdMask[k] = 1;
    App.sfx.buy(); App.buzz(12);
    floatText('买入 ' + px.toFixed(2), 'up');
    updatePad();
  }
  function trySell() {
    if (!S.holding) {
      if (S.queue && S.queue.type === 'buy') { S.queue = null; App.toast('已撤单'); }
      return;
    }
    if (S.locked) {
      if (!S.flags.lockTip) { S.flags.lockTip = true; App.toast('T+1：今天买的，明天开盘才能卖', 'warn'); }
      return;
    }
    const d = S.day, k = curIdx();
    if (d.sealDown[k]) {
      S.queue = { type: 'sell', ahead: d.sealAmt[k] * S.rng.range(0.55, 1) };
      S.flags.queuedDown = true;
      App.sfx.tap();
      return;
    }
    execSell(curPrice(), k);
  }
  function execSell(px, k, via) {
    const gross = S.shares * px, fee = gross * FEE;
    S.cash = gross - fee; S.fees += fee; S.shares = 0; S.holding = false; S.queue = null;
    S.trades.push({ type: 'sell', i: k, price: px, via: via || '' });
    scr.classList.remove('holding');
    App.sfx.sell(); App.buzz(8);
    floatText('卖出 ' + px.toFixed(2), 'down');
    updatePad();
  }
  function processQueue(i) {
    const q = S.queue;
    if (!q) return;
    const d = S.day;
    if (q.type === 'buy') {
      if (!S.pressing) { S.queue = null; return; }
      if (!d.sealUp[i]) { execBuy(d.limitUp, i, 'break'); S.flags.zhaban = true; App.toast('炸板了！排队的买单在涨停价成交', 'warn', 2400); return; }
      q.ahead -= d.vol[i] * S.rng.range(0.5, 1.1);
      if (q.ahead <= 0) { execBuy(d.limitUp, i, 'queue'); S.flags.paiban = true; App.toast('排到了！涨停价买入成功', 'up'); }
    } else {
      if (S.pressing) { S.queue = null; return; }
      if (!d.sealDown[i]) { execSell(d.limitDown, i, 'open'); App.toast('撬板了，排队的卖单成交', 'warn'); return; }
      q.ahead -= d.vol[i] * S.rng.range(0.5, 1.1);
      if (q.ahead <= 0) { execSell(d.limitDown, i, 'queue'); App.toast('排到了！跌停价卖出', 'down'); }
    }
  }

  // ---------- HUD ----------
  function equityNow() { return S.holding ? S.shares * curPrice() : S.cash; }
  function updateHud() {
    if (!S) return;
    const d = S.day, p = curPrice(), pc = (p / d.prevClose - 1) * 100;
    App.setText(els.price, p.toFixed(2)); App.setClass(els.price, 'q-price num ' + cls(pc));
    const diff = p - d.prevClose;
    App.setText(els.chg, fmtPct(pc) + '  ' + (diff >= 0 ? '+' : '') + diff.toFixed(2)); App.setClass(els.chg, 'q-chg num ' + cls(pc));
    App.setText(els.clock, S.phase === 'done' || S.phase === 'closing' ? '15:00' : clockOf(Math.floor(S.t)));
    const eq = equityNow(), r = (eq / S.eq0 - 1) * 100;
    App.setText(els.eq, fmtMoney(eq));
    App.setText(els.pnl, fmtPct(r)); App.setClass(els.pnl, 'num h-pnl ' + cls(r));
    let st = '空仓', sc = 'chip';
    if (S.queue) { st = '排队中'; sc = 'chip gold'; } else if (S.locked) { st = 'T+1 锁定'; sc = 'chip gold'; } else if (S.holding) { st = '持仓中'; sc = 'chip up'; }
    App.setText(els.state, st); App.setClass(els.state, 'q-state ' + sc);
    // 封板 / 排队横幅
    const k = curIdx();
    let txt = '', bc = '';
    const dropping = k >= 5 && d.sealAmt[k] < d.sealAmt[k - 5] * 0.75;
    if (S.phase === 'run' || S.phase === 'resume') {
      if (S.queue && S.queue.type === 'buy') { txt = '封板买不进，排队中 · 前面还有 ' + fmtWan(Math.max(0, S.queue.ahead)) + '手'; bc = 'up'; }
      else if (S.queue) { txt = '跌停卖不掉，排队中 · 前面还有 ' + fmtWan(Math.max(0, S.queue.ahead)) + '手'; bc = 'down'; }
      else if (d.sealUp[k]) { txt = '涨停封板 · 封单 ' + fmtWan(d.sealAmt[k]) + '手' + (dropping ? ' ↓ 在减少' : ''); bc = 'up'; }
      else if (d.sealDown[k]) { txt = '跌停封死 · 卖单 ' + fmtWan(d.sealAmt[k]) + '手' + (dropping ? ' ↓ 在减少' : ''); bc = 'down'; }
    }
    if (txt) { App.setText(els.banner, txt); App.setClass(els.banner, 'seal-banner show ' + bc); } else App.setClass(els.banner, 'seal-banner');
  }
  function updatePad() {
    let a, b;
    if (S && S.locked) { a = 'T+1 锁定中'; b = '明天开盘自动卖出，现在松手也没关系'; }
    else if (S && S.holding) { a = '持有中 · 松开就卖出'; b = '手指别离开屏幕'; }
    else if (S && S.mode === 't1') { a = '按住屏幕 = 买入'; b = '只有一次机会，买了就锁定到明天'; }
    else { a = '按住屏幕 = 满仓买入'; b = '松开 = 全部卖出 · 每次手续费 0.12%'; }
    App.setText(els.padText, a); App.setText(els.padSub, b);
  }
  function showNews(n) {
    S.newsSeen.push(n);
    const tag = n.kind === 'good' ? '利好' : n.kind === 'bad' ? '利空' : '传闻';
    const div = App.el('<div class="news ' + n.kind + '"><span class="tag">' + tag + '</span></div>');
    div.appendChild(document.createTextNode(n.text));
    els.news.prepend(div);
    while (els.news.children.length > 2) els.news.lastChild.remove();
    App.sfx.news();
    later(() => { div.classList.add('out'); later(() => div.remove(), 320); }, 3400);
  }
  function floatText(txt, c) {
    if (S.headX == null) return;
    const f = App.el('<div class="float-txt ' + c + '"></div>');
    f.textContent = txt;
    f.style.left = clamp(S.headX, 40, cv.clientWidth - 40) + 'px';
    f.style.top = clamp(S.headY - 28, 4, cv.clientHeight - 20) + 'px';
    els.floats.appendChild(f);
    later(() => f.remove(), 1150);
  }

  // ---------- 暂停 ----------
  function pause() {
    if (!S || S.phase !== 'run') return;
    S.paused = true;
    active.clear(); S.pressing = false;
    App.show(els.pause);
  }
  function resume() {
    App.hide(els.pause);
    countdown(2, false);
  }
  function quitToMenu() {
    clearTimers(); cancelAnimationFrame(raf);
    if (S) S.phase = 'idle';
    [els.pause, els.count, els.result].forEach(App.hide);
    scr.classList.remove('holding', 'locked');
    refreshMenu(); App.show(els.menu);
  }

  // ---------- 收盘结算 ----------
  function endDay() {
    S.phase = 'closing';
    cancelAnimationFrame(raf);
    S.holdMask[N - 1] = S.holding ? 1 : 0;
    S.queue = null;
    updateHud(); draw();
    App.toast('收盘 15:00', '', 1100);
    if (S.mode === 't1' && S.holding) later(overnight, 800); else later(finish, 800);
  }
  function overnight() {
    const d = S.day;
    els.cnum.textContent = '🌙'; App.setClass(els.cnum, 'count-num');
    els.cinfo.innerHTML = '持股过夜中……<br>明天开盘自动卖出'; els.ctip.textContent = '';
    App.show(els.count);
    later(() => {
      const g = d.gapNext;
      els.cnum.textContent = fmtPct(g, 1);
      App.setClass(els.cnum, 'count-num num ' + cls(g));
      els.cinfo.innerHTML = '次日开盘 <b class="num">' + d.nextOpen.toFixed(2) + '</b>' +
        (d.gapNews ? '<br><span class="small">盘后公告：' + d.gapNews + '</span>' : '');
      if (g >= 0) App.sfx.good(); else App.sfx.bad();
      later(() => { App.hide(els.count); finish(); }, 1900);
    }, 1200);
  }

  function finish() {
    const d = S.day, t1 = S.mode === 't1';
    S.phase = 'done';
    let eq;
    if (S.holding && t1) {
      const gross = S.shares * d.nextOpen;
      S.fees += gross * FEE; eq = gross * (1 - FEE);
      S.trades.push({ type: 'sell', i: N, price: d.nextOpen, via: 'nextOpen' });
    } else eq = S.holding ? S.shares * d.price[N - 1] : S.cash;
    const ret = (eq / S.eq0 - 1) * 100;
    const bh = t1 ? ((1 - FEE) * (1 - FEE) * d.nextOpen / d.open - 1) * 100 : ((1 - FEE) * d.price[N - 1] / d.open - 1) * 100;
    const best = t1 ? E.perfectT1(d) : E.perfectHold(d);
    const pct = E.holdPercentile(d, t1, ret);
    S.result = { eq, ret, bh, best, pct, moments: detectMoments(ret) };
    saveResult();
    showResult();
    if (ret >= 2) App.sfx.good(); else if (ret <= -2) App.sfx.bad();
  }

  function detectMoments(ret) {
    const d = S.day, P = d.price, out = [];
    let hi = -Infinity, lo = Infinity;
    for (let i = 0; i < N; i++) { hi = Math.max(hi, P[i]); lo = Math.min(lo, P[i]); }
    const maxAfter = (i) => { let m = -Infinity; for (let k = i + 1; k < N; k++) m = Math.max(m, P[k]); return m; };
    const tr = S.trades.filter((t) => t.i < N);
    const t1 = S.mode === 't1';
    if (S.flags.zhaban) out.push({ k: 'zb', name: '炸板接盘', tone: 'down', desc: '排队等涨停，等来的却是炸板——排队的买单都在最高价成交了。' });
    let fly = null;
    for (const t of tr) {
      if (t.type !== 'sell') continue;
      const m = maxAfter(t.i), g = (m / t.price - 1) * 100;
      if (g >= 3.5 && (!fly || g > fly.g)) fly = { t, m, g };
    }
    if (fly) out.push({ k: 'fly', name: '卖飞', tone: 'down', desc: clockOf(fly.t.i) + ' 卖在 ' + fly.t.price.toFixed(2) + '，之后最高涨到 ' + fly.m.toFixed(2) + '（+' + fly.g.toFixed(1) + '%）。' });
    const top = tr.find((t) => t.type === 'buy' && t.price >= hi * 0.993 && hi / P[0] > 1.02);
    if (top) out.push({ k: 'top', name: '买在山顶', tone: 'down', desc: clockOf(top.i) + ' 买在 ' + top.price.toFixed(2) + '，正好是全天最高点附近。' });
    const floor = tr.find((t) => t.type === 'sell' && t.price <= lo * 1.007 && maxAfter(t.i) / t.price > 1.03);
    if (floor) out.push({ k: 'floor', name: '割在地板', tone: 'down', desc: clockOf(floor.i) + ' 卖在 ' + floor.price.toFixed(2) + '，几乎是全天最低价，之后就涨回去了。' });
    const bottom = tr.find((t) => t.type === 'buy' && t.price <= lo * 1.008);
    if (bottom) out.push({ k: 'bottom', name: '抄底成功', tone: 'up', desc: clockOf(bottom.i) + ' 买在 ' + bottom.price.toFixed(2) + '，离全天最低只差 ' + ((bottom.price / lo - 1) * 100).toFixed(1) + '%。' });
    const esc = tr.find((t) => t.type === 'sell' && t.price >= hi * 0.993);
    if (esc) out.push({ k: 'esc', name: '逃顶成功', tone: 'up', desc: clockOf(esc.i) + ' 卖在 ' + esc.price.toFixed(2) + '，几乎卖在全天最高点。' });
    if (S.flags.ateLimit) out.push({ k: 'limit', name: '吃到涨停', tone: 'up', desc: '涨停板上你手里有货，这种感觉值得截图。' });
    if (S.flags.queuedDown) out.push({ k: 'qd', name: '跌停排队', tone: 'down', desc: '跌停板上排队卖不出去，体验了一把 A 股特色。' });
    // 踏空：全天最大一段上涨，你几乎没拿着
    let bestRun = null, minI = 0;
    for (let i = 1; i < N; i++) {
      if (P[i] < P[minI]) minI = i;
      const g = (P[i] / P[minI] - 1) * 100;
      if (!bestRun || g > bestRun.g) bestRun = { a: minI, b: i, g };
    }
    if (!t1 && bestRun && bestRun.g >= 5) {
      let held = 0;
      for (let i = bestRun.a; i <= bestRun.b; i++) held += S.holdMask[i];
      if (held / (bestRun.b - bestRun.a + 1) < 0.2) out.push({ k: 'miss', name: '踏空', tone: 'down', desc: clockOf(bestRun.a) + ' 到 ' + clockOf(bestRun.b) + ' 涨了 ' + bestRun.g.toFixed(1) + '%，你基本都在场外看着。' });
    }
    const seenTrap = S.newsSeen.find((n) => n.note);
    if (seenTrap) out.push({ k: 'trap', name: seenTrap.kind === 'good' ? '利好出尽' : '利空出尽', tone: 'gold', desc: clockOf(seenTrap.t) + ' 那条快讯：' + seenTrap.note + '。' });
    if (tr.length >= 16) out.push({ k: 'fee', name: '手续费战士', tone: 'gold', desc: '交易了 ' + tr.length + ' 次，光手续费就交了 ' + fmtMoney(S.fees) + '。' });
    if (tr.length === 1 && tr[0].type === 'buy' && tr[0].i <= 2 && !t1) out.push({ k: 'allin', name: '开盘梭哈', tone: 'gold', desc: '开盘满仓，一拿到底。' });
    if (!tr.length) out.push({ k: 'none', name: '空仓观望', tone: 'gold', desc: '一整天都没出手，至少没亏手续费。' });
    if (ret <= -5) out.push({ k: 'noodle', name: '关灯吃面', tone: 'down', desc: '今天就别再看盘了。' });
    return out.slice(0, 4);
  }

  function titleFor(ret) {
    if (S.mode === 't1') {
      if (ret >= 6) return '打板之王';
      if (ret >= 2) return '隔夜赢家';
      if (ret >= 0) return '小赚一笔';
      if (ret >= -3) return '小亏离场';
      return '隔夜惊魂';
    }
    if (ret >= 9) return '涨停敢死队';
    if (ret >= 5) return '股神附体';
    if (ret >= 2) return '小赚是福';
    if (ret > 0.005) return '保住本金';
    if (ret >= -2) return '白忙一场';
    if (ret >= -5) return '被割了一刀';
    return '关灯吃面';
  }

  function saveResult() {
    const r = S.result;
    if (S.mode === 'daily') {
      const rec = App.store.get('hold_daily', {});
      const k = U.dateKey();
      if (!rec[k]) rec[k] = { first: r.ret, best: r.ret, plays: 1, pct: r.pct };
      else { rec[k].best = Math.max(rec[k].best, r.ret); rec[k].plays++; }
      const keys = Object.keys(rec).sort();
      while (keys.length > 40) delete rec[keys.shift()];
      App.store.set('hold_daily', rec);
      S.dailyRec = rec[k];
    } else if (S.mode === 'career') {
      const c = loadCareer();
      const before = rankOf(c.equity);
      c.equity = r.eq; c.day += 1; c.peak = Math.max(c.peak, r.eq);
      if (r.ret > 0) c.wins = (c.wins || 0) + 1;
      c.over = r.eq < START_CASH * 0.5;
      saveCareer(c);
      S.career = c; S.rankUp = rankOf(c.equity) !== before && c.equity > S.eq0 ? rankOf(c.equity) : null;
    } else {
      const rec = App.store.get('hold_t1', { best: null, plays: 0 });
      rec.plays++; rec.best = rec.best == null ? r.ret : Math.max(rec.best, r.ret);
      App.store.set('hold_t1', rec);
    }
  }

  function showResult() {
    const r = S.result, q = (s) => scr.querySelector(s);
    q('.r-mascot').innerHTML = App.mascot(r.ret >= 2 ? 'happy' : r.ret <= -2 ? 'sad' : 'neutral');
    q('.r-title').textContent = titleFor(r.ret);
    const ret = q('.r-ret');
    ret.textContent = fmtPct(r.ret); ret.className = 'res-ret num r-ret ' + cls(r.ret);
    q('.r-eq').textContent = fmtMoney(S.eq0) + ' → ' + fmtMoney(r.eq) + '  ·  手续费 ' + fmtMoney(S.fees);
    const bh = q('.r-bh'); bh.textContent = fmtPct(r.bh, 1); bh.className = 'num r-bh ' + cls(r.bh);
    q('.r-best').textContent = '+' + r.best.toFixed(1) + '%';
    q('.r-best').className = 'num r-best up';
    q('.r-pct').textContent = Math.round(r.pct) + '%';
    const mm = q('.r-moments');
    mm.innerHTML = '';
    for (const m of r.moments) {
      const row = App.el('<div class="moment ' + m.tone + '"><b></b><span></span></div>');
      row.querySelector('b').textContent = m.name; row.querySelector('span').textContent = m.desc;
      mm.appendChild(row);
    }
    const extra = q('.r-extra');
    extra.innerHTML = '';
    const again = q('.r-again');
    again.textContent = '再来一局';
    if (S.mode === 'daily') {
      const rec = S.dailyRec;
      extra.innerHTML = '<div class="res-box">' + (rec.plays > 1
        ? '今日首次成绩 <b class="num ' + cls(rec.first) + '">' + fmtPct(rec.first) + '</b>（已记录）· 这是第 ' + rec.plays + ' 次'
        : '这是今天的首次成绩，已记录。明天会换一只股票。') + '</div>';
      again.textContent = '再练一次';
    } else if (S.mode === 'career') {
      const c = S.career, nr = nextRank(c.equity);
      if (c.over) {
        extra.innerHTML = '<div class="res-box bad">资产跌破 5 万，<b>被迫离场</b>。生涯坚持了 ' + (c.day - 1) + ' 天。</div>' +
          (c.revived ? '' : '<button class="btn block" style="margin-top:10px" data-act="revive">补仓复活（看一段广告）</button>') +
          '<button class="btn ghost block" style="margin-top:8px" data-act="newcareer">重新开始生涯</button>';
        again.textContent = '返回菜单';
        again.setAttribute('data-act', 'menu');
      } else {
        again.setAttribute('data-act', 'again');
        extra.innerHTML = '<div class="res-box">生涯第 ' + (c.day - 1) + ' 天结束 · 总资产 <b class="num">' + fmtMoney(c.equity) + '</b> · 段位 <b>' + rankOf(c.equity) + '</b>' +
          (S.rankUp ? '<br>🎉 晋级「' + S.rankUp + '」！' : '') + (nr ? '<br><span class="small">距离「' + nr[1] + '」还差 ' + fmtMoney(nr[0] - c.equity) + '</span>' : '') + '</div>';
        again.textContent = '下一天';
      }
    } else {
      const d = S.day;
      extra.innerHTML = '<div class="res-box">次日开盘 ' + fmtPct(d.gapNext, 1) + (d.gapNews ? '（盘后公告：' + d.gapNews + '）' : '') + '。收盘封涨停的股票，第二天往往高开；尾盘跳水的，第二天往往低开。</div>';
    }
    if (S.mode !== 'career') again.setAttribute('data-act', 'again');
    q('.r-note').textContent = '* 与 400 位模拟股民炒同一只股票比较（原型阶段，上线后换成真实玩家排名）。本局剧本：' + S.day.archName + '。';
    App.show(els.result);
    requestAnimationFrame(drawResultChart);
  }

  function again() {
    App.hide(els.result);
    if (S && S.mode === 'career' && S.career && S.career.over) { quitToMenu(); return; }
    startSession(S ? S.mode : 'daily');
  }

  function showCareerOver() {
    refreshMenu(); App.show(els.menu);
    App.confirm('生涯已结束', '上一段生涯资产腰斩、被迫离场了。要重新开始吗？', '重新开始生涯', () => {
      saveCareer({ id: Date.now().toString(36), day: 1, equity: START_CASH, peak: START_CASH, revived: false, over: false, wins: 0 });
      App.hide(els.menu); startSession('career');
    });
  }

  function revive() {
    const ov = App.el('<div class="overlay center show"><div class="dialog ad-box"><div class="dialog-title">广告位</div>' +
      '<div class="ad-screen">这里接激励视频广告<br><b class="num ad-n">3</b></div><div class="dialog-text">原型演示：看完广告，补仓到 10 万继续</div></div></div>');
    scr.appendChild(ov);
    let n = 3;
    const tick = () => {
      n--;
      if (n > 0) { ov.querySelector('.ad-n').textContent = n; later(tick, 1000); return; }
      ov.remove();
      const c = loadCareer();
      c.equity = START_CASH; c.over = false; c.revived = true;
      saveCareer(c);
      App.toast('补仓成功，继续战斗！', 'ok');
      App.hide(els.result);
      startSession('career');
    };
    later(tick, 1000);
  }

  // ---------- 分享 ----------
  function shareText() {
    const r = S.result, d = S.day;
    const blocks = [];
    for (let b = 0; b < 12; b++) {
      const a = b * 20, e = a + 19;
      let held = 0;
      for (let i = a; i <= e; i++) held += S.holdMask[i];
      blocks.push(held >= 10 ? (d.price[e] >= d.price[a] ? '🟥' : '🟩') : '⬜');
    }
    const head = S.mode === 'daily' ? '📈 按住别松手 · ' + U.dateLabel() + '每日行情' : S.mode === 'career' ? '📈 按住别松手 · 生涯第 ' + S.careerDay + ' 天' : '📈 按住别松手 · T+1 硬核';
    const lines = [head, '收益 ' + fmtPct(r.ret) + '｜跑赢 ' + Math.round(r.pct) + '% 的股民', blocks.join('')];
    if (r.moments.length) lines.push('名场面：' + r.moments.map((m) => m.name).join(' · '));
    return lines.join('\n');
  }

  // ---------- 菜单记录 ----------
  function refreshMenu() {
    const q = (s) => scr.querySelector(s);
    const rec = App.store.get('hold_daily', {})[U.dateKey()];
    q('.r-daily').innerHTML = rec ? '今日首次 <span class="' + cls(rec.first) + '">' + fmtPct(rec.first) + '</span> · 最佳 ' + fmtPct(rec.best) : '今天还没玩';
    const c = App.store.get('hold_career', null);
    q('.r-career').textContent = c ? (c.over ? '上次生涯已结束 · 坚持了 ' + (c.day - 1) + ' 天' : '第 ' + c.day + ' 天 · ' + fmtMoney(c.equity) + ' · ' + rankOf(c.equity)) : '还没开始';
    const t = App.store.get('hold_t1', null);
    q('.r-t1').textContent = t && t.best != null ? '最佳 ' + fmtPct(t.best) + ' · 玩了 ' + t.plays + ' 局' : '还没玩过';
  }

  function enter() {
    refreshMenu();
    [els.pause, els.count, els.result].forEach(App.hide);
    App.show(els.menu);
    requestAnimationFrame(draw);
  }
  function leave() {
    clearTimers(); cancelAnimationFrame(raf);
    if (S) S.phase = 'idle';
    active.clear();
  }

  // ---------- 绘图 ----------
  function draw() {
    if (!cv) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    if (!S) return;
    const tEnd = S.phase === 'done' || S.phase === 'closing' ? N - 1 : S.t;
    const g = drawDayChart(ctx, w, h, S.day, tEnd, { live: true, mask: S.holdMask, trades: S.trades, holding: S.holding, news: S.newsSeen });
    S.headX = g.headX; S.headY = g.headY;
  }
  function drawResultChart() {
    if (!S || !S.result) return;
    const { ctx, w, h } = App.fitCanvas(resCv);
    ctx.clearRect(0, 0, w, h);
    drawDayChart(ctx, w, h, S.day, N - 1, { live: false, mask: S.holdMask, trades: S.trades.filter((t) => t.i < N), news: S.day.news, compact: true });
  }

  function drawDayChart(ctx, w, h, d, tEnd, o) {
    const padL = 6, padR = o.compact ? 40 : 46, padT = o.compact ? 8 : 12, padB = 4;
    const volH = Math.max(o.compact ? 22 : 34, h * (o.compact ? 0.16 : 0.15));
    const chartB = h - padB - volH - 6;
    const plotW = w - padL - padR, plotH = chartB - padT;
    const xOf = (i) => padL + (i / (N - 1)) * plotW;
    const iEnd = Math.floor(tEnd);
    let maxDev = 2.5;
    for (let i = 0; i <= iEnd; i++) maxDev = Math.max(maxDev, Math.abs(d.pct[i]));
    let range;
    if (o.live) {
      const want = Math.min(10.6, maxDev * 1.18);
      S.range = S.range ? S.range + (want - S.range) * 0.08 : want;
      range = Math.max(S.range, Math.min(10.6, maxDev * 1.04));
    } else range = Math.min(10.6, maxDev * 1.15);
    const midY = padT + plotH / 2;
    const yOf = (pc) => midY - (pc / range) * (plotH / 2);
    const yP = (p) => yOf((p / d.prevClose - 1) * 100);

    // 网格与刻度
    ctx.font = '10px ' + C.num;
    ctx.textBaseline = 'middle';
    for (const f of [-1, -0.5, 0, 0.5, 1]) {
      const y = yOf(f * range);
      ctx.strokeStyle = f === 0 ? 'rgba(255,255,255,0.18)' : C.grid;
      ctx.setLineDash(f === 0 ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = f > 0 ? C.up : f < 0 ? C.down : C.sub;
      ctx.textAlign = 'left';
      ctx.fillText((f > 0 ? '+' : '') + (f * range).toFixed(1) + '%', padL + plotW + 4, y);
    }
    ctx.strokeStyle = C.grid;
    for (const i of [60, 120, 180]) { const x = xOf(i); ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, chartB); ctx.stroke(); }
    // 涨跌停线
    if (range > 8.5) {
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = 'rgba(245,71,75,0.55)';
      ctx.beginPath(); ctx.moveTo(padL, yOf(d.upPct)); ctx.lineTo(padL + plotW, yOf(d.upPct)); ctx.stroke();
      ctx.strokeStyle = 'rgba(23,178,106,0.55)';
      ctx.beginPath(); ctx.moveTo(padL, yOf(d.downPct)); ctx.lineTo(padL + plotW, yOf(d.downPct)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '10px ' + C.font; ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(245,71,75,0.8)'; ctx.fillText('涨停 ' + d.limitUp.toFixed(2), padL + 4, yOf(d.upPct) + 8);
      ctx.fillStyle = 'rgba(23,178,106,0.8)'; ctx.fillText('跌停 ' + d.limitDown.toFixed(2), padL + 4, yOf(d.downPct) - 8);
    }
    // 持仓区间
    if (o.mask) {
      ctx.fillStyle = 'rgba(245,71,75,0.11)';
      let a = -1;
      const last = o.live ? iEnd : N - 1;
      for (let i = 0; i <= last + 1; i++) {
        const on = i <= last && (o.mask[i] || (o.live && i === last && o.holding));
        if (on && a < 0) a = i;
        if (!on && a >= 0) {
          const x1 = i - 1 === last && o.live ? xOf(tEnd) : xOf(i - 1);
          ctx.fillRect(xOf(a), padT, Math.max(2, x1 - xOf(a)), plotH);
          a = -1;
        }
      }
    }
    // 均价线
    ctx.strokeStyle = 'rgba(255,179,26,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= iEnd; i++) { const x = xOf(i), y = yP(d.avg[i]); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
    // 价格线 + 渐变填充
    const pts = [];
    for (let i = 0; i <= iEnd; i++) pts.push([xOf(i), yP(d.price[i])]);
    let headP = d.price[Math.min(iEnd, N - 1)];
    if (o.live && iEnd < N - 1) {
      const f = tEnd - iEnd;
      const k = Math.min(N - 1, Math.round(tEnd));
      headP = d.sealUp[k] ? d.limitUp : d.sealDown[k] ? d.limitDown : d.price[iEnd] + (d.price[iEnd + 1] - d.price[iEnd]) * f;
      pts.push([xOf(tEnd), yP(headP)]);
    }
    const headPct = (headP / d.prevClose - 1) * 100;
    const lineCol = headPct >= 0 ? C.up : C.down;
    if (pts.length > 1) {
      const grad = ctx.createLinearGradient(0, padT, 0, chartB);
      grad.addColorStop(0, headPct >= 0 ? 'rgba(245,71,75,0.22)' : 'rgba(23,178,106,0.22)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.moveTo(pts[0][0], chartB);
      for (const p of pts) ctx.lineTo(p[0], p[1]);
      ctx.lineTo(pts[pts.length - 1][0], chartB); ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.strokeStyle = '#eef1f7'; ctx.lineWidth = o.compact ? 1.2 : 1.6; ctx.lineJoin = 'round';
      ctx.stroke();
    }
    // 快讯标记
    if (o.news) {
      for (const n of o.news) {
        if (n.t > iEnd) continue;
        const x = xOf(n.t), y = padT + 4;
        ctx.fillStyle = n.kind === 'good' ? C.up : n.kind === 'bad' ? C.down : C.gold;
        ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 4); ctx.lineTo(x - 4, y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.moveTo(x, y + 5); ctx.lineTo(x, chartB); ctx.stroke();
      }
    }
    // 买卖点
    if (o.trades) {
      ctx.font = 'bold 9px ' + C.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of o.trades) {
        if (t.i > iEnd + 1) continue;
        const x = xOf(Math.min(t.i, N - 1)), y = yP(t.price);
        ctx.fillStyle = t.type === 'buy' ? C.up : C.down;
        ctx.beginPath(); ctx.arc(x, y, o.compact ? 5.5 : 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(t.type === 'buy' ? 'B' : 'S', x, y + 0.5);
      }
    }
    // 当前价光点
    let headX = null, headY = null;
    if (pts.length) {
      const hp = pts[pts.length - 1];
      headX = hp[0]; headY = hp[1];
      if (o.live) {
        ctx.setLineDash([2, 3]); ctx.strokeStyle = lineCol; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(hp[0], hp[1]); ctx.lineTo(padL + plotW, hp[1]); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
        const pulse = 4 + 2 * Math.sin(performance.now() / 160);
        ctx.fillStyle = lineCol; ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(hp[0], hp[1], pulse + 4, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(hp[0], hp[1], 3.5, 0, Math.PI * 2); ctx.fill();
        // 右侧价签
        ctx.font = 'bold 10px ' + C.num;
        const tag = headP.toFixed(2);
        const tw = ctx.measureText(tag).width + 8;
        const ty = clamp(hp[1], padT + 7, chartB - 7);
        ctx.fillStyle = lineCol;
        ctx.fillRect(padL + plotW + 1, ty - 7, Math.min(tw, padR - 2), 14);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(tag, padL + plotW + 5, ty + 0.5);
      }
    }
    // 成交量
    let vmax = 1;
    for (let i = 0; i < N; i++) vmax = Math.max(vmax, d.vol[i]);
    const vTop = chartB + 6, bw = Math.max(1, plotW / N - 0.4);
    for (let i = 0; i <= Math.min(iEnd, N - 1); i++) {
      const vh = (d.vol[i] / vmax) * (volH - 2);
      ctx.fillStyle = i === 0 || d.price[i] >= d.price[i - 1] ? 'rgba(245,71,75,0.75)' : 'rgba(23,178,106,0.75)';
      ctx.fillRect(xOf(i) - bw / 2, vTop + volH - vh, bw, vh);
    }
    if (!o.compact) {
      ctx.font = '10px ' + C.font; ctx.fillStyle = C.dim; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('成交量', padL + 2, vTop);
    }
    return { headX, headY };
  }

  App.Hold = { init, _state: () => S };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ④ 画出明天：看一段真实历史走势，用手指画出未来 20 天，揭晓后打分 */
(function (root) {
  'use strict';
  const App = root.App, E = App.Engine, U = App.U, C = App.C;
  const { fmtPct, cls, clamp, lerp } = U;
  const F = 20;
  let scr, cv, els = {}, S = null, raf = 0;

  const episodes = () => (App.EPISODES && App.EPISODES.length ? App.EPISODES : (App._synthEps || (App._synthEps = E.synthEpisodes(12))));
  const isReal = () => !!(App.EPISODES && App.EPISODES.length);

  function dailyEpisode() {
    const eps = episodes();
    const order = App.makeRng('draw-order-v1').shuffle(eps.map((_, i) => i));
    return eps[order[U.dayNumber() % eps.length]];
  }
  function practiceEpisode() {
    const eps = episodes(), daily = dailyEpisode().id;
    let seen = App.store.get('draw_seen', []);
    let pool = eps.filter((e) => seen.indexOf(e.id) < 0 && e.id !== daily);
    if (!pool.length) { seen = []; pool = eps.filter((e) => e.id !== daily); if (!pool.length) pool = eps.slice(); }
    const ep = pool[Math.floor(Math.random() * pool.length)];
    seen.push(ep.id);
    App.store.set('draw_seen', seen);
    return ep;
  }
  const loadStats = () => App.store.get('draw_stats', { played: 0, right: 0, sum: 0, streakR: 0, bestR: 0, streakW: 0, bestW: 0 });

  function init() {
    scr = App.el(`
<section class="screen" id="scr-draw">
  <div class="topbar">
    <button class="icon-btn" data-act="back" aria-label="返回">‹</button>
    <div class="tb-title"><div class="t1">画出明天</div><div class="t2 d-sub">每日一题</div></div>
    <div class="tb-badge d-badge"></div>
  </div>
  <div class="draw-info"><div class="di-q d-q">某指数 · 日 K 线（名称和日期已隐藏）</div><div class="di-hint d-hint">用手指在右边画出接下来 20 个交易日的走势</div></div>
  <div class="draw-stage"><canvas class="draw-canvas"></canvas><div class="draw-prompt">从这里开始画 →</div></div>
  <div class="legend d-legend"></div>
  <div class="draw-bottom d-bottom"></div>
  <div class="overlay d-menu"><div class="sheet">
    <div class="menu-head"><div class="mascot">${App.mascot('neutral')}</div>
      <div><div class="menu-title">画出明天</div><div class="menu-sub">给你一段真实的历史走势，<br>用手指画出接下来 20 天会怎么走。</div></div></div>
    <div class="stat-row"><div><b class="num s-played">0</b><span>答题数</span></div><div><b class="num s-acc">--</b><span>方向正确率</span></div><div><b class="num s-avg">--</b><span>平均分</span></div></div>
    <div class="stat-row"><div><b class="num s-sr">0</b><span>当前连对</span></div><div><b class="num s-bestr up">0</b><span>股神指数</span></div><div><b class="num s-bestw down">0</b><span>反指指数</span></div></div>
    <button class="mode-card" data-mode="daily"><div class="mc-title">每日一题 <span class="chip gold">全服同题</span></div>
      <div class="mc-sub">每天一段知名历史行情，第一次作答计入成绩</div><div class="mc-rec r-daily"></div></button>
    <button class="mode-card" data-mode="practice"><div class="mc-title">练习模式 <span class="chip blue r-bank">题库</span></div>
      <div class="mc-sub">随机抽题，见识各种走势</div><div class="mc-rec r-prac"></div></button>
    <details class="rules"><summary>怎么算分</summary><ul>
      <li><b>方向</b>（35%）：20 天后是涨、是跌还是横盘（±1.5% 以内算横盘）。</li>
      <li><b>终点</b>（25%）和<b>整体形状</b>（40%）：画得越贴近越高分。</li>
      <li>连续猜对方向会刷新「股神指数」，连续猜反会刷新「反指指数」——反指也是一种天赋。</li>
      <li>题目来自真实的历史指数行情，揭晓时告诉你这是哪一段、发生了什么。</li></ul></details>
    <button class="link-btn" data-act="home">返回首页</button>
  </div></div>
</section>`);
    document.getElementById('app').appendChild(scr);
    const q = (s) => scr.querySelector(s);
    cv = q('.draw-canvas');
    Object.assign(els, { sub: q('.d-sub'), badge: q('.d-badge'), q: q('.d-q'), hint: q('.d-hint'), prompt: q('.draw-prompt'), legend: q('.d-legend'), bottom: q('.d-bottom'), menu: q('.d-menu') });
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    scr.addEventListener('click', onClick);
    root.addEventListener('resize', () => { if (App.current === 'draw' && S) draw(); });
    App.register('draw', { enter, leave });
  }

  function onClick(e) {
    const b = e.target.closest('[data-act],[data-mode]');
    if (!b) return;
    const mode = b.getAttribute('data-mode'), act = b.getAttribute('data-act');
    if (mode) { App.hide(els.menu); start(mode); return; }
    switch (act) {
      case 'back': case 'menu': openMenu(); break;
      case 'home': App.go('home'); break;
      case 'clear': clearDrawing(); break;
      case 'submit': submit(); break;
      case 'share': App.share(shareText()); break;
      case 'next': App.hide(els.menu); start('practice'); break;
      default: break;
    }
  }

  // ---------- 开一道题 ----------
  function start(mode) {
    cancelAnimationFrame(raf);
    const daily = mode === 'daily';
    const ep = daily ? dailyEpisode() : practiceEpisode();
    const split = ep.split || 60;
    const base = ep.ohlc[split - 1][3];
    const toPct = (v) => (v / base - 1) * 100;
    const hist = ep.ohlc.slice(0, split).map((r) => r.map(toPct));
    const fut = ep.ohlc.slice(split, split + F).map((r) => r.map(toPct));
    let hlo = Infinity, hhi = -Infinity;
    for (const r of hist) { hlo = Math.min(hlo, r[2]); hhi = Math.max(hhi, r[1]); }
    const room = Math.max((hhi - hlo) * 0.8, 8);
    const lo = Math.min(hlo, -room), hi = Math.max(hhi, room), pad = (hi - lo) * 0.05;
    S = {
      mode, ep, base, hist, fut, actual: fut.map((r) => r[3]), phase: 'draw',
      pred: new Float64Array(F), mask: new Uint8Array(F), drawing: false, lastCol: null, lastPc: 0,
      yr0: { lo: lo - pad, hi: hi + pad }, yr: { lo: lo - pad, hi: hi + pad }, revealK: 0, crowdA: 0, replay: false,
    };
    const rec = daily ? App.store.get('draw_daily', {})[U.dateKey()] : null;
    App.setText(els.sub, daily ? '每日一题 · ' + U.dateLabel() : '练习模式');
    App.setText(els.q, (isReal() ? '某指数' : '模拟走势') + ' · 日 K 线（名称和日期已隐藏）');
    App.setText(els.hint, '用手指在右边画出接下来 20 个交易日的走势');
    els.prompt.style.display = '';
    updateBadge();
    if (rec && rec.id === ep.id && rec.pred) {
      // 今天已经答过：直接回放
      S.replay = true;
      rec.pred.forEach((v, i) => { S.pred[i] = v; S.mask[i] = 1; });
      els.prompt.style.display = 'none';
      submit();
      return;
    }
    setLegend(false);
    renderDrawingPanel();
    requestAnimationFrame(draw);
  }

  function renderDrawingPanel() {
    els.bottom.innerHTML = '<div class="draw-btns"><button class="btn ghost" data-act="clear">重画</button><button class="btn d-submit" data-act="submit" disabled>确定，揭晓答案</button></div>' +
      '<div class="draw-tips">· 从“今天”那根 K 线右边开始，一直画到最右边。<br>· 画错了可以直接重新画，新的笔迹会覆盖旧的。<br>· 坐标是相对“今天”收盘价的涨跌幅。</div>';
  }
  function setLegend(revealed) {
    els.legend.innerHTML = revealed
      ? '<span><i style="background:#eef1f7"></i>实际走势</span><span><i style="background:' + C.gold + '"></i>你的预测</span><span><i style="background:rgba(91,140,255,0.7);height:8px"></i>玩家预测分布</span><span><i style="background:' + C.blue + '"></i>大众中位数</span>'
      : '<span><i style="background:' + C.gold + '"></i>你的预测</span><span class="small">红涨绿跌 · 空心为阳线</span>';
  }
  function updateBadge() {
    const st = loadStats();
    App.setText(els.badge, st.streakR >= 2 ? '🔥 连对 ' + st.streakR : st.streakW >= 2 ? '🙃 连反 ' + st.streakW : '');
  }

  // ---------- 画线 ----------
  function localXY(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onDown(e) {
    if (!S || S.phase !== 'draw') return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    S.drawing = true; S.lastCol = null;
    addPoint(localXY(e));
  }
  function onMove(e) {
    if (!S || !S.drawing) return;
    e.preventDefault();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length) list.forEach((ev) => addPoint(localXY(ev), true)); else addPoint(localXY(e), true);
    draw();
  }
  function onUp() {
    if (!S || !S.drawing) return;
    S.drawing = false;
    updateSubmit();
  }
  function addPoint(p, noDraw) {
    const g = S.g;
    if (!g || p.x < g.fx0 - g.slotF * 0.6) return;
    if (els.prompt.style.display !== 'none') els.prompt.style.display = 'none';
    const col = clamp(Math.floor((p.x - g.fx0) / g.slotF), 0, F - 1);
    const pc = clamp(pcOf(g, p.y), S.yr.lo, S.yr.hi);
    if (S.lastCol == null) { S.pred[col] = pc; S.mask[col] = 1; }
    else {
      const a = S.lastCol, b = col, pa = S.lastPc, step = a <= b ? 1 : -1;
      for (let c = a; c !== b + step; c += step) {
        const u = a === b ? 1 : (c - a) / (b - a);
        S.pred[c] = pa + (pc - pa) * u; S.mask[c] = 1;
      }
    }
    S.lastCol = col; S.lastPc = pc;
    if (!noDraw) draw();
    updateSubmit();
  }
  function coverageOK() {
    let last = -1, cnt = 0;
    for (let c = 0; c < F; c++) if (S.mask[c]) { cnt++; last = c; }
    return last >= F - 3 && cnt >= 8;
  }
  function updateSubmit() {
    const b = els.bottom.querySelector('.d-submit');
    if (b) b.disabled = !coverageOK();
  }
  function clearDrawing() {
    if (!S || S.phase !== 'draw') return;
    S.pred.fill(0); S.mask.fill(0); S.lastCol = null;
    updateSubmit(); draw();
  }
  function finalPred() {
    const p = new Float64Array(F), m = S.mask;
    for (let c = 0; c < F; c++) {
      if (m[c]) { p[c] = S.pred[c]; continue; }
      let a = -1, b = -1;
      for (let k = c - 1; k >= 0; k--) if (m[k]) { a = k; break; }
      for (let k = c + 1; k < F; k++) if (m[k]) { b = k; break; }
      const va = a >= 0 ? S.pred[a] : 0;
      p[c] = b >= 0 ? va + (S.pred[b] - va) * ((c - a) / (b - a)) : va;
    }
    const s = Float64Array.from(p);
    for (let c = 1; c < F - 1; c++) s[c] = (p[c - 1] + 2 * p[c] + p[c + 1]) / 4;
    return s;
  }

  // ---------- 揭晓 ----------
  function submit() {
    if (!S || S.phase !== 'draw') return;
    if (!S.replay && !coverageOK()) { App.toast('要一直画到最右边哦', 'warn'); return; }
    S.final = S.replay ? Float64Array.from(S.pred) : finalPred();
    S.score = E.scoreDrawing(S.final, S.actual);
    S.crowd = E.crowdPredictions(S.hist.map((r) => r[3]), 'crowd:' + S.ep.id, 260, F);
    const sc = S.crowd.map((c) => E.scoreDrawing(c, S.actual));
    S.crowdScores = sc.map((x) => x.score).sort((a, b) => a - b);
    S.crowdDirRight = sc.filter((x) => x.dirPred === x.dirAct).length / sc.length;
    const ext = [S.yr0.lo, S.yr0.hi];
    for (const r of S.fut) { ext.push(r[1], r[2]); }
    for (const v of S.final) ext.push(v);
    const lo = Math.min.apply(null, ext), hi = Math.max.apply(null, ext), pad = (hi - lo) * 0.05;
    S.yrT = { lo: lo - pad, hi: hi + pad };
    buildHeat();
    if (!S.replay) saveStats();
    S.phase = 'reveal';
    App.setText(els.hint, S.replay ? '今天的题已经答过了，这是回放' : '揭晓中……');
    els.bottom.innerHTML = '<div class="draw-tips" style="text-align:center;margin-top:24px">真实走势正在一根一根揭晓……</div>';
    S.t0 = performance.now();
    let lastK = -1;
    const dur = S.replay ? 1200 : 2400;
    const frame = (now) => {
      if (!S || S.phase !== 'reveal') return;
      const t = Math.min(1, (now - S.t0) / dur);
      S.revealK = t * F;
      const k = Math.floor(S.revealK);
      if (k !== lastK && k < F && !S.replay) { App.sfx.tick(); lastK = k; }
      const e = 1 - Math.pow(1 - Math.min(1, t * 1.3), 3);
      S.yr = { lo: lerp(S.yr0.lo, S.yrT.lo, e), hi: lerp(S.yr0.hi, S.yrT.hi, e) };
      draw();
      if (t < 1) { raf = requestAnimationFrame(frame); return; }
      S.phase = 'crowd'; S.t1 = performance.now();
      const f2 = (n2) => {
        if (!S || S.phase !== 'crowd') return;
        S.crowdA = Math.min(1, (n2 - S.t1) / 700);
        draw();
        if (S.crowdA < 1) raf = requestAnimationFrame(f2); else { S.phase = 'done'; draw(); showResult(); }
      };
      raf = requestAnimationFrame(f2);
    };
    raf = requestAnimationFrame(frame);
  }

  function buildHeat() {
    const bins = 48, lo = S.yrT.lo, hi = S.yrT.hi;
    const H = [];
    let max = 1;
    for (let d = 0; d < F; d++) H.push(new Float32Array(bins));
    for (const path of S.crowd) {
      for (let d = 0; d < F; d++) {
        const b = Math.floor(((hi - path[d]) / (hi - lo)) * bins);
        if (b >= 0 && b < bins) { H[d][b]++; if (H[d][b] > max) max = H[d][b]; }
      }
    }
    S.heat = { H, bins, max };
    S.crowdMed = [];
    for (let d = 0; d < F; d++) {
      const col = S.crowd.map((p) => p[d]).sort((a, b) => a - b);
      S.crowdMed.push(col[Math.floor(col.length / 2)]);
    }
  }

  function saveStats() {
    const sc = S.score, st = loadStats();
    st.played++; st.sum += sc.score;
    if (sc.dirPred === sc.dirAct) { st.right++; st.streakR++; st.streakW = 0; }
    else if (sc.dirScore === 0) { st.streakW++; st.streakR = 0; }
    else { st.streakR = 0; st.streakW = 0; }
    st.bestR = Math.max(st.bestR, st.streakR); st.bestW = Math.max(st.bestW, st.streakW);
    App.store.set('draw_stats', st);
    S.statsAfter = st;
    if (S.mode === 'daily') {
      const rec = App.store.get('draw_daily', {});
      const k = U.dateKey();
      if (!rec[k]) rec[k] = { id: S.ep.id, score: sc.score, pred: Array.from(S.final).map((v) => Math.round(v * 100) / 100) };
      const keys = Object.keys(rec).sort();
      while (keys.length > 40) delete rec[keys.shift()];
      App.store.set('draw_daily', rec);
    }
  }

  function titleFor(sc) {
    if (sc.dirScore === 0 && Math.abs(sc.actEnd) > 3 && sc.score < 50) return '人形反指';
    if (sc.score >= 85) return '股神附体';
    if (sc.score >= 70) return '老股民的直觉';
    if (sc.score >= 50) return '有点东西';
    if (sc.score >= 30) return '凭感觉画的吧';
    return '纯属瞎画';
  }
  const arrow = (v) => (v > 1.5 ? '↗' : v < -1.5 ? '↘' : '→');
  const fmtDate = (s) => (s ? s.replace(/-/g, '.') : '');

  function showResult() {
    const sc = S.score, ep = S.ep;
    const beat = Math.round(E.percentile(S.crowdScores, sc.score));
    const dirOK = sc.dirPred === sc.dirAct;
    const dirChip = dirOK ? '<span class="chip up">方向 ✔</span>' : sc.dirScore === 0 ? '<span class="chip down">方向猜反了</span>' : '<span class="chip">方向差一点</span>';
    let maxUp = -Infinity, maxDn = Infinity;
    for (const r of S.fut) { maxUp = Math.max(maxUp, r[1]); maxDn = Math.min(maxDn, r[2]); }
    const period = ep.dates ? fmtDate(ep.dates[0]) + ' – ' + fmtDate(ep.dates[ep.dates.length - 1]) : '';
    const lastClose = ep.ohlc[(ep.split || 60) - 1][3];
    const endClose = ep.ohlc[(ep.split || 60) + F - 1][3];
    const st = S.statsAfter || loadStats();
    let streakNote = '';
    if (!S.replay) {
      if (dirOK && st.streakR >= 2) streakNote = '已经连续猜对 ' + st.streakR + ' 次方向！';
      else if (sc.dirScore === 0 && st.streakW >= 2) streakNote = '已经连续猜反 ' + st.streakW + ' 次——反着买说不定能发财。';
    }
    els.bottom.innerHTML =
      '<div class="dr-top"><div class="dr-score num">0</div><div><div class="dr-title">' + titleFor(sc) + (S.replay ? '（回放）' : '') + '</div>' +
      '<div class="dr-sub">' + dirChip + '<span class="chip">跑赢 ' + beat + '% 玩家*</span></div></div></div>' +
      (streakNote ? '<div class="res-box" style="margin-top:10px">' + streakNote + '</div>' : '') +
      '<div class="dr-grid">' +
      '<div><span>你画的 20 天后</span><b class="num ' + cls(sc.predEnd) + '">' + arrow(sc.predEnd) + ' ' + fmtPct(sc.predEnd, 1) + '</b></div>' +
      '<div><span>实际 20 天后</span><b class="num ' + cls(sc.actEnd) + '">' + arrow(sc.actEnd) + ' ' + fmtPct(sc.actEnd, 1) + '</b></div>' +
      '<div><span>猜对方向的玩家*</span><b class="num">' + Math.round(S.crowdDirRight * 100) + '%</b></div>' +
      '<div><span>期间最高 / 最低</span><b class="num nowrap"><span class="up">' + fmtPct(maxUp, 1) + '</span> <span class="down">' + fmtPct(maxDn, 1) + '</span></b></div>' +
      '</div>' +
      '<div class="dr-reveal"><div class="dr-name"></div><div class="dr-period"></div><div class="dr-story"></div><div class="dr-facts"></div></div>' +
      '<div class="res-note">* “玩家”是原型阶段的 260 个模拟预测（趋势派、抄底派、随机派……），上线后换成真实玩家数据。</div>' +
      '<div class="dr-btns"><button class="btn ghost" data-act="share">分享</button><button class="btn" data-act="next">' + (S.mode === 'daily' ? '去练习模式' : '下一题') + '</button></div>' +
      '<button class="link-btn" data-act="menu">返回菜单</button>';
    const q = (s) => els.bottom.querySelector(s);
    q('.dr-name').textContent = ep.index + (ep.title ? ' · ' + ep.title : '');
    q('.dr-period').textContent = [period, ep.market].filter(Boolean).join(' · ');
    q('.dr-story').textContent = ep.story || '';
    q('.dr-facts').textContent = isReal() ? '“今天”收盘 ' + lastClose.toFixed(2) + ' → 20 个交易日后 ' + endClose.toFixed(2) : '';
    App.setText(els.hint, S.replay ? '今天的题已经答过了，这是回放' : '揭晓！');
    setLegend(true);
    updateBadge();
    // 分数滚动
    const el = q('.dr-score'), t0 = performance.now();
    const roll = (now) => {
      const t = Math.min(1, (now - t0) / 800);
      el.textContent = Math.round(sc.score * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(roll);
    };
    requestAnimationFrame(roll);
    if (!S.replay) { if (sc.score >= 60) App.sfx.good(); else if (sc.score < 30) App.sfx.bad(); }
    els.bottom.scrollTop = 0;
  }

  function shareText() {
    const sc = S.score;
    const lines = [
      '✍️ 画出明天 · ' + (S.mode === 'daily' ? '每日一题 ' + U.dateLabel() : '练习'),
      '得分 ' + sc.score + '｜' + titleFor(sc),
      '我画 ' + arrow(sc.predEnd) + ' ' + fmtPct(sc.predEnd, 1) + '｜实际 ' + arrow(sc.actEnd) + ' ' + fmtPct(sc.actEnd, 1),
      '只有 ' + Math.round(S.crowdDirRight * 100) + '% 的人猜对了方向',
      '（这是一段真实的历史行情，你能画对吗？）',
    ];
    return lines.join('\n');
  }

  // ---------- 菜单 ----------
  function openMenu() {
    cancelAnimationFrame(raf);
    if (S && (S.phase === 'reveal' || S.phase === 'crowd')) { S.phase = 'done'; }
    const st = loadStats(), q = (s) => scr.querySelector(s);
    q('.s-played').textContent = st.played;
    q('.s-acc').textContent = st.played ? Math.round((st.right / st.played) * 100) + '%' : '--';
    q('.s-avg').textContent = st.played ? Math.round(st.sum / st.played) : '--';
    q('.s-sr').textContent = st.streakR;
    q('.s-bestr').textContent = st.bestR;
    q('.s-bestw').textContent = st.bestW;
    const rec = App.store.get('draw_daily', {})[U.dateKey()];
    q('.r-daily').textContent = rec ? '今天已作答：' + rec.score + ' 分 · 点开看回放' : '今天还没答';
    q('.r-bank').textContent = (isReal() ? '真实题库 ' : '模拟题 ') + episodes().length + ' 段';
    q('.r-prac').textContent = '已练习 ' + Math.max(0, st.played - Object.keys(App.store.get('draw_daily', {})).length) + ' 题';
    App.show(els.menu);
  }
  function enter() { openMenu(); }
  function leave() { cancelAnimationFrame(raf); }

  // ---------- 绘图 ----------
  function geom(w, h) {
    const padL = 6, padR = 40, padT = 12, padB = 20;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const hx0 = padL, hx1 = padL + plotW * 0.58;
    return { w, h, padL, padR, padT, padB, plotW, plotH, hx0, hx1, fx0: hx1, fx1: padL + plotW, slotH: (hx1 - hx0) / S.hist.length, slotF: (padL + plotW - hx1) / F };
  }
  const yOf = (g, pc) => g.padT + ((S.yr.hi - pc) / (S.yr.hi - S.yr.lo)) * g.plotH;
  const pcOf = (g, y) => S.yr.hi - ((y - g.padT) / g.plotH) * (S.yr.hi - S.yr.lo);
  const hxOf = (g, i) => g.hx0 + (i + 0.5) * g.slotH;
  const fxOf = (g, d) => g.fx0 + (d + 0.5) * g.slotF;

  function candle(ctx, g, x, slot, r) {
    const o = r[0], h = r[1], l = r[2], c = r[3], up = c >= o;
    const col = up ? C.up : C.down, bw = Math.max(1.2, slot * 0.68);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yOf(g, h)); ctx.lineTo(x, yOf(g, l)); ctx.stroke();
    const y1 = yOf(g, Math.max(o, c)), y2 = yOf(g, Math.min(o, c)), hh = Math.max(1, y2 - y1);
    if (up && bw >= 4) { ctx.fillStyle = C.bg; ctx.fillRect(x - bw / 2, y1, bw, hh); ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, Math.max(0.5, hh - 1)); }
    else ctx.fillRect(x - bw / 2, y1, bw, hh);
  }

  function draw() {
    if (!S) return;
    const { ctx, w, h } = App.fitCanvas(cv);
    const g = (S.g = geom(w, h));
    ctx.clearRect(0, 0, w, h);
    // 未来区底色
    ctx.fillStyle = S.phase === 'draw' ? 'rgba(255,179,26,0.05)' : 'rgba(255,255,255,0.025)';
    ctx.fillRect(g.fx0, g.padT, g.fx1 - g.fx0, g.plotH);
    // 横向网格
    const span = S.yr.hi - S.yr.lo;
    const step = span > 90 ? 20 : span > 45 ? 10 : span > 20 ? 5 : span > 9 ? 2 : 1;
    ctx.font = '10px ' + C.num; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (let v = Math.ceil(S.yr.lo / step) * step; v <= S.yr.hi + 1e-9; v += step) {
      const y = yOf(g, v);
      ctx.strokeStyle = Math.abs(v) < 1e-9 ? 'rgba(255,255,255,0.2)' : C.grid;
      ctx.setLineDash(Math.abs(v) < 1e-9 ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(g.padL, y); ctx.lineTo(g.fx1, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = v > 0 ? C.up : v < 0 ? C.down : C.sub;
      ctx.fillText((v > 0 ? '+' : '') + Math.round(v) + '%', g.fx1 + 4, y);
    }
    // 分隔线与未来刻度
    ctx.strokeStyle = 'rgba(255,179,26,0.45)'; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(g.fx0, g.padT); ctx.lineTo(g.fx0, g.padT + g.plotH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = C.grid;
    for (let d = 5; d < F; d += 5) { const x = g.fx0 + d * g.slotF; ctx.beginPath(); ctx.moveTo(x, g.padT); ctx.lineTo(x, g.padT + g.plotH); ctx.stroke(); }
    // 底部标注
    ctx.font = '10px ' + C.font; ctx.fillStyle = C.dim; ctx.textBaseline = 'top';
    const by = g.padT + g.plotH + 5;
    const revealed = S.phase !== 'draw' && S.ep.dates;
    ctx.textAlign = 'left'; ctx.fillText(revealed ? fmtDate(S.ep.dates[0]) : '60 个交易日前', g.hx0 + 2, by);
    ctx.textAlign = 'center'; ctx.fillStyle = C.gold; ctx.fillText(revealed ? fmtDate(S.ep.dates[(S.ep.split || 60) - 1]) : '今天', g.fx0, by);
    ctx.textAlign = 'right'; ctx.fillStyle = C.dim; ctx.fillText(revealed ? fmtDate(S.ep.dates[S.ep.dates.length - 1]) : '+20 天', g.fx1, by);
    // 玩家热力图
    if ((S.phase === 'crowd' || S.phase === 'done') && S.heat) {
      const { H, bins, max } = S.heat, bh = g.plotH / bins;
      for (let d = 0; d < F; d++) {
        for (let b = 0; b < bins; b++) {
          const v = H[d][b];
          if (!v) continue;
          ctx.fillStyle = 'rgba(91,140,255,' + (0.62 * Math.sqrt(v / max) * S.crowdA).toFixed(3) + ')';
          ctx.fillRect(g.fx0 + d * g.slotF, g.padT + b * bh, g.slotF + 0.5, bh + 0.5);
        }
      }
    }
    // 历史 K 线
    for (let i = 0; i < S.hist.length; i++) candle(ctx, g, hxOf(g, i), g.slotH, S.hist[i]);
    const ax = hxOf(g, S.hist.length - 1), ay = yOf(g, 0);
    // 揭晓的真实 K 线
    const k = S.phase === 'draw' ? 0 : Math.min(F, S.revealK);
    const kn = Math.floor(k);
    for (let d = 0; d < kn; d++) candle(ctx, g, fxOf(g, d), g.slotF, S.fut[d]);
    if (kn > 0) {
      ctx.strokeStyle = 'rgba(238,241,247,0.9)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ax, ay);
      for (let d = 0; d < kn; d++) ctx.lineTo(fxOf(g, d), yOf(g, S.actual[d]));
      ctx.stroke();
    }
    // 大众中位数
    if ((S.phase === 'crowd' || S.phase === 'done') && S.crowdMed) {
      ctx.strokeStyle = C.blue; ctx.globalAlpha = S.crowdA; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(ax, ay);
      for (let d = 0; d < F; d++) ctx.lineTo(fxOf(g, d), yOf(g, S.crowdMed[d]));
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // 你的预测
    const line = S.final || S.pred;
    const drawnAny = S.final || S.mask.some((m) => m);
    if (drawnAny) {
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255,179,26,0.5)'; ctx.shadowBlur = 6;
      ctx.beginPath();
      let started = false;
      if (S.final || S.mask[0]) { ctx.moveTo(ax, ay); started = true; }
      for (let d = 0; d < F; d++) {
        if (!S.final && !S.mask[d]) { started = false; continue; }
        const x = fxOf(g, d), y = yOf(g, line[d]);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // “今天”锚点
    ctx.fillStyle = C.gold;
    ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, Math.PI * 2); ctx.fill();
    if (S.phase === 'done' && isReal()) {
      ctx.font = '10px ' + C.num; ctx.fillStyle = C.sub; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(S.base.toFixed(2), ax - 4, ay - 4);
    }
    // 终点标签
    if (S.phase === 'done') {
      ctx.font = 'bold 10px ' + C.font; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
      const labs = [[yOf(g, S.final[F - 1]), '你', C.gold], [yOf(g, S.actual[F - 1]), '实际', '#eef1f7']];
      if (Math.abs(labs[0][0] - labs[1][0]) < 12) labs[0][0] += labs[0][0] < labs[1][0] ? -7 : 7;
      for (const L of labs) { ctx.fillStyle = L[2]; ctx.fillText(L[1], g.fx1 - 3, clamp(L[0], g.padT + 6, g.padT + g.plotH - 6) - 9); }
    }
  }

  App.Draw = { init, _state: () => S };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ⑤ 解套大作战：开局就在山顶站岗，靠高抛低吸把成本做到现价以下 */
(function (root) {
  'use strict';
  const App = root.App, E = App.Engine, U = App.U, C = App.C;
  const { fmtPct, fmtMoney, cls, clamp, round2 } = U;
  const VIS = 32;
  let scr, cv, els = {}, S = null, raf = 0, drag = null, autoTimer = 0;

  const levelRec = () => App.store.get('uk_levels', {});
  const starsHtml = (n) => [0, 1, 2].map((i) => '<span class="' + (i < n ? 'on' : '') + '">★</span>').join('');
  const stockName = (lv) => lv.stock[0] + lv.stock[1];
  const stockCode = (lv) => 'J' + (10000 + ((typeof lv.id === 'number' ? lv.id : App.hashStr(String(lv.id))) * 7919) % 89999);
  const stoodDays = (lv) => 30 + (App.hashStr('stood' + lv.id) % 320);

  function init() {
    scr = App.el(`
<section class="screen" id="scr-unstuck">
  <div class="uk-view uk-select">
    <div class="topbar"><button class="icon-btn" data-act="home" aria-label="返回">‹</button>
      <div class="tb-title"><div class="t1">解套大作战</div><div class="t2 sel-sub"></div></div></div>
    <div class="uk-scroll">
      <div class="uk-hero"><div class="mascot">${App.mascot('sad')}</div><div>每一关你都在山顶站岗：买入价远高于现价。<br>用<b>高抛低吸</b>把成本做下来，成本价低于现价就算解套。</div></div>
      <div class="uk-grid"></div>
      <button class="mode-card" data-act="endless" style="margin-top:12px"><div class="mc-title">无尽模式 <span class="chip blue">随机股票</span></div>
        <div class="mc-sub">随机走势、随机套牢深度，解完一只再来一只</div><div class="mc-rec r-endless"></div></button>
      <details class="rules"><summary>规则说明</summary><ul>
        <li>每天开盘前挂两张单：<b>高抛</b>（价格涨到红线就卖）和<b>低吸</b>（跌到绿线就买）。拖动图上的红线、绿线改价格，点按钮开关。</li>
        <li>今天买的股票，明天才能卖（<b>T+1</b>）。挂单当天有效，价格每天不能超过前一天收盘的 ±10%。</li>
        <li>每笔手续费 0.1%，最低 5 元；每关的成交笔数有上限。</li>
        <li><b>成本价</b> =（当初的投入 − 现在的现金）÷ 持股数。成本价 ≤ 现价，就是解套。</li>
        <li>三颗星：解套 / 用时不超过六成天数 / 成交笔数不超过一半。</li></ul></details>
    </div>
  </div>

  <div class="uk-view uk-play">
    <div class="topbar"><button class="icon-btn" data-act="levels" aria-label="返回">‹</button>
      <div class="tb-title"><div class="t1 p-title"></div><div class="t2 p-stock"></div></div>
      <button class="icon-btn" data-act="menu" aria-label="菜单">⋯</button></div>
    <div class="uk-goal">
      <div class="ug-row"><div>成本<b class="num p-cost gold">--</b></div><div>现价<b class="num p-price">--</b></div><div>第<b class="num p-day">1</b>/<span class="p-days">20</span> 天</div></div>
      <div class="ug-bar"><div class="ug-fill p-fill"></div></div>
      <div class="ug-row small"><div>解套进度 <b class="num p-prog">0%</b></div><div class="p-need">还差 <b class="num">--</b></div></div>
    </div>
    <div class="uk-stage"><canvas class="uk-canvas"></canvas><div class="uk-drag-tip">上下拖动红线/绿线改挂单价</div></div>
    <div class="uk-hold"><div>持股 <b class="num p-shares">0</b></div><div>现金 <b class="num p-cash">¥0</b></div><div>成交 <b class="num p-trades">0/0</b></div></div>

      <button class="ord-chip sell on" data-act="tsell"><span class="dot"></span>高抛<b class="num p-sell">--</b></button>

  </div>

  <div class="overlay k-intro"><div class="sheet k-intro-body"></div></div>
  <div class="overlay k-end"><div class="sheet k-end-body"></div></div>
  <div class="overlay center k-menu"><div class="dialog menu-list">

</section>`);
    document.getElementById('app').appendChild(scr);
    const q = (s) => scr.querySelector(s);
    cv = q('.uk-canvas');
    Object.assign(els, {
      select: q('.uk-select'), play: q('.uk-play'), grid: q('.uk-grid'), selSub: q('.sel-sub'), endlessRec: q('.r-endless'),
      title: q('.p-title'), stock: q('.p-stock'), cost: q('.p-cost'), price: q('.p-price'), day: q('.p-day'), days: q('.p-days'),
      fill: q('.p-fill'), prog: q('.p-prog'), need: q('.p-need'), shares: q('.p-shares'), cash: q('.p-cash'), trades: q('.p-trades'),
      sellChip: q('.ord-chip.sell'), buyChip: q('.ord-chip.buy'), sell: q('.p-sell'), buy: q('.p-buy'), qty: q('.p-qty'),
      auto: q('.p-auto'), next: q('.p-next'), log: q('.p-log'),

    scr.addEventListener('click', onClick);
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
